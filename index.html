<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      這份是**所有主題共用的模板**：非 root 主題的 index.html 是它的複本，
      由 vite.config.ts 產生。下面的 title 與 description 只是預留位 ——
      實際內容一律由該主題的 topic.yaml 決定（見 vite.config.ts 的 topicMeta 外掛），
      改這裡不會有效果。
    -->
    <title>AoE</title>
    <meta name="description" content="把不同地區的歷史放在同一條時間軸上並排比較。" />
    <!--
      圖示三份都是 scripts/make-favicon.mjs 從同一份幾何定義產生的（npm run icons），
      不要單獨手改其中一份。SVG 會跟著系統亮暗色切換，.ico 是舊瀏覽器的退路。
      路徑一律寫絕對路徑：這份 HTML 會被複製到 /tw-railway/ 之類的子目錄，
      相對路徑會變成去要 /tw-railway/favicon.svg。base 由 vite 補。
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // 在首次繪製前就套用存下來的主題，否則手動選亮色的人在暗色系統上會先閃一下暗底。
      // 必須跟 src/lib/theme.ts 的 THEME_KEY 一致。
      try {
        var t = localStorage.getItem('aoe:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <!--
      字型：把 --font stack（styles.css）裡本來就寫著的 'Noto Sans TC' 真的載進來。
      stack 順序不變（system-ui 在前）—— 拉丁字與數字繼續走系統字型，
      年份的 tabular-nums 不受 Google Fonts 剝 OpenType feature 的影響；
      Noto Sans TC 只接住 CJK。只載 400;600，全站僅用這兩個字重。
      這幾個 link 必須放在上面的 theme script 之後：外部 stylesheet 會阻擋
      其後 inline script 執行，放前面會延遲主題套用、重現閃白問題。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&display=swap"
    />
    <!-- 文楷只用在大字級的點綴處：站名標題（700）與朝代直排名稱（400），
         見 styles.css 的 .masthead h1 / .period-name。 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
