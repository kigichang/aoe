<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AoE — 並排比較各地區歷史</title>
    <meta name="description" content="把不同地區的歷史放在同一條時間軸上並排比較。" />
    <script>
      // 在首次繪製前就套用存下來的主題，否則手動選亮色的人在暗色系統上會先閃一下暗底。
      // 必須跟 src/lib/theme.ts 的 THEME_KEY 一致。
      try {
        var t = localStorage.getItem('aoe:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
