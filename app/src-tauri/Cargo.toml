[package]
name = "aoe-app"
version = "0.1.0"
edition = "2021"
description = "AoE 桌面版：把不同地區／主題的歷史放在同一條時間軸上並排比較"
license = "MIT"

[lib]
name = "aoe_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 已停維護；saphyr 是 yaml-rust 的後繼，serde-saphyr 是它的 serde 介面
serde-saphyr = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
anyhow = "1"
sha2 = "0.10"
flate2 = "1"
# rustls：Windows 上不必裝 OpenSSL。刻意不開 gzip feature：bundle 本身是 .gz，
# 讓 reqwest 自動解壓的話拿到的就不是原始 bytes，sha256 永遠對不上。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# App 自身的更新。用自簽的 minisign 金鑰驗證更新包，跟 Apple 的憑證體系無關 ——
# 這正是開發期能在不處理 Apple Developer 簽章的前提下發 Windows 版的原因。
tauri-plugin-updater = "2"
