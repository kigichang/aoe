<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AoE</title>
    <script>
      // 同網站 index.html：首次繪製前套用存下來的主題。key 必須跟 src/lib/theme.ts 的 THEME_KEY 一致。
      try {
        var t = localStorage.getItem('aoe:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <!-- 字型是本機的，不連 fonts.googleapis.com：桌面版第一次啟動可能完全離線，
         而「有網路一個樣、沒網路另一個樣」比一律用系統字型更難查。
         這個檔由 npm run fonts 產生（predev／prebuild 會自動跑），見 tools/fonts.mjs。 -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
