name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，但不取消進行中的那個
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` 尾端會一併產生 dist/data（桌面版的資料 bundle）。
      # 這裡刻意**不再單獨跑一次 bundle**：aoe.kigi.tw 已經搬到 Cloudflare Pages，
      # 那邊的建置指令是後台設定的 `npm run build`，repo 管不到。把 bundle 綁進
      # build script 才是唯一能保證「不論誰建置這個站，/data/ 都在」的做法。
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
