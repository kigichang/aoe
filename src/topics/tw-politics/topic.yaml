# 台灣政治與政黨發展史。目錄名就是網址路徑：/tw-politics/
#
# 史觀：**記錄「誰有資格決定誰來統治」怎麼被改變的歷史**，不替任何一方的
# 正當性背書。收錄的判準是「這件事之後，取得與行使權力的規則不一樣了」——
# 一套規則被立起來或被拆掉、一個政黨誕生分裂或消失、一次選票真的決定了誰統治、
# 一群體制外的人推了一把、一次由上而下的壓制改變了往後幾十年、
# 一場武力對決重畫了政治歸屬。
#
# **刻意不採用任一方的官方敘事。** 這是這條軸上最需要自律的地方：
# 二二八、白色恐怖、清黨、反右、文革、六四、美麗島，在不同立場的敘述裡差距極大。
# 本站的 desc 一律只寫**做了什麼、規則因此怎麼變**，不寫誰是好人；
# 不用「動亂」「暴亂」「平息」「解放」這類任一方的官方定性用語；
# 傷亡與規模有爭議的一律寫出爭議區間並掛出處，不挑對自己方便的數字
# （二二八、大躍進饑荒、六四三則都是這樣寫的）。
#
# **兩欄用同一把尺。** 台灣的威權時期與中國的運動整肅用同樣的敘述方式與同樣的
# importance 級距。不寫台灣「必然走向民主」的目的論 —— 地方自治同時是開放參政
# 與收編地方派系，威權時期的地方選舉從 1950 年就沒停過，兩面都收；
# 也不寫中國「必然崩潰」或「必然崛起」。兩邊都還在軸上跑。
#
# 政黨與機構一律用當時的正式名稱（中國國民黨、中國共產黨、民主進步黨、
# 台灣總督府），不用「藍」「綠」「中共當局」「北京」這類帶立場的簡稱。
# 兩岸定位不在資料裡下結論：欄位叫地區而不叫國家，類別裡沒有「外交」
# （叫外交就等於斷言是國與國，叫內政就等於斷言不是），
# 對外關係一律歸「政體」，因為這條軸上的對外關係幾乎全都是在爭「誰代表中國」。
#
# 對照的價值在**兩欄的同代並置**：台灣文化協會成立那年，中國正在辦五四之後
# 第一波政黨重組；台灣宣布戒嚴那年，中華人民共和國剛成立；
# 台灣首次總統直選那年，對岸正在台海試射飛彈。

name: 台灣政治與政黨發展史
description: 把台灣與中國的政治與政黨發展放在同一條時間軸上，看同一個年代各自在走哪一條路。

# 排在鐵道史之前 —— 鐵道史那份還是種子資料，不該擋在讀者第一眼會點的位置
# （理由寫在 tw-railway/topic.yaml）。號碼維持連號，鐵道史一併往後挪成 7。
order: 6

# 欄位在這裡就是「地區」，所以不填 columnLabel，直接用 schema 的預設值。
#
# **不要改成用政權當欄位**（「中華民國」「中華人民共和國」）。那在事實上就不成立：
# 1858–1911 兩欄都是大清，1895–1945 台灣是日本。168 年裡每一個政權名都會變，
# 只有這兩塊土地不變 —— 而且中華民國在 1912 年記在中國欄、1949 之後記在台灣欄，
# 用政權當欄位就切不出這條線，而那條線正是這個主題的論點。

# 開場縮放（px/年）。**這個值是量出來的，不是猜的**，方法與 tw-development
# 那份相同：套用 layout.ts 的實際排版演算法，固定視窗 1568×713（兩欄時
# columnWidth = 740，laneCount = 2），數「讀得到標題的則數」。
#
# 實測（199 則資料）：
#
#   ppy | 圖釘        | 讀得到 | 一屏年數 | 台灣 | 中國
#   ----|-------------|--------|----------|------|------
#    4  | 105（53%）  |   94   |   178    |  49  |  45
#    6  |  81（41%）  |  118   |   119    |  61  |  57
#    8  |  61（31%）  |  138   |    89    |  72  |  66
#    9  |  46（23%）  |  153   |    79    |  79  |  74   ← 現況
#   10  |  43（22%）  |  156   |    71    |  81  |  75
#   12  |  32（16%）  |  167   |    59    |  86  |  81
#   14  |  18（ 9%）  |  181   |    51    |  93  |  88
#
# 取 9。真正的躍升在 8→9（讀得到 +15），9→10 只多 3 則就進入平台期，
# 再往上每一級的增量都不如那一跳，一屏年數卻一路掉。
# 79 年剛好讓 1912 建立民國、1945 接收、1949 分立這三個轉折能同時或接連
# 出現在畫面上，而那正是這個主題最想給的對照。
# 要看的是「讀得到幾則」而不是圖釘比例 —— 比例會騙人，分母跟著變（CLAUDE.md）。
#
# **1940 年代有 24 則、1920 年代有 21 則，那兩段在任何 ppy 下都會有圖釘剩下。**
# 這是必然的，不是調壞了：兩欄的事件密度極度偏向 1911–1949 與 1987–2016。
# 密的那一段放大就讀得到，jumps 的 1912／1945／1949／1987 與搜尋也都到得了。
#
# **已知代價：開啟詳情面板時 laneCount 會從 2 掉到 1**（欄寬 740 → 約 550，
# 低於 MIN_LANE_W 的兩倍）。實測讀得到的標題 153 → 96。這是 CLAUDE.md
# 「地區少 + 螢幕寬」那條已知代價的典型情境，只有兩欄時必然發生。
# 可逆 —— 關掉面板就復原，所以不另外處理。
#
# **這個主題的 importance 分層實際上沒有作用**，這是刻意接受的：
# MIN_PPY = 700 / 168 = 4.17，已經越過 TIERS 的 imp-2 門檻（4），
# 而資料裡最低就是 3 級 —— 所以縮到最小也看得到全部 199 則。
# 跨度短的主題本來就該這樣（CLAUDE.md「TIERS 刻意維持絕對值」那節），
# **不要為此去動 TIERS，也不要為了讓分層「有作用」硬把事件降到 2 級以下。**
# 密度只有兩個槓桿：defaultPpy，以及「不收這一則」。
defaultPpy: 9

# 刻意在 1911–1949 那段密集：1858–1894 這 37 年只給一顆，
# 1912–1949 這 38 年給四顆，因為資料密度就是那樣。
# 1945 與 1949 相鄰是刻意的 —— 那四年裡裝著這條軸的中心事件。
jumps: [1860, 1895, 1912, 1928, 1945, 1949, 1971, 1987, 2000, 2016]
