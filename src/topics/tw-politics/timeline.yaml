# 時間軸的上下界。事件與時期都必須落在這個範圍內，否則 data.ts 的 assertInRange
# 會在載入期直接報錯 —— 範圍外的資料會被算出負的 y 畫到畫布外面，
# 不報錯、主控台乾淨，只有讀者永遠找不到那一筆。

# 起點取 1858 而不是 1860：最早的一則事件是 1860 年台灣開港通商，
# 而正好落在 minYear 上的事件標籤會被切掉上半列（CLAUDE.md 實作坑第 7 條），
# 所以照 tw-railway 的作法留兩年緩衝。
#
# 為什麼是這個年代：這條軸問的是「近代政黨政治怎麼長出來的」。
# 1860 開港之後台灣才有了條約體制下的對外關係與新的社會階層，
# 中國那一欄同年簽下北京條約、隔年設總理衙門，洋務運動起步 ——
# 兩欄的近代化都從這裡開始計時。再往前是傳統帝國的治理史，
# 沒有政黨、沒有選舉、沒有憲政，跟這條軸要比較的東西不是同一回事。
minYear: 1858

# 會逐年過期。加了超出的事件時 assertInRange 會直接報錯，屆時往上調即可。
maxYear: 2026
