# 欄位定義。order 決定由左至右的順序，**同時也決定配色 slot**
# （0=藍 1=橘 2=青 3=黃 4=洋紅 5=綠 6=紫 7=紅）。
#
# 只有兩欄，用掉最前面兩個 slot（藍／橘）—— 那是全站色盲安全距離最好的一組
# （相鄰配對實測最差色盲 ΔE 24.7 亮／26.8 暗，遠高於門檻 8）。
# 要加第三、第四欄不必重驗，第五欄才要。見 CLAUDE.md「顏色只承載地區」。
#
# 台灣在左（order: 0）：這個主題叫「台灣政治與政黨發展史」，台灣是主詞，
# 中國那一欄是拿來對照的。順序也跟世界史主題一致（那邊台灣同樣是 order: 0），
# 讀者在兩個主題之間切換時，藍色永遠是台灣。

- id: taiwan
  name: 台灣
  subtitle: 清領・日治・中華民國
  order: 0

# subtitle 這句是**設計的一部分**，不是隨手寫的說明。
#
# 這一欄的指涉在 1949 年整個換了一次：1858–1911 是大清，1912–1949 是中華民國，
# 1949 之後是中華人民共和國，而**中華民國並沒有消失，它移到了左邊那一欄**。
# 讀者若不知道這件事，看到 1949 年之後「中華民國」從右欄跳到左欄會以為是資料錯了。
# 三個政權名並列就是在講這件事，也順帶說明了為什麼 1912–1949 的中華民國
# 放在中國欄而不是台灣欄 —— 那段時間它治理的是大陸，台灣還在日本手上。
- id: china
  name: 中國
  subtitle: 清・中華民國・中華人民共和國
  order: 1
