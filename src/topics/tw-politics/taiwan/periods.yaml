  track: 1
  start: 1930
  end: 1930
  note: 第十三任，任期 1929年7月30日－1931年1月16日，因霧社事件處置失當而去職。色帶畫在 1930 整年。

- id: twp-r-gov-ota
  name: 太田政弘
  track: 1
  start: 1931
  end: 1931
  note: 第十四任，任期 1931年1月16日－1932年3月2日。

- id: twp-r-gov-minami
  name: 南弘
  track: 1
  start: 1932
  end: 1932
  note: 第十五任，任期 1932年3月2日－5月26日，不足三個月。色帶借用 1932 整年。

- id: twp-r-gov-nakagawa
  name: 中川健藏
  track: 1
  start: 1933
  end: 1936
  note: 第十六任，最後一位文官總督，任期 1932年5月26日－1936年9月2日。1935 年首次地方選舉在其任內。色帶自 1933 年起。

- id: twp-r-gov-kobayashi
  name: 小林躋造
  track: 1
  start: 1937
  end: 1940
  note: 第十七任，武官總督復歸，任期 1936年9月2日－1940年11月27日。皇民化運動由其推動。色帶自 1937 年起。

- id: twp-r-gov-hasegawa
