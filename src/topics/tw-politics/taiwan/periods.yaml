# 台灣的政治階段。時期是「面」，畫成欄位左側的背景色帶。
# 同一條 track 上不可重疊 —— 所以前一段的 end 要比下一段的 start 早一年。
#
# 只用一條 track，而且從 1858 到 2026 填得滿，符合 CLAUDE.md 那條
# 「要加 track 先確認它從頭到尾填得滿」。
#
# 分期照「誰能參與政治、用什麼方式」切。政權更迭大多同時也是階段更迭
# （1895、1945、1949 三次都是），但日治五十年之內還有一次大轉折
# （武官→文官），而那正是台灣第一波政治結社與議會請願發生的時候，
# 不切開的話那五十年會被當成鐵板一塊。
#
# **1894/1895 與 1944/1945 兩處界線刻意抄自 world/taiwan/periods.yaml。**
# 同一段歷史在兩個主題裡切在不同年份，只會讓在兩邊之間切換的讀者以為看錯了。
# 兩個主題共用邊界是免費的一致性，動它之前先想想另一邊。
#
# **1948/1949 那道界線與中國欄的 twp 對應段落落在同一條 y 上，這是刻意的，
# 也是這個主題的論點本身：** 中華民國在那一年從右欄搬到左欄，兩條色帶同時換色。
# 改任一邊的邊界之前，先確認另一邊還對得上。
#
# **`twp-takeover` 只有四年，預設縮放下畫不出名字**（PeriodRail 的
# MIN_LABEL_HEIGHT 是 44px，色帶高度是 (end + 1 - start) × ppy，
# 四年要 ppy ≥ 11 才夠高）。這是已知的，不要為了讓它顯示而把它併進前後任一段
# —— 色帶的邊界本身已經在傳達訊息，名字放大就看得到，滑鼠停留也有 title。
# 中國欄的 cnp-civil-war 同樣如此，兩欄的窄帶剛好並排在 1949 那道大界線之前，
# 是對照而不是雜訊。
#
# 名字一律控制在六個字以內：`.period-name` 是直排的 11.5px 字加 .14em 字距，
# 每個字約 13.1px，而色帶再高也就那幾十到幾百像素，長名字會被 overflow 切掉。

- id: twp-qing-late
  name: 清領後期
  track: 0
  start: 1858
  end: 1894
  note: 開港通商帶進條約體制與新的商紳階層，牡丹社事件後清廷從消極治理轉為積極經營，1885 年建省。

- id: twp-japan-military
  name: 武官總督期
  track: 0
  start: 1895
  end: 1918
  note: 六三法給予總督發布律令的權力，武裝抗日與招降並行，台灣人沒有任何體制內的參政管道。

- id: twp-japan-civil
  name: 文官總督期
  track: 0
  start: 1919
  end: 1936
  note: 內地延長主義下改派文官總督，台灣文化協會、議會設置請願、台灣民眾黨與地方自治聯盟在這十八年裡先後出現又被瓦解。

- id: twp-japan-kominka
  name: 皇民化時期
  track: 0
  start: 1937
  end: 1944
  note: 政治結社全面禁絕，改以皇民奉公會由上而下動員，台灣人以日本臣民的身分被送上戰場。

- id: twp-takeover
  name: 接收與二二八
  track: 0
  start: 1945
  end: 1948
  note: 行政長官公署接管，本地菁英一度期待參政，二二八事件與其後的清鄉把那一代人幾乎清空。

- id: twp-martial-law
  name: 戒嚴威權時期
  track: 0
  start: 1949
  end: 1986
  note: 戒嚴令、動員戡亂體制與中央民代不改選同時成立，地方選舉是唯一開放的競爭場域。

- id: twp-democratization
  name: 民主化
  track: 0
  start: 1987
  end: 1999
  note: 解嚴、開放黨禁報禁、萬年國會退職、修憲與省市長直選，十三年之內把威權體制逐項拆掉。

- id: twp-alternation
  name: 政黨輪替
  track: 0
  start: 2000
  end: 2026
  note: 政權以定期選舉和平移轉，競爭軸線從「能不能選」移到「與中國的距離」。
