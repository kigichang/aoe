# 台灣的政治階段。時期是「面」，畫成欄位左側的背景色帶。
# 同一條 track 上不可重疊 —— 所以前一段的 end 要比下一段的 start 早一年。
#
# **兩條 track：0 是政治階段，1 是當時的主事者**（清治的皇帝、日治的總督、
# 中華民國的總統）。兩條都從 1858 到 2026 填得滿，符合 CLAUDE.md 那條
# 「要加 track 先確認它從頭到尾填得滿」。
#
# track 1 的成本是整欄再扣 26px + 2px 間隙，而**這筆帳付在標題的寬度上，
# 不是付在標籤的則數上**。`laneCount` 是拿 columnWidth（整欄寬）去除
# MIN_LANE_W 算的，根本沒扣掉 rail，所以加 track 不會讓任何一則事件退化成圖釘；
# 真正變窄的是每個標籤欄。實測 1568px 視窗、兩欄的情況：
#
#   一條 track：欄寬 740 → 事件區 711 → 每個標籤欄 348px
#   兩條 track：欄寬 740 → 事件區 683 → 每個標籤欄 334px（少 14px，約一個字）
#
# **四欄以上的主題不要照抄這個作法** —— 340px 的 MIN_COL_W 扣掉兩條 track
# 只剩約 284px，那時候少掉的就不只一個字了。
#
# ── track 1 的兩個已知取捨，動它之前先讀完 ──────────────────────
#
# **一、年份是整年制，但總督常在年中交接，所以有幾位的色帶會偏移最多約八個月。**
# 日治五十年有十九位總督，其中 1896 年有三位（樺山、桂、乃木）、1932 年也有三位
# （太田、南弘、中川）。色帶不能重疊，而每一位至少要佔一整年才畫得出來，
# 於是採「依序各給一年、不足的往後推」：例如乃木希典實際是 1896/10–1898/2，
# 色帶畫在 1897 整年。**每一則的 note 都寫著精確任期**，偏移看 note 就知道。
# 這是年解析度的畫布與月解析度的史實之間的取捨，不是資料錯誤。
#
# **二、只佔一年的那十條色帶，放到最大也不會顯示名字，只能靠滑鼠停留。**
# PeriodRail 的 MIN_LABEL_HEIGHT 是 44px，色帶高度是 (end + 1 - start) × ppy，
# 而這個主題的 MAX_PPY 是 40（scale.ts：max(40, MIN_PPY×8)，跨度 168 年），
# 所以一年的色帶最高就是 40px，永遠差那 4px。實測顯示得出名字的條數：
#
#   ppy=4.17（全域）4/32　ppy=9（預設）10/32　ppy=15 19/32　ppy=40（最大）22/32
#
# 剩下那十條全是一年期的：樺山資紀、桂太郎、乃木希典、內田嘉吉、上山滿之進、
# 石塚英藏、太田政弘、南弘、安藤利吉、李宗仁。**把門檻調低也救不了**——
# 直排字高約 13.1px，四個字要 52px，一年的色帶只有 40px 還是放不下。
# 它們都有完整的 title（滑鼠停留可看姓名、精確任期與說明）。
#
# 這與 twp-takeover 那則是同一種已知情況（見下方），**不要為了讓名字顯示而把
# 短命總督併進相鄰的人** —— 色帶的邊界本身就在傳達「這五十年換了十九個人」，
# 而那正是這條 track 最值得看的資訊：文官總督期九位總督平均不到兩年一換。
# 真要讓一年期的也顯示得出名字，得動 scale.ts 的 MAX_PPY（要 ≥52 才夠四個字），
# 那是全站共用的常數，會影響每一個主題，不該為了這一欄改。
#
# 分期照「誰能參與政治、用什麼方式」切。政權更迭大多同時也是階段更迭
# （1895、1945、1949 三次都是），但日治五十年之內還有一次大轉折
# （武官→文官），而那正是台灣第一波政治結社與議會請願發生的時候，
# 不切開的話那五十年會被當成鐵板一塊。
#
# **1894/1895 與 1944/1945 兩處界線刻意抄自 world/taiwan/periods.yaml。**
# 同一段歷史在兩個主題裡切在不同年份，只會讓在兩邊之間切換的讀者以為看錯了。
# 兩個主題共用邊界是免費的一致性，動它之前先想想另一邊。
#
# **1948/1949 那道界線與中國欄的 twp 對應段落落在同一條 y 上，這是刻意的，
# 也是這個主題的論點本身：** 中華民國在那一年從右欄搬到左欄，兩條色帶同時換色。
# 改任一邊的邊界之前，先確認另一邊還對得上。
#
# **`twp-takeover` 只有四年，預設縮放下畫不出名字**（PeriodRail 的
# MIN_LABEL_HEIGHT 是 44px，色帶高度是 (end + 1 - start) × ppy，
# 四年要 ppy ≥ 11 才夠高）。這是已知的，不要為了讓它顯示而把它併進前後任一段
# —— 色帶的邊界本身已經在傳達訊息，名字放大就看得到，滑鼠停留也有 title。
# 中國欄的 cnp-civil-war 同樣如此，兩欄的窄帶剛好並排在 1949 那道大界線之前，
# 是對照而不是雜訊。
#
# 名字一律控制在六個字以內：`.period-name` 是直排的 11.5px 字加 .14em 字距，
# 每個字約 13.1px，而色帶再高也就那幾十到幾百像素，長名字會被 overflow 切掉。

- id: twp-qing-late
  name: 清領後期
  track: 0
  start: 1858
  end: 1894
  note: 開港通商帶進條約體制與新的商紳階層，牡丹社事件後清廷從消極治理轉為積極經營，1885 年建省。

- id: twp-japan-military
  name: 武官總督期
  track: 0
  start: 1895
  end: 1918
  note: 六三法給予總督發布律令的權力，武裝抗日與招降並行，台灣人沒有任何體制內的參政管道。

- id: twp-japan-civil
  name: 文官總督期
  track: 0
  start: 1919
  end: 1936
  note: 內地延長主義下改派文官總督，台灣文化協會、議會設置請願、台灣民眾黨與地方自治聯盟在這十八年裡先後出現又被瓦解。

- id: twp-japan-kominka
  name: 皇民化時期
  track: 0
  start: 1937
  end: 1944
  note: 政治結社全面禁絕，改以皇民奉公會由上而下動員，台灣人以日本臣民的身分被送上戰場。

- id: twp-takeover
  name: 接收與二二八
  track: 0
  start: 1945
  end: 1948
  note: 行政長官公署接管，本地菁英一度期待參政，二二八事件與其後的清鄉把那一代人幾乎清空。

- id: twp-martial-law
  name: 戒嚴威權時期
  track: 0
  start: 1949
  end: 1986
  note: 戒嚴令、動員戡亂體制與中央民代不改選同時成立，地方選舉是唯一開放的競爭場域。

- id: twp-democratization
  name: 民主化
  track: 0
  start: 1987
  end: 1999
  note: 解嚴、開放黨禁報禁、萬年國會退職、修憲與省市長直選，十三年之內把威權體制逐項拆掉。

- id: twp-alternation
  name: 政黨輪替
  track: 0
  start: 2000
  end: 2026
  note: 政權以定期選舉和平移轉，競爭軸線從「能不能選」移到「與中國的距離」。

# ── track 1：當時的主事者 ──────────────────────────────────────
#
# 清治列皇帝、日治列總督、中華民國列總統。1858–2026 連續無縫。
# 年份的取捨與名字顯示的限制見檔頭；每一則的 note 都寫著精確任期，
# 色帶與實際任期有出入時會在 note 裡直接寫明「色帶借用／自某年起」。
- id: twp-r-qing-xianfeng
  name: 咸豐帝
  track: 1
  start: 1858
  end: 1861
  note: 在位 1850年3月9日－1861年8月22日。1858 年天津條約簽訂、台灣開港即在其任內，條約體制自此進入台灣。

- id: twp-r-qing-tongzhi
  name: 同治帝
  track: 1
  start: 1862
  end: 1874
  note: 在位 1861年8月22日－1875年1月12日。實際由慈禧與慈安垂簾聽政；1874 年牡丹社事件後，清廷對台從消極治理轉為積極經營。

- id: twp-r-qing-guangxu
  name: 光緒帝
  track: 1
  start: 1875
  end: 1894
  note: 在位 1875年2月25日－1908年11月14日，但實權長期在慈禧手中。1885 年台灣建省在其任內；1895 年 4 月馬關條約割台，故色帶止於 1894 年，與 track 0 的清領後期一致。

- id: twp-r-gov-kabayama
  name: 樺山資紀
  track: 1
  start: 1895
  end: 1895
  note: 首任總督，任期 1895年5月10日－1896年6月2日。乙未戰爭與台灣民主國在其任內。色帶止於 1895 年底，實際做到 1896 年 6 月。

- id: twp-r-gov-katsura
  name: 桂太郎
  track: 1
  start: 1896
  end: 1896
  note: 第二任，任期 1896年6月2日－10月14日，僅四個多月，是任期最短的總督。色帶借用 1896 整年。

- id: twp-r-gov-nogi
  name: 乃木希典
  track: 1
  start: 1897
  end: 1897
  note: 第三任，任期 1896年10月14日－1898年2月26日。雲林事件在其任內。色帶畫在 1897 整年。

- id: twp-r-gov-kodama
  name: 兒玉源太郎
  track: 1
  start: 1898
  end: 1905
  note: 第四任，任期 1898年2月26日－1906年4月11日。民政長官後藤新平在其任內確立保甲、警察與土地調查的治理骨架，實務多由後藤主持。

- id: twp-r-gov-sakuma
  name: 佐久間左馬太
  track: 1
  start: 1906
  end: 1914
  note: 第五任，任期 1906年4月11日－1915年5月1日，是任期最長的總督。五年理蕃計畫與太魯閣戰爭在其任內。

- id: twp-r-gov-ando-sadami
  name: 安東貞美
  track: 1
  start: 1915
  end: 1917
  note: 第六任，任期 1915年5月1日－1918年6月6日。西來庵事件在其任內，是最後一次大規模武裝抗日。

- id: twp-r-gov-akashi
  name: 明石元二郎
  track: 1
  start: 1918
  end: 1919
  note: 第七任，任期 1918年6月6日－1919年10月24日，唯一在任內病逝並依遺囑葬於台灣的總督。

- id: twp-r-gov-den
  name: 田健治郎
  track: 1
  start: 1920
  end: 1923
  note: 第八任，首位文官總督，任期 1919年10月29日－1923年9月2日。推行內地延長主義，1920 年改制五州二廳。色帶自 1920 年起。

- id: twp-r-gov-uchida
  name: 內田嘉吉
  track: 1
  start: 1924
  end: 1924
  note: 第九任，任期 1923年9月6日－1924年9月1日。治警事件在其任內。

- id: twp-r-gov-izawa
  name: 伊澤多喜男
  track: 1
  start: 1925
  end: 1926
  note: 第十任，任期 1924年9月1日－1926年7月16日。

- id: twp-r-gov-kamiyama
  name: 上山滿之進
  track: 1
  start: 1927
  end: 1927
  note: 第十一任，任期 1926年7月16日－1928年6月16日。台灣民眾黨與台灣工友總聯盟在其任內成立。色帶畫在 1927 整年。

- id: twp-r-gov-kawamura
  name: 川村竹治
  track: 1
  start: 1928
  end: 1929
  note: 第十二任，任期 1928年6月16日－1929年7月30日。

- id: twp-r-gov-ishizuka
