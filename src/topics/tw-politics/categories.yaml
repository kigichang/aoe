# 這個主題的事件類別。**最多六個** —— 識別完全靠圖釘上那個漢字，
# 不靠顏色（顏色只承載欄位，理由見 CLAUDE.md）。
#
# 六類是照「一件事**怎麼**改變了政治的形狀」切的，不是照政權切（政權更迭本身
# 就是「政體」裡的一種事件），也不是照人物切：
# 規則與法統改了（政）、有人組織起來了（黨）、開始用選票決定誰統治（選）、
# 由下而上推了一把（運）、由上而下壓了回去（壓）、用武力解決（戰）。
#
# 界線上的常見疑問：
# - 「政體」對「政黨」：政體是**規則與法統**的改變（臨時約法、動員戡亂時期
#   臨時條款、萬年國會、修憲、退出聯合國、一國兩制）。政黨是**特定政黨**的
#   成立、分裂、合併、改組或解散（同盟會、台灣民眾黨、民進黨、新黨、時代力量）。
#   「開放黨禁」是政體 —— 它改的是所有政黨的遊戲規則，不是任何一個政黨的事。
# - 「政體」也收**主權與法統的對外主張**：退出聯合國、中美斷交、辜汪會談、
#   九二共識、一中原則。刻意不另開「外交」一類，因為這條軸上的對外關係
#   幾乎全都是在爭「誰代表中國」，那本來就是法統問題。純粹的邦交國增減不收。
# - 「選舉」收的是**選舉制度與選舉結果**（日治的市街庄協議會員選舉、
#   增額中央民代、首次總統直選、政黨輪替、中共的人民代表大會制）。
#   判準是有沒有真的在投票決定誰上台；等額同意票那種形式投票放這裡，
#   但 desc 要寫清楚它不是競爭性選舉。
# - 「運動」收的是**由下而上的政治動員**（台灣文化協會、五四、美麗島、
#   野百合、太陽花、六四學運的學生端）。判準是發動者不在體制內。
# - 「鎮壓」收的是**由上而下壓制反對力量**（戒嚴、清黨、二二八、白色恐怖、
#   反右、六四的清場端）。同一件事的兩端會拆成兩則還是合成一則，
#   看史料上它是不是被當成一件事講；六四拆兩則（學運與清場），
#   美麗島事件合成一則（遊行與大逮捕在同一夜）。
# - 「戰爭」收的是**用武力決定政治歸屬**（乙未戰爭、北伐、抗日戰爭、
#   國共內戰、古寧頭、八二三）。判準是有沒有成建制的軍隊對打；
#   政府對平民的武力鎮壓歸「鎮壓」，不歸這裡。
#
# **刻意沒有「人物」這一類。** 誰上台誰下台是政體事件的一部分
# （蔣經國逝世收在政體，因為它解除的是強人體制），單獨開一類會讓這條軸
# 變成領導人列表，而這個主題想問的是制度怎麼變，不是誰在位。

