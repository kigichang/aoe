# 中國的政治階段。同一條 track 上不可重疊。
#
# **只用一條 track，而 1912–1928 的「兩個中央政府並存」刻意不另闢一條。**
# 那十幾年裡北京的北洋政府與廣州的軍政府／國民政府各自宣稱正統，
# 畫成兩條色帶確實更準確，但那條 track 只有 1917–1928 這十一年有東西
# （168 年裡的 6.5%），前後都是大片空白 —— CLAUDE.md 說得明白：
# 空白色帶比沒有色帶更難讀。而 track 的成本是**整欄都要付**的：
# 固定 26px + 2px 從 340px 的 MIN_COL_W 裡扣，為了 6.5% 的軸長付 8% 的欄寬。
# 護法軍政府、廣州國民政府、寧漢分裂全部照收成事件（有跨度的用 endYear），
# 讀者從那幾則就看得出來當時不只一個政府。
#
# 還有一個更重要的理由：如果這一欄為了 1917–1928 分成兩條 track，
# 讀者立刻會問為什麼 1949 之後不分 —— 那才是兩個政府宣稱代表同一個國家、
# 而且一直並存到今天的情況，何況其中一個就在左邊那一欄。
# 用色帶回答那個問題就是在替兩岸定位下結論。**兩欄都維持單 track 才是中性的。**
#
# 分期照「誰在行使中央權力、依據什麼法統」切。1949 之後這一欄只講
# 中華人民共和國，中華民國移到左邊那一欄 —— 這是這個主題最需要讀者
# 意會的一件事，regions.yaml 的 subtitle 也在講同一件事。
#
# **1911/1912 與 1948/1949 兩處界線抄自 world/china/periods.yaml**
# （那邊是「清 …1911／中華民國 1912–1948／現代 1949–」），
# 而 1948/1949 同時也是台灣欄換色的那一年。理由見 taiwan/periods.yaml。
#
# **分期名一律沿用該地史學界既有的通行分法，不為了跟台灣欄視覺對稱而自創新名。**
# 台灣欄的段落用制度命名（戒嚴、民主化、政黨輪替），這一欄 1949 之後用領導人命名
# （毛澤東時期、江胡時期、習近平時期），看起來不對稱 —— 但那正是兩邊史學界
# 實際使用的講法，硬造一個「個人集權回歸」來配「民主轉型」就是資料在表態。

- id: cnp-late-qing
  name: 晚清變法與革命
  track: 0
  start: 1858
  end: 1911
  note: 從總理衙門與洋務運動一路到戊戌變法、清末新政與預備立憲，體制內的改革與體制外的革命同時加速。

- id: cnp-beiyang
  name: 北洋政府
  track: 0
  start: 1912
  end: 1927
  note: 共和的形式建立起來了，實質卻是總統、國會與軍閥反覆推翻彼此；1917 年起南方另立政府與之對抗。

- id: cnp-tutelage
  name: 訓政時期
  track: 0
  start: 1928
  end: 1936
  note: 北伐完成後以黨治國，訓政時期約法把政權交給中國國民黨，同時展開對中共的圍剿。

- id: cnp-anti-japan
  name: 抗日戰爭
  track: 0
  start: 1937
  end: 1945
  note: 第二次國共合作把內戰按下暫停鍵，政府西遷重慶，中共在敵後大幅擴張根據地與兵力。

- id: cnp-civil-war
  name: 行憲與內戰
  track: 0
  start: 1946
  end: 1948
  note: 政治協商會議破局，制憲國民大會通過中華民國憲法並選出行憲後首任總統，同一段時間內戰全面爆發並迅速逆轉。

- id: cnp-mao
  name: 毛澤東時期
  track: 0
  start: 1949
  end: 1976
  note: 中華人民共和國成立後確立一黨領導與人民代表大會制，反右、大躍進與文化大革命接連把政治鬥爭推向全社會。

- id: cnp-reform
  name: 改革開放
  track: 0
  start: 1977
  end: 1992
  note: 三中全會確立路線轉向，廢除領導職務終身制；政治體制的界線在 1989 年被明確劃下，1992 年南巡與十四大定調。

- id: cnp-collective
  name: 江胡時期
  track: 0
  start: 1993
  end: 2012
  note: 接班與任期制度化，集體領導與黨政分工達到最完整的形態，對台政策同時走硬法與軟交流兩手。

- id: cnp-xi
  name: 習近平時期
  track: 0
  start: 2013
  end: 2026
  note: 修憲取消國家主席任期限制，權力重新集中，香港的一國兩制與對台政策同步收緊。
