# 這個主題的事件類別。**最多六個** —— 識別完全靠圖釘上那個漢字，
# 不靠顏色（顏色只承載欄位，理由見 CLAUDE.md）。
#
# 六類是照「一件事怎麼推動知識」切的，不是照學科切（學科已經是欄位了）：
# 看到了什麼（發）、解釋成什麼（論）、寫成了什麼（著）、
# 靠什麼才看得到（器）、誰在持續做這件事（院）、真的被用出去（用）。
#
# 界線上的常見疑問：
# - 「發現」對「理論」：X 光是發現（先看到現象），相對論是理論（先寫下形式）。
#   同一個人同一年常常兩件都做了，這時看那則事件想講的是哪一半。
# - 「理論」對「著作」：定律的提出用「論」，把一整個領域整理成體系的書用「著」
#   （《幾何原本》《本草綱目》《物種起源》都是後者——它們的分量在於整理，
#   不在於某一條新命題）。
# - 「儀器」收的是**讓新東西被看見的工具**（望遠鏡、顯微鏡、加速器），
#   不是一般技術產品。
# - 「建制」問的是**研究在什麼條件下進行**，所以不只收學會、期刊、獎項與
#   大科學計畫，也收限制研究的裁決（伽利略受審、李森科事件）。兩者是同一
#   個問題的正反面——誰有資源做、誰被允許做。

