# 時間軸的上下界。事件與時期都必須落在裡面，超出的會被 data.ts 的
# assertInRange 在載入期擋下（見 CLAUDE.md「時間軸的上下界」）。
#
# 為什麼是 -3000：有紀錄可考的數理活動大致從這裡開始（蘇美的六十進位
# 記數與土地丈量）。再往前只剩考古推測（伊尚戈骨、巨石陣的天文對位），
# 年代誤差以千年計，釘在精確的 y 上是假精度。
#
# 為什麼不乾脆從 -600（泰利斯）起算：那會把巴比倫的天文觀測表、
# 萊因德紙草書、埃及曆全部關在門外，而「希臘人之前近東已經算了一千年」
# 正是這個主題該讓人看到的事。前 3000–前 600 那段確實稀疏，
# 但稀疏本身是誠實的訊息。
minYear: -3000

# 會逐年過期。加了超出的事件時 assertInRange 會直接報錯，屆時往上調即可。
maxYear: 2026
