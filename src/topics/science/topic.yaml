# 世界科學史。目錄名就是網址路徑：/science/
#
# 史觀：**知識本身的歷史**，不是偉人榜。收錄的判準是「這件事之後，
# 這個學科能問的問題不一樣了」——一個現象被觀測到、一條定律被寫下來、
# 一本書把散落的東西整理成體系、一件儀器讓看不見的東西被看見、
# 一個機構讓研究可以持續、一項知識真的被用出去。
#
# 刻意**不做輝格式的敘事**（把過去讀成「一路走向今天的正確答案」）：
# 燃素說、地心說、四體液說在被推翻之前都是當時最好的解釋，
# 它們的提出與被推翻是同一條軸上的兩則事件，兩則都收。
# 非歐洲的成果（中國、印度、伊斯蘭世界、瑪雅）依同一套判準收錄，
# 不因為「後來沒有接上近代科學」就降級。

name: 世界科學史
description: 把幾個學科放在同一條時間軸上，看同一個年代各自走到哪裡。

order: 3

# 欄位在這裡是「學科」，不是地區。
#
# 為什麼不照地理分欄：世界史那個主題已經在做地理對照了，再做一次沒有新東西。
# 照學科分欄才問得出這個主題獨有的問題——「牛頓寫《原理》那年，
# 生物學還在爭論生物會不會自然發生」「微積分成形時，化學連元素是什麼都還沒定義」。
# 學科之間的落差本身就是科學史最重要的觀察，而那要並排才看得出來。
columnLabel: 學科

# 開場縮放（px/年）。比世界史的 1.0 高，因為科學史的事件分佈更偏——
# 軸的前四千年稀疏，1600 年之後極密。1.0 時近代那段擠成一片圓點，
# 拉到 1.6 才讀得出十七世紀以後的標題。代價是一屏從 700 年變約 440 年，
# 仍然看得到「伽利略對上哈維」這種同代對照。
defaultPpy: 1.6

# 愈近代愈密，而且比世界史更極端——科學事件的重心整個壓在 1600 之後，
# 所以 1600、1700、1800 之後每個世紀都給一顆。
jumps: [-2000, -500, 1, 500, 1000, 1500, 1600, 1700, 1800, 1900, 1960]
