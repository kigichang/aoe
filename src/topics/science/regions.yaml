# 欄位定義。order 決定由左至右的順序，**同時也決定配色 slot**
# （0=藍 1=橘 2=青 3=黃 4=洋紅 5=綠 6=紫 7=紅）。
#
# 只有四欄是刻意的：相鄰欄的配色只驗證過前四個 slot 的色盲安全距離
# （見 CLAUDE.md「顏色只承載地區」）。要加第五欄之前得先重驗，
# 而且調整 order 也要重驗。
#
# 由抽象而具體排列：數學 → 物理與化學 → 天文與地球 → 生命與醫學。
# 這個順序讓相鄰欄真的有話可講——數學與物理是同一條因果鏈
# （微積分之於力學、群論之於量子力學），天文與地球共用觀測方法，
# 地球與生命共用地層與化石。隔一欄以上的對照才是「純粹的同代並置」。
#
# **刻意沒有「技術與工程」這一欄。** 這個主題問的是「知道了什麼」，
# 不是「做得出什麼」；蒸汽機、電報、電腦都在，但收的角度是它們帶來的
# 知識（熱力學、電磁學、可計算性），掛在對應的學科欄。真要做技術史
# 該另開一個主題，那條軸的判準（產量、普及率、成本）跟這裡完全不同。

- id: math
  name: 數學
  subtitle: 數與形
  order: 0

- id: physical
  name: 物理與化學
  subtitle: 物質與運動
  order: 1

- id: cosmos
  name: 天文與地球
  subtitle: 星空與大地
  order: 2

- id: life
  name: 生命與醫學
  subtitle: 生物與人體
  order: 3
