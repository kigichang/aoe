# ── 先進製程與地緣政治 ────────────────────────────────────────

- id: te-2020-5nm
  year: 2020
  title: 5 奈米量產，蘋果 A14 與 M1 採用
  category: technology
  importance: 4
  desc: 製程領先從「便宜可靠」變成「只有這裡做得出來」。客戶的旗艦產品要等台積電的產能表，議價關係整個倒轉過來。
  sources:
    - title: 英文維基百科：台積電
      url: https://en.wikipedia.org/wiki/TSMC

- id: te-2020-global-share
  year: 2020
  title: 台積電佔全球晶圓代工過半
  category: trade
  importance: 4
  desc: 一家公司拿下超過一半的市場。這個集中度後來被稱為「矽盾」——既是台灣在國際上的籌碼，也是全世界都想分散掉的風險。
  sources:
    - title: 英文維基百科：台灣半導體產業
      url: https://en.wikipedia.org/wiki/Semiconductor_industry_in_Taiwan
    - title: 英文維基百科：矽盾
      url: https://en.wikipedia.org/wiki/Silicon_shield

- id: te-2020-arizona
  year: 2020
  title: 台積電宣布赴亞利桑那設廠
  category: policy
  importance: 5
  desc: 先進製程第一次離開台灣。決定的理由不是成本也不是市場，而是客戶國的政策壓力 —— 從這一年起，晶圓廠蓋在哪裡是地緣政治問題，不是工程問題。2022 年底投資額增為三倍，2024 年初則坦承量產要延到 2027 至 2028 年。
  sources:
    - title: 英文維基百科：台積電
      url: https://en.wikipedia.org/wiki/TSMC
    - title: 英文維基百科：矽盾
      url: https://en.wikipedia.org/wiki/Silicon_shield

- id: te-2021-jasm
  year: 2021
  title: 與索尼合資成立 JASM，赴熊本設廠
  category: enterprise
  importance: 4
  desc: 十一月宣布，日本政府補貼過半建廠成本。與亞利桑那那一座不同，這裡做的是成熟製程，補的是車用與工業晶片的缺口。
  sources:
    - title: 英文維基百科：台積電
      url: https://en.wikipedia.org/wiki/TSMC

- id: te-2021-chip-shortage
  year: 2021
  title: 全球晶片荒
  category: trade
  importance: 5
  desc: 疫情打亂需求預測，車廠減單後又搶不回產能，全球汽車生產線陸續停擺。各國政府這才發現最關鍵的零件幾乎全部來自同一個島 —— 此後的補貼法案、在地設廠要求與出口管制，都是從這一年的恐慌開始的。
  sources:
