- id: te-2009-output
  year: 2009
  title: 半導體產值達 390 億美元
  category: trade
  importance: 3
  desc: 金融海嘯的谷底年份仍有這個規模。DRAM 廠在這一波倒了一批，晶圓代工卻幾乎沒有受傷 —— 押注記憶體與押注代工的差別在這一年結算。
  sources:
    - title: 英文維基百科：台灣半導體產業
      url: https://en.wikipedia.org/wiki/Semiconductor_industry_in_Taiwan

- id: te-2018-morris-chang-retires
  year: 2018
  title: 張忠謀退休，台積電交棒
  category: enterprise
  importance: 4
  desc: 主持三十一年後退休，由劉德音任董事長、魏哲家任總裁。創辦人退場而公司持續領先，代表晶圓代工已經從一個人的構想變成一套制度。
  sources:
    - title: 英文維基百科：台積電
