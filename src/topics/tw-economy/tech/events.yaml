  title: 南科產值 2.97 兆，首度超越竹科加中科
  category: trade
  importance: 3
  desc: 三個園區裡最晚開的那個，三十年後成為最大的一個。先進製程的重心跟著台積電的新廠往南移，竹科則轉為研發與設計的聚落。
  sources:
