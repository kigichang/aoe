  title: 熊本廠開始商業運轉
  category: enterprise
  importance: 3
  desc: 十二月投產，從宣布到量產只花了三年，比亞利桑那快得多。同一家公司在兩個國家蓋廠的落差，說明的是當地的供應鏈與工班有沒有跟上，而不是技術。
  sources:
