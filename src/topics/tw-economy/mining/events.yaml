- id: mn-2000-last-coal-mines
  year: 2000
  title: 最後四座煤礦停工，台灣不再採煤
  category: enterprise
  importance: 5
  desc: 利豐、裕峰、安順、台誠相繼停工，從 1876 年八斗子官礦算起一百二十四年的採煤史結束。收尾的原因不是煤挖完了，是薄煤層深坑的成本贏不了進口煤，而三場大礦災之後也再沒有人願意用那種條件開坑。礦區留下的坑口、卸煤櫓與礦工聚落陸續被指定為文化資產，新平溪與猴硐的舊礦場改成博物園區 —— 這一欄的故事到此為止，接下來台灣需要的礦全部從外面買。
  sources:
