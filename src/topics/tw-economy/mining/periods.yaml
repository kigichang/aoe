# 礦業的階段。同一條 track 上不可重疊。
#
# **兩端刻意留白，而且兩端的理由不一樣。**
#
# 1624–1875 沒有色帶：那段只有官方採辦的硫磺與禁令下的私掘小坑，
# 沒有可稱為「時期」的共同結構（同工業欄 1624–1859 的處理）。
#
# 2001–2026 沒有色帶：那是真的結束了。台灣在 2000 年停止採煤、
# 1987 年停止採金銅，此後這一欄沒有產業可以斷代。**不要為了讓色帶
# 撐到軸底而把「礦業遺址觀光」或「進口礦砂加工」算進來** —— 那會讓
# 這一欄變成「凡是跟礦有關的東西」，而這個主題最想講的正是
# 一個產業從無到有、再到完全消失的完整形狀，結尾的空白就是結論。

- id: mn-qing-official
  name: 官辦採礦
  track: 0
  start: 1876
  end: 1894
  note: 八斗子官礦與出磺坑油井引進機器，但只有官方出得起錢，規模始終有限。

- id: mn-japanese-capital
  name: 礦權與財閥
  track: 0
  start: 1895
  end: 1945
  note: 礦業規則把礦權國有再核發給日本人，資本整併出基隆炭礦、台陽與金瓜石三大礦業。

- id: mn-postwar-energy
  name: 戰後能源支柱
  track: 0
  start: 1946
  end: 1972
  note: 煤是發電、鐵路與工廠唯一的大宗燃料，1960 年產量達到高峰後隨即被重油取代。

- id: mn-decline
  name: 收坑與歇業
  track: 0
  start: 1973
  end: 2000
  note: 石油危機撐起最後一波回升，三場大礦災之後礦場陸續關閉，採煤與採金相繼結束。
