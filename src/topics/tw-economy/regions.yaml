# 欄位定義。order 決定由左至右的順序，**同時也決定配色 slot**
# （0=藍 1=橘 2=青 3=黃 4=洋紅 5=綠 6=紫 7=紅）。
#
# 三欄，落在已驗證過相鄰色盲安全距離的前四個 slot 之內（見 CLAUDE.md
# 「顏色只承載地區」）。要加第四欄不必重驗，第五欄才要。
#
# 順序照「一個產業從哪裡長出來」排，不是照重要性也不是照現在的產值：
# 農業養工業（以農養工、肥料換穀把農業剩餘抽去建工廠），
# 工業養科技業（電子代工吃的是加工出口區練出來的製造與管理能力）。
# 這個順序讓相鄰欄真的共用東西——農業與工業共用製糖、土地與勞動力，
# 工業與科技業共用出口導向、園區制度與代工模式。隔一欄的對照
# （農業對科技業）才是純粹的同代並置，也正是這個主題最想給的那一組：
# 「台積電成立那年，稻米還在保價收購」。

- id: agriculture
  name: 農業
  subtitle: 稻米・糖・茶・林漁牧
  order: 0

- id: industry
  name: 工業
  subtitle: 製糖・電力・石化・製造
  order: 1

# subtitle 這句是**設計的一部分**，不是隨手寫的說明。
# 這一欄在 1624–1972 之間完全空白（349 年，佔軸長 87%），
# 讀者需要知道那片空白是史實而不是資料沒補完。
#
# **不要為了填滿它而放寬這一欄的定義。** 清代的機器局、日治的電力建設
# 都是工業欄的東西；把它們挪過來會讓「科技業」變成「凡是先進的東西」，
# 而這個主題最想講的正是「台灣的科技業是 1973 年才無中生有長出來的」。
- id: tech
  name: 科技業
  subtitle: 1973 年工研院成立起
  order: 2
