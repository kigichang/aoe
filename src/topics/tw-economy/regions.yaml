# 欄位定義。order 決定由左至右的順序，**同時也決定配色 slot**
# （0=藍 1=橘 2=青 3=黃 4=洋紅 5=綠 6=紫 7=紅）。
#
# 四欄，正好用滿 CLAUDE.md「顏色只承載地區」那節實測過相鄰色盲安全距離的
# 前四個 slot。**第五欄要先重驗**，而且驗的是相鄰配對，所以下面的 order
# 一動就得重驗。
#
# 加入礦業時 工業 從 slot 1 換到 2、科技業 從 2 換到 3。CLAUDE.md 那條
# 「不可以重新指派顏色」講的是**篩選**（關掉一欄之後剩下的欄不能換色，
# 否則讀者的顏色記憶就毀了）；新增欄位是資料本身的改動，換色是一次性的，
# 不是同一件事。
#
# 順序照「一個產業從哪裡長出來」排，不是照重要性也不是照現在的產值：
# 農業與礦業都是從同一塊土地上取東西，共用季節性的勞動力（礦工長期是
# 農閒兼業，礦業聚落也是從農村招人）；礦業養工業（八斗子的煤先餵輪船與
# 機器局，日治的糖廠、發電所與戰後的鐵路工廠燒的都是本地煤）；
# 工業養科技業（電子代工吃的是加工出口區練出來的製造與管理能力）。
# 這個順序讓相鄰欄真的共用東西，隔一欄的對照才是純粹的同代並置 ——
# 「台積電成立那年，金瓜石礦山正式歇業」「稻米還在保價收購」。

- id: agriculture
  name: 農業
  subtitle: 稻米・糖・茶・林漁牧
  order: 0

# subtitle 標出年代範圍，理由同科技業那欄：這一欄兩端都是空白，
# 讀者需要知道那是史實而不是資料沒補完。1624–1875 只有官方採辦的硫磺與
# 禁令下的私掘小坑，2000 年之後台灣不再採煤——**這一欄是站上唯一一個
# 有完整結局的產業**，結尾的空白就是結論，不要為了填滿它把礦區觀光或
# 進口礦砂加工算進來。
- id: mining
  name: 礦業
  subtitle: 1876–2000・硫磺・煤・金銅・石油
  order: 1

- id: industry
  name: 工業
  subtitle: 製糖・電力・石化・製造
  order: 2

# subtitle 這句是**設計的一部分**，不是隨手寫的說明。
# 這一欄在 1624–1972 之間完全空白（349 年，佔軸長 87%），
# 讀者需要知道那片空白是史實而不是資料沒補完。
#
# **不要為了填滿它而放寬這一欄的定義。** 清代的機器局、日治的電力建設
# 都是工業欄的東西；把它們挪過來會讓「科技業」變成「凡是先進的東西」，
# 而這個主題最想講的正是「台灣的科技業是 1973 年才無中生有長出來的」。
- id: tech
  name: 科技業
  subtitle: 1973 年工研院成立起
  order: 3
