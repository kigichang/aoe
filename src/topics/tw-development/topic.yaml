# 台灣發展史。目錄名就是網址路徑：/tw-development/
#
# 史觀：**產業能做什麼的歷史**，不是經濟成長率的排行榜。收錄的判準是
# 「這件事之後，這個產業能做的事不一樣了」——一項作物或製程被引進、
# 一條規則改變了誰能生產、一座設施讓做不到的事變成做得到、
# 一家公司開闢了新的做法、出口的結構整個換了一批東西、
# 做這些事的人換了一批。
#
# 刻意**不做「經濟奇蹟」的敘事**（把過去讀成一路向上的成功故事）：
# 日治的米糖經濟同時是農業技術的躍進與殖民地的剝削結構，
# 以農養工同時撐起了工業化與壓垮了農村，兩面都收。
# 失敗與退場也是事件——糖業萎縮、產業外移、面板的兩兆雙星，
# 它們改變產業能做的事，程度不亞於成功的那些。

name: 台灣發展史
description: 把台灣的三大產業放在同一條時間軸上，看同一個年代各自在做什麼。

order: 5

# 欄位在這裡是「產業」，不是地區。
#
# 為什麼不照地區分欄：台灣只有一個地理範圍，切成南北中東問不出什麼——
# 而且世界史那個主題已經在做地理對照了。照產業分欄才問得出這個主題獨有的問題：
# 「台積電成立那年，農村正在推稻米轉作」「加工出口區設立時，農民還在繳肥料換穀」。
# 台灣最值得看的不是任一個產業自己的故事，而是**後一個產業怎麼從前一個身上長出來**，
# 而那要並排才看得出來。
#
# 為什麼不叫「部門」或「產業別」：欄位標題就那幾個字，愈短愈好讀。
columnLabel: 產業

# 開場縮放（px/年）。跨度只有 402 年，但事件密度極度偏向近代——
# 1624–1894 這 271 年約 30 則，1895–2026 這 132 年約 120 則，**密度差九倍**。
#
# 實測（136 則資料，1568×713 視窗，錨在 1900 年）：
#
#   ppy | 圖釘       | 讀得到 | 一屏年數
#   ----|------------|--------|--------
#   2   | 87（64%）  | 49     | 364
#   4   | 63（46%）  | 73     | 182
#   6   | 46（34%）  | 90     | 121
#   8   | 39（29%）  | 97     | 91
#   12  | 27（20%）  | 109    | 61
#
# 取 6。真正的躍升在 4→6（讀得到 +17），6 之後每加一級只多五到七則，
# 一屏年數卻掉得很快。121 年剛好讓日治那五十年與戰後土地改革同時在畫面上，
# 而那正是這個主題最想給的對照。CLAUDE.md 說得很清楚：要看的是「讀得到幾則」
# 而不是圖釘比例（比例會騙人，分母跟著變）。
#
# **預設視角下科技業欄有 26 顆圖釘（40 則裡的 65%），這是必然的，不是調壞了。**
# 那一欄的 40 則全擠在 1973–2026 的 53 年裡，而農業欄的 54 則攤在 402 年上。
# 三欄各自的疏密天差地遠，靠一個全域的 ppy 不可能同時照顧到 ——
# 密的那一欄放大就讀得到，工具列的 1970／1990／2010 跳轉與搜尋也都到得了。
#
# **這個主題的 importance 分層實際上沒有作用**，這是刻意接受的：
# MIN_PPY = 700 / 402 = 1.74，已經越過 TIERS 的 imp-3 門檻（1.2），
# 而資料裡最低就是 3 級 —— 所以縮到最小也看得到全部 136 則。
# 跨度短的主題本來就該這樣（CLAUDE.md「TIERS 刻意維持絕對值」那節），
# **不要為此去動 TIERS，也不要為了讓分層「有作用」硬把事件降到 2 級以下。**
defaultPpy: 6

# 刻意愈近代愈密：1624–1860 這 236 年只給三顆，1895 之後 131 年給五顆，
# 因為資料密度就是那樣。平均切只會讓近代那段跳不準。
jumps: [1624, 1700, 1800, 1860, 1895, 1945, 1970, 1990, 2010]
