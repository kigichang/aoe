# 這個主題的事件類別。**最多六個** —— 識別完全靠圖釘上那個漢字，
# 不靠顏色（顏色只承載欄位，理由見 CLAUDE.md）。
#
# 六類是照「一件事**怎麼**推動產業」切的，不是照產業別切（產業別已經是欄位了），
# 也不是照作物或商品切（那比欄位細兩級，而且新作物的引進本身就是這條軸上的事件）：
# 規則改了（政）、做得到的事變了（技）、蓋出了實體（建）、
# 有人開了新做法（企）、賣的買的換了一批（貿）、做事的人換了一批（勞）。
#
# 界線上的常見疑問：
# - 「政策」對「建設」：政策是**規則**的改變（三七五減租、獎勵投資條例、
#   加入 WTO），建設是**蓋出了實體的東西**（嘉南大圳、日月潭發電所、
#   新竹科學園區）。「設立加工出口區」兩者都是——這時看那則想講的是
#   那部條例還是高雄那塊地。法人機構的成立（工研院、農復會、農委會）
#   算規則的一種，歸政策。
# - 「技術」收的是**讓做不到的事變成做得到**（蓬萊米育成、CMOS 製程移轉、
#   晶圓代工模式、雜交育種），不是產量成長也不是單純的設備更新。判準是：
#   沒有它，後來那一整批東西在物理上做不出來。
# - 「企業」是**特定公司**的成立、轉折或退場（台灣製糖、台塑、台積電、
#   聯電、鴻海）。判準是那家公司本身就是斷點，不是它某一年的業績。
# - 「貿易」收的是**出口／進口結構本身**的變化（開港通商、樟腦專賣、
#   出口值首度超越進口、對美貿易順差、加入 WTO）。單一商品的價格波動不算。
# - 「勞動」收的是**做這些事的人換了一批**（羅漢腳與佃農、糖業契作、
#   加工出口區女工、勞基法、引進移工、產業外移後的失業）。
#
# **刻意沒有「危機／災害」這一類**（八七水災、石油危機、亞洲金融風暴）。
# 那些事件本身不改變產業能做什麼，改變的是它們**逼出來的回應**，
# 所以照回應歸類：石油危機→十大建設是政策，八七水災→石門水庫是建設。
# 硬開第七類也會撞到 schema 的六類上限。

- id: policy
  label: 政策
  glyph: 政

- id: technology
