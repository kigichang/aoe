# 時間軸的上下界。事件與時期超出範圍會在載入期報錯（見 data.ts 的 assertInRange）。
#
# 起點取 1500 而不是 1624（荷蘭築城）或 1400：
#
#   | 下限 | 台灣 | 日本 | 中國 | 世界 |
#   |------|------|------|------|------|
#   | 1400 | 172  | 162  | 117  | 171  |
#   | 1500 | 172  | 155  | 111  | 160  |
#   | 1624 | 167  | 122  |  93  | 131  |
#
# 1624 會砍掉台灣欄 1582 船難、1593 高山國、1603 東番記、1621 顏思齊那四則前史，
# 也砍掉世界欄整個大航海時代的鋪陳 —— 哥倫布、達伽馬、麥哲倫、宗教改革、
# 鐵砲傳日、馬尼拉建城正是「福爾摩沙為什麼在 16 世紀末被看見」的脈絡。
# 1400 只多收明初與室町幾則，台灣欄 1400–1581 完全空白（1281 的澎湖巡檢司
# 也進不來），多出來的 100 年幾乎純粹是留白。
#
# 十三行文化（200–1600）是唯一一則跨過起點的台灣事件，用 actualYear 夾在 1500
# （CLAUDE.md「夾住的年份」那條），年代軸因此在最上格印 ~1500。
minYear: 1500
maxYear: 2026
