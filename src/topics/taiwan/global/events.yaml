  category: politics
  importance: 4
  desc: 光榮革命後國會通過權利法案，明定國王不得未經國會同意徵稅或維持常備軍，臣民享有請願與言論自由；君主權力自此正式受法律節制，君主立憲的憲政框架就此確立，也成為日後美國權利法案等文件的藍本。
  sources:
    - title: 維基百科：1689年權利法案
      url: https://zh.wikipedia.org/wiki/1689年權利法案

