  endYear: 1977
  title: 英迪拉·甘地宣布緊急狀態
  category: politics
  importance: 4
  desc: 總理英迪拉·甘地因選舉舞弊判決與國內動盪，宣布全國進入緊急狀態，中止公民自由、大規模逮捕反對派並實施新聞審查；近兩年後她主動解除緊急狀態、舉行大選卻意外落敗，是印度獨立以來民主體制最嚴重的一次中斷。
