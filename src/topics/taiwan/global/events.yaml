  category: politics
  importance: 4
  desc: 費城制憲會議在《邦聯條例》運作失靈後重新設計聯邦體制，確立三權分立與聯邦制的架構，是史上第一部成文的國家憲法；隨後通過的權利法案十條修正案進一步保障言論、宗教等基本公民權利。
  sources:
    - title: 維基百科：美國憲法
