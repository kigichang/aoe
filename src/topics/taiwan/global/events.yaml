  category: politics
  importance: 5
  desc: 戈巴契夫的開放與改革政策鬆動了蘇聯的政治控制，卻未能挽救停滯的經濟，反而加速了各加盟共和國的獨立浪潮；保守派發動政變失敗後，戈巴契夫辭去蘇共總書記，蘇聯正式解體為十五個獨立國家，冷戰時代兩極對抗的格局就此終結。
