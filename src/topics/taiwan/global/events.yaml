  importance: 5
  desc: 瓦特大幅改良紐科門蒸汽機的效率，使其能廣泛應用於紡織廠、礦場與日後的鐵路運輸，動力來源不再受限於水力或人力；英國因此成為第一個工業化國家，生產方式與社會結構自此徹底改變。
