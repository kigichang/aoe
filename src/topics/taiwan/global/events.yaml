  importance: 4
  desc: 猶太裔軍官德雷福斯遭誣陷叛國定罪，作家左拉發表《我控訴》揭露軍方偽造證據、聲援平反，社會因此分裂為擁德雷福斯與反猶陣營兩派；事件最終促成法國政教分離立法，也被視為現代反猶主義與錫安主義興起的重要案例。
