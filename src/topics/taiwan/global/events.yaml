  category: war
  importance: 3
  desc: 美國以緬因號軍艦爆炸為由對西班牙宣戰，數月內擊敗西班牙艦隊，取得波多黎各、關島與菲律賓，古巴則名義獨立、實際受美國控制；這場戰爭標誌美國正式躋身殖民帝國之列，美西兩國的全球地位自此互換。
