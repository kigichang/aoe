- id: eu-rome-annexation
  year: 1870
  title: 義大利併吞羅馬，教宗國滅亡，統一完成
  category: politics
  importance: 4
  desc: 普法戰爭爆發、法軍撤離羅馬後，義大利軍隊攻入教宗國首都，教宗庇護九世宣布自囚梵蒂岡以示抗議；羅馬隨即成為義大利新首都，延續逾千年的教宗世俗統治至此終結，「羅馬問題」的政教爭議持續近六十年，直到1929年拉特朗條約才告解決。
  sources:
    - title: 維基百科：羅馬問題
      url: https://zh.wikipedia.org/wiki/羅馬問題
    - title: 維基百科：義大利統一
      url: https://zh.wikipedia.org/wiki/義大利統一

- id: eu-german-unification
  year: 1871
  title: 德意志帝國統一
  category: politics
  importance: 4
  desc: 普魯士首相俾斯麥接連在普丹、普奧、普法三場戰爭中取勝，最終在凡爾賽宮鏡廳為普魯士國王威廉一世加冕德意志皇帝；統一後的德意志帝國迅速躍居歐陸最強的工業與軍事強權，也打破了原有的歐洲均勢。
  sources:
    - title: 維基百科：德意志統一
      url: https://zh.wikipedia.org/wiki/德意志統一

