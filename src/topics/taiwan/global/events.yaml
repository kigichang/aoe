  category: economy
  importance: 3
  desc: 聯合太平洋與中央太平洋鐵路公司分別從東西兩端施工，在猶他州普若蒙特里會合完工，橫貫北美大陸的鐵路首度貫通；原本需時數月的東西岸往返縮短至一週內，大批華工是築路的主力勞動力。
  sources:
    - title: 維基百科：第一條橫貫大陸鐵路
      url: https://zh.wikipedia.org/wiki/第一條橫貫大陸鐵路

