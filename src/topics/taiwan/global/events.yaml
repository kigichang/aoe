- id: am-shanghai-communique
  year: 1972
  title: 上海公報，美國「認知」台灣海峽兩岸都主張一個中國
  category: politics
  importance: 4
  desc: 季辛吉前一年秘密訪問北京鋪路，尼克森訪華結束時雙方在上海發表聯合公報。台灣條款的措辭經過反覆推敲：美國「認知」（acknowledge）海峽兩岸的中國人都認為只有一個中國、台灣是中國的一部分，對此「不提出異議」，並表示將逐步減少駐台美軍。這句話刻意迴避美國自己的立場，為與北京建交留下七年的過渡期；同時也給了台灣一個訊號 —— 華府的優先順序已經改變，退出聯合國才一年，台北的處境從此更為孤立。
  sources:
    - title: 維基百科：中美三個聯合公報
      url: https://zh.wikipedia.org/wiki/中美三個聯合公報
    - title: 英文維基百科：Shanghai Communiqué
      url: https://en.wikipedia.org/wiki/Shanghai_Communiqué

- id: sa-pokhran-1
  year: 1974
  title: 印度首次核試驗
  category: science
  importance: 4
  desc: 印度在拉賈斯坦沙漠引爆代號「微笑佛陀」的核裝置，成為第六個掌握核武技術的國家，也是首個在《核不擴散條約》體制外試爆的國家；1998年印度再度於波卡蘭進行五次核試並正式宣布為核武國家，巴基斯坦隨即跟進試爆。
  sources:
    - title: 維基百科：波卡蘭-I
      url: https://zh.wikipedia.org/wiki/波卡蘭-I

- id: sa-emergency
