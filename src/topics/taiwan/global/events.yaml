- id: am-emancipation-proclamation
  year: 1863
  title: 林肯發布解放奴隸宣言
  category: politics
  importance: 4
  desc: 林肯總統宣布南方邦聯控制區內的奴隸自由，雖無法立即執行、也未涵蓋邊境蓄奴州，卻讓廢除奴隸制度成為北方戰爭目標的核心，並開放黑人從軍；戰後通過的憲法第十三條修正案才正式在全國廢除奴隸制。
  sources:
    - title: 維基百科：解放奴隸宣言
      url: https://zh.wikipedia.org/wiki/解放奴隸宣言

- id: am-reconstruction
  year: 1865
  title: 重建時期，南方政治秩序重整
  category: politics
  importance: 3
  endYear: 1877
  desc: 聯邦軍隊駐守南方監督黑人公民權的落實，但隨著駐軍在1877年撤出，白人民主黨人重新掌權，種族隔離制度逐漸成形，直到近百年後的民權運動才被撼動。
  sources:
    - title: 維基百科：美國重建時期
      url: https://zh.wikipedia.org/wiki/美國重建時期

- id: am-transcontinental
  year: 1869
