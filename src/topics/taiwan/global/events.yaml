- id: am-taiwan-relations-act
  year: 1979
  title: 《台灣關係法》，以國內法延續對台承諾
  category: politics
  importance: 4
  desc: 卡特宣布與中華民國斷交、廢止共同防禦條約，國會不滿行政部門事先未諮詢，三個月內以近乎一致的票數通過台灣關係法。法案把台灣視同外國政府處理，承諾提供防禦性武器、視任何以非和平方式決定台灣前途的企圖為對西太平洋和平的威脅，並設美國在台協會維持非官方關係。一部國內法取代了一份條約，四十餘年來美國對台軍售與安全承諾的法律基礎都在這裡。
  sources:
