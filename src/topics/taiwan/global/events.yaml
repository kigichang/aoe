  category: politics
  importance: 3
  desc: 東巴基斯坦因語言、文化與經濟長期遭西巴基斯坦壓制爆發獨立運動，印度出兵介入第三次印巴戰爭助其獨立建國；孟加拉的分離重創了巴基斯坦「兩個地理區塊、一個國家」的立國基礎。
  sources:
    - title: 維基百科：孟加拉國解放戰爭
