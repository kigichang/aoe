  category: war
  importance: 4
  endYear: 1865
  desc: 蓋茨堡之役是雙方傷亡最慘重、也是扭轉戰局的一役；北方雖然獲勝，主導戰後重建的林肯卻在戰爭結束五天後遇刺身亡。
  sources:
    - title: 維基百科：南北戰爭
