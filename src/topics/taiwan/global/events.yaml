  category: politics
  importance: 4
  desc: 阿爾巴尼亞裔軍官穆罕默德·阿里趁鄂圖曼與馬木留克勢力真空崛起掌權，隨後屠殺殘餘馬木留克貴族，推行軍事與經濟現代化；他建立的王朝統治埃及直到1952年被推翻。
