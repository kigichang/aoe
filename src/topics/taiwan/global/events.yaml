- id: am-watergate
  year: 1972
  endYear: 1974
  title: 水門事件，尼克森辭職
  category: politics
  importance: 4
  desc: 尼克森競選團隊涉嫌闖入民主黨全國委員會總部竊聽，總統本人隨後被查出試圖掩蓋案情；國會彈劾程序啟動後，尼克森搶先宣布辭職，是美國史上唯一在任內辭職的總統，也重創民眾對政府的信任。
  sources:
    - title: 維基百科：水門事件
