  title: 亞歷山大二世廢除農奴制
  category: politics
  importance: 4
  desc: 俄國在克里米亞戰爭敗於已完成工業化的英法後，亞歷山大二世頒布敕令解放兩千三百餘萬名農奴，是俄國近代史上規模最大的社會改革；但農民須向地主付出高額贖金才能取得土地，改革未能化解積怨，反而助長了日後的革命情緒。
