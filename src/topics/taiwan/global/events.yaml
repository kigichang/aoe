  category: politics
  importance: 5
  desc: 拿破崙以公投確認終身執政後加冕稱帝，建立法蘭西第一帝國；他隨後席捲歐陸大部分地區、輸出《拿破崙法典》重塑歐洲的法律體系，卻在1812年遠征俄羅斯慘敗，1815年滑鐵盧一役徹底終結其統治。
  sources:
    - title: 維基百科：拿破崙一世
