- id: am-taiwan-travel-act
  year: 2018
  title: 《台灣旅行法》，解除美台高層互訪限制
  category: politics
  importance: 2
  desc: 川普簽署國會兩院無異議通過的台灣旅行法，鼓勵美國各級官員訪台、台灣高層官員訪美，解除 1979 年以來行政部門自我設限的往來規範。它是台灣關係法之後第一部專為台灣制定的美國法律，此後《台北法》、《台灣保證法》等接連立法，國會成為美台關係升溫的主要推手；2022 年眾議院議長裴洛西訪台就是在這條線上發生的。
  sources:
