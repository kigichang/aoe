  sources:
    - title: 維基百科：賽克斯-皮科協定
      url: https://zh.wikipedia.org/wiki/賽克斯-皮科協定

- id: eu-october-revolution
  year: 1917
  title: 俄國十月革命
  category: politics
  importance: 4
  desc: 1905年日俄戰爭戰敗引發的革命已讓沙皇被迫讓步、成立杜馬，卻未能化解積怨；一戰的慘重傷亡與物資短缺終於在1917年二月引爆革命，尼古拉二世被迫退位，羅曼諾夫王朝覆滅。臨時政府堅持繼續參戰、遲遲不解決土地問題，列寧領導的布爾什維克黨隨後在十月發動政變奪取政權，建立世界第一個共產黨執政的國家。
  sources:
    - title: 維基百科：十月革命
      url: https://zh.wikipedia.org/wiki/十月革命
    - title: 維基百科：俄國二月革命
      url: https://zh.wikipedia.org/wiki/俄國二月革命

- id: eu-russian-civil-war
