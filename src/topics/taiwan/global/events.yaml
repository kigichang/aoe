  category: economy
  importance: 3
  desc: 加州發現金礦的消息傳開後，數十萬人從美國各地與海外湧入西部淘金，加州人口暴增、迅速建州；這波移民潮加速美國西部開發，卻也加劇對原住民土地的侵占。
