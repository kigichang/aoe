  category: politics
  importance: 4
  desc: 普法戰爭戰敗、臨時政府對德求和後，巴黎市民組成自治政府抵制中央，短暫實施工人自治、政教分離等激進政策，兩個月後遭凡爾賽政府軍血腥鎮壓；儘管壽命短暫，巴黎公社日後被馬克思主義者奉為第一個無產階級政權的先例。
  sources:
    - title: 維基百科：巴黎公社
      url: https://zh.wikipedia.org/wiki/巴黎公社

