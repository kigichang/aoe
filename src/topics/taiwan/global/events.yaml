- id: eu-glorious-revolution
  year: 1688
  title: 光榮革命
  category: politics
  importance: 4
  desc: 國會貴族不滿信奉天主教的詹姆斯二世集權，邀請荷蘭執政威廉三世率軍渡海登陸，詹姆斯二世不戰而逃亡法國；這場幾乎沒有流血的政變確立國會凌駕王權的原則，隔年頒布的權利法案便是這場革命的立法成果。
  sources:
    - title: 維基百科：光榮革命
      url: https://zh.wikipedia.org/wiki/光榮革命

- id: eu-bill-of-rights
