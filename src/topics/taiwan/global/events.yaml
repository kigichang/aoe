      url: https://en.wikipedia.org/wiki/Gulf_of_Tonkin_incident

- id: me-egypt-six-day-war
  year: 1967
  title: 六日戰爭，埃及失去西奈半島
  category: war
  importance: 4
  desc: 埃及、敘利亞與約旦聯手備戰，以色列先發制人，在六天內重創三國軍隊並占領西奈半島、加薩走廊、約旦河西岸與戈蘭高地；埃及的慘敗重挫納賽爾的威望，也埋下六年後贖罪日戰爭的遠因。
  sources:
    - title: 維基百科：第三次中東戰爭
      url: https://zh.wikipedia.org/wiki/第三次中東戰爭

- id: eu-may-1968
  year: 1968
  title: 五月風暴
  category: politics
  importance: 4
  desc: 學生占領大學校園抗議教育體制與社會保守氛圍，工人隨後響應發動全國大罷工，一度癱瘓法國經濟、動搖戴高樂政府；雖未能立即改朝換代，卻深刻改變法國的社會文化與勞動權益，也啟發了同時期全球各地的學生運動。
  sources:
    - title: 維基百科：五月風暴
      url: https://zh.wikipedia.org/wiki/五月風暴

- id: am-apollo-11
  year: 1969
  title: 阿波羅十一號登月
  category: science
  importance: 5
  desc: 阿姆斯壯與艾德林搭乘阿波羅十一號登陸月球，成為首度踏上地球以外天體的人類；這是美蘇太空競賽的高潮，也讓美國在冷戰的科技競爭中取得指標性的勝利。
  sources:
    - title: 維基百科：阿波羅11號
      url: https://zh.wikipedia.org/wiki/阿波羅11號

- id: sa-bangladesh
  year: 1971
