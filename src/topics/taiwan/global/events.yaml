  category: politics
  importance: 4
  desc: 薩丁尼亞王國首相加富爾聯合法國擊敗奧地利、解放倫巴底，加里波第則率領「千人遠征隊」南下推翻兩西西里王國，雙方在那不勒斯會師後將征服的土地獻給薩丁尼亞國王維克多·艾曼紐二世；義大利王國宣告成立，但威尼西亞與羅馬仍待收復，統一尚未完全。
