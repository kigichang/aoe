    - title: 英文維基百科：Taiwan Relations Act
      url: https://en.wikipedia.org/wiki/Taiwan_Relations_Act

- id: am-817-communique
  year: 1982
  title: 八一七公報與六項保證，對台軍售的雙重承諾
  category: politics
  importance: 3
  desc: 雷根政府為換取北京在對蘇聯問題上的合作，在八一七公報中承諾對台軍售在質與量上不超過建交後的水準並逐步減少。簽署前一個月，雷根透過在台協會向台北提出六項保證：不設軍售終止日期、不事先與北京磋商、不修改台灣關係法、不改變對台灣主權的立場、不逼台灣談判、不做調人。公報與保證互相牽制，「三個公報、一部法、六項保證」從此是美國一中政策的完整清單，雷根本人還留下備忘錄，把減少軍售的前提綁在北京承諾和平解決。
  sources:
    - title: 維基百科：中美三個聯合公報
      url: https://zh.wikipedia.org/wiki/中美三個聯合公報
