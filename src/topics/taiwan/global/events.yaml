  importance: 4
  desc: 拿破崙在奧斯特里茲擊敗奧俄聯軍後成立萊茵邦聯，末代皇帝法蘭茲二世被迫放棄帝號，延續八百多年的神聖羅馬帝國正式解體；德意志地區自此陷入邦國林立、缺乏統一政治中心的局面，直到俾斯麥完成統一。
  sources:
    - title: 維基百科：神聖羅馬帝國解體
