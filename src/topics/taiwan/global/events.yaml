  desc: 廢奴運動人士歷經二十年遊說促成國會通過法令，禁止英國船隻參與奴隸貿易；1833年國會進一步立法廢除大英帝國境內的蓄奴制本身，政府以鉅額公帑補償奴隸主。作為當時全球最大的奴隸貿易國，英國自此轉為出動皇家海軍在海上查緝奴隸船。
  sources:
