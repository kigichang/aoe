# 台灣史。設了 root: true，所以掛在根網址（/），目錄名 taiwan 不進網址。
#
# 2026-08-28 起根網址是這個主題，世界史移到 /world/。當時站尚未正式上線，
# 不必顧既有的分享連結；世界史那份 topic.yaml 有對應的說明。
#
# **資料是從 world 複製來的，不是引用。** 四欄的 events.yaml / periods.yaml
# 都由 world/<欄>/ 取 year ≥ 1500 的部分複製而成，id 保留原樣
# （tw-*／jp-*／cn-*／eu-*／am-*／me-*／sa-*）。兩份彼此獨立、不會自動同步；
# id 相同只是為了日後拿兩邊 diff 時對得起來。
#
# 為什麼不做程式層的引用（regions.yaml 加 include、data.ts 載入時過濾）：
# 那要動 data.ts／schema.ts／lint-data 三支，而且兩個主題的 importance 尺規
# 本來就該不同 —— 這裡「最高一級」的意思是「台灣史上最重要」，不是
# 「世界史上最重要」（CLAUDE.md「欄位範圍變大時，importance 尺規要重新對齊」
# 講的是同一件事，方向相反）。分岔是接受的代價。
#
# 補資料的方向：台灣欄可以放世界史那邊嫌太細的事件（原住民族、清治民變、
# 日治社會運動、戰後社會與文化），不必回填世界史；反過來補世界史台灣欄時，
# 若 ≥1500 要想一下是否也補這裡。
#
# 起點 1500 的取捨寫在 timeline.yaml。

name: 台灣史
description: 以台灣為主體，把日本、中國與世界放在同一條時間軸上對照，看同一個年代各自在發生什麼。

# 排第一：這是根網址的主題。世界史是 2。
order: 1

columnLabel: 地區

# 開場縮放（px/年）。跨度 526 年，MIN_PPY = 700/526 ≈ 1.33 已越過 TIERS 的 imp-4
# 門檻，所以縮到最小也看得到 4+。2026-08-28 實測（1920×929、詳情面板關閉、
# 錨在 1800 年，599 則）：
#
#   ppy | 讀得到標題 | 圖釘 | 一屏年數
#   ----|-----------|------|--------
#   1.5 |    107    |  490 |   581
#   2   |    144    |  453 |   436
#   3   |    193    |  404 |   290
#   4   |    240    |  359 |   218   ← 現況
#   5   |    270    |  329 |   174
#   6   |    303    |  296 |   145
#
# 取 4：荷西→清領→鴉片戰爭（1624–1842）剛好一屏，再往上讀得到的標題
# 增幅趨緩，一屏卻連一個完整時期都裝不下。
defaultPpy: 4

# 年代跳轉按鈕：台灣史的轉折點（荷蘭築城、清領、割讓、戰後、解嚴）。
jumps: [1500, 1600, 1624, 1683, 1750, 1800, 1850, 1895, 1945, 1987, 2010]

root: true
