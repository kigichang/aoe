- id: jp-slim-moon-landing-2024
  year: 2024
  title: SLIM 探測器成功精準登月，日本成為第五個登月國
  category: science
  importance: 4
  desc: JAXA 的「SLIM」（智能月球探測器）於月球表面成功實現高精度著陸（目標地點誤差在 10 公尺內），日本成為繼前蘇聯、美國、中國與印度後，全球第 5 個成功將探測器送上月球的國家。
  sources:
