- id: jp-lockheed-scandal
  year: 1976
  endYear: 1983
  title: 洛克希德事件，前首相田中角榮遭起訴
  category: politics
  importance: 4
  desc: 美國參議院調查委員會揭發洛克希德公司透過丸紅商社行賄各國政要促銷客機，前首相田中角榮被查出經由丸紅收受五億日圓賄款，1976年遭東京地檢署以受賄罪起訴。案件審理長達七年，1983年一審判處有期徒刑四年，田中終身上訴至1993年病逝、公訴才不了了之。事件重創自民黨形象，直接導致三木武夫內閣垮台，成為戰後日本政商勾結最著名的象徵性醜聞。
  sources:
    - title: 日文維基百科：ロッキード事件
