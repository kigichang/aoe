  desc: 受 COVID-19 全球疫情影響延期一年後，第 32 屆奧林匹克運動會於東京登場。因應防疫大多數賽事採無觀眾閉門舉行，為現代奧運歷史上首次因全球大流行疫情延期舉辦之盛會。
  sources:
    - title: 維基百科：2020年夏季奧林匹克運動會
      url: https://zh.wikipedia.org/wiki/2020年夏季奧林匹克運動會

- id: jp-nishi-kyushu-shinkansen-2022
  year: 2022
  title: 西九州新幹線（武雄溫泉—長崎）通車
  category: economy
  importance: 3
  desc: 連結佐賀縣武雄溫泉站與長崎站的「西九州新幹線」正式通車，採用 N700S 系列車「海鷗號」（Kamome）。這是時隔 7 年日本新幹線路線延伸，促進九州觀光與區域發展。
