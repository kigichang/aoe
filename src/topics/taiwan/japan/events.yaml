- id: jp-gdp-fourth-2024
  year: 2024
  title: 名目GDP被德國超越，跌至全球第四
  category: economy
  importance: 3
  desc: 受日圓大幅貶值影響，日本名目GDP以美元計算被德國超越，從戰後長期穩坐的世界第二、第三經濟體跌落至第四位——這是自1968年超越西德以來首次被反超。長期通貨緊縮、少子高齡化與製造業競爭力下滑是背後的結構性原因，「經濟大國」的長期敘事自此蒙上陰影。
  sources:
    - title: 日文維基百科：日本の経済
      url: https://ja.wikipedia.org/wiki/日本の経済
