- id: jp-bubble-burst
  year: 1991
  title: 泡沫經濟破滅，失落的十年
  category: economy
  importance: 4
  desc: 廣場協定後日圓急遽升值，低利率環境催生大量熱錢湧入房市與股市，泡沫經濟高峰時東京都的地價總和一度等同全美國地價總和，日經225指數在1989年12月29日創下38,957.44點的歷史新高。1990年3月大藏省實施不動產貸款總量規制，加上央行升息緊縮銀根，泡沫應聲破滅，到1992年8月日經指數已腰斬至約1萬4千點。此後地價與股價同時崩跌，日本陷入長期低成長與通縮的「失落的十年」，甚至延伸為「失落的二十年」。
  sources:
