- id: jp-abe-assassination
  year: 2022
  title: 前首相安倍晉三遇刺身亡
  category: politics
  importance: 4
  desc: 日本執政時間最長的前首相安倍晉三於奈良市助選演講時遭槍擊身亡。事件震撼全球，並引發全日本對政治安全防護、槍械管制以及政治人物與統一教鏈結的強烈檢討。
  sources:
