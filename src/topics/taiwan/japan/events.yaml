  importance: 3
  desc: 竹下登內閣力排眾議通過消費稅法，4月起開徵日本史上第一種一般消費稅，初期稅率僅3%。稅制改革衝擊龐大，同年參議院選舉自民黨慘敗，是稅率調升史上第一次政治震盪。此後稅率歷經多次調高——1997年橋本內閣升至5%、2014年安倍內閣升至8%、2019年再升至10%——消費稅至今仍是日本政壇最敏感的財政議題之一。
