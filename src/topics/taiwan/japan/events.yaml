- id: jp-noto-earthquake-2024
  year: 2024
  title: 能登半島地震，強震與海嘯重創北陸
  category: culture
  importance: 3
  desc: 元旦下午能登半島發生芮氏規模 7.6 淺層強震並引發海嘯與火災，造成逾二百人罹難，古建築與傳統漆器工藝重創。為令和時代以來日本傷亡最慘重的自然災害。
  sources:
    - title: 維基百科：2024年能登半島地震
      url: https://zh.wikipedia.org/wiki/2024年能登半島地震

- id: jp-new-banknotes-2024
  year: 2024
  title: 令和新紙幣全面發行，採用全息防偽新技術
  category: economy
  importance: 3
  desc: 日本銀行時隔 20 年發行新版紙幣，一萬日圓肖像改為「日本資本主義之父」澀澤榮一、五千日圓改為女性教育先驅津田梅子、千日圓改為醫學家北里柴三郎，並導入全球首創 3D 全息防偽技術。
