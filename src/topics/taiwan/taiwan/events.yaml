- id: tw-wto-accession
  year: 2002
  title: 以「臺澎金馬個別關稅領域」加入世界貿易組織
  category: economy
  importance: 3
  desc: 申請十二年後，台灣在中華人民共和國入會的次日以「臺灣、澎湖、金門及馬祖個別關稅領域」名義成為 WTO 第 144 個會員，關稅、農產品進口與服務業全面開放。名稱是主權爭議下的妥協，實質上台灣自此在多邊貿易體系中擁有獨立席位；稻米開放進口與菸酒公賣廢止是入會最直接的國內衝擊。
  sources:
    - title: 維基百科：臺澎金馬個別關稅領域
      url: https://zh.wikipedia.org/wiki/臺澎金馬個別關稅領域

- id: tw-sars-2003
  year: 2003
  title: SARS 疫情爆發，和平醫院封院
  category: science
  importance: 4
  desc: 嚴重急性呼吸道症候群（SARS）於全臺爆發，臺北市立和平醫院緊急封院，造成數位醫護人員與民眾犧牲。此事件促使政府全面體檢公共衛生與防疫體系，重建傳染病防治指揮體系（CDC）與防疫物資儲備。
  sources:
    - title: 維基百科：嚴重急性呼吸系統綜合症疫情
      url: https://zh.wikipedia.org/wiki/嚴重急性呼吸系統綜合症疫情

- id: tw-literature-museum
  year: 2003
  title: 國立臺灣文學館開館
  category: culture
  importance: 2
  desc: 台灣第一座國家級文學博物館在台南的原台南州廳開館，蒐藏從原住民口傳、古典漢詩、日治新文學到當代作品的手稿與文物。它承接 1990 年代以來台灣文學系所設立、「台灣文學」被承認為獨立學門的過程，也是把日治時期的日文作品與戰後的台語文學一併納入的第一個官方機構。
  sources:
    - title: 維基百科：國立臺灣文學館
      url: https://zh.wikipedia.org/wiki/國立臺灣文學館

- id: tw-319-shooting
  year: 2004
  title: 三一九槍擊案，總統大選前夕的兩顆子彈
  category: politics
  importance: 3
  desc: 選舉投票前一天，陳水扁與呂秀蓮在台南掃街時遭槍擊受輕傷，隔日以不到三萬票的差距連任。落選的連宋陣營質疑槍擊案影響選情、拒絕承認結果，發起長達數週的抗爭並提出選舉無效之訴。檢警最後認定嫌犯為已自殺的陳義雄，但真相之爭至今未平。此案讓 2000 年首次政黨輪替後的社會對立達到頂點，也是台灣選舉史上最接近的一次結果。
  sources:
    - title: 維基百科：三一九槍擊事件
      url: https://zh.wikipedia.org/wiki/三一九槍擊事件

- id: tw-indigenous-basic-law
  year: 2005
  title: 原住民族基本法公布
  category: politics
  importance: 3
  desc: 確立原住民族的自治、土地與自然資源權利，並明定在原住民族地區的開發行為須經部落諮商同意。同年將 8 月 1 日訂為原住民族日，紀念 1994 年的正名。法律架構立起來了，落實的爭議至今未停。
  sources:
    - title: 維基百科：臺灣原住民族
      url: https://zh.wikipedia.org/wiki/臺灣原住民族
    - title: 維基百科：中華民國原住民族委員會
      url: https://zh.wikipedia.org/wiki/中華民國原住民族委員會

- id: tw-red-shirt-movement
  year: 2006
  title: 紅衫軍倒扁運動
  category: politics
  importance: 3
  desc: 民進黨前主席施明德以陳水扁家族與親信涉及國務機要費等弊案為由發起「百萬人民反貪倒扁」，號召每人捐一百元、穿紅衣靜坐，九月起在凱達格蘭大道持續集會，高峰時號稱數十萬人。運動沒有讓陳水扁下台，但重創民進黨的清廉形象，2008 年政黨再度輪替與陳水扁卸任後入獄都與此相連。
  sources:
    - title: 維基百科：百萬人民倒扁運動
      url: https://zh.wikipedia.org/wiki/百萬人民倒扁運動

- id: tw-hsr
  year: 2007
  title: 台灣高鐵通車
  category: economy
  importance: 4
  desc: 台北到高雄縮短為約九十分鐘，西部走廊形成一日生活圈，長途客運與國內航線隨之萎縮。
  sources:
    - title: 維基百科：臺灣高速鐵路
      url: https://zh.wikipedia.org/wiki/臺灣高速鐵路

- id: tw-ma-president
  year: 2008
  title: 馬英九當選總統，二次政黨輪替
  category: politics
  importance: 3
  desc: 馬英九當選總統，國民黨重新執政，是民主化以來的第二次政黨輪替。
  sources:
    - title: 維基百科：2008年中華民國總統選舉
