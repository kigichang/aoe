# category: politics | war | culture | science | religion | economy
# importance: 1-5。縮放到全域視角時只會顯示 5，放大後才逐層釋出。
#
# 本欄由 world/taiwan/events.yaml 複製（year ≥ 1500），兩份獨立維護、不會自動同步；
# id 與世界史相同只是為了日後 diff 方便。
#
# 年代經維基百科查證；標題與描述為自行撰寫，未取用條目文字。

- id: tw-shihsanhang
  year: 1500
  actualYear: 200
  endYear: 1600
  title: 十三行文化，台灣進入鐵器時代
  category: science
  importance: 4
  desc: 淡水河出海口南岸的聚落，出土煉鐵作坊與大量鐵器，是目前確定擁有煉鐵技術的台灣史前居民，很可能是凱達格蘭族的祖先。同層另有中國瓷器與玻璃器，顯示島外交易已成常態 —— 這一支一直延續到荷蘭人抵達前後，與有文字的歷史時期首尾相接。實際約始於西元 200 年，此處為時間軸起點所截。
  sources:
    - title: 維基百科：十三行遺址
      url: https://zh.wikipedia.org/wiki/十三行遺址

- id: tw-formosa
  year: 1582
  title: 葡萄牙與西班牙船員因船難滯留台灣
  category: culture
  importance: 3
  sources:
    - title: 維基百科：臺灣歷史
      url: https://zh.wikipedia.org/wiki/臺灣歷史

- id: tw-takasago-summons
  year: 1593
  title: 豐臣秀吉遣使招諭「高山國」
  category: politics
  importance: 3
  desc: 豐臣秀吉派家臣原田孫七郎攜文書前來，要求台灣向日本納貢。日本古籍稱台灣為高砂或高山國，語源與高雄的舊稱「打狗」有關。文書送不出去 —— 島上沒有可以接收國書的政權，使者找不到對象。1616 年德川家康再派村山等安率船隊來台，途中遇風浪只有三艘抵達北部，登陸的一兩百人被原住民包圍而死。日本對台灣的興趣比荷蘭與西班牙更早，但兩次都停在「找不到談判對手」這一關。
  sources:
    - title: 維基百科：高砂 (臺灣古名)
      url: https://zh.wikipedia.org/wiki/高砂_(臺灣古名)
    - title: 維基百科：豐臣秀吉
      url: https://zh.wikipedia.org/wiki/豐臣秀吉

- id: tw-dongfan-ji
  year: 1603
  title: 陳第著《東番記》，最早的台灣實地紀錄
  category: culture
  importance: 3
  desc: 沈有容率明軍到台灣西南沿海剿倭時，福州連江人陳第隨行，回去後寫成這篇一千四百餘字的雜記。它記下西拉雅人的母系社會、服飾、飲食、建築、狩獵與貿易，是現存最早由漢人親自到台灣實地採訪留下的文獻 —— 在此之前的中文記載都是隔海轉述。這一篇之後，台灣才開始有具體的樣子，而不只是史書上一個位置不明的島名。
  sources:
    - title: 維基百科：東番記
      url: https://zh.wikipedia.org/wiki/東番記
    - title: 維基百科：沈有容
      url: https://zh.wikipedia.org/wiki/沈有容

- id: tw-yan-siqi
  year: 1621
  title: 顏思齊、鄭芝龍入北港
  category: economy
  importance: 3
  desc: 武裝海商顏思齊率鄭芝龍等人在北港一帶登岸，把台灣當成走私與劫掠的基地。顏思齊 1625 年病故後鄭芝龍接手，其後受明朝招撫、成為福建沿海最大的海上勢力，也把大批閩南饑民載來台灣開墾。這條線一路連到 1661 年 —— 鄭成功來台的資本、船隊與人脈，都是從父親這個海商集團承接下來的。
  sources:
    - title: 維基百科：顏思齊
      url: https://zh.wikipedia.org/wiki/顏思齊
    - title: 維基百科：鄭芝龍
      url: https://zh.wikipedia.org/wiki/鄭芝龍

- id: tw-dutch-penghu
  year: 1622
  title: 荷蘭佔領澎湖，兩年後轉進大員
  category: politics
  importance: 3
  desc: 為打通與明朝、日本的貿易而奪澎湖築城。明軍圍城八個月後議和，荷蘭人拆城轉往不屬明朝版圖的臺灣。
  sources:
    - title: 維基百科：風櫃尾荷蘭城堡
      url: https://zh.wikipedia.org/wiki/風櫃尾荷蘭城堡
    - title: 維基百科：臺灣荷蘭統治時期
      url: https://zh.wikipedia.org/wiki/臺灣荷蘭統治時期

- id: tw-zeelandia
  year: 1624
  title: 荷蘭東印度公司築熱蘭遮城，據南台灣
  category: politics
  importance: 5
  desc: 在澎湖被明軍逼退後轉進不屬明朝版圖的大員，由首任長官宋克在一鯤鯓沙洲築城。隔年再以十五匹花布向新港社取得赤崁的土地，開闢普羅民遮市街 —— 一座城守海口、一片街市管內陸，南台灣的統治骨架就此定下。台灣從這一年起進入有系統文字記載的年代，也被捲進東亞的海上貿易網。
  sources:
    - title: 維基百科：熱蘭遮城
      url: https://zh.wikipedia.org/wiki/熱蘭遮城
    - title: 維基百科：臺灣荷蘭統治時期
      url: https://zh.wikipedia.org/wiki/臺灣荷蘭統治時期

- id: tw-spanish-keelung
  year: 1626
  title: 西班牙人佔領雞籠，據北台灣
  category: politics
  importance: 4
  desc: 荷蘭據大員之後扼住了馬尼拉北上中國與日本的航路，菲律賓總督決定在台灣北端設點反制。艦隊五月自馬尼拉出發，先到島的東北角命名 Santiago（今三貂角），再進雞籠港，於社寮島（今和平島）舉行佔領典禮、築聖薩爾瓦多城。駐軍常年只有兩三百人，靠馬尼拉一年兩班的補給船維持 —— 從頭到尾是一座靠外部輸血的據點，這也決定了它十六年後怎麼結束。
  sources:
    - title: 維基百科：西班牙統治時期 (台灣)
      url: https://zh.wikipedia.org/wiki/西班牙統治時期_(台灣)
    - title: 維基百科：聖薩爾瓦多城
      url: https://zh.wikipedia.org/wiki/聖薩爾瓦多城

- id: tw-dominican-mission
  year: 1626
  title: 道明會士隨軍抵雞籠，天主教首度傳入台灣
  category: religion
  importance: 3
  desc: 六名道明會神父隨艦隊出征，這是天主教第一次進入台灣。他們在雞籠、淡水一帶向巴賽人傳教，艾斯奇維編出《淡水語辭彙》與《淡水語教理書》—— 兩本都已佚失，只剩書名留在文獻裡。荷蘭人在南部用羅馬字寫西拉雅語的同時，北部有人在做同一件事，只是成果沒能留下來。1642 年西班牙被逐，這條線整個斷掉，要等到 1859 年道明會士再從打狗登陸，天主教才重返台灣。
  sources:
    - title: 維基百科：臺灣西班牙統治時期
      url: https://zh.wikipedia.org/wiki/臺灣西班牙統治時期
    - title: 維基百科：道明會
      url: https://zh.wikipedia.org/wiki/道明會

- id: tw-hamada-incident
  year: 1628
  title: 濱田彌兵衛事件，日荷貿易中斷
  category: economy
  importance: 3
  desc: 荷蘭對日本商人課稅引發衝突，日方一度扣押臺灣長官。德川幕府隨即中止與荷蘭的貿易，至 1632 年才恢復。
  sources:
    - title: 維基百科：濱田彌兵衛事件
      url: https://zh.wikipedia.org/wiki/濱田彌兵衛事件

- id: tw-santo-domingo
  year: 1628
  title: 西班牙築聖多明哥城，據淡水
  category: politics
  importance: 3
  desc: 佔領雞籠兩年後西進淡水。1637 年菲律賓當局為節省開支自行毀城，北臺防務空虛，終招來荷蘭進攻。
  sources:
    - title: 維基百科：聖多明哥城
      url: https://zh.wikipedia.org/wiki/聖多明哥城
    - title: 維基百科：臺灣西班牙統治時期
      url: https://zh.wikipedia.org/wiki/臺灣西班牙統治時期

- id: tw-mattau-river
  year: 1629
  title: 麻豆溪事件，六十三名荷兵遭殺
  category: war
  importance: 3
  desc: 西拉雅四大社中最強的麻豆社伏擊荷軍。荷蘭人在南臺灣的威望重挫，數年間無力報復。
  sources:
    - title: 維基百科：麻豆溪事件
      url: https://zh.wikipedia.org/wiki/麻豆溪事件

- id: tw-spanish-kavalan
  year: 1632
  title: 西班牙進兵蛤仔難，毀噶瑪蘭七社
  category: war
  importance: 3
  desc: 一艘西班牙船漂到蘭陽平原，全船人遭噶瑪蘭人殺害。長官隨即派兵報復，摧毀七座村落，1635 年再打一次。同一批人也從淡水河、基隆河探出通往台北盆地的路線，把據點的影響力從海口往內陸推 —— 西班牙在台灣十六年，除了兩座城，留下的主要就是這幾次征討。漢人成規模進入蘭陽平原還要再等一百六十年的吳沙。
  sources:
    - title: 維基百科：臺灣西班牙統治時期
      url: https://zh.wikipedia.org/wiki/臺灣西班牙統治時期
    - title: 維基百科：噶瑪蘭族
      url: https://zh.wikipedia.org/wiki/噶瑪蘭族

- id: tw-mattau-treaty
  year: 1635
  title: 麻豆協約，原住民村社臣服
  category: politics
  importance: 4
  desc: 荷蘭聯合新港社擊破麻豆社後締約，確立領主與封臣的關係。到 1636 年底共五十七座村社服從，並以每年的地方會議維繫。
  sources:
    - title: 維基百科：臺灣荷蘭統治時期
      url: https://zh.wikipedia.org/wiki/臺灣荷蘭統治時期
    - title: 維基百科：西拉雅族
      url: https://zh.wikipedia.org/wiki/西拉雅族

- id: tw-sinkang-school
  year: 1636
  title: 新港社設校，以羅馬字書寫西拉雅語
  category: culture
  importance: 4
  desc: 臺灣史上第一所學校。傳教士用拉丁字母拼寫原住民語言，所留下的契約文書即新港文書，直到十九世紀仍在使用。
  sources:
    - title: 維基百科：新港文書
      url: https://zh.wikipedia.org/wiki/新港文書
    - title: 維基百科：臺灣荷蘭統治時期
      url: https://zh.wikipedia.org/wiki/臺灣荷蘭統治時期

- id: tw-deerskin-trade
  year: 1637
  title: 鹿皮出口達十五萬張
  category: economy
  importance: 3
  desc: 漢人引進陷阱後產量大增，鹿皮主要銷往日本製甲冑。濫捕使鹿群銳減，1640 年起一度全面禁獵。
  sources:
    - title: 維基百科：臺灣梅花鹿
      url: https://zh.wikipedia.org/wiki/臺灣梅花鹿
    - title: 維基百科：臺灣荷蘭統治時期
      url: https://zh.wikipedia.org/wiki/臺灣荷蘭統治時期

- id: tw-siraya-shamans-exile
  year: 1641
  title: 荷蘭流放二百五十名尪姨，禁西拉雅祭儀
  category: religion
  importance: 3
  desc: 尪姨是西拉雅村社裡主持祭儀、司掌祖靈信仰的女性祭司。傳教士把她們看成改宗最大的障礙，這一年將二百五十人集體流放到北方的諸羅山，村社原有的祭祀隨之中斷。新港社的學校與羅馬字書寫是同一套傳教工作的另一面 —— 台灣第一次的識字教育與第一次的信仰壓制出自同一批人，同一個十年裡。
  sources:
    - title: 維基百科：臺灣荷蘭統治時期
      url: https://zh.wikipedia.org/wiki/臺灣荷蘭統治時期
    - title: 維基百科：尪姨
      url: https://zh.wikipedia.org/wiki/尪姨

- id: tw-dutch-expel-spanish
  year: 1642
  title: 荷蘭驅逐西班牙人
  category: war
  importance: 4
  desc: 西班牙 1637 年自毀淡水的聖多明哥城、又把兵力抽回菲律賓之後，北台灣只剩雞籠一座孤城。荷蘭艦隊八月下旬北上登陸圍攻，守軍於 26 日開城，撤往馬尼拉，十六年的西班牙統治告終。西部沿海的南北兩端第一次握在同一個政權手上，荷蘭也才真正能把島當成一整塊來經營。
  sources:
    - title: 維基百科：西班牙統治時期 (台灣)
      url: https://zh.wikipedia.org/wiki/西班牙統治時期_(台灣)
    - title: 維基百科：雞籠之戰
      url: https://zh.wikipedia.org/wiki/雞籠之戰

- id: tw-pacht
  year: 1644
  title: 贌社，村社交易權公開招標
  category: economy
  importance: 3
  desc: 荷蘭人把各原住民村社的交易權公開標售，得標商人獨佔該社所有買賣，以鹽、鐵鍋、布疋換取鹿皮鹿肉再轉售。「贌」是荷語 pacht 的台語音譯。清治延續此制而改以社餉徵稅，直到 1737 年乾隆稅制改革才逐漸消失 —— 一套荷蘭的承包制在台灣運作了近百年。
  sources:
    - title: 維基百科：贌社
      url: https://zh.wikipedia.org/wiki/贌社

- id: tw-middag-kingdom
  year: 1645
  title: 大肚王國與荷蘭締約
  category: politics
  importance: 3
  desc: 中部跨部落的政治聯盟。荷蘭打通南北陸路時遭其攻擊，翌年進兵後締約，但大肚王仍保有相當自主，連年貢都獲豁免。
  sources:
    - title: 維基百科：大肚王國
      url: https://zh.wikipedia.org/wiki/大肚王國
    - title: 維基百科：臺灣荷蘭統治時期
      url: https://zh.wikipedia.org/wiki/臺灣荷蘭統治時期

- id: tw-guo-huaiyi
  year: 1652
  title: 郭懷一抗荷事件
  category: war
  importance: 3
  desc: 1640 年代大員當局對漢人陸續加稅，其中人頭稅最受反彈，士兵又常藉查驗稅單勒索財物。郭懷一聚眾數千夜襲赤崁，隔日在荷軍與原住民兵夾擊下潰散，死傷數千。這是荷治時期規模最大的漢人反抗 —— 公司靠漢人開墾與納稅撐起財政，事後卻動工築城把他們當成必須設防的對象。
  sources:
    - title: 維基百科：郭懷一事件
      url: https://zh.wikipedia.org/wiki/郭懷一事件
    - title: 維基百科：臺灣荷蘭統治時期
      url: https://zh.wikipedia.org/wiki/臺灣荷蘭統治時期

- id: tw-shen-guangwen
  year: 1652
  title: 沈光文流寓台灣，漢語古典文學之始
  category: culture
  importance: 2
  desc: 南明遺臣沈光文在浙閩沿海輾轉抗清，據傳於此時渡海途中遇颶風漂抵台灣（確切年份有 1651 到 1662 年之間的不同說法），此後定居近四十年，歷經荷蘭、明鄭到清初。他以詩文記錄台灣的風土與原住民生活，晚年在諸羅與流寓文人結成東吟社，是台灣第一個詩社。後人稱他「海東文獻初祖」，台灣的漢語古典文學史通常從他算起。
  sources:
    - title: 維基百科：沈光文
      url: https://zh.wikipedia.org/wiki/沈光文

- id: tw-provintia
  year: 1653
  endYear: 1655
  title: 築普羅民遮城，赤崁設省城城塞
  category: politics
  importance: 3
  desc: 郭懷一事件的直接產物。荷蘭人在赤崁市街北方動工興建磚石城塞，兩年後完工，作為赤崁省的行政中心，與海口對岸的熱蘭遮城分掌南台灣。1661 年鄭成功登陸後最先攻下的就是這一座，隨即在城裡設承天府衙門，成為明鄭的最高行政機構。城基就是今天的赤崁樓。
  sources:
    - title: 維基百科：赤崁樓
      url: https://zh.wikipedia.org/wiki/赤崁樓
    - title: 維基百科：郭懷一事件
      url: https://zh.wikipedia.org/wiki/郭懷一事件

- id: tw-siege-zeelandia
  year: 1661
  title: 鄭成功圍攻熱蘭遮城
  category: war
  importance: 4
  endYear: 1662
  desc: 鄭軍自鹿耳門進入台江，先取普羅民遮城，再圍熱蘭遮城。荷方守了將近九個月，巴達維亞派來的援軍無功而返，長官揆一於 1662 年 2 月 1 日開城投降，率殘餘人員撤離。三十八年的荷蘭統治到此結束；揆一回去後被公司問成失土之罪，流放海島十餘年。
  sources:
    - title: 維基百科：鄭成功攻臺之役
      url: https://zh.wikipedia.org/wiki/鄭成功攻臺之役
    - title: 維基百科：揆一
      url: https://zh.wikipedia.org/wiki/揆一

- id: tw-tuntian
  year: 1661
  title: 實施軍屯制，奠定漢人拓墾基礎
  category: economy
  importance: 4
  desc: 鄭成功抵台後為解決糧食危機頒布屯田令，實施軍屯制度。官兵文封田、武屯墾，分駐中南部各地，此即今日新營、左營、柳營、前鎮等軍營地名的由來。軍屯奠定了台灣漢人開墾與聚落分布的基礎。
  sources:
    - title: 維基百科：臺灣明鄭時期
      url: https://zh.wikipedia.org/wiki/臺灣明鄭時期
    - title: 維基百科：屯田制
      url: https://zh.wikipedia.org/wiki/屯田制

- id: tw-qianjie
  year: 1661
  title: 清朝實施遷界令，封鎖明鄭經濟
  category: politics
  importance: 3
  endYear: 1684
  desc: 清朝為斷絕沿海居民對明鄭的物資支援，嚴令山東至廣東沿海居民內遷三十里並毀棄村莊。遷界令使沿海經濟受創，但也迫使明鄭轉向與日本、英國及東南亞展開國際走私與跨境貿易。
  sources:
    - title: 維基百科：遷界令
      url: https://zh.wikipedia.org/wiki/遷界令
    - title: 維基百科：臺灣明鄭時期
      url: https://zh.wikipedia.org/wiki/臺灣明鄭時期

- id: tw-tungning
  year: 1662
  title: 鄭成功驅逐荷蘭人，明鄭治台
  category: politics
  importance: 5
  desc: 圍城還沒結束，鄭成功就已在赤崁設承天府與天興、萬年二縣，另在澎湖與南北兩路置安撫司 —— 明朝的一整套官制被原樣搬上島，台灣第一次有以漢人政權形式運作的行政體系。名義上仍奉南明永曆正朔，而南明其實早已無力，這座島成了明朝最後一塊招牌。荷蘭投降四個月後鄭成功病逝，體制留給了兒子。
  sources:
    - title: 維基百科：明鄭時期
      url: https://zh.wikipedia.org/wiki/明鄭時期
    - title: 維基百科：鄭成功
      url: https://zh.wikipedia.org/wiki/鄭成功

- id: tw-zheng-jing
  year: 1662
  title: 鄭成功歿，鄭經繼位
  category: politics
  importance: 3
  desc: 鄭成功接收台灣後五個月即病逝，年僅三十八。明鄭二十一年的江山，其中十九年是鄭經在治 —— 他行陳永華之議屯田興學、通商日本與英國，也在 1674 年響應三藩之亂西征閩粵，耗盡實力而返。
  sources:
    - title: 維基百科：鄭經
      url: https://zh.wikipedia.org/wiki/鄭經
    - title: 維基百科：鄭成功
      url: https://zh.wikipedia.org/wiki/鄭成功

- id: tw-qingdutch-alliance
  year: 1663
  endYear: 1664
  title: 清荷聯軍攻金廈，明鄭盡失大陸領土
  category: war
  importance: 4
  desc: 康熙駁回鄭經開出的條件後，轉而拉攏剛被逐出台灣的荷蘭人組成聯軍。1663 年 11 月合攻金門、廈門，鄭軍棄守退往銅山，隔年連銅山也失，大將周全斌降清，鄭經率殘部全數退回台灣。荷蘭趁勢在 1664 年重佔雞籠，指望以此換回失去的島。鄭芝龍以來經營四十年的閩海根據地一次清空，明鄭從此只剩台澎 —— 東都改稱東寧、六部與州制的建立，都是在這個新現實下才發生的。
  sources:
    - title: 維基百科：鄭經
      url: https://zh.wikipedia.org/wiki/鄭經
    - title: 維基百科：臺灣明鄭時期
      url: https://zh.wikipedia.org/wiki/臺灣明鄭時期

- id: tw-dongning-regime
  year: 1664
  title: 鄭經改東都為東寧，升天興萬年為州
  category: politics
  importance: 3
  desc: 鄭經退守台灣後，改「東都」為「東寧」，升天興、萬年二縣為州，劃分行政區劃並設澎湖安撫司。東寧成為明鄭統治體制的核心，並以「東寧國」或「東寧王」之名開展外交與貿易。
  sources:
    - title: 維基百科：東寧_(臺灣古名)
      url: https://zh.wikipedia.org/wiki/東寧_(臺灣古名)
    - title: 維基百科：臺灣明鄭時期
      url: https://zh.wikipedia.org/wiki/臺灣明鄭時期

- id: tw-confucius-temple
  year: 1666
  title: 陳永華建台南孔廟，設學校
  category: culture
  importance: 3
  desc: 陳永華 1665 年 9 月奏請興建，同年先師聖廟落成，隔年再訂出州試、府試、院試三級考試，中選者入太學。科舉隨孔廟一起搬進台灣，讀書人第一次能在島上取得功名而不必渡海。明鄭在台灣只有二十二年，留下最久的東西之一就是這套考試 —— 這座廟至今仍稱「全臺首學」。
  sources:
    - title: 維基百科：臺南孔子廟
      url: https://zh.wikipedia.org/wiki/臺南孔子廟
    - title: 維基百科：陳永華 (明鄭)
      url: https://zh.wikipedia.org/wiki/陳永華_(明鄭)

- id: tw-zheng-qing-talks
  year: 1667
  endYear: 1679
  title: 清鄭多次和談，鄭經求「照朝鮮事例」
  category: politics
  importance: 3
  desc: 1667 年清廷派孔元章來台招撫，許以「八閩王」遭拒；1669 年明珠南下再談，已願讓鄭氏封藩、世守台灣，鄭經開的條件是比照朝鮮 —— 不剃髮、稱臣納貢即可。康熙駁回：朝鮮是本來就不屬版圖的外國，鄭經是中國之人。此後十年談了數回，鄭經一再主張台灣「遠在海外，與版圖渺不相涉」；1678 年清方甚至鬆口給朝鮮、日本那樣的地位，卻因鄭經索要海澄當互市口岸而破局。十二年反覆談的其實只有一件事：東寧是清朝的一個藩，還是一個外國。
  sources:
    - title: 維基百科：鄭經
      url: https://zh.wikipedia.org/wiki/鄭經
    - title: 維基百科：澎湖海戰
      url: https://zh.wikipedia.org/wiki/澎湖海戰

- id: tw-dutch-leave-keelung
  year: 1668
  title: 荷蘭放棄雞籠，徹底退出臺灣
  category: politics
  importance: 3
  desc: 失去南部後，荷蘭於 1664 年重佔雞籠。但補給困難、與清朝的貿易也無進展，四年後撤回巴達維亞。
  sources:
    - title: 維基百科：臺灣荷蘭統治時期
      url: https://zh.wikipedia.org/wiki/臺灣荷蘭統治時期

- id: tw-shalu-battle
  year: 1670
  title: 劉國軒討沙轆社，大肚王國瓦解
  category: war
  importance: 3
  desc: 明鄭在西部平原屯墾一萬八千餘甲，直接吃進大肚王國的生活領域。1661 年鄭軍北上屯墾時雙方已結怨，1670 年沙轆、大肚兩社武裝抵抗，劉國軒率兵討伐，沙轆社數百人被殺，全社只剩六人生還，大肚社則被迫往埔里方向遷走。1645 年跟荷蘭締約時還保得住自主、連年貢都獲豁免的政權，二十五年後被下一個政權連根拔掉 —— 軍屯要地，這是屯田令的另一面。
  sources:
    - title: 維基百科：沙轆社之役
      url: https://zh.wikipedia.org/wiki/沙轆社之役
    - title: 維基百科：大肚王國
      url: https://zh.wikipedia.org/wiki/大肚王國

- id: tw-zheng-british-treaty
  year: 1670
  title: 英國東印度公司與明鄭締結通商條約
  category: economy
  importance: 4
  desc: 明鄭與英國東印度公司簽署《鄭英通商條約》，英商於安平設置商館，為臺灣史上首次與歐美強權建立正式貿易關係。明鄭出口蔗糖與鹿皮，換取英方的火砲、彈藥與洋貨。
  sources:
    - title: 維基百科：鄭英通商
      url: https://zh.wikipedia.org/wiki/鄭英通商
    - title: 維基百科：臺灣明鄭時期
      url: https://zh.wikipedia.org/wiki/臺灣明鄭時期

- id: tw-sanfan-zheng
  year: 1674
  title: 響應三藩之亂，鄭經率軍西征閩粵
  category: war
  importance: 4
  endYear: 1680
  desc: 靖南王耿精忠於福建響應三藩之亂，邀請鄭經出兵。鄭經率主力西征反清，一度攻佔泉州、漳州、潮州等地。後因與耿精忠內爭、清軍反攻與資源枯竭，於 1680 年敗退回臺，明鄭精銳盡失。
  sources:
    - title: 維基百科：三藩之亂
      url: https://zh.wikipedia.org/wiki/三藩之亂
    - title: 維基百科：臺灣明鄭時期
      url: https://zh.wikipedia.org/wiki/臺灣明鄭時期

- id: tw-dongning-coup
  year: 1681
  title: 鄭經病逝，東寧之變
  category: politics
  importance: 3
  desc: 鄭經西征失敗返台後病逝，大臣馮錫範與鄭聰等發動政變，殺害監國世子鄭克𡛕，擁立十二歲的鄭克塽。明鄭內部政爭加劇，政局嚴重動盪，加速了兩年後明鄭的覆亡。
  sources:
    - title: 維基百科：東寧之變
      url: https://zh.wikipedia.org/wiki/東寧之變
    - title: 維基百科：鄭克塽
      url: https://zh.wikipedia.org/wiki/鄭克塽

- id: tw-penghu-battle
  year: 1683
  title: 澎湖海戰，明鄭降清
  category: war
  importance: 5
  desc: 施琅率兩萬一千人、艦船兩百三十八艘攻澎湖，先敗後勝，明鄭統帥劉國軒從吼門水道脫逃。消息傳回台灣，島上再無抵抗意志：寧靖王朱術桂自縊，鄭克塽於 9 月 5 日出降、10 月 8 日剃髮易服，南明最後一個政權就此結束，鄭氏在台二十二年告終。施琅二十多年前因故被鄭成功誅殺父弟而降清，這一戰是他自己上疏請纓打的；入台之後他仍到延平郡王墓前跪拜。
  sources:
    - title: 維基百科：澎湖海戰
      url: https://zh.wikipedia.org/wiki/澎湖海戰
    - title: 維基百科：施琅
      url: https://zh.wikipedia.org/wiki/施琅

- id: tw-qing-prefecture
  year: 1684
  title: 設台灣府，隸屬福建省
  category: politics
  importance: 4
  desc: 明鄭降清之後，朝中爭論了將近一年要不要留下這座島 —— 不少大臣認為孤懸海外、治守都費錢，主張遷走人口、棄其地。施琅上〈恭陳臺灣棄留疏〉力主保留，李光地也向康熙進言，最後設一府三縣隸福建省。台灣自此進入版圖，但定位是為了防海而守的邊區，渡臺禁令同年一併頒下 —— 留是留了，卻是防著留的。
  sources:
    - title: 維基百科：臺灣清治時期
      url: https://zh.wikipedia.org/wiki/臺灣清治時期
    - title: 維基百科：臺灣府
      url: https://zh.wikipedia.org/wiki/臺灣府
    - title: 維基百科：施琅
      url: https://zh.wikipedia.org/wiki/施琅

- id: tw-crossing-ban
  year: 1684
  title: 渡臺禁令，限制赴臺與攜眷
  category: politics
  importance: 3
  endYear: 1875
  desc: 意在防止臺灣再成為反抗基地。政策時緊時鬆，卻造成長期男女比例失衡與遊民問題，直到 1875 年才全面解除。
  sources:
    - title: 維基百科：渡臺禁令
      url: https://zh.wikipedia.org/wiki/渡臺禁令
    - title: 維基百科：臺灣清治時期
      url: https://zh.wikipedia.org/wiki/臺灣清治時期

- id: tw-yu-yonghe
  year: 1697
  title: 郁永河抵台採硫，著《裨海紀遊》
  category: culture
  importance: 3
  desc: 福州鴉片庫火災失硫，郁永河自告奮勇前往臺灣採硫。他自府城陸路北上淡水，詳細記錄沿途原住民風貌與地理景物，所著《裨海紀遊》為清初臺灣最重要的遊記與人文地理文獻。
  sources:
    - title: 維基百科：裨海紀遊
      url: https://zh.wikipedia.org/wiki/裨海紀遊
    - title: 維基百科：郁永河
      url: https://zh.wikipedia.org/wiki/郁永河

- id: tw-chen-laizhang
  year: 1709
  title: 陳賴章墾號成立，台北盆地大開墾
  category: economy
  importance: 4
  desc: 泉州商人陳天仕、陳賴章等申獲「陳賴章墾號」，獲准開墾大佳臘（今台北市艋舺、大稻埕至松山一帶）。這是漢人有系統開墾台北盆地的開端，奠定台北市街發展的基石。
  sources:
    - title: 維基百科：陳賴章
      url: https://zh.wikipedia.org/wiki/陳賴章

- id: tw-babao-canal
  year: 1719
  title: 八堡圳完工，水利灌溉彰化平原
  category: economy
  importance: 3
  desc: 施世榜引濁水溪水開鑿八堡圳，耗時十年建成，灌溉彰化大部分農田。八堡圳為清代臺灣規模最大的水利工程，使彰化平原成為臺灣的中部糧倉。
  sources:
    - title: 維基百科：八堡圳
      url: https://zh.wikipedia.org/wiki/八堡圳

- id: tw-zhu-yigui
  year: 1721
  title: 朱一貴事件
  category: war
  importance: 3
  desc: 清治台灣第一次大規模民變。鳳山養鴨人朱一貴以「反清復明」為號召，聯合粵籍的杜君英起事，半個月內攻下台灣府城，自稱中興王、建元永和，全台幾乎盡失。但閩粵兩籍的起事者旋即內鬨，清廷派施世驃、藍廷珍渡海，兩個月即收復府城，朱一貴被捕解京處死。下淡水溪以東的客家庄在事件中組成六堆鄉團自保，從此成為常備的地方武力；清廷也自此在要道立石劃界，隔離漢人與原住民。
  sources:
    - title: 維基百科：朱一貴
      url: https://zh.wikipedia.org/wiki/朱一貴

- id: tw-changhua-tamsui
  year: 1723
  title: 增設彰化縣與淡水廳，行政北擴
  category: politics
  importance: 3
  desc: 朱一貴事件後，朝廷採藍鼎元之議分割幅員過廣的諸羅縣。漢人拓墾的重心自此正式北移。
  sources:
    - title: 維基百科：彰化縣 (清朝)
      url: https://zh.wikipedia.org/wiki/彰化縣_(清朝)
    - title: 維基百科：淡水廳
      url: https://zh.wikipedia.org/wiki/淡水廳
    - title: 維基百科：藍鼎元
      url: https://zh.wikipedia.org/wiki/藍鼎元

- id: tw-dajiaxi-uprising
  year: 1731
  endYear: 1732
  title: 大甲西社事件，平埔族群最大規模的抗官
  category: war
  importance: 3
  desc: 道卡斯族大甲西社的林武力等人因不堪勞役而起事，中部各社響應，前後延續一年才被平定，是平埔族群歷史上規模最大的一次抗官行動。清軍調鳳山總兵北上支援，南部守備因此空虛，朱一貴的舊部趁機再起，是為吳福生事件。事後清廷在平埔各社境內加強駐兵，中部的大肚王國也在此後瓦解 —— 一個從荷蘭時期存續下來、與三個政權都打過交道的跨部落聯盟，就這樣消失在文獻裡。
  sources:
    - title: 維基百科：大甲西社抗清事件
      url: https://zh.wikipedia.org/wiki/大甲西社抗清事件

- id: tw-wu-fusheng
  year: 1732
  title: 吳福生事件，趁大甲西社之亂起事
  category: war
  importance: 2
  desc: 大甲西社事件爆發後，駐台清軍大半被調往中部，鳳山縣的吳福生趁南部兵力空虛聚眾起事，焚燒營盤與萬丹巡檢衙門，殺守備張玉。亂事兩個多月即被總兵王郡與地方義民合力平定，吳福生被捕處死。此役讓清廷體認到義民的作用，此後轉為主動提倡；下淡水溪以東的客家六堆自朱一貴事件以來的鄉團組織，也因此獲得默許成為常備武力。
  sources:
    - title: 維基百科：吳福生事件
      url: https://zh.wikipedia.org/wiki/吳福生事件
    - title: 維基百科：六堆
      url: https://zh.wikipedia.org/wiki/六堆

- id: tw-family-migration
  year: 1733
  title: 開放移民攜眷渡臺
  category: politics
  importance: 3
  desc: 藍鼎元建言獲雍正採納。此前以單身男性為主的移墾社會，自此逐步轉為攜家帶眷的定居社會。
  sources:
    - title: 維基百科：渡臺禁令
      url: https://zh.wikipedia.org/wiki/渡臺禁令
    - title: 維基百科：藍鼎元
      url: https://zh.wikipedia.org/wiki/藍鼎元

- id: tw-longshan-temple
  year: 1738
  title: 艋舺龍山寺創建
  category: religion
  importance: 3
  desc: 泉州移民的信仰中心，也是清代艋舺的公共議事場所。
  sources:
    - title: 維基百科：艋舺龍山寺
      url: https://zh.wikipedia.org/wiki/艋舺龍山寺

- id: tw-tuniu-line
  year: 1750
  title: 土牛紅線，劃定漢人與原住民的界線
  category: politics
  importance: 3
  desc: 清廷治台採原漢隔離，朱一貴事件後（1722）先在要道立石為界，乾隆十五年起在地圖上以紅線標示界址，並沿線挖溝堆土，土堆狀似臥牛，故稱土牛。界線之外是「番地」，漢人不得越界墾殖，但實際上隨著移民壓力一再東移：1760 年藍線、1784 年紫線、1790 年綠線各重劃一次，同時以熟番屯丁與隘寮守界。番界既是清廷承認原住民土地權的證據，也記錄了漢人拓墾一步步侵入的軌跡；到了牡丹社事件後開山撫番，這條線才被正式廢止。
  sources:
    - title: 維基百科：台灣番界
      url: https://zh.wikipedia.org/wiki/台灣番界

- id: tw-liugong-canal
  year: 1753
  title: 瑠公圳完工，水利灌溉台北盆地
  category: economy
  importance: 3
  desc: 郭錫瑠引新店溪水開鑿水圳，克服穿山引水等工程難關，水圳橫貫景美、公館至大安一帶。瑠公圳提供穩定水源，促進台北盆地農耕與聚落繁榮。
  sources:
    - title: 維基百科：瑠公圳
      url: https://zh.wikipedia.org/wiki/瑠公圳

- id: tw-huang-jiao
  year: 1768
  endYear: 1769
  title: 黃教事件，南部山區的游擊抗官
  category: war
  importance: 2
  desc: 定居台灣縣大目降山區的泉州人黃教，於乾隆三十三年九月起事，以大崗山為據點在鳳山、諸羅之間流竄，劫掠商家、襲擊軍營奪取軍火，也攻擊協助官府的客家庄。清廷調集千人與水師提督吳必達合圍，半年後黃教被捕殺。它介於朱一貴與林爽文兩次大民變之間，規模不大卻讓官府疲於奔命，暴露了駐台班兵對山區束手無策的弱點。
  sources:
    - title: 維基百科：黃教
      url: https://zh.wikipedia.org/wiki/黃教

- id: tw-lin-shuangwen
  year: 1786
  title: 林爽文事件
  category: war
  importance: 4
  desc: 清治台灣規模最大、時間最長的民變。彰化大里杙的天地會首領林爽文因官府查拿會黨而起事，數日內攻陷彰化、諸羅，南路的莊大田也攻下鳳山縣城響應，全台除府城與鹿港外幾乎盡失，歷時一年餘。清廷先後動員福建、廣東、湖南等省兵力，最後由陝甘總督福康安率軍登陸鹿港才逐步平定，林爽文與莊大田皆被捕處死。乾隆將此役列入「十全武功」，並因諸羅縣民堅守而改其名為嘉義；事件中閩粵、漳泉互相攻殺，族群械鬥的格局由此加深。
  endYear: 1788
  sources:
    - title: 維基百科：林爽文事件
      url: https://zh.wikipedia.org/wiki/林爽文事件

- id: tw-wu-sha
  year: 1796
  title: 吳沙入墾蛤仔難，漢人進入蘭陽平原
  category: economy
  importance: 3
  desc: 吳沙率漳、泉、粵三籍墾民由烏石港一帶進入蛤仔難，築土圍據守，即今頭城。這是漢人成規模進入蘭陽平原的開端，也把噶瑪蘭族的生存空間往內壓縮。當時蛤仔難還在清朝版圖之外，官方既不保護也不承認；要到 1808 年吳化等人把已開墾的戶口造冊呈給閩浙總督，1812 年設噶瑪蘭廳，這片土地才被納進行政體系 —— 開墾走在治權前面，是清代台灣拓墾的常態。
  sources:
    - title: 維基百科：吳沙
      url: https://zh.wikipedia.org/wiki/吳沙
    - title: 維基百科：台灣歷史年表
      url: https://zh.wikipedia.org/wiki/台灣歷史年表

- id: tw-kavalan-prefecture
  year: 1811
  title: 增設噶瑪蘭廳，宜蘭納入版圖
  category: politics
  importance: 3
  desc: 吳沙率漳泉粵移民入墾蘭陽平原後原漢糾紛頻仍，朝廷始設官治理。
  sources:
    - title: 維基百科：噶瑪蘭廳
      url: https://zh.wikipedia.org/wiki/噶瑪蘭廳
    - title: 維基百科：吳沙
      url: https://zh.wikipedia.org/wiki/吳沙

- id: tw-guo-bainian
  year: 1814
  endYear: 1816
  title: 郭百年事件，漢人越界侵墾埔里
  category: war
  importance: 3
  desc: 隘丁首黃林旺等人冒用已故通事、土目的名義向臺灣府請領墾照，取得水沙連埔地的開墾權，隨後帶千餘人一路侵墾社仔、水里、沈鹿諸社，最後進佔埔里社築土城，並假冒官方誘使埔社停止抵抗後焚殺。1817 年官方查辦，杖責郭百年、拆城逐佃，在集集與烏溪立碑禁越 —— 但埔社元氣已盡，只能招西部的平埔族群遷入依附自保，中部平埔各社大舉入埔就是從這裡開始。番界擋得住合法的墾照，擋不住一張假的。
  sources:
    - title: 維基百科：郭百年事件
      url: https://zh.wikipedia.org/wiki/郭百年事件
    - title: 維基百科：水沙連
      url: https://zh.wikipedia.org/wiki/水沙連

- id: tw-zhang-bing
  year: 1832
  title: 張丙事件，道光年間中南部的大民變
  category: war
  importance: 3
  desc: 道光十二年台灣歉收，官府禁止米糧出境卻執行不公，店仔口（今台南白河）的張丙又被誣為強盜，遂於九月底起事。起事者連克佳里興等地，先後擊敗嘉義知縣邵用之與知府呂志恆，各地紛起響應，直到欽差馬濟勝率軍渡台，在鐵線橋一役獲勝才告平息，首謀解京凌遲。事件中閩粵兩籍互相攻殺，加深了族群裂痕，也讓清廷再度正視台灣的治理問題，與朱一貴、林爽文、戴潮春並列清治時期的大民變。
  sources:
    - title: 維基百科：張丙事件
      url: https://zh.wikipedia.org/wiki/張丙事件

- id: tw-dingxia-conflict
  year: 1853
  title: 頂下郊拚，同安人敗走大稻埕
  category: war
  importance: 3
  desc: 艋舺的三邑人（頂郊）與同安人（下郊）因港口貿易利益與族群矛盾爆發大規模分類械鬥。同安人戰敗後背負霞海城隍神像避走大稻埕，帶動大稻埕商業與街肆興起。
  sources:
    - title: 維基百科：頂下郊拚
      url: https://zh.wikipedia.org/wiki/頂下郊拚

- id: tw-lin-gong
  year: 1853
  title: 林恭事件，太平天國波及下的南部民變
  category: war
  importance: 2
  desc: 太平天國席捲閩南，小刀會在廈門起事，清廷對台灣的控制一時鬆動。四月，鳳山的小刀會首領林恭率眾攻入鳳山縣城，殺知縣王廷幹，自立為縣令，進而圍攻台南府城；北路的張古、羅阿沙同時響應。兩個月後林恭在二層行溪戰敗退往東港，七月遭部下綁縛交官，與佔據灣裡街的李石一同被斬。它與同年台北的頂下郊拚幾乎同時，顯示大陸動亂如何直接傳導到海峽這一側。
  sources:
    - title: 維基百科：林恭
      url: https://zh.wikipedia.org/wiki/林恭

- id: tw-perry-keelung
  year: 1854
  title: 培理艦隊勘查基隆煤礦
  category: politics
  importance: 3
  desc: 前一年叩關日本的同一支艦隊北上，在基隆停泊十日。培理返國後主張佔領臺灣未獲採納，但其報告引起歐美各國對臺灣的注意。
  sources:
    - title: 維基百科：馬修·培里
      url: https://zh.wikipedia.org/wiki/馬修·培里
    - title: 維基百科：臺灣清治時期
      url: https://zh.wikipedia.org/wiki/臺灣清治時期

- id: tw-treaty-ports
  year: 1858
  title: 天津條約，台灣開港通商
  category: economy
  importance: 4
  desc: 茶、糖、樟腦成為出口大宗，北部因茶業興起而快速發展。
  sources:
    - title: 維基百科：天津條約
      url: https://zh.wikipedia.org/wiki/天津條約
    - title: 維基百科：臺灣清治時期
      url: https://zh.wikipedia.org/wiki/臺灣清治時期

- id: tw-catholic-return
  year: 1859
  title: 道明會士抵打狗，天主教重返台灣
  category: religion
  importance: 3
  desc: 距離荷西時期的傳教中斷已逾兩百年。
  sources:
    - title: 維基百科：玫瑰聖母聖殿主教座堂
      url: https://zh.wikipedia.org/wiki/玫瑰聖母聖殿主教座堂

- id: tw-dai-chaochun
  year: 1862
  title: 戴潮春事件
  category: war
  importance: 3
  desc: 清代臺灣三大民變的最後一起，與朱一貴、林爽文事件並稱。
  sources:
    - title: 維基百科：戴潮春事件
      url: https://zh.wikipedia.org/wiki/戴潮春事件

- id: tw-maxwell
  year: 1865
  title: 馬雅各在台南行醫傳教
  category: religion
  importance: 3
  sources:
    - title: 維基百科：馬雅各
      url: https://zh.wikipedia.org/wiki/馬雅各

- id: tw-rover-incident
  year: 1867
  title: 羅發號事件，李仙得與卓杞篤締結南岬之盟
  category: politics
  importance: 4
  desc: 美國商船羅發號於恆春遇難，船員登陸後遭原住民殺害。美軍派兵登陸攻擊未果，駐廈門領事李仙得隨後與排灣族十八社總頭目卓杞篤談判，簽署《南岬之盟》保護遇難外國船員，為臺灣原住民與外國簽署的首份國際協議。
  sources:
    - title: 維基百科：羅發號事件
      url: https://zh.wikipedia.org/wiki/羅發號事件
    - title: 維基百科：卓杞篤
      url: https://zh.wikipedia.org/wiki/卓杞篤

- id: tw-camphor-war
  year: 1868
  title: 樟腦戰爭，樟腦開放自由貿易
  category: economy
  importance: 3
  desc: 英商因樟腦專賣與官府衝突，英艦砲擊安平。此後臺灣樟腦成為國際市場的主要來源。
  sources:
    - title: 維基百科：樟腦戰爭
      url: https://zh.wikipedia.org/wiki/樟腦戰爭

- id: tw-mackay
  year: 1872
  title: 馬偕抵淡水，行醫與辦學
  category: religion
  importance: 3
  sources:
    - title: 維基百科：馬偕
      url: https://zh.wikipedia.org/wiki/馬偕

- id: tw-mudan
  year: 1874
  title: 牡丹社事件，日本出兵台灣
  category: war
  importance: 4
  desc: 促使清廷改變消極治台方針，轉向開山撫番與積極經營。
  sources:
    - title: 維基百科：牡丹社事件
      url: https://zh.wikipedia.org/wiki/牡丹社事件

- id: tw-shen-baozhen
  year: 1875
  title: 沈葆楨開山撫番，解除渡臺禁令
  category: politics
  importance: 4
  desc: 牡丹社事件後治臺方針由消極轉為積極。增設臺北府與恆春縣，開闢通往後山的道路，並解除實行近兩百年的渡臺限制。
  sources:
    - title: 維基百科：沈葆楨
      url: https://zh.wikipedia.org/wiki/沈葆楨
    - title: 維基百科：開山撫番
      url: https://zh.wikipedia.org/wiki/開山撫番
    - title: 維基百科：渡臺禁令
      url: https://zh.wikipedia.org/wiki/渡臺禁令

- id: tw-shitou-she
  year: 1875
  title: 獅頭社之役，開山撫番南路的第一場硬仗
  category: war
  importance: 3
  desc: 沈葆楨要打通往恆春與後山的道路，與屏東山區的排灣族大龜文酋邦正面衝突。前一年獅頭社人被刺桐腳庄民殺害、日軍又借牡丹社事件侵入原住民領地，雙方積怨已深。清軍以淮軍主力進攻內外獅頭社，王開俊中伏陣亡、所部全軍覆沒，戰事拖了三個月、動員數千人才勉強收場，是沈葆楨在台期間規模最大的一場戰爭。戰後清廷把竹坑、內外獅頭等社改成「永平」「永化」之類的名字，宣示教化，實際上是用地名蓋住一場慘勝。
  sources:
    - title: 維基百科：獅頭社之役
      url: https://zh.wikipedia.org/wiki/獅頭社之役

- id: tw-cepo
  year: 1877
  title: 大港口事件，阿美族壯丁遭設宴誘殺
  category: war
  importance: 3
  desc: 開山撫番中路推進到花蓮秀姑巒溪口，總兵吳光亮要開闢水尾到大港口的道路，遭大港口、奇密等阿美族部落抵抗。清軍武力不能得手，改以宴請和解為名把部落壯丁集中起來，趁其酒醉一舉射殺。大港口一帶的青壯世代幾乎滅絕，倖存者逃入山區或投靠其他部落。它與次年的加禮宛戰役同為開山撫番在東部留下的血債；2022 年豐濱鄉公所將它正名為「Cepo' 戰役」。
  sources:
    - title: 維基百科：大港口事件
      url: https://zh.wikipedia.org/wiki/大港口事件

- id: tw-kaliawan
  year: 1878
  title: 加禮宛戰役，兩個族群幾乎滅絕
  category: war
  importance: 3
  desc: 開山撫番推進到花蓮奇萊平原，噶瑪蘭族加禮宛社與撒奇萊雅族聯合抗清，戰敗後兩族幾乎滅絕，倖存者改說阿美語、藏身在阿美族部落之中，此後一百多年不再以自己的族名出現。協助清軍的七腳川社因此成為奇萊平原最大的部落。這兩族到 2002 年與 2007 年才分別獲得官方正名 —— 一場戰役讓兩個族群從族譜上消失了一個多世紀，是開山撫番這面「積極經營」旗幟下的另一面。
  sources:
    - title: 維基百科：加禮宛戰役
      url: https://zh.wikipedia.org/wiki/加禮宛戰役

- id: tw-sino-french-war
  year: 1884
  title: 清法戰爭波及臺灣，法軍攻基隆、佔澎湖
  category: war
  importance: 4
  endYear: 1885
  desc: 法軍封鎖臺灣、數度攻擊基隆與淡水，並一度佔領澎湖。此役凸顯臺灣的海防地位，直接促成隔年建省。
  sources:
    - title: 維基百科：西仔反
      url: https://zh.wikipedia.org/wiki/西仔反
    - title: 維基百科：滬尾之役
      url: https://zh.wikipedia.org/wiki/滬尾之役
    - title: 維基百科：中法戰爭
      url: https://zh.wikipedia.org/wiki/中法戰爭

- id: tw-province
  year: 1885
  title: 台灣建省，劉銘傳任首任巡撫
  category: politics
  importance: 5
  desc: 清法戰爭讓清廷確認台灣的戰略地位，光緒十一年下詔建省，與福建分治，劉銘傳以巡撫身分主政，行政區擴為三府一州十一縣三廳，省會定在台北。建省後推動清賦、鐵路、郵政、電報、電燈、煤礦、新式學堂等一連串新政，是清治台灣最積極的六年；但財政壓力沉重，清賦又激起民變，劉銘傳 1891 年去職後多數事業轉趨保守，四年後台灣即割讓日本。
  sources:
    - title: 維基百科：福建臺灣省
      url: https://zh.wikipedia.org/wiki/福建臺灣省
    - title: 維基百科：劉銘傳
      url: https://zh.wikipedia.org/wiki/劉銘傳

- id: tw-qingfu
  year: 1886
  title: 清賦，全台土地清丈與稅制整理
  category: economy
  importance: 3
  desc: 劉銘傳為了替建省後的新政籌錢，設清賦總局清查全台隱匿的田地，把清初以來大租戶、小租戶層層疊疊的權利關係重新登記，改以小租戶為納稅主體、大租減四留六。清出的田畝數倍於舊冊，稅收大增，卻也因丈量草率、官吏需索而民怨四起，兩年後在彰化激起施九緞事件、在後山激起大庄事件，清丈被迫中止。這份不完整的田冊後來成為日治初期土地調查的底本。
  sources:
    - title: 維基百科：劉銘傳
      url: https://zh.wikipedia.org/wiki/劉銘傳
    - title: 維基百科：施九緞事件
      url: https://zh.wikipedia.org/wiki/施九緞事件

- id: tw-railway-bureau-qing
  year: 1887
  title: 全臺鐵路商務總局成立，鐵路動工
  category: economy
  importance: 3
  desc: 劉銘傳主導，原規劃基隆經台北、新竹通到台南。1891 年他去職後，繼任巡撫以財政困難奏請中止。
  sources:
    - title: 維基百科：全臺鐵路商務總局
      url: https://zh.wikipedia.org/wiki/全臺鐵路商務總局
    - title: 維基百科：劉銘傳
      url: https://zh.wikipedia.org/wiki/劉銘傳

- id: tw-shi-jiuduan
  year: 1888
  title: 施九緞事件，清丈激起建省後最大民變
  category: war
  importance: 3
  desc: 淡水知縣李嘉棠奉派到彰化丈量土地，敷衍了事又藉機需索，地主施九緞以「索焚丈單」為號召率數千民眾圍彰化縣城，前來解圍的提督朱煥明戰死，全縣一度失序。林朝棟率棟軍一千八百人內外夾擊才解圍。事後李嘉棠革職，施九緞受民眾掩護始終未被捕，參與者也多從寬發落。這是建省以來規模最大的民變，直接讓劉銘傳的清賦停擺，新政財源斷絕，三年後他也去職。
  sources:
    - title: 維基百科：施九緞事件
      url: https://zh.wikipedia.org/wiki/施九緞事件

- id: tw-dazhuang
  year: 1888
  title: 大庄事件，北洋艦隊首次渡海登陸作戰
  category: war
  importance: 3
  desc: 花東縱谷的大庄（今花蓮富里）以大武壠族為主的移民，因撫墾局委員雷福海藉清丈之便欺壓居民、凌辱婦女，六月殺雷福海等官吏起事，隨後阿美族、客家移民與卑南族呂家望社加入，北路打到花蓮港、南路圍攻卑南廳署，是清治時期東部最大的一場反抗。清廷從北洋調來致遠、靖遠兩艘巡洋艦以艦砲掩護登陸，這是中國近代海軍第一次對台灣的兩棲作戰；戰事到十月才平息，與同年西部的施九緞事件一東一西同源於清賦。
  sources:
    - title: 維基百科：大庄事件
      url: https://zh.wikipedia.org/wiki/大庄事件

- id: tw-taiwan-post
  year: 1888
  title: 臺灣郵政總局開辦，劉銘傳新政的高峰
  category: science
  importance: 3
  desc: 劉銘傳在台北府城設臺灣郵政總局，兼收官方文書與民間信件並發行郵票，比大清郵政官局正式成立早了八年。同一時期他還鋪設台北到台南與跨海到福州的電報線、在台北點亮全台第一盞電燈、開辦教授外語與西學的西學堂與電報學堂、興建台北到基隆的鐵路。這些事業多集中在 1887 到 1888 年，是清治台灣近代化的頂點；但財政不堪負荷加上清賦引發民變，多數事業在他 1891 年去職後或停辦或縮減。
  sources:
    - title: 維基百科：臺灣郵政
      url: https://zh.wikipedia.org/wiki/臺灣郵政
    - title: 維基百科：劉銘傳
      url: https://zh.wikipedia.org/wiki/劉銘傳

- id: tw-railway-qing
  year: 1891
  title: 台北—基隆鐵路通車，台灣首條鐵路
  category: economy
  importance: 3
  desc: 首段由大稻埕通至基隆，1893 年才延伸到新竹。清代的建設止步於此，原訂的台南段未及動工。
  sources:
    - title: 維基百科：劉銘傳
      url: https://zh.wikipedia.org/wiki/劉銘傳
    - title: 維基百科：臺灣鐵路
      url: https://zh.wikipedia.org/wiki/臺灣鐵路

- id: tw-shimonoseki
  year: 1895
  title: 馬關條約割台；台灣民主國與乙未戰爭
  category: politics
  importance: 5
  desc: 割讓消息傳來後士紳宣布成立台灣民主國抵抗，數月內為日軍所平。
  sources:
    - title: 維基百科：馬關條約
      url: https://zh.wikipedia.org/wiki/馬關條約
    - title: 維基百科：臺灣民主國
      url: https://zh.wikipedia.org/wiki/臺灣民主國
    - title: 維基百科：乙未戰爭
      url: https://zh.wikipedia.org/wiki/乙未戰爭

- id: tw-law-63
  year: 1896
  title: 六三法，總督獨攬立法權
  category: politics
  importance: 3
  desc: 授權總督在臺灣發布具法律效力的命令，行政、立法、司法與軍事大權集於一身。這是「特別統治」的法源。
  sources:
    - title: 維基百科：六三法
      url: https://zh.wikipedia.org/wiki/六三法
