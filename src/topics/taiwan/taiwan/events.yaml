- id: tw-covid-19
  year: 2020
  title: COVID-19 疫情，邊境管制與三級警戒
  category: science
  importance: 4
  desc: 一月出現首例境外移入後，台灣以入境管制、居家檢疫、口罩實名制與疫調把疫情壓在極低水準，一年多內本土病例不到百例，成為國際上的例外。2021 年五月本土疫情爆發，全國進入三級警戒兩個半月，疫苗取得一度成為政治焦點；2022 年改採與病毒共存，累計確診逾千萬。三年間邊境幾乎關閉，是戰後台灣與外界隔絕最久的一段。
  sources:
