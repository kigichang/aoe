- id: tw-cloud-gate
  year: 1973
  title: 雲門舞集成立，台灣第一個職業現代舞團
  category: culture
  importance: 3
  desc: 林懷民以「中國人作曲、中國人編舞、中國人跳給中國人看」創辦雲門舞集，是台灣第一個職業現代舞團，也是華語世界第一個。1978 年的《薪傳》在中美斷交當天首演，以台灣先民渡海的故事引起巨大共鳴；此後《九歌》《流浪者之歌》《水月》《行草》陸續巡演歐美，是台灣表演藝術在國際上最持久的名字。雲門的興起與校園民歌、鄉土文學同屬 1970 年代「回頭看自己」的一波。
