- id: tw-siraya-recognition
  year: 2026
  title: 西拉雅族獲認定，第 17 個原住民族
  category: politics
  importance: 4
  desc: 行政院於 7 月 30 日核定西拉雅族為原住民族，是噶瑪蘭族之後第二個、也是《平埔原住民族群身分法》通過後第一個獲認定的平埔族群。三十年正名路的里程碑：2022 年憲法法庭判《原住民身分法》違憲，2025 年立法院三讀新法，此年核定 —— 而 1636 年荷蘭人在新港社教的羅馬字，寫的正是西拉雅語。
