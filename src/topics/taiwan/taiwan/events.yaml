- id: tw-cape-no-7
  year: 2008
  title: 《海角七號》賣座，國片熱潮回來了
  category: culture
  importance: 3
  desc: 好萊塢片長期佔據市場、國片籌資困難的低迷年代，魏德聖的首部劇情長片以五千萬元成本拍成，宣傳幾乎只靠網路口碑，最後全台票房超過五億三千萬，是當時最賣座的國產電影。此後《艋舺》《賽德克·巴萊》《那些年》《KANO》接連出現，本土題材重新有了商業上的可行性 —— 這是自 1980 年代新電影以來，台灣電影第一次同時拿到票房與話題。
  sources:
    - title: 維基百科：海角七號
      url: https://zh.wikipedia.org/wiki/海角七號

- id: tw-morakot
  year: 2009
  title: 八八風災，小林村滅村
  category: economy
  importance: 3
  desc: 莫拉克颱風在八月六日到十日間為南台灣帶來破紀錄的降雨，兩天雨量相當於一整年，高雄甲仙的小林村遭山崩掩埋，四百七十餘人罹難；全台死亡與失蹤近七百人，是八七水災以來最嚴重的水患。救災遲緩導致行政院長劉兆玄內閣總辭，災後重建把原住民部落遷離山區的做法引發長期爭議。
  sources:
    - title: 維基百科：八八水災
      url: https://zh.wikipedia.org/wiki/八八水災

- id: tw-ecfa
  year: 2010
  title: 簽署 ECFA，兩岸經濟合作架構協議
  category: economy
  importance: 3
  desc: 馬英九政府與中華人民共和國在重慶簽署海峽兩岸經濟合作架構協議，先就數百項貨品降稅（早收清單），後續再談貨品貿易與服務貿易。支持者視為避免台灣在區域經濟整合中被邊緣化，反對者擔憂經濟依賴轉為政治籌碼。2014 年服貿協議在立法院的審查程序引爆太陽花學運，後續協議全部停擺，ECFA 至今停留在早收清單階段。
  sources:
    - title: 維基百科：海峽兩岸經濟合作架構協議
      url: https://zh.wikipedia.org/wiki/海峽兩岸經濟合作架構協議

- id: tw-hung-chung-chiu
  year: 2013
  title: 洪仲丘事件，二十五萬人白衫軍上街
  category: politics
  importance: 3
  desc: 義務役下士洪仲丘在退伍前三天於禁閉室操練中熱衰竭死亡，軍方調查避重就輕，網友自發組成「公民 1985 行動聯盟」，八月三日在凱達格蘭大道集結二十五萬人要求真相。立法院隨即修法，承平時期軍人犯罪改由普通法院審判，軍事審判法實質停用。這是台灣第一次由網路動員、沒有政黨主導的大型集會，隔年的太陽花學運沿用了同一套方法。
  sources:
    - title: 維基百科：洪仲丘事件
      url: https://zh.wikipedia.org/wiki/洪仲丘事件

- id: tw-sunflower-movement
  year: 2014
  title: 太陽花學運，佔領立法院二十四天
  category: politics
  importance: 4
  desc: 《海峽兩岸服務貿易協議》遭強行通過審查，學生與公民團體佔領立法院議場二十四天，要求退回協議並先立兩岸協議監督條例。服貿自此擱置，也重塑了此後十年的政黨版圖與兩岸議題攻防。
  sources:
    - title: 維基百科：太陽花學運
      url: https://zh.wikipedia.org/wiki/太陽花學運

- id: tw-kaohsiung-gas-explosions
  year: 2014
  title: 高雄氣爆，石化管線在市區連環爆炸
  category: science
  importance: 2
  desc: 七月三十一日深夜高雄前鎮、苓雅區的道路連環爆炸，三十二人死亡、三百餘人受傷，數公里道路被炸開。事後查明是李長榮化工的丙烯管線被錯誤包覆在排水箱涵內，長年腐蝕洩漏。這場災難暴露了石化管線穿越市區而無人監管的問題，促成管線資訊公開與《石化管線管理自治條例》，也讓高雄的石化產業去留成為政治議題。
  sources:
    - title: 維基百科：2014年高雄氣爆事故
      url: https://zh.wikipedia.org/wiki/2014年高雄氣爆事故

- id: tw-12-year-education
  year: 2014
  title: 十二年國民基本教育上路
  category: culture
  importance: 2
  desc: 九年國教實施四十六年後，高中職三年納入國民基本教育，以免試入學為主、高職免學費，但後三年不強制。2019 年配套的新課綱（一〇八課綱）以「素養」取代學科知識為核心，開設校訂必修與自主學習。制度的爭議集中在免試入學的超額比序與明星高中的存廢，反映的仍是 1994 年教改以來「升學壓力能不能靠制度解決」的老問題。
  sources:
    - title: 維基百科：十二年國民基本教育
      url: https://zh.wikipedia.org/wiki/十二年國民基本教育

