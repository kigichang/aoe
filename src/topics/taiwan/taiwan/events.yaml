- id: tw-relocation
  year: 1949
  title: 國民政府遷台；台灣省戒嚴
  category: politics
  importance: 5
  desc: 國共內戰失利，中華民國政府於十二月七日宣布遷往台北；此前五月省主席陳誠已頒布戒嚴令，接著《懲治叛亂條例》、《檢肅匪諜條例》相繼施行，一百多萬軍民隨政府渡海。台灣自此成為中華民國實際統治的全部範圍，戒嚴持續三十八年，是世界上最長的戒嚴之一。
  sources:
    - title: 維基百科：中華民國政府遷臺
      url: https://zh.wikipedia.org/wiki/中華民國政府遷臺
    - title: 維基百科：臺灣省戒嚴令
      url: https://zh.wikipedia.org/wiki/臺灣省戒嚴令

- id: tw-white-terror
  year: 1949
  endYear: 1991
  title: 白色恐怖
  category: politics
  importance: 5
  desc: 起於 1949 年 5 月 20 日的戒嚴令，止於 1991 年廢止《戡亂時期檢肅匪諜條例》，歷時四十二年。以《懲治叛亂條例》等特別法整肅異議者，同年 4 月的四六事件已先一步在校園開始。這條軸線幾乎與戰後前半段等長 —— 二二八、雷震案、美麗島事件都落在它裡面。
  sources:
    - title: 維基百科：臺灣白色恐怖時期
      url: https://zh.wikipedia.org/wiki/臺灣白色恐怖時期
    - title: 維基百科：懲治叛亂條例
      url: https://zh.wikipedia.org/wiki/懲治叛亂條例
    - title: 維基百科：四六事件
      url: https://zh.wikipedia.org/wiki/四六事件

- id: tw-guningtou
  year: 1949
  title: 古寧頭戰役，兩岸分治的軍事定局
  category: war
  importance: 4
  desc: 10 月下旬解放軍第十兵團於攻佔廈門後渡海進攻大金門，因船隻不足、情報有誤與國軍及時增援，登陸部隊在島上苦戰三晝夜後全軍覆沒。這是國軍在內戰後期少有的一場勝仗，把戰線停在金門，也讓台灣本島暫時脫離立即被渡海攻擊的處境 —— 韓戰爆發、第七艦隊進入台灣海峽，還是八個月以後的事。此後兩岸的軍事對峙就沿著這條線固定下來。
  sources:
    - title: 維基百科：古寧頭戰役
      url: https://zh.wikipedia.org/wiki/古寧頭戰役

- id: tw-april-6-incident
  year: 1949
  title: 四六事件，軍警進入台大與師院逮捕學生
  category: politics
  importance: 3
  desc: 三月一起單車雙載的取締演成學生示威，四月六日凌晨軍警包圍台大與台灣省立師範學院宿舍，逮捕學生兩百餘人，師院隨即停課整頓、全體學生重新登記。這比五月的戒嚴令還早一個多月，是戰後校園肅清的起點，也被視為白色恐怖的序幕；台大校長傅斯年當時要求「不得在校園內開槍」的一句話，後來成為校園自治的象徵。
  sources:
    - title: 維基百科：四六事件
      url: https://zh.wikipedia.org/wiki/四六事件

- id: tw-new-taiwan-dollar
  year: 1949
  title: 幣制改革，四萬舊台幣換一元新台幣
  category: economy
  importance: 3
  desc: 戰後台灣銀行券改為舊台幣，卻因對大陸匯兌與國共內戰的軍費而惡性通膨，四年間物價漲了數千倍。六月十五日省政府發行新台幣，以四萬比一收回舊幣，並以黃金與外匯準備限額發行，與大陸的法幣、金圓券切斷連動。這次改革在國民政府遷台之前半年完成，穩住了物價，也是台灣自成一個經濟體的起點；新台幣由台灣銀行發行到 2000 年才改由中央銀行接手。
  sources:
    - title: 維基百科：新臺幣
      url: https://zh.wikipedia.org/wiki/新臺幣

- id: tw-local-autonomy-1950
  year: 1950
  endYear: 1951
  title: 頒布地方自治綱要，首次實施縣市長與議員選舉
  category: politics
  importance: 4
  desc: 行政院頒布《臺灣省各縣市實施地方自治綱要》，劃分全臺十六縣五省轄市，並於 1950 至 1951 年間舉行戰後首次縣市長與縣市議員直接選舉（花蓮縣率先投開票）。開啟臺灣戰後地方自治與基層民主的制度實踐。
  sources:
    - title: 維基百科：1950年—1951年中華民國縣市長選舉
      url: https://zh.wikipedia.org/wiki/1950年—1951年中華民國縣市長選舉
    - title: 維基百科：臺灣省各縣市實施地方自治綱要
      url: https://zh.wikipedia.org/wiki/臺灣省各縣市實施地方自治綱要

- id: tw-korean-war-strait
  year: 1950
  title: 韓戰爆發，第七艦隊巡弋台灣海峽
  category: war
  importance: 4
  desc: 北韓南侵，美國杜魯門總統宣布台灣海峽中立化，第七艦隊隨即進駐巡弋，阻止兩岸雙方互相攻擊。台灣自此獲得美國安全保護傘，為戰後經濟社會的穩定奠定基礎。
  sources:
    - title: 維基百科：韓戰
      url: https://zh.wikipedia.org/wiki/朝鮮戰爭
    - title: 維基百科：臺灣海峽中立化
      url: https://zh.wikipedia.org/wiki/臺灣海峽中立化

- id: tw-us-aid
  year: 1951
  endYear: 1965
  title: 美援正式啟動，支撐戰後經濟重建
  category: economy
  importance: 4
  desc: 韓戰爆發後美國重啟對臺經濟與軍事援助，美援於 1951 年正式啟動，至 1965 年累計達十五億美元。美援穩定了戰後劇烈的通貨膨脹，並為基礎設施建設、農業化肥與工業發展提供資金，支撐臺灣戰後經濟復甦。
  sources:
    - title: 維基百科：美援
      url: https://zh.wikipedia.org/wiki/美援

- id: tw-sf-treaty
  year: 1951
  title: 舊金山和約簽署，台灣主權歸屬未明載
  category: politics
  importance: 5
  desc: 48國與日本在舊金山簽署對日和約，日本聲明放棄對台灣、澎湖的一切權利，但條文未指明歸屬何國——中華民國與中華人民共和國均未受邀與會。這段留白日後成為「台灣地位未定論」的起點。
  sources:
    - title: 維基百科：舊金山和約
      url: https://zh.wikipedia.org/wiki/舊金山和約
    - title: 維基百科：台灣地位未定論
      url: https://zh.wikipedia.org/wiki/台灣地位未定論

- id: tw-taipei-treaty
  year: 1952
  title: 中日和約（台北和約）簽訂
  category: politics
  importance: 4
  desc: 舊金山和約生效前七小時，中華民國與日本在台北賓館另訂雙邊和約，日本同樣聲明放棄台灣、澎湖權利卻未載明歸屬，並約定台灣住民依中華民國國籍處理，日本並放棄對台戰爭賠償請求權。雙方批准書於同年8月5日互換，條約始正式生效。
  sources:
    - title: 維基百科：中日和約
      url: https://zh.wikipedia.org/wiki/中日和約

- id: tw-luku-incident
  year: 1952
  title: 鹿窟事件，白色恐怖初期最大的政治案
  category: politics
  importance: 3
  desc: 十二月底軍警上萬人封鎖台北汐止、石碇交界的鹿窟山區，圍捕中共台灣省工作委員會的武裝基地，前後逮捕村民數百人，三十五人處死、近百人判刑，受牽連者包括不識字的農民與未成年人。它是 1950 年代肅清中共地下組織的最大一案，但多數被捕者只是被脅迫提供糧食的山村居民；2000 年才在原地立碑，是最早獲得官方紀念的白色恐怖案件之一。
  sources:
    - title: 維基百科：鹿窟基地案
      url: https://zh.wikipedia.org/wiki/鹿窟基地案

- id: tw-land-reform
  year: 1953
  title: 耕者有其田，土地改革完成
  category: economy
  importance: 4
  desc: 土地改革分三步：1949 年三七五減租把佃租上限定在收穫的 37.5%，1951 年公地放領，1953 年耕者有其田強制徵收地主超額出租地轉售佃農，地主以實物債券與四大公營公司股票受償。自耕農比例從三成多升到六成，農村收入提高、農業增產支撐了 1950 年代的工業化；地主資本被引導進入工業，是戰後台灣土地與資本結構最大的一次重組。
  sources:
    - title: 維基百科：耕者有其田
      url: https://zh.wikipedia.org/wiki/耕者有其田
    - title: 維基百科：三七五減租
      url: https://zh.wikipedia.org/wiki/三七五減租

- id: tw-modern-poetry-quarterly
  year: 1953
  title: 紀弦創辦《現代詩》，現代派登場
  category: culture
  importance: 2
  desc: 隨政府來台的詩人紀弦獨力創辦《現代詩》季刊，1956 年進一步與鄭愁予、林亨泰等人組成「現代派」，主張新詩是「橫的移植」而非「縱的繼承」，全面向西方現代主義取經。同一時期覃子豪的藍星詩社、洛夫與瘂弦的創世紀詩社相繼成立，三大詩社的論爭決定了戰後台灣新詩三十年的走向，也讓 1950 年代在反共文學之外留下了另一條線。
  sources:
    - title: 維基百科：現代詩社
      url: https://zh.wikipedia.org/wiki/現代詩社

- id: tw-first-strait-crisis
  year: 1954
  title: 第一次台海危機
  category: war
  importance: 4
  sources:
    - title: 維基百科：第一次臺灣海峽危機
      url: https://zh.wikipedia.org/wiki/第一次臺灣海峽危機

- id: tw-mutual-defense-treaty
  year: 1954
  title: 中美共同防禦條約簽訂
  category: politics
  importance: 4
  desc: 第一次台海危機後，中華民國與美國簽署共同防禦條約，美軍協防台灣與澎湖正式法制化，直到 1979 年台美斷交後失效。
  sources:
    - title: 維基百科：中美共同防禦條約
      url: https://zh.wikipedia.org/wiki/中美共同防禦條約

- id: tw-dachen-evacuation
  year: 1955
  title: 大陳島撤退，浙江外海最後的據點放棄
  category: war
  importance: 3
  desc: 一江山失守後，中華民國在美國第七艦隊護航下於 2 月分批撤離浙江外海的大陳、漁山、南麂各島，共運走 16053 名官兵與 17132 名居民，官方稱之為「大陳義胞」，安置於台灣各地的新村。這是第一次台海危機的一部分，也是中華民國實際控制範圍最後一次大幅收縮 —— 此後統治的範圍就固定為台澎金馬，一直到今天。
  sources:
    - title: 維基百科：大陳島撤退
      url: https://zh.wikipedia.org/wiki/大陳島撤退

- id: tw-taiyu-cinema
  year: 1955
  endYear: 1981
  title: 台語片的興衰，二十六年一千餘部
  category: culture
  importance: 3
  desc: 從歌仔戲電影起家，題材多取自民間故事與通俗劇，二十六年間拍出一千多部，是當時產量最大的一支 —— 因為多數台灣人的母語就是台語。1970 年代國語政策全面收緊，電視與電影的方言時段受限、輔導資源集中於國語片，台語片迅速沒落，1981 年楊麗花主演的歌仔戲電影《陳三五娘》是最後一部。現存於片庫的只剩約兩百部，其餘拷貝多半散佚。
  sources:
    - title: 維基百科：臺語電影
      url: https://zh.wikipedia.org/wiki/臺語電影

- id: tw-sun-liren-case
  year: 1955
  title: 孫立人案，陸軍總司令遭軟禁三十三年
  category: politics
  importance: 3
  desc: 政府指控孫立人的部屬郭廷亮為匪諜、密謀兵變，以「縱容部屬」為由將這位留美出身、曾任陸軍總司令的上將免職軟禁，部屬三百餘人連坐入獄。案件的背景是孫立人與美軍關係密切、又不屬黃埔系統，在蔣經國掌握軍中政工之後成為被排除的對象。孫立人在台中住處被幽禁到 1988 年，2001 年監察院重新調查認定為誣陷。
  sources:
    - title: 維基百科：孫立人兵變案
      url: https://zh.wikipedia.org/wiki/孫立人兵變案

