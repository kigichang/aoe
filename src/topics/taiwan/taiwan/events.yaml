- id: tw-transitional-justice-act
  year: 2017
  title: 《促進轉型正義條例》通過，促轉會成立
  category: politics
  importance: 3
  desc: 立法院三讀通過促轉條例，隔年成立促進轉型正義委員會，任務包括開放政治檔案、撤銷威權時期的有罪判決、清除威權象徵與處理不當黨產。促轉會在四年任期內撤銷五千餘件判決、公布中正紀念堂轉型方案，2022 年解散，業務移交行政院各部會。它承接 1998 年補償條例以來的路，但把重心從賠償受難者移向釐清加害體制，也因此爭議不斷。
