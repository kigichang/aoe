      url: https://zh.wikipedia.org/wiki/柏楊

- id: tw-taiyuan-incident
  year: 1970
  title: 泰源事件，政治犯的武裝台獨行動
  category: politics
  importance: 2
  desc: 台東泰源監獄的台獨政治犯江炳興等人聯合部分衛兵奪槍越獄，計畫佔領廣播電台宣布台灣獨立，行動失敗後逃入山區，十餘日內全數被捕，五人處決。官方稱「泰源暴動」，台獨運動者稱「泰源起義」。它與同年紐約的刺蔣案發生在同一年，顯示 1970 年前後台獨運動一度走向武裝路線，此後才轉回海外與島內的政治動員。
  sources:
    - title: 維基百科：泰源事件
