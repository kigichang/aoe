- id: tw-formosa-incident
  year: 1979
  title: 台美斷交；美麗島事件
  category: politics
  importance: 5
  desc: 一月一日美國與中華民國斷交、與中華人民共和國建交，年底黨外人士以《美麗島》雜誌社名義在高雄舉辦國際人權日集會，與憲警爆發衝突，隨後黃信介、施明德、呂秀蓮、林義雄等數十人被捕，八人以叛亂罪交付軍法審判。隔年的公開審判與辯護律師團（陳水扁、謝長廷、蘇貞昌等）讓黨外的主張第一次完整傳到社會，被告與辯護人日後成為民進黨的核心。黨外運動遭大規模逮捕，卻也成為此後民主化的人才與動員基礎。
  sources:
