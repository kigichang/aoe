- id: tw-lin-family-murders
  year: 1980
  title: 林宅血案，美麗島被告家屬遭滅門
  category: politics
  importance: 3
  desc: 美麗島軍法大審進行期間的二月二十八日，被告林義雄的母親與一對七歲雙胞胎女兒在台北住家遭刺殺身亡，九歲長女重傷。案發時林宅受情治單位全天監控，兇手卻至今未破。這起血案讓島內外對美麗島審判的觀感徹底改變，也是黨外運動最沉重的記憶之一；林宅後來改為義光教會。
  sources:
    - title: 維基百科：林宅血案
      url: https://zh.wikipedia.org/wiki/林宅血案

- id: tw-chen-wen-chen
  year: 1981
  title: 陳文成命案，返台學者陳屍台大校園
  category: politics
  importance: 3
  desc: 在美國卡內基美隆大學任教的陳文成返台探親，因曾捐款給《美麗島》雜誌被警備總部約談，隔日清晨被發現陳屍台大研究生圖書館旁。官方宣稱「畏罪自殺」，美國國會為此舉行聽證，成為台美關係中的人權議題。它與林宅血案、江南案並列 1980 年代三大懸案，台大 2021 年在原地設立陳文成事件紀念廣場。
  sources:
    - title: 維基百科：陳文成事件
      url: https://zh.wikipedia.org/wiki/陳文成事件

- id: tw-new-cinema
  year: 1982
  endYear: 1987
  title: 台灣新電影，鏡頭轉向真實生活
  category: culture
  importance: 3
  desc: 一批新生代導演以寫實風格拍攝身邊的社會與記憶，題材是小鎮、家庭、成長與城鄉遷徙，形式上放棄了官營片廠慣用的政宣與類型套路。1983 年改編自黃春明小說的《兒子的大玩偶》遭檢舉並要求剪片，引發輿論反彈而作罷，一般稱為削蘋果事件。這波運動在票房上並不成功，卻讓台灣電影第一次在國際影展被看見，也替解嚴後侯孝賢、楊德昌、李安、蔡明亮那一代鋪好了路。
  sources:
    - title: 維基百科：台灣新電影
      url: https://zh.wikipedia.org/wiki/台灣新電影

- id: tw-indigenous-movement
  year: 1984
  title: 原住民族運動興起
  category: politics
  importance: 3
  desc: 台灣原住民權利促進會成立，提出正名、還我土地與自治三大訴求。1988 年嘉義火車站前的吳鳳銅像被拆除，「吳鳳捨生取義感化生番」這則寫進教科書數十年的敘事就此退場 —— 運動要爭的不只是權利，還有誰來講述這座島的歷史。
  sources:
    - title: 維基百科：臺灣原住民族運動
      url: https://zh.wikipedia.org/wiki/臺灣原住民族運動
    - title: 維基百科：臺灣原住民族
      url: https://zh.wikipedia.org/wiki/臺灣原住民族

- id: tw-henry-liu-case
  year: 1984
  title: 江南案，情報局派黑道在美國殺害作家
  category: politics
  importance: 3
  desc: 撰寫《蔣經國傳》的美籍作家劉宜良（筆名江南）在加州住家遭竹聯幫份子槍殺，追查後證實是國防部情報局主使。在美國領土上殺害美國公民讓台美關係陷入危機，美國國會通過決議譴責，政府被迫審判情報局長汪希苓與竹聯幫首領陳啟禮。此案重創政權的正當性，被認為是蔣經國晚年決定開放黨禁、解嚴的推力之一。
  sources:
    - title: 維基百科：江南案
      url: https://zh.wikipedia.org/wiki/江南案

- id: tw-lee-yuan-tseh-nobel
  year: 1986
  title: 李遠哲獲諾貝爾化學獎
  category: science
  importance: 3
  desc: 新竹出身的李遠哲以交叉分子束方法研究化學反應動力學，與赫施巴赫、波拉尼共同獲獎，是第一位在台灣出生成長的諾貝爾獎得主。他 1994 年放棄美國籍返台出任中央研究院院長，此後十餘年深度介入台灣的教育改革與政治，從一個科學家的獎項變成一個公共人物的起點 —— 那段參與的評價至今分歧，但四百年來第一次有台灣長大的人站上那個位置這件事，當年的震撼是一致的。
  sources:
    - title: 維基百科：李遠哲
      url: https://zh.wikipedia.org/wiki/李遠哲

- id: tw-dpp-founded
  year: 1986
  title: 民主進步黨成立，戒嚴下的組黨
  category: politics
  importance: 4
  desc: 九月二十八日黨外人士在台北圓山飯店集會，原本要推薦年底選舉的候選人，臨時決議直接組黨，成為戰後台灣第一個本土反對黨。當時黨禁仍在，蔣經國選擇不取締，十月即對外表示將解除戒嚴、開放組黨。民進黨在年底的立委與國代選舉中取得兩成多選票，從此台灣有了兩黨競爭；十四年後它贏得總統選舉。
  sources:
    - title: 維基百科：民主進步黨
      url: https://zh.wikipedia.org/wiki/民主進步黨

- id: tw-martial-law-lifted
  year: 1987
  title: 解除戒嚴
  category: politics
  importance: 5
  desc: 歷時三十八年的戒嚴結束，報禁、黨禁隨後陸續解除。
  sources:
    - title: 維基百科：臺灣省戒嚴令
      url: https://zh.wikipedia.org/wiki/臺灣省戒嚴令

- id: tw-tsmc
  year: 1987
  title: 台積電成立，開創晶圓代工模式
  category: science
  importance: 4
  desc: 只製造、不設計自有產品的分工，重塑了全球半導體產業的結構。
  sources:
    - title: 維基百科：台積電
      url: https://zh.wikipedia.org/wiki/台積電

- id: tw-national-theater
  year: 1987
  title: 國家兩廳院啟用
  category: culture
  importance: 2
  desc: 中正紀念堂園區內的國家戲劇院與國家音樂廳落成啟用，是台灣第一座國家級的專業表演場館，也是解嚴那一年完成的文化建設。兩廳院讓國際樂團、歌劇與舞團得以來台演出，也給雲門、表演工作坊等本地團體一個標準舞台；2004 年改制為行政法人，是台灣文化機構法人化的第一例。
  sources:
    - title: 維基百科：國家兩廳院
      url: https://zh.wikipedia.org/wiki/國家兩廳院

- id: tw-mainland-visits
  year: 1987
  title: 開放赴大陸探親，隔絕三十八年後的第一道門
  category: politics
  importance: 3
  desc: 解嚴後三個月，蔣經國宣布除現役軍人與公職人員外，民眾可經第三地赴大陸探親，紅十字會受理登記第一天就湧進上萬人。一九四九年隨軍來台的老兵四十年不能返鄉，前一年組成「外省人返鄉探親促進會」上街抗爭，是這項政策最直接的推力。探親打破「三不政策」的實際隔絕，隔年開始有台商赴大陸投資，兩岸的人員與資金往來自此再也關不回去。
  sources:
    - title: 維基百科：開放兩岸探親
      url: https://zh.wikipedia.org/wiki/開放兩岸探親

- id: tw-lee-succession
  year: 1988
  title: 蔣經國逝世，李登輝繼任總統，首位台籍元首
  category: politics
  importance: 5
  desc: 蔣經國病逝，副總統李登輝依憲法繼任，成為中華民國史上首位台灣本省籍國家元首，後續主導修憲與民主化進程。
  sources:
    - title: 維基百科：蔣經國
      url: https://zh.wikipedia.org/wiki/蔣經國
    - title: 維基百科：李登輝
      url: https://zh.wikipedia.org/wiki/李登輝

- id: tw-520-farmers
  year: 1988
  title: 五二〇農民運動，解嚴後第一場流血衝突
  category: economy
  importance: 3
  desc: 政府為與美國談判而準備開放水果與火雞進口，雲林農權會率數千農民北上，提出農保、肥料自由買賣、廢除水利會等七項訴求。遊行在立法院前與警方衝突，持續到隔日凌晨，百餘人受傷、九十餘人被捕，是解嚴後第一次激烈的警民衝突。此後農民健康保險提前全面開辦，農業在自由化下的處境也成為往後每次貿易談判的核心議題。
  sources:
    - title: 維基百科：1988年臺灣農民運動
      url: https://zh.wikipedia.org/wiki/1988年臺灣農民運動

- id: tw-snail-movement
  year: 1989
  title: 無殼蝸牛運動，五萬人夜宿忠孝東路
  category: economy
  importance: 3
  desc: 1987 年國有財產局標售華航總部旁土地創下天價，帶動全台房價在兩年內狂飆，所得卻沒有跟上。無住屋者團結組織在 8 月 26 日號召民眾夜宿台北市忠孝東路，到場約五萬人，是台灣第一次以都市議題為主的社會運動。運動催出了往後的住宅法制與社會住宅倡議，但房價所得比在此後三十多年裡只有更高 —— 這是少數訴求沒有隨解嚴一起被滿足的社會運動。
  sources:
    - title: 維基百科：無殼蝸牛運動
      url: https://zh.wikipedia.org/wiki/無殼蝸牛運動

- id: tw-cheng-nan-jung
  year: 1989
  title: 鄭南榕自焚，爭取百分之百的言論自由
  category: politics
  importance: 3
  desc: 《自由時代》週刊創辦人鄭南榕因刊登〈台灣共和國憲法草案〉被以叛亂罪傳訊，拒絕出庭，在雜誌社自囚七十一天，四月七日警方攻堅時引火自焚。他生前主張「爭取百分之百的言論自由」並公開支持台灣獨立；出殯當日詹益樺在總統府前跟著自焚。此後兩年內《懲治叛亂條例》廢止、刑法一百條修正，四月七日在 2016 年被訂為言論自由日。
  sources:
    - title: 維基百科：鄭南榕
      url: https://zh.wikipedia.org/wiki/鄭南榕

- id: tw-wild-lily
  year: 1990
  title: 野百合學運，要求國會全面改選
  category: politics
  importance: 4
  desc: 三月間數千名學生靜坐於中正紀念堂廣場，要求解散萬年國會、廢除臨時條款、召開國是會議。這是政府遷台以來最大規模的學生行動，李登輝接見學生代表並允諾改革 —— 次年終止動員戡亂、資深中央民代全數退職，訴求幾乎都兌現了。
  sources:
    - title: 維基百科：野百合學運
      url: https://zh.wikipedia.org/wiki/野百合學運

- id: tw-women-zhijian
  year: 1990
  title: 「我們之間」成立，台灣第一個同志團體
  category: culture
  importance: 3
  desc: 解嚴三年後，台灣第一個女同志組織「我們之間」成立。1993 年台大出現第一個相關的大學社團，同年立法委員召開公聽會討論反歧視與同性戀人權，多個團體聯合發表聲明；1998 年台灣同志諮詢熱線協會申請立案時，內政部以「同志宜尊重但不宜鼓勵」為由退件，靠持續行文抗爭才獲准。從一個沒有辦公室的小團體到 2019 年同婚立法，這條線走了二十九年。
  sources:
    - title: 維基百科：台灣LGBT權益
      url: https://zh.wikipedia.org/wiki/台灣LGBT權益

- id: tw-end-mobilization
  year: 1991
  title: 終止動員戡亂時期
  category: politics
  importance: 4
  desc: 李登輝宣告終止 1948 年起實施的動員戡亂時期，《動員戡亂時期臨時條款》廢止，總統的緊急權力回歸憲法，中華民國不再視中共為叛亂團體。同時廢止《懲治叛亂條例》、以第一次憲法增修條文為資深民代退職與國會全面改選鋪路。這是憲政體制從內戰狀態回到常態的分水嶺，也是台灣民主化在法律層面的起點。
  sources:
    - title: 維基百科：動員戡亂時期臨時條款
      url: https://zh.wikipedia.org/wiki/動員戡亂時期臨時條款

- id: tw-round-island-rail
  year: 1991
  title: 南迴線通車，環島鐵路網完成
  category: economy
  importance: 4
  desc: 距 1887 年動工已逾一世紀，鐵路終於繞行全島一周。
  sources:
    - title: 維基百科：南迴線
      url: https://zh.wikipedia.org/wiki/南迴線
    - title: 維基百科：臺灣鐵路
      url: https://zh.wikipedia.org/wiki/臺灣鐵路

- id: tw-senior-legislators-retire
  year: 1991
  title: 萬年國會終結，第一屆中央民代全部退職
  category: politics
  importance: 4
  desc: 1947 到 1948 年在大陸選出的第一屆國大代表、立法委員與監察委員，以「大陸淪陷無法改選」為由在台灣延任四十餘年，被稱為萬年國會。野百合學運後大法官作出釋字 261 號解釋，要求資深民代於 1991 年底全部退職；同年底選出第二屆國民大會，隔年底選出第二屆立法院，國會自此完全由台灣選出。這是憲政改革的第一步，總統直選與精省都在之後幾次修憲中接續完成。
  sources:
    - title: 維基百科：萬年國會
      url: https://zh.wikipedia.org/wiki/萬年國會

- id: tw-article-100
  year: 1992
  title: 刑法第一百條修正，言論不再構成內亂罪
  category: politics
  importance: 3
  desc: 舊刑法一百條把「意圖」顛覆政府就視為內亂罪，是戒嚴解除後仍能用來起訴台獨主張者的最後一部法律；前一年廢止《懲治叛亂條例》時，獨台會案仍以此條逮捕學生。學界與社運人士組成「一〇〇行動聯盟」靜坐抗爭，立法院五月修正條文，刪除「陰謀」內亂罪，只處罰以強暴脅迫著手實行者。海外黑名單人士得以返台，思想與言論的入罪至此在法律上終結。
  sources:
    - title: 維基百科：中華民國刑法第一百條
      url: https://zh.wikipedia.org/wiki/中華民國刑法第一百條

- id: tw-koo-wang-talks
  year: 1993
  title: 辜汪會談，兩岸分治後首次正式接觸
  category: politics
  importance: 3
  desc: 海基會董事長辜振甫與海協會會長汪道涵在新加坡會談，簽署文書查證、掛號函件等四項事務性協議。這是 1949 年以來兩岸授權代表的第一次正式會面，建立在前一年「九二共識」的模糊基礎上。1995 年李登輝訪美後會談中斷，1998 年在上海再舉行一次，之後原訂在台北的第三次始終沒有實現。
  sources:
    - title: 維基百科：辜汪會談
      url: https://zh.wikipedia.org/wiki/辜汪會談

- id: tw-indigenous-renaming
  year: 1994
  title: 憲法增修條文改稱「原住民」
  category: politics
  importance: 4
  desc: 沿用數十年的「山胞」正式改為「原住民」，1997 年再修為「原住民族」，承認其為集體的民族而非個別身分。名稱之爭表面上是用字，實際爭的是誰有權定義自己 —— 熟蕃、高砂族、山胞，歷來每個稱呼都是外來政權給的。
  sources:
    - title: 維基百科：中華民國憲法增修條文
      url: https://zh.wikipedia.org/wiki/中華民國憲法增修條文
    - title: 維基百科：臺灣原住民族運動
      url: https://zh.wikipedia.org/wiki/臺灣原住民族運動

- id: tw-education-reform-1994
  year: 1994
  title: 四一〇教改大遊行，教育鬆綁啟動
  category: culture
  importance: 3
  desc: 四月十日民間團體發起遊行，提出小班小校、廣設高中大學、教育現代化、制定教育基本法四大訴求，行政院隨即成立教育改革審議委員會，由李遠哲主持。此後十年是台灣教育變動最劇烈的階段：師資培育開放、教科書開放審定、大學從五十所增至一百六十餘所、2002 年廢除大學聯考改為多元入學。廣設大學帶來的學歷貶值與少子化下的退場問題，是教改至今最受爭議的遺產。
  sources:
    - title: 維基百科：臺灣教育改革
      url: https://zh.wikipedia.org/wiki/臺灣教育改革
    - title: 維基百科：大學聯合招生考試
      url: https://zh.wikipedia.org/wiki/大學聯合招生考試

- id: tw-national-health-insurance
  year: 1995
  title: 全民健康保險開辦
  category: politics
  importance: 4
  desc: 政府整合公保、勞保與農保，正式開辦「全民健康保險」，實施全體國民強制納保與社會保險制度。全民健保極大地提高了醫療覆蓋率與醫療平等，成為臺灣戰後最標誌性的社會福利制度。
  sources:
    - title: 維基百科：全民健康保險
      url: https://zh.wikipedia.org/wiki/全民健康保險

- id: tw-direct-election
  year: 1996
  title: 首次總統直選
  category: politics
  importance: 5
  desc: 第三次修憲決定總統由公民直選，三月二十三日在解放軍飛彈演習的陰影下投票，李登輝以 54% 當選，彭明敏、林洋港、陳履安分居其後。這是台灣人第一次直接選出國家元首，也是華人社會的第一次；此後每四年一次的大選成為政黨輪替與兩岸關係的主軸。
  sources:
    - title: 維基百科：1996年中華民國總統選舉
      url: https://zh.wikipedia.org/wiki/1996年中華民國總統選舉

- id: tw-taipei-mrt
  year: 1996
  title: 臺北捷運木柵線通車，臺灣首條捷運
  category: economy
  importance: 3
  desc: 臺北捷運木柵線（今文湖線）正式通車營運，為臺灣第一條大眾捷運系統（MRT）。捷運系統的興建重塑了臺北都會區的交通習慣、土地開發與公共運輸網絡。
  sources:
    - title: 維基百科：臺北捷運
      url: https://zh.wikipedia.org/wiki/臺北捷運

- id: tw-missile-crisis
  year: 1996
  title: 台海飛彈危機，美國航艦戰鬥群進入海峽
  category: war
  importance: 4
  desc: 李登輝 1995 年訪問美國母校康乃爾大學，中華人民共和國視為走向獨立，自當年七月起在台灣外海試射飛彈、舉行登陸演習，1996 年三月總統選舉前夕更把彈著區設在基隆與高雄外海。美國派出兩個航空母艦戰鬥群到台灣附近，是越戰以來在亞洲最大的軍力部署。危機沒有阻止選舉，李登輝以過半票數當選；但它讓台灣的第一次總統直選從此與海峽安全綁在一起。
  sources:
    - title: 維基百科：台灣海峽飛彈危機
      url: https://zh.wikipedia.org/wiki/台灣海峽飛彈危機

- id: tw-province-downsized
  year: 1998
  title: 精省，台灣省政府虛級化
  category: politics
  importance: 3
  desc: 1997 年第四次修憲凍結省長與省議會選舉，隔年台灣省政府改為行政院派出機關，人員與業務移交中央或縣市。省與中央的轄區重疊近九成，1994 年宋楚瑜當選唯一一任民選省長後這個「葉爾欽效應」更加明顯；精省一方面是行政效率，一方面也是憲政體制往「以台灣為範圍」調整的一步。省級機關的實體業務到 2019 年全部結束。
  sources:
    - title: 維基百科：臺灣省政府功能業務與組織調整
      url: https://zh.wikipedia.org/wiki/臺灣省政府功能業務與組織調整

- id: tw-921-earthquake
  year: 1999
  title: 921 大地震
  category: culture
  importance: 4
  desc: 9 月 21 日凌晨車籠埔斷層錯動，芮氏規模 7.3，地表破裂帶長達八十五公里，二千四百餘人罹難、五萬餘戶房屋全倒。這是戰後台灣傷亡最重的天災，此後建築耐震規範全面翻修，也促成防災體系的重建。
  sources:
    - title: 維基百科：921大地震
      url: https://zh.wikipedia.org/wiki/921大地震

