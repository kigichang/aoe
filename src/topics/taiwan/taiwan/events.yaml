- id: tw-bank-of-taiwan
  year: 1899
  title: 臺灣銀行成立，發行臺灣銀行券
  category: economy
  importance: 4
  desc: 臺灣銀行作為日治時期的中央與商業銀行成立，發行獨立貨幣「臺灣銀行券」。臺灣銀行的創立統一了全臺貨幣與金融體系，為殖民地產業、交通建設與貿易提供資金支撐。
  sources:
    - title: 維基百科：臺灣銀行
      url: https://zh.wikipedia.org/wiki/臺灣銀行
    - title: 維基百科：臺灣銀行券
      url: https://zh.wikipedia.org/wiki/臺灣銀行券

- id: tw-taiwan-sugar
  year: 1900
  title: 臺灣製糖株式會社成立，新式糖業起步
  category: economy
  importance: 3
  desc: 三井財閥在總督府扶植下成立臺灣製糖株式會社，隔年在橋仔頭建成台灣第一座新式機械糖廠。總督府隨後以原料採取區域制把蔗農綁在指定糖廠，日本資本的糖廠在十年內增至十餘座，糖取代茶成為台灣最大宗出口品，到 1930 年代年產二十餘億斤。「第一憨，種甘蔗給會社磅」這句俗諺說的就是這個體制：蔗農沒有議價權，1925 年的二林事件正是由此而起。
  sources:
    - title: 維基百科：臺灣製糖
      url: https://zh.wikipedia.org/wiki/臺灣製糖

- id: tw-monopoly-bureau
  year: 1901
  title: 專賣局成立，鴉片、樟腦、食鹽收歸官營
  category: economy
  importance: 4
  desc: 總督府把先後開辦的鴉片（1897）、食鹽與樟腦（1899）三項專賣合併由專賣局經營，此後再加入菸草（1905）與酒（1922）。專賣收入長期佔歲入的三成到五成，是殖民地財政自立的關鍵；其中鴉片採「漸禁」而非嚴禁，靠特許牌照收稅，既是財政成就也是道德代價。這套機構戰後由臺灣省專賣局、公賣局一路承接下來。
  sources:
    - title: 維基百科：臺灣總督府專賣局
      url: https://zh.wikipedia.org/wiki/臺灣總督府專賣局

- id: tw-armed-resistance-crushed
  year: 1902
  title: 武裝抗日勢力大致肅清
  category: war
  importance: 3
  desc: 據總督府自身的統計，統治前八年約三萬二千人遭殺害，超過當時總人口的百分之一。此後漢人抗日沉寂約五年。
  sources:
    - title: 維基百科：臺灣日治時期
      url: https://zh.wikipedia.org/wiki/臺灣日治時期

- id: tw-census
  year: 1905
  title: 首次戶口普查，人口約三百萬
  category: economy
  importance: 3
  sources:
    - title: 維基百科：臨時臺灣戶口調查
      url: https://zh.wikipedia.org/wiki/臨時臺灣戶口調查

- id: tw-rihan-policy
  year: 1905
  title: 理蕃政策與隘勇線推進
  category: politics
  importance: 3
  desc: 總督府為控有高山山林與樟腦資源，大規模實施「理蕃政策」並推進行政與軍事的「隘勇線」。透過武力封鎖與討伐戰事，強行將高山原住民部落與山地納入殖民統治網絡。
  sources:
    - title: 維基百科：理蕃政策
      url: https://zh.wikipedia.org/wiki/理蕃政策
    - title: 維基百科：隘勇
      url: https://zh.wikipedia.org/wiki/隘勇

- id: tw-meishan-quake
  year: 1906
  title: 梅山大地震，嘉義一帶死亡逾一千二百人
  category: politics
  importance: 2
  desc: 3 月 17 日清晨梅山斷層錯動，規模 7.1，嘉義、斗六、鹽水港一帶房屋倒塌六千餘間，至少 1258 人罹難。震後嘉義市街依市區改正重建成棋盤格局，也促成總督府增設測候所 —— 台灣的地震測報，是被這一場與 1935 年新竹台中大地震先後推出來的。
  sources:
    - title: 維基百科：1906年梅山地震
      url: https://zh.wikipedia.org/wiki/1906年梅山地震

- id: tw-beipu-incident
  year: 1907
  title: 北埔事件，蔡清琳率眾襲擊日警
  category: war
  importance: 2
  desc: 新竹北埔的蔡清琳以「復中興」為名號召隘勇與賽夏族人，十一月襲擊北埔支廳與各隘勇監督所，殺日籍官民五十餘人。總督府迅速鎮壓，蔡清琳被賽夏族人所殺，餘眾多遭處死。這是 1902 年武裝抗日勢力大致肅清之後，第一起再度爆發的漢人武裝反抗，開啟了苗栗事件、西來庵事件這一波以秘密結社為底的抗日。
  sources:
    - title: 維基百科：北埔事件
      url: https://zh.wikipedia.org/wiki/北埔事件

- id: tw-trunk-railway
  year: 1908
  title: 縱貫鐵路全線通車
  category: economy
  importance: 4
  desc: 基隆到高雄一日可達，西部平原自此連成一個市場。
  sources:
    - title: 維基百科：縱貫線 (鐵路)
      url: https://zh.wikipedia.org/wiki/縱貫線_(鐵路)

- id: tw-miaoli-incident
  year: 1913
  title: 苗栗事件，羅福星等抗日組織遭破獲
  category: war
  importance: 3
  desc: 曾參加辛亥革命的羅福星以同盟會名義回台秘密招募黨員，計畫以苗栗為據點起事，1913 年底事洩被捕。總督府把同一時期台中、南投、台南等地另外四起密謀併案，隔年二月在苗栗設臨時法庭集中審判，判死刑二十人，羅福星在台北刑務所處絞。辛亥革命成功後中國對台灣知識分子的號召力在這裡第一次具體顯現，而總督府的處置也讓武裝抗日走到尾聲，兩年後的西來庵是最後一次。
  sources:
    - title: 維基百科：苗栗事件
      url: https://zh.wikipedia.org/wiki/苗栗事件

- id: tw-truku-war
  year: 1914
  title: 太魯閣戰爭，二十世紀台灣本島最大的戰役
  category: war
  importance: 3
  desc: 總督佐久間左馬太自 1910 年起推動「五年理蕃計畫」，以武力把隘勇線推進到山地深處，最後的目標是東部的太魯閣族。1914 年五月到八月，日軍與警察約兩萬人分東西兩路夾攻，對手是總人口不到萬人的太魯閣各部落；佐久間本人在戰場墜崖負傷，隔年去世。太魯閣族戰敗後被強制遷往山腳，槍枝全數沒收，山地全面納入警察駐在所的管理。五年理蕃計畫至此結束，往後的理蕃轉向「教化」，直到 1930 年霧社事件證明那套教化的底下是什麼。
  sources:
    - title: 維基百科：太魯閣戰爭
      url: https://zh.wikipedia.org/wiki/太魯閣戰爭

- id: tw-xilaian
  year: 1915
  title: 西來庵事件，最後一次大規模武裝抗日
  category: war
  importance: 4
  desc: 余清芳以台南西來庵為據點，藉齋教信仰與符咒號召，宣稱建立「大明慈悲國」，聯合羅俊、江定在噍吧哖（今台南玉井）起事，襲擊南庄派出所後遭日軍圍剿。事後被判死刑者八百六十六人，實際處決九十五人，其餘因大正天皇即位減刑，是日治時期判刑最重的一案；日軍在噍吧哖一帶的報復性屠殺，民間估計死者數以千計。此後漢人的武裝抗日結束，反抗轉入政治與文化運動。
  sources:
    - title: 維基百科：西來庵事件
      url: https://zh.wikipedia.org/wiki/西來庵事件

- id: tw-dafen-incident
  year: 1915
  title: 大分事件，布農族襲擊駐在所
  category: war
  importance: 2
  desc: 總督府在山地沒收原住民的槍枝，斷了布農族的狩獵生計。花蓮玉里郡大分的布農族人在拉荷阿雷兄弟率領下襲擊大分駐在所，殺警察十二人。此後拉荷阿雷退入荖濃溪上游的玉穗社，以游擊方式對抗近二十年，是台灣原住民抗日最持久的一支，直到 1933 年才與日方「和解」。它與同年的西來庵事件一在山地、一在平地，說明武裝反抗在漢人社會結束之後，山地還持續了很久。
  sources:
    - title: 維基百科：大分事件
      url: https://zh.wikipedia.org/wiki/大分事件

- id: tw-civilian-governor
  year: 1919
  title: 首任文官總督，推行內地延長主義
  category: politics
  importance: 4
  sources:
    - title: 維基百科：田健治郎
      url: https://zh.wikipedia.org/wiki/田健治郎
    - title: 維基百科：臺灣總督
      url: https://zh.wikipedia.org/wiki/臺灣總督

- id: tw-education-rescript
  year: 1919
  title: 頒布《臺灣教育令》，殖民地教育體系定型
  category: culture
  importance: 3
  desc: 第一次《臺灣教育令》把台灣人的普通教育、實業教育、專門教育與師範教育整套規定下來，但與在台日本人的學校系統分立，年限與課程都不同。1922 年的第二次教育令改採「內台共學」，名義上取消差別，實際上以日語能力作為入學門檻，結果仍是分流。中等以上學校台灣人名額長期偏低，醫學與農林之外的路很窄 —— 這是日治時期台灣人專業階層以醫師為主的制度原因。
  sources:
    - title: 維基百科：臺灣教育令
      url: https://zh.wikipedia.org/wiki/臺灣教育令

- id: tw-admin-reform-1920
  year: 1920
  title: 地方制度改正，五州二廳；地名雅化
  category: politics
  importance: 4
  desc: 今日臺灣的行政區界大致在此確立，此後變動極少。打狗改高雄、枋橋改板橋、噍吧哖改玉井，多數新地名沿用至今。
  sources:
    - title: 維基百科：町名改正
      url: https://zh.wikipedia.org/wiki/町名改正
    - title: 維基百科：臺灣日治時期
      url: https://zh.wikipedia.org/wiki/臺灣日治時期

- id: tw-general-history
  year: 1920
  title: 連橫《臺灣通史》出版
  category: culture
  importance: 3
  desc: 連橫以傳統紀傳體寫成的台灣史著，1920 年出上中冊、翌年出下冊，在台北大稻埕自設發行所。這是台灣人第一次替自己的島寫一部通史 —— 在此之前的台灣記載都出自方志、遊記或殖民者的調查報告，敘事的主體從來不是島上的人。書中史料考訂的疏漏後來屢遭學界指出，但它在殖民統治下宣告「台灣有自己的歷史」這件事，分量不在考據。
  sources:
    - title: 維基百科：臺灣通史
      url: https://zh.wikipedia.org/wiki/臺灣通史

- id: tw-shinminkai
  year: 1920
  title: 新民會成立、《臺灣青年》創刊，政治運動從東京起步
  category: politics
  importance: 3
  desc: 在東京的台灣留學生以林獻堂為會長組成新民會，是日治時期台灣人第一個政治運動團體，同年七月創刊《臺灣青年》雜誌，鼓吹民族自決與白話文。留學生在日本看到大正民主與民族自決的風潮，把「以合法手段爭取台灣人權利」帶回島內：新民會催生了隔年的議會設置請願運動與台灣文化協會，《臺灣青年》幾經改名後成為《臺灣民報》。武裝抗日結束五年後，台灣人的抵抗以另一種形式重新開始。
  sources:
    - title: 維基百科：新民會 (臺灣)
      url: https://zh.wikipedia.org/wiki/新民會_(臺灣)

- id: tw-cultural-association
  year: 1921
  title: 台灣文化協會成立
  category: culture
  importance: 4
  desc: 蔣渭水、林獻堂等人在台北成立台灣文化協會，以讀報社、文化講演、夏季學校、文化劇與電影巡迴放映向大眾啟蒙，會員以醫師、教師、地主為主，是日治時期最大的社會文化團體。抗爭手段從武裝轉向文化啟蒙與議會請願。1927 年左右派分裂：連溫卿、王敏川的左派掌握協會轉向階級路線，蔣渭水等舊幹部另組台灣民眾黨，林獻堂一系再分出地方自治聯盟。分裂後的協會受台共影響，1931 年隨大搜捕而瓦解。
  sources:
    - title: 維基百科：臺灣文化協會
      url: https://zh.wikipedia.org/wiki/臺灣文化協會

- id: tw-parliament-petition
  year: 1921
  title: 臺灣議會設置請願運動
  category: politics
  importance: 4
  endYear: 1934
  desc: 十四年間十五次向帝國議會請願，要求設置由臺灣人選出的議會。1923 年當局以治警事件大舉搜捕，運動終未成事。
  sources:
    - title: 維基百科：臺灣議會設置請願運動
      url: https://zh.wikipedia.org/wiki/臺灣議會設置請願運動
    - title: 維基百科：治警事件
      url: https://zh.wikipedia.org/wiki/治警事件

- id: tw-coast-line
  year: 1922
  title: 海線通車，取代山線成為縱貫線主線
  category: economy
  importance: 3
  desc: 竹南經清水到彰化的新線，避開山線的坡度限制。中部西岸的沿海市街隨之發展起來。
  sources:
    - title: 維基百科：海岸線 (臺鐵)
      url: https://zh.wikipedia.org/wiki/海岸線_(臺鐵)
    - title: 維基百科：縱貫線 (鐵路)
      url: https://zh.wikipedia.org/wiki/縱貫線_(鐵路)

- id: tw-taiwan-minpao
  year: 1923
  title: 《臺灣民報》創刊，臺灣人的唯一言論機關
  category: culture
  importance: 3
  desc: 蔣渭水、蔡培火等於東京創辦《臺灣民報》（前身為《臺灣青年》與《臺灣》），後獲准回臺發行。作為日治時期臺灣人唯一自治的言論機關，積極宣揚民主思想、漢文白話文與啟蒙運動。
  sources:
    - title: 維基百科：臺灣民報
      url: https://zh.wikipedia.org/wiki/臺灣民報

- id: tw-zhijiing-incident
  year: 1923
  title: 治警事件，蔣渭水等政治領袖遭逮捕
  category: politics
  importance: 4
  desc: 蔣渭水、蔡培火等成立「臺灣議會期成同盟會」，總督府以違反《治安警察法》發動全臺大搜捕，起訴十八名政治運動領袖。治警事件引發全臺與日本國內輿論關注，成為日治政治運動的重要里程碑。
  sources:
    - title: 維基百科：治警事件
      url: https://zh.wikipedia.org/wiki/治警事件
    - title: 維基百科：蔣渭水
      url: https://zh.wikipedia.org/wiki/蔣渭水

- id: tw-yilan-line
  year: 1924
  title: 宜蘭線全線通車
  category: economy
  importance: 3
  desc: 1917 年動工，因經費不足而延宕。蘭陽平原首次以公共運輸與台北相連。
  sources:
    - title: 維基百科：宜蘭線
      url: https://zh.wikipedia.org/wiki/宜蘭線

- id: tw-new-old-literature-debate
  year: 1924
  title: 新舊文學論戰，張我軍砲打舊詩壇
  category: culture
  importance: 3
  desc: 在北京親歷五四文學革命的張我軍，在《臺灣民報》發表〈致台灣青年的一封信〉與〈糟糕的台灣文學界〉，痛批島內詩社擊缽吟詩、附庸風雅，主張以白話文寫台灣的現實。古典文人連橫等人撰文反擊，論戰持續兩三年，白話文與新文學自此站穩腳跟，賴和、楊逵這一代作家隨之登場。1930 年黃石輝、郭秋生再掀起台灣話文論戰，主張用漢字寫台語，「該用哪一種語言寫台灣」的問題從此一直延續到戰後。
  sources:
    - title: 維基百科：臺灣日治時期新舊文學論戰
      url: https://zh.wikipedia.org/wiki/臺灣日治時期新舊文學論戰

- id: tw-erlin-incident
  year: 1925
  title: 二林事件，蔗農第一次集體對抗糖廠
  category: economy
  importance: 3
  desc: 彰化二林的蔗農不滿林本源製糖收購價低於鄰近糖廠、秤量又不透明，在李應章醫師等人協助下組成蔗農組合，要求先公布價格再採收。十月糖廠強行收割，蔗農與前來護衛的警察衝突，九十餘人被捕、二十餘人判刑。這是台灣第一起有組織的農民運動，直接催生了隔年的臺灣農民組合，也讓文化協會的啟蒙路線開始往階級問題傾斜。
  sources:
    - title: 維基百科：二林事件
      url: https://zh.wikipedia.org/wiki/二林事件

- id: tw-taitung-line
  year: 1926
  title: 台東線花蓮—台東通車
  category: economy
  importance: 3
  desc: 花東縱谷南北貫通。但軌距與西部不同，要到 1982 年拓寬後列車才能從台北直駛台東。
  sources:
    - title: 維基百科：臺東線
      url: https://zh.wikipedia.org/wiki/臺東線

- id: tw-horai-rice
  year: 1926
  title: 蓬萊米命名問世，臺灣農業重大轉型
  category: science
  importance: 4
  desc: 磯永吉與末永仁在臺試種日本稻成功，1926 年總督伊澤多喜男正式命名為「蓬萊米」。蓬萊米口感符合日本市場需求且產量大增，成功取代在地在來米，成為臺灣外銷日本的核心農產品與農業現代化代表。
  sources:
    - title: 維基百科：蓬萊米
      url: https://zh.wikipedia.org/wiki/蓬萊米
    - title: 維基百科：磯永吉
      url: https://zh.wikipedia.org/wiki/磯永吉

- id: tw-farmers-union
  year: 1926
  title: 臺灣農民組合成立，農民運動全島化
  category: politics
  importance: 3
  desc: 二林事件之後，鳳山的簡吉把各地為了土地與蔗價而起的農民組合整合成全島性的臺灣農民組合，兩年內支部遍及二十餘處、會員兩萬多人，是日治時期規模最大的社會運動團體，抗爭對象從糖廠擴及退職官員承墾與竹林放領。1927 年文化協會左傾後兩者合流，農組也逐漸受台灣共產黨影響；1929 年總督府發動「二一二大檢舉」全島搜捕，農組被迫轉入地下，簡吉入獄。戰後他再度投入農運，1951 年死於白色恐怖。
  sources:
    - title: 維基百科：臺灣農民組合
      url: https://zh.wikipedia.org/wiki/臺灣農民組合

- id: tw-peoples-party
  year: 1927
  title: 臺灣民眾黨成立，首個近代政黨
  category: politics
  importance: 3
  desc: 文化協會左右分裂後，舊幹部另組民眾黨。1931 年遭總督府以結社禁止令解散。
  sources:
    - title: 維基百科：臺灣民眾黨 (1927年)
      url: https://zh.wikipedia.org/wiki/臺灣民眾黨_(1927年)

- id: tw-taihoku-imperial-univ
  year: 1928
  title: 臺北帝國大學創立
  category: culture
  importance: 4
  desc: 台灣第一所大學，戰後改制為台灣大學。
  sources:
    - title: 維基百科：臺北帝國大學
      url: https://zh.wikipedia.org/wiki/臺北帝國大學

- id: tw-taiwan-communist-party
  year: 1928
  title: 台灣共產黨在上海成立
  category: politics
  importance: 3
  desc: 謝雪紅、林木順等人在共產國際指導下於上海法租界成立「日本共產黨台灣民族支部」，綱領裡首次提出台灣民族與台灣獨立的主張。返台後台共透過農民組合與文化協會擴大影響，並主導工運。1931 年總督府大舉搜捕，全黨瓦解，前後只存在三年多；但它留下的組織與人脈在戰後重新浮現，謝雪紅在二二八事件中組織二七部隊，多位舊黨員在白色恐怖中被處決。
  sources:
    - title: 維基百科：台灣共產黨
      url: https://zh.wikipedia.org/wiki/台灣共產黨

- id: tw-jianan-canal
  year: 1930
  title: 嘉南大圳完工
  category: economy
  importance: 4
  desc: 灌溉嘉南平原十五萬甲農地，稻米與甘蔗產量大增。
  sources:
    - title: 維基百科：嘉南大圳
      url: https://zh.wikipedia.org/wiki/嘉南大圳
    - title: 維基百科：八田與一
      url: https://zh.wikipedia.org/wiki/八田與一

- id: tw-wushe
  year: 1930
  title: 霧社事件
  category: war
  importance: 5
  sources:
    - title: 維基百科：霧社事件
      url: https://zh.wikipedia.org/wiki/霧社事件

- id: tw-local-autonomy-league
  year: 1930
  title: 臺灣地方自治聯盟成立，合法路線的最後一個團體
  category: politics
  importance: 2
  desc: 民眾黨轉趨激進後，楊肇嘉、林獻堂等溫和派另組地方自治聯盟，只提一項訴求：地方議會由民選產生。它是日治時期台灣人最後一個獲准活動的政治團體 —— 民眾黨隔年即被解散，農組與台共已遭肅清。1935 年總督府開放半數州市街庄議員民選，算是對這個訴求的部分回應；聯盟在 1937 年中日開戰後自行解散，台灣人的政治運動至此全面停擺，直到戰後。
  sources:
    - title: 維基百科：臺灣地方自治聯盟
      url: https://zh.wikipedia.org/wiki/臺灣地方自治聯盟

- id: tw-sunmoonlake-power
  year: 1934
  title: 日月潭水力發電所完工
  category: economy
  importance: 4
  desc: 1919 年動工，數度停工復工，歷十五年建成。十萬千瓦的電力是臺灣由農業轉向工業化的基礎。
  sources:
    - title: 維基百科：日月潭水力電氣工事
      url: https://zh.wikipedia.org/wiki/日月潭水力電氣工事
    - title: 維基百科：大觀發電廠
      url: https://zh.wikipedia.org/wiki/大觀發電廠

- id: tw-atom-splitting
  year: 1934
  title: 台北帝大完成亞洲第一次人工撞擊原子核
  category: science
  importance: 3
  desc: 台北帝國大學首任物理學講座教授荒勝文策帶領團隊自建考克饒夫—瓦耳頓型直線加速器，成功以人工方式擊破鋰原子核，是繼劍橋卡文迪西實驗室之後世界第二例、亞洲第一例。這件事發生在一個被當成農業殖民地經營的島上，距離帝大創校只有六年。荒勝 1936 年轉任京都帝大，戰後其研究室的迴旋加速器遭盟軍總部拆除，實驗紀錄與儀器大量流失。
  sources:
    - title: 維基百科：荒勝文策
      url: https://zh.wikipedia.org/wiki/荒勝文策
    - title: 維基百科：臺北帝國大學
      url: https://zh.wikipedia.org/wiki/臺北帝國大學

- id: tw-literary-alliance
  year: 1934
  title: 臺灣文藝聯盟成立，政治運動轉進文學
  category: culture
  importance: 2
  desc: 政治運動被壓制之後，全島各路作家在台中集結成立臺灣文藝聯盟，發行《臺灣文藝》，是日治時期最大的文學組織，賴和、張深切、楊逵、呂赫若都在其中。隔年楊逵因路線分歧出走，另辦《臺灣新文學》；1937 年總督府禁止報刊漢文欄，兩份刊物相繼停刊。文學在這幾年承接了政治運動的能量，也是日治時期台灣人用日文與漢文並行寫作最活躍的一段。
  sources:
    - title: 維基百科：臺灣文藝聯盟
      url: https://zh.wikipedia.org/wiki/臺灣文藝聯盟

- id: tw-formosan-classification
  year: 1935
  title: 《台灣高砂族系統所屬之研究》確立九族分類
  category: culture
  importance: 3
  desc: 台北帝大的移川子之藏與宮本延人、馬淵東一以系譜與口傳調查寫成，把原住民分成九族。1898 年伊能嘉矩已提出「四群八族十一部」，這一份才成為定本 —— 戰後中華民國政府直接沿用，「九族」進了教科書與觀光地名，用了超過六十年。代價是被歸併進去的族群沒有自己的名字：邵、噶瑪蘭、太魯閣、撒奇萊雅、賽德克後來一個個要靠正名把自己從別族名下拆出來，2001 年起才陸續恢復。學術分類一旦被政府採用，就成了誰存在、誰不存在的行政事實。
  sources:
    - title: 維基百科：移川子之藏
      url: https://zh.wikipedia.org/wiki/移川子之藏
    - title: 維基百科：臺灣原住民族
      url: https://zh.wikipedia.org/wiki/臺灣原住民族

- id: tw-1935-earthquake
  year: 1935
  title: 新竹—台中大地震，台灣傷亡最慘重的天災
  category: politics
  importance: 4
  desc: 4 月 21 日清晨規模 7.1 的地震，震央在大安溪中游，新竹州與台中州死亡 3276 人、受傷 12053 人，房屋全倒近一萬八千戶。這是台灣有紀錄以來傷亡最慘重的自然災害，至今仍未被超越 —— 一九九九年的 921 地震死亡兩千四百餘人。總督府設震災地復興委員會推動重建，並陸續在新竹、大武、新港、宜蘭設立地震觀測站，台灣的地震觀測網從這場災難之後才真正鋪開。
  sources:
    - title: 維基百科：1935年新竹-台中地震
      url: https://zh.wikipedia.org/wiki/1935年新竹-台中地震

- id: tw-first-election
  year: 1935
  title: 首次地方選舉
  category: politics
  importance: 4
  desc: 臺灣史上第一次選舉，選出半數的市會及街庄協議會員，另一半仍為官派；選舉權另有年齡、納稅額與性別的限制。
  sources:
    - title: 維基百科：1935年臺灣市會及街庄協議會員選舉
      url: https://zh.wikipedia.org/wiki/1935年臺灣市會及街庄協議會員選舉

- id: tw-expo-1935
  year: 1935
  title: 始政四十周年記念臺灣博覽會
  category: culture
  importance: 3
  desc: 總督府為展示日治四十年的現代化建設成果，於臺北及全臺各地舉辦大型博覽會。五十日展期吸引三百萬人次參觀，展示近代產業、交通、衛生與都市計畫成就，為日治時期規模最大的文化展覽。
  sources:
    - title: 維基百科：始政四十周年記念臺灣博覽會
      url: https://zh.wikipedia.org/wiki/始政四十周年記念臺灣博覽會

- id: tw-kominka
  year: 1937
  title: 進入皇民化時期
  category: culture
  importance: 4
  desc: 中日開戰後總督府全面推動皇民化：廢止報紙漢文欄、禁止使用台語與傳統戲曲、推行國語家庭、整理寺廟並鼓勵改信神道、1940 年開放改日本姓名。武官總督自 1936 年復設，台灣被定位為南進基地，工業化與軍需生產同步推進。皇民化到 1941 年成立皇民奉公會、1942 年實施志願兵而達到頂點，八年間改變了一整代台灣人的語言與認同。
  endYear: 1945
  sources:
    - title: 維基百科：皇民化運動
      url: https://zh.wikipedia.org/wiki/皇民化運動

- id: tw-kominka-hokokai
  year: 1941
  title: 皇民奉公會成立，全島動員體制
  category: politics
  importance: 3
  desc: 比照日本內地的大政翼贊會，總督府成立皇民奉公會，總督任總裁，從州廳到街庄部落逐級設支部，把全島居民納入戰時動員網。前一年已開放改日本姓名，這一年起又有奉公壯年團、青年團、產業奉公，隔年實施志願兵。皇民化從「鼓勵」變成「組織」，是日治末期統治最深入日常生活的一步；奉公會在 1945 年六月解散，只留下國民義勇隊準備本土決戰。
  sources:
    - title: 維基百科：皇民奉公會
      url: https://zh.wikipedia.org/wiki/皇民奉公會

- id: tw-takasago-volunteers
  year: 1942
  endYear: 1943
  title: 高砂義勇隊派赴南洋
  category: war
  importance: 3
  desc: 日軍看上原住民的叢林能力，在志願兵制度正式實施之前就先徵調原住民成軍，1942 至 1943 年間分七梯次約四千人送往菲律賓與新幾內亞，擔任開路、搬運與偵察。估計三千餘人戰死，執行特攻任務的「薰空挺隊」全軍覆沒。霧社事件之後被當成統治難題的那批人，十二年後成了帝國最倚重的叢林部隊；戰後他們既不算日本人也未獲任何補償，直到 1974 年阿美族的史尼育唔（中村輝夫）在印尼叢林被尋獲、仍以為戰爭沒有結束，這段歷史才重新被提起。
  sources:
    - title: 維基百科：高砂義勇隊
      url: https://zh.wikipedia.org/wiki/高砂義勇隊
    - title: 維基百科：臺灣原住民族
      url: https://zh.wikipedia.org/wiki/臺灣原住民族

- id: tw-volunteer-soldiers
  year: 1942
  title: 實施陸軍特別志願兵，臺灣人投入戰場
  category: war
  importance: 3
  desc: 太平洋戰爭擴大後，1943 年增設海軍特別志願兵，1945 年全面實施徵兵制。
  sources:
    - title: 維基百科：台籍日本兵
      url: https://zh.wikipedia.org/wiki/台籍日本兵
    - title: 維基百科：臺灣日治時期
      url: https://zh.wikipedia.org/wiki/臺灣日治時期

- id: tw-compulsory-education
  year: 1943
  title: 實施六年義務教育，就學率突破七成
  category: culture
  importance: 3
  desc: 1941 年小學校、公學校與蕃人公學校一律改稱國民學校，1943 年起實施六年制義務教育，台灣人學齡兒童就學率升到七成以上。時機並非偶然 —— 這是戰時動員的一環，義務教育與皇民化、志願兵制度是同一套政策的不同面向。戰後中華民國政府接手這套國民學校體制，直到 1968 年才延長為九年。
  sources:
    - title: 維基百科：國民學校
      url: https://zh.wikipedia.org/wiki/國民學校
    - title: 維基百科：臺灣教育令
      url: https://zh.wikipedia.org/wiki/臺灣教育令

- id: tw-cairo-declaration
  year: 1943
  title: 開羅宣言，聲明台灣戰後歸還中華民國
  category: politics
  importance: 4
  desc: 羅斯福、蔣中正、邱吉爾會於開羅，會後公報聲明日本竊取自中國的領土（含台灣、澎湖）應歸還中華民國。這份文件是兩年後接收台灣的依據，其法律效力與地位至今仍是台灣主權論辯的核心爭點之一。
  sources:
    - title: 維基百科：開羅宣言
      url: https://zh.wikipedia.org/wiki/開羅宣言

- id: tw-allied-bombing
  year: 1944
  title: 盟軍空襲臺灣，農工生產崩跌
  category: war
  importance: 3
  endYear: 1945
  desc: 二十五次大空襲。到 1945 年，農業產值只剩 1937 年的一半，工業產值不到三分之一。
  sources:
    - title: 維基百科：臺北大空襲
      url: https://zh.wikipedia.org/wiki/臺北大空襲
    - title: 維基百科：臺灣日治時期
      url: https://zh.wikipedia.org/wiki/臺灣日治時期

- id: tw-retrocession
  year: 1945
  title: 日本投降，中華民國接收台灣
  category: politics
