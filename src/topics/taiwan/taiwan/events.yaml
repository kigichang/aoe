- id: tw-87-flood
  year: 1959
  title: 八七水災，中南部戰後最慘重的水患
  category: economy
  importance: 3
  desc: 八月七日起熱帶低壓帶來連日豪雨，濁水溪、大肚溪、八掌溪同時氾濫，苗栗到台南十三縣市受災，死亡與失蹤逾千人、房屋全倒兩萬七千餘戶，是戰後台灣死亡人數僅次於九二一地震的天災。政府隨後開徵「水災復興建設捐」重建堤防與農田，美援也投入救災；這場水災促成日後的河川整治與石門、曾文等水庫工程加速推動。
  sources:
    - title: 維基百科：八七水災
      url: https://zh.wikipedia.org/wiki/八七水災

- id: tw-lei-chen
  year: 1960
  title: 雷震案，《自由中國》停刊
  category: politics
  importance: 3
  desc: 雷震籌組「中國民主黨」，以叛亂罪判刑十年，發行近十一年的《自由中國》隨之停刊。那是 1950 年代檯面上幾乎唯一的異議聲音 —— 反對黨的嘗試自此中斷二十六年，直到 1986 年民進黨成立。
  sources:
