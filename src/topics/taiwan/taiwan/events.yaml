- id: tw-hongye-baseball
  year: 1968
  title: 紅葉少棒擊敗日本明星隊，棒球熱席捲全島
  category: culture
  importance: 3
  desc: 台東延平鄉紅葉國小的球隊以 7 比 0 擊敗來訪的日本關西少棒明星隊，全島轟動，隔年組成的金龍少棒隊遠征美國威廉波特奪下世界冠軍，開啟三級棒球的年代。紅葉的傳奇後來被查出以超齡與冒名球員參賽，教練等三人遭判刑 —— 這支球隊來自不足百人的偏遠山區小學，湊不出合乎資格的名單。棒球在外交處境急轉直下的七〇年代成了少數能讓台灣被看見的場域，這一點與紀錄上的瑕疵同樣是這段熱潮的一部分。
  sources:
    - title: 維基百科：紅葉少棒隊
      url: https://zh.wikipedia.org/wiki/紅葉少棒隊
    - title: 維基百科：金龍少棒隊
      url: https://zh.wikipedia.org/wiki/金龍少棒隊

- id: tw-nine-year-education
  year: 1968
  title: 實施九年國民義務教育
  category: culture
  importance: 3
  desc: 義務教育從六年延長為九年，國小畢業生免試進入國民中學，廢除持續二十年的初中入學考試。政策由蔣中正一年內拍板，全台一年內新設或改制國中四百餘所，教師嚴重不足；但升學壓力自此後移到高中聯考，國民教育普及則為 1970 年代的工業化提供了勞動力。
  sources:
    - title: 維基百科：九年國民義務教育
      url: https://zh.wikipedia.org/wiki/九年國民義務教育

- id: tw-bo-yang-case
  year: 1968
  title: 柏楊因翻譯《大力水手》漫畫入獄
  category: culture
  importance: 2
  desc: 作家柏楊翻譯美國漫畫《大力水手》，其中父子流落荒島競選總統的對白被當局認定影射蔣氏父子，以「共諜」罪名判刑十二年，關押於綠島。他在獄中寫成《中國人史綱》，出獄後以《醜陋的中國人》聞名。此案是文字獄在戒嚴時期的典型：定罪不需要證據，只需要解讀。
  sources:
