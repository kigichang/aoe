  sources:
    - title: 維基百科：臺灣光復
      url: https://zh.wikipedia.org/wiki/臺灣光復

- id: tw-taipei-air-raid
  year: 1945
  title: 臺北大空襲，總督府中彈
  category: war
  importance: 3
  desc: 五月三十一日美軍第五航空隊出動百餘架轟炸機，對台北投彈三百餘噸，總督府、台北車站、龍山寺、台大醫院等皆遭命中，市區死亡約一千七百人，是台北史上最大規模的空襲。自 1944 年十月起到戰爭結束，全台空襲死亡五千餘人、罹災近二十八萬人。這場空襲在戰後長期不見於教科書，直到近年才重新被記憶。
  sources:
    - title: 維基百科：臺北大空襲
      url: https://zh.wikipedia.org/wiki/臺北大空襲

- id: tw-228
  year: 1947
  title: 二二八事件
  category: politics
