- id: tw-pelosi-visit
  year: 2022
  title: 裴洛西訪台，解放軍環台軍演
  category: politics
  importance: 3
  desc: 美國眾議院議長裴洛西八月二日抵台，是 1997 年以來訪台層級最高的美國官員。中華人民共和國隨即在台灣周邊六個海域進行實彈演習，飛彈飛越台灣上空、落入日本專屬經濟海域，並中斷多項對美對話。這次軍演把「跨越海峽中線」變成常態，台海此後被視為亞洲最危險的引爆點之一。
  sources:
    - title: 維基百科：南西·裴洛西訪問台灣
      url: https://zh.wikipedia.org/wiki/南西·裴洛西訪問台灣

- id: tw-2024-election
  year: 2024
  title: 賴清德當選總統，同一政黨首次三連任
  category: politics
  importance: 3
  desc: 民進黨的賴清德以四成得票在三組人馬中勝出，是總統直選以來第一次有政黨連續執政第三任；但立法院沒有任何一黨過半，台灣民眾黨成為關鍵少數。此後行政與立法的對立持續升高，2025 年爆發大規模罷免立委的投票，是直選三十年來首次朝小野大局面下的全面對抗。
