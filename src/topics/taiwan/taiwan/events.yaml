      url: https://zh.wikipedia.org/wiki/自由中國_(雜誌)

- id: tw-modern-literature-magazine
  year: 1960
  title: 白先勇等創辦《現代文學》
  category: culture
  importance: 2
  desc: 台大外文系學生白先勇、王文興、陳若曦、歐陽子等人創辦《現代文學》雜誌，系統譯介卡夫卡、喬伊斯、吳爾芙，並發表自己的小說。白先勇的《台北人》、王文興的《家變》都在這裡起步，現代主義小說自此成為 1960 年代台灣文學的主流，與紀弦一代的現代詩前後呼應。雜誌斷續出到 1984 年，共七十三期，是 1977 年鄉土文學論戰中被批評為「西化」的那一方。
  sources:
    - title: 維基百科：現代文學 (雜誌)
      url: https://zh.wikipedia.org/wiki/現代文學_(雜誌)

- id: tw-ttv
  year: 1962
  title: 台灣電視公司開播，進入電視時代
  category: culture
  importance: 3
  desc: 台灣第一家電視台，10 月 10 日開播，成立時由台灣省營機構與日本四家電視相關企業合資。其後中視（1969）、華視（1971）相繼開播，三家的股權分別握在省政府、中國國民黨與國防部及教育部手上，這個「老三台」格局維持了三十年 —— 在只有三個頻道且全部由黨政軍持股的年代，電視同時是新的大眾娛樂與最有效的宣傳工具。
  sources:
    - title: 維基百科：臺灣電視公司
      url: https://zh.wikipedia.org/wiki/臺灣電視公司

- id: tw-golden-horse
  year: 1962
  title: 金馬獎創辦，華語電影最早的獎項
  category: culture
  importance: 2
  desc: 行政院新聞局為獎勵國語片而創辦金馬獎，名稱取自金門、馬祖，寓意前線。初期只評國語片、帶有政策色彩，1990 年代起改由民間影人主辦、開放所有華語電影參賽，逐漸成為兩岸三地與海外華語電影共同的最高榮譽。它與台語片的興衰是同一時期的兩面：政府扶植國語片的同時，年產百部的台語片在 1970 年代消失。
  sources:
    - title: 維基百科：金馬獎
      url: https://zh.wikipedia.org/wiki/金馬獎

- id: tw-self-salvation-declaration
  year: 1964
  title: 彭明敏師生印製《台灣自救運動宣言》被捕
  category: politics
  importance: 3
  desc: 台大政治系教授彭明敏與學生魏廷朝、謝聰敏印製宣言，主張「一個中國、一個台灣」已是事實，反攻大陸不可能，應制定新憲法、以新國家身分加入聯合國。傳單尚未散發三人即被捕，彭明敏判八年，後獲特赦軟禁，1970 年化裝逃出台灣。這是戒嚴時期島內知識分子第一次公開提出台灣獨立的政治綱領，宣言被海外台獨運動翻成英文登在《紐約時報》，彭明敏本人在 1996 年成為首次總統直選的候選人。
  sources:
    - title: 維基百科：台灣自救運動宣言
      url: https://zh.wikipedia.org/wiki/台灣自救運動宣言

- id: tw-cultural-renaissance
  year: 1966
  title: 中華文化復興運動，與對岸文革分庭抗禮
  category: culture
  importance: 4
  desc: 對岸文化大革命展開的同一年，孫科、王雲五、陳立夫等一千五百人聯名建議發起中華文化復興運動，隔年成立推行委員會、蔣中正親任會長，訂國父誕辰為中華文化復興節。動機是宣示中華民國才是正統中華文化的代表 —— 兩岸在同一個時間點上，一邊拆廟砸碑、一邊修廟編書，做的其實是同一件事的兩面：用文化證明自己的正當性。代價是台灣本土的語言與民間文化被壓到檯面下，原住民族的文化傳承也在這套一元的文化政策裡斷了層。
  sources:
    - title: 維基百科：中華文化復興運動
      url: https://zh.wikipedia.org/wiki/中華文化復興運動

- id: tw-kaohsiung-epz
