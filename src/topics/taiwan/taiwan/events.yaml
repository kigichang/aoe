      url: https://zh.wikipedia.org/wiki/台灣話文論戰

- id: tw-zhongli-incident
  year: 1977
  title: 中壢事件，群眾火燒分局抗議作票
  category: politics
  importance: 3
  desc: 桃園縣長選舉開票時，中壢一處投開票所的監選主任被指控塗污選票，群眾包圍中壢分局，入夜後搗毀警車、放火燒分局，警方開槍打死兩名青年。脫黨參選的許信良最後高票當選。這是戒嚴以來第一次自發的大規模街頭抗議，也是黨外運動從選舉走向街頭的起點，兩年後的美麗島事件直接接續它。
  sources:
    - title: 維基百科：中壢事件
