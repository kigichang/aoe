# 主題定義。一個主題 = 一份獨立的資料集 + 一個網址。
#
# 目錄名（world）就是網址的路徑：/world/。
#
# 2026-08-02 到 2026-08-28 之間這個主題掛在根網址（root: true）。改成台灣史
# 掛根網址的那天站還沒正式上線，所以不必顧舊的分享連結；日後不要再換回來，
# 換一次就是讓一批連結失效。

# 只填主題名，不要帶站名 —— 標題列會自動組成「AoE · 世界史」，
# 主題切換清單則只印這個名字。分頁標題同樣自動組（要覆寫就填 title）。
name: 世界史
description: 把不同地區放在同一條時間軸上，看同一個年代各自在發生什麼。

# 主題切換清單的排序。沒填的排在後面，所以新增主題時記得一併給號碼。
# 2026-08-28 起排在台灣三個主題（經濟史／政治史／鐵道史）之後。
order: 5

# 欄位在這個主題裡叫什麼。用在篩選群組、搜尋結果的命中欄位標示、說明文字。
columnLabel: 地區

# 開場縮放（px/年）。1.0 是實測出來的：0.6 時有一半事件擠不下標籤只剩圓點，
# 1.0 降到 31%，讀得到的標題從 112 變 155。代價是一屏從 1167 年變 700 年，
# 仍看得到「秦漢對上羅馬」。詳見 CLAUDE.md 標籤排版那節。
defaultPpy: 1

# 工具列的年代跳轉按鈕。刻意愈近代愈密（前2000 到 1 之間跨四千年只放四顆，
# 1500 之後五百年放三顆）—— 資料密度就是那樣，平均切只會讓近代那段跳不準。
jumps: [-2000, -1000, -500, 1, 500, 1000, 1500, 1800, 1950]
