  desc: 財政破產與三級會議召開觸發民怨，攻陷巴士底獄後革命迅速激進化，廢除封建特權、頒布《人權宣言》，國王路易十六終被送上斷頭台；舊制度崩解，「自由、平等、博愛」的理念自此傳遍歐洲，也開啟了長達數十年的動盪與戰爭。
  sources:
    - title: 維基百科：法國大革命
      url: https://zh.wikipedia.org/wiki/法國大革命

- id: me-egypt-napoleon
