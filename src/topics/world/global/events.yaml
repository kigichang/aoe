  title: 蘇伊士運河危機
  category: war
  importance: 4
  desc: 埃及將運河收歸國有，英法出兵奪回卻在美蘇雙重壓力下撤軍，象徵英法傳統殖民強權的終結與美蘇兩強主導中東局勢的開始。
  sources:
    - title: 維基百科：第二次中東戰爭
