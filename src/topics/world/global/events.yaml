  category: war
  importance: 4
  endYear: 1975
  desc: 東京灣事件後美國國會授權總統擴大軍事行動，數十萬美軍投入這場代理人戰爭；1975年西貢淪陷，是美國自建國以來首次戰爭失利。
  sources:
    - title: 維基百科：越南戰爭
      url: https://zh.wikipedia.org/wiki/越南戰爭
