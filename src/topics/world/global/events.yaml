      url: https://zh.wikipedia.org/wiki/法蘭西第五共和國

- id: me-egypt-aswan-dam
  year: 1960
  endYear: 1970
  title: 阿斯旺高壩興建
  category: economy
  importance: 3
  desc: 蘇伊士運河危機後西方撤資，蘇聯出資協助興建阿斯旺高壩，攔蓄尼羅河水以擴大灌溉並發電，但也淹沒努比亞古蹟與大量農地；這是納賽爾時代最具代表性的建設，也是冷戰時期蘇聯拉攏埃及的象徵。
  sources:
    - title: 維基百科：阿斯旺水壩
      url: https://zh.wikipedia.org/wiki/阿斯旺水壩

- id: am-cuban-missile-crisis
  year: 1962
  title: 古巴飛彈危機
  category: politics
  importance: 5
  desc: 美國發現蘇聯在古巴部署核彈頭飛彈，甘迺迪下令海上封鎖並公開對峙，雙方一度瀕臨核戰邊緣，最終蘇聯同意撤彈、美國則暗中承諾撤除土耳其的飛彈才化解危機；這是冷戰期間美蘇最接近直接核武衝突的一次對峙。
  sources:
    - title: 維基百科：古巴導彈危機
      url: https://zh.wikipedia.org/wiki/古巴導彈危機

- id: am-jfk-assassination
  year: 1963
  title: 甘迺迪遇刺
  category: politics
  importance: 4
  desc: 甘迺迪總統在德州達拉斯遇刺身亡，兇手身分與動機至今仍有陰謀論爭議，副總統詹森隨即繼任；這起事件震撼全美社會，也常被視為戰後美國社會信任崩解的起點之一。
  sources:
    - title: 維基百科：約翰·F·甘迺迪遇刺案
      url: https://zh.wikipedia.org/wiki/約翰·F·甘迺迪遇刺案

- id: am-civil-rights-act
  year: 1964
  title: 民權法案通過，種族隔離制度終結
  category: politics
  importance: 4
  desc: 金恩博士領導的非暴力抗爭與民權運動促成國會立法，禁止依種族、膚色、宗教或性別的公共場所歧視，正式終結吉姆·克勞法時代的種族隔離制度。
  sources:
    - title: 維基百科：1964年民權法案
      url: https://zh.wikipedia.org/wiki/1964年民權法案

- id: am-vietnam-war
  year: 1964
