- id: eu-may-1968
  year: 1968
  title: 五月風暴
  category: politics
  importance: 4
  desc: 學生占領大學校園抗議教育體制與社會保守氛圍，工人隨後響應發動全國大罷工，一度癱瘓法國經濟、動搖戴高樂政府；雖未能立即改朝換代，卻深刻改變法國的社會文化與勞動權益，也啟發了同時期全球各地的學生運動。
  sources:
    - title: 維基百科：五月風暴
      url: https://zh.wikipedia.org/wiki/五月風暴

