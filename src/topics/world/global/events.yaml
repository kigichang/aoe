  category: politics
  importance: 4
  desc: 傑佛遜總統以低價向拿破崙的法國買下密西西比河以西的廣大領土，國土面積一舉倍增，也讓法國徹底退出北美大陸的角逐。
  sources:
    - title: 維基百科：路易斯安那購地
      url: https://zh.wikipedia.org/wiki/路易斯安那購地

- id: eu-napoleon
  year: 1804
  title: 拿破崙稱帝
  category: politics
  importance: 5
  desc: 拿破崙以公投確認終身執政後加冕稱帝，建立法蘭西第一帝國；他隨後席捲歐陸大部分地區、輸出《拿破崙法典》重塑歐洲的法律體系，卻在1812年遠征俄羅斯慘敗，1815年滑鐵盧一役徹底終結其統治。
  sources:
    - title: 維基百科：拿破崙一世
      url: https://zh.wikipedia.org/wiki/拿破崙一世

- id: am-haiti
