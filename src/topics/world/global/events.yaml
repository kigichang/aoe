  category: war
  importance: 4
  endYear: 1830
  desc: 希臘人反抗鄂圖曼統治爆發起義，英法俄三國介入、在納瓦里諾海戰重創鄂圖曼艦隊，1830年倫敦議定書承認希臘獨立，結束近四百年的鄂圖曼統治，是十九世紀歐洲民族主義浪潮的先聲。
