  category: politics
  importance: 4
  desc: 阿爾巴尼亞裔軍官穆罕默德·阿里趁鄂圖曼與馬木留克勢力真空崛起掌權，隨後屠殺殘餘馬木留克貴族，推行軍事與經濟現代化；他建立的王朝統治埃及直到1952年被推翻。
  sources:
    - title: 維基百科：穆罕默德·阿里
      url: https://zh.wikipedia.org/wiki/穆罕默德·阿里

- id: eu-hre-dissolution
  year: 1806
