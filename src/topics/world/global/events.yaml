  category: politics
  importance: 4
  desc: 突尼西亞茉莉花革命引發連鎖效應，開羅解放廣場爆發大規模示威，執政近三十年的穆巴拉克在十八天後辭職下台；埃及其後歷經穆爾西當選、軍事政變與塞西掌權，是「阿拉伯之春」中規模最大、對區域政局影響最深遠的一場革命。
  sources:
