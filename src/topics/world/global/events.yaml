  title: 拿破崙遠征埃及
  category: war
  importance: 4
  endYear: 1801
  desc: 隨軍學者發現羅塞塔石碑，日後成為破解古埃及象形文字的關鍵；這場遠征也讓埃及第一次直接暴露在歐洲列強的競逐之下。
  sources:
    - title: 英文維基百科：French invasion of Egypt and Syria
      url: https://en.wikipedia.org/wiki/French_invasion_of_Egypt_and_Syria

- id: am-louisiana-purchase
