- id: eu-fifth-republic
  year: 1958
  title: 戴高樂建立法蘭西第五共和
  category: politics
  importance: 4
  desc: 阿爾及利亞獨立戰爭引爆的政治危機讓第四共和瀕臨崩潰，戴高樂在軍方支持下復出，主導制定賦予總統更大實權的新憲法，建立至今仍在運作的第五共和；阿爾及利亞其後於1962年獨立，法國也逐步結束大部分殖民統治。
  sources:
    - title: 維基百科：夏爾·戴高樂
      url: https://zh.wikipedia.org/wiki/夏爾·戴高樂
