- id: me-egypt-six-day-war
  year: 1967
  title: 六日戰爭，埃及失去西奈半島
  category: war
  importance: 4
  desc: 埃及、敘利亞與約旦聯手備戰，以色列先發制人，在六天內重創三國軍隊並占領西奈半島、加薩走廊、約旦河西岸與戈蘭高地；埃及的慘敗重挫納賽爾的威望，也埋下六年後贖罪日戰爭的遠因。
  sources:
    - title: 維基百科：第三次中東戰爭
