  category: politics
  importance: 4
  desc: 史上唯一由奴隸起義建立的國家，也是拉丁美洲第一個獨立國。
  sources:
    - title: 維基百科：海地革命
      url: https://zh.wikipedia.org/wiki/海地革命

- id: me-egypt-muhammad-ali
