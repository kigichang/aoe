  year: 1628
  title: 西班牙築聖多明哥城，據淡水
  category: politics
  importance: 3
  desc: 佔領雞籠兩年後西進淡水。1637 年菲律賓當局為節省開支自行毀城，北臺防務空虛，終招來荷蘭進攻。
  sources:
