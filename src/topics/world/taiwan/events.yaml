- id: tw-takasago-summons
  year: 1593
  title: 豐臣秀吉遣使招諭「高山國」
  category: politics
  importance: 3
  desc: 豐臣秀吉派家臣原田孫七郎攜文書前來，要求台灣向日本納貢。日本古籍稱台灣為高砂或高山國，語源與高雄的舊稱「打狗」有關。文書送不出去 —— 島上沒有可以接收國書的政權，使者找不到對象。1616 年德川家康再派村山等安率船隊來台，途中遇風浪只有三艘抵達北部，登陸的一兩百人被原住民包圍而死。日本對台灣的興趣比荷蘭與西班牙更早，但兩次都停在「找不到談判對手」這一關。
  sources:
    - title: 維基百科：高砂 (臺灣古名)
      url: https://zh.wikipedia.org/wiki/高砂_(臺灣古名)
    - title: 維基百科：豐臣秀吉
      url: https://zh.wikipedia.org/wiki/豐臣秀吉

- id: tw-dongfan-ji
  year: 1603
  title: 陳第著《東番記》，最早的台灣實地紀錄
  category: culture
  importance: 3
  desc: 沈有容率明軍到台灣西南沿海剿倭時，福州連江人陳第隨行，回去後寫成這篇一千四百餘字的雜記。它記下西拉雅人的母系社會、服飾、飲食、建築、狩獵與貿易，是現存最早由漢人親自到台灣實地採訪留下的文獻 —— 在此之前的中文記載都是隔海轉述。這一篇之後，台灣才開始有具體的樣子，而不只是史書上一個位置不明的島名。
  sources:
    - title: 維基百科：東番記
      url: https://zh.wikipedia.org/wiki/東番記
    - title: 維基百科：沈有容
      url: https://zh.wikipedia.org/wiki/沈有容

- id: tw-yan-siqi
  year: 1621
  title: 顏思齊、鄭芝龍入北港
  category: economy
  importance: 3
  desc: 武裝海商顏思齊率鄭芝龍等人在北港一帶登岸，把台灣當成走私與劫掠的基地。顏思齊 1625 年病故後鄭芝龍接手，其後受明朝招撫、成為福建沿海最大的海上勢力，也把大批閩南饑民載來台灣開墾。這條線一路連到 1661 年 —— 鄭成功來台的資本、船隊與人脈，都是從父親這個海商集團承接下來的。
  sources:
    - title: 維基百科：顏思齊
      url: https://zh.wikipedia.org/wiki/顏思齊
    - title: 維基百科：鄭芝龍
      url: https://zh.wikipedia.org/wiki/鄭芝龍

