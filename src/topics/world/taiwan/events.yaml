  category: politics
  importance: 5
  sources:
    - title: 維基百科：福建臺灣省
      url: https://zh.wikipedia.org/wiki/福建臺灣省
    - title: 維基百科：劉銘傳
      url: https://zh.wikipedia.org/wiki/劉銘傳

- id: tw-railway-bureau-qing
