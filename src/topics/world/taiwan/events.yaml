- id: tw-rover-incident
  year: 1867
  title: 羅發號事件，李仙得與卓杞篤締結南岬之盟
  category: politics
  importance: 4
  desc: 美國商船羅發號於恆春遇難，船員登陸後遭原住民殺害。美軍派兵登陸攻擊未果，駐廈門領事李仙得隨後與排灣族十八社總頭目卓杞篤談判，簽署《南岬之盟》保護遇難外國船員，為臺灣原住民與外國簽署的首份國際協議。
  sources:
