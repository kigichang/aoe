- id: tw-nativist-literature-debate
  year: 1977
  endYear: 1978
  title: 鄉土文學論戰
  category: culture
  importance: 3
  desc: 表面上爭的是文學該不該寫台灣的現實社會，實際上是戰後第一次把政治、經濟與社會處境攤開來吵的總檢驗。一方主張文學要回到農民與勞工的真實生活，另一方指其為工農兵文藝、影射左傾，在戒嚴體制下這種指控隨時可能變成刑責。論戰沒有結論，但此後本土題材不再是次要的，1980 年代的新電影與本土意識都接在這條線上。1930 年代日治時期也有過一場性質相近的台灣話文論戰，兩次隔了四十年。
  sources:
