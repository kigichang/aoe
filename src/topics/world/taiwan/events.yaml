      url: https://zh.wikipedia.org/wiki/雷震_(1897年)
    - title: 維基百科：自由中國 (雜誌)
      url: https://zh.wikipedia.org/wiki/自由中國_(雜誌)

- id: tw-ttv
  year: 1962
  title: 台灣電視公司開播，進入電視時代
  category: culture
  importance: 3
  desc: 台灣第一家電視台，10 月 10 日開播，成立時由台灣省營機構與日本四家電視相關企業合資。其後中視（1969）、華視（1971）相繼開播，三家的股權分別握在省政府、中國國民黨與國防部及教育部手上，這個「老三台」格局維持了三十年 —— 在只有三個頻道且全部由黨政軍持股的年代，電視同時是新的大眾娛樂與最有效的宣傳工具。
  sources:
    - title: 維基百科：臺灣電視公司
      url: https://zh.wikipedia.org/wiki/臺灣電視公司

- id: tw-cultural-renaissance
  year: 1966
  title: 中華文化復興運動，與對岸文革分庭抗禮
  category: culture
  importance: 4
  desc: 對岸文化大革命展開的同一年，孫科、王雲五、陳立夫等一千五百人聯名建議發起中華文化復興運動，隔年成立推行委員會、蔣中正親任會長，訂國父誕辰為中華文化復興節。動機是宣示中華民國才是正統中華文化的代表 —— 兩岸在同一個時間點上，一邊拆廟砸碑、一邊修廟編書，做的其實是同一件事的兩面：用文化證明自己的正當性。代價是台灣本土的語言與民間文化被壓到檯面下，原住民族的文化傳承也在這套一元的文化政策裡斷了層。
  sources:
    - title: 維基百科：中華文化復興運動
      url: https://zh.wikipedia.org/wiki/中華文化復興運動

