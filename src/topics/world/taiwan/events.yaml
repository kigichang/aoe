  title: 「我們之間」成立，台灣第一個同志團體
  category: culture
  importance: 3
  desc: 解嚴三年後，台灣第一個女同志組織「我們之間」成立。1993 年台大出現第一個相關的大學社團，同年立法委員召開公聽會討論反歧視與同性戀人權，多個團體聯合發表聲明；1998 年台灣同志諮詢熱線協會申請立案時，內政部以「同志宜尊重但不宜鼓勵」為由退件，靠持續行文抗爭才獲准。從一個沒有辦公室的小團體到 2019 年同婚立法，這條線走了二十九年。
