- id: tw-indigenous-basic-law
  year: 2005
  title: 原住民族基本法公布
  category: politics
  importance: 3
  desc: 確立原住民族的自治、土地與自然資源權利，並明定在原住民族地區的開發行為須經部落諮商同意。同年將 8 月 1 日訂為原住民族日，紀念 1994 年的正名。法律架構立起來了，落實的爭議至今未停。
