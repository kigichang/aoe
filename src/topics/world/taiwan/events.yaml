- id: tw-snail-movement
  year: 1989
  title: 無殼蝸牛運動，五萬人夜宿忠孝東路
  category: economy
  importance: 3
  desc: 1987 年國有財產局標售華航總部旁土地創下天價，帶動全台房價在兩年內狂飆，所得卻沒有跟上。無住屋者團結組織在 8 月 26 日號召民眾夜宿台北市忠孝東路，到場約五萬人，是台灣第一次以都市議題為主的社會運動。運動催出了往後的住宅法制與社會住宅倡議，但房價所得比在此後三十多年裡只有更高 —— 這是少數訴求沒有隨解嚴一起被滿足的社會運動。
