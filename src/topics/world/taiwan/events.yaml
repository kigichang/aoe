- id: tw-zheng-jing
  year: 1662
  title: 鄭成功歿，鄭經繼位
  category: politics
  importance: 3
  desc: 鄭成功接收台灣後五個月即病逝，年僅三十八。明鄭二十一年的江山，其中十九年是鄭經在治 —— 他行陳永華之議屯田興學、通商日本與英國，也在 1674 年響應三藩之亂西征閩粵，耗盡實力而返。
  sources:
    - title: 維基百科：鄭經
      url: https://zh.wikipedia.org/wiki/鄭經
    - title: 維基百科：鄭成功
      url: https://zh.wikipedia.org/wiki/鄭成功

- id: tw-dongning-regime
  year: 1664
  title: 鄭經改東都為東寧，升天興萬年為州
  category: politics
  importance: 3
  desc: 鄭經退守台灣後，改「東都」為「東寧」，升天興、萬年二縣為州，劃分行政區劃並設澎湖安撫司。東寧成為明鄭統治體制的核心，並以「東寧國」或「東寧王」之名開展外交與貿易。
  sources:
    - title: 維基百科：東寧_(臺灣古名)
      url: https://zh.wikipedia.org/wiki/東寧_(臺灣古名)
    - title: 維基百科：臺灣明鄭時期
      url: https://zh.wikipedia.org/wiki/臺灣明鄭時期

