- id: tw-dutch-leave-keelung
  year: 1668
  title: 荷蘭放棄雞籠，徹底退出臺灣
  category: politics
  importance: 3
  desc: 失去南部後，荷蘭於 1664 年重佔雞籠。但補給困難、與清朝的貿易也無進展，四年後撤回巴達維亞。
  sources:
