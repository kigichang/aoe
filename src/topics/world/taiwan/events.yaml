- id: tw-admin-reform-1920
  year: 1920
  title: 地方制度改正，五州二廳；地名雅化
  category: politics
  importance: 4
  desc: 今日臺灣的行政區界大致在此確立，此後變動極少。打狗改高雄、枋橋改板橋、噍吧哖改玉井，多數新地名沿用至今。
  sources:
