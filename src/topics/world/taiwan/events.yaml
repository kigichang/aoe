  desc: 雷震籌組「中國民主黨」，以叛亂罪判刑十年，發行近十一年的《自由中國》隨之停刊。那是 1950 年代檯面上幾乎唯一的異議聲音 —— 反對黨的嘗試自此中斷二十六年，直到 1986 年民進黨成立。
