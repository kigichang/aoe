  year: 1723
  title: 增設彰化縣與淡水廳，行政北擴
  category: politics
  importance: 3
  desc: 朱一貴事件後，朝廷採藍鼎元之議分割幅員過廣的諸羅縣。漢人拓墾的重心自此正式北移。
  sources:
    - title: 維基百科：彰化縣 (清朝)
      url: https://zh.wikipedia.org/wiki/彰化縣_(清朝)
    - title: 維基百科：淡水廳
