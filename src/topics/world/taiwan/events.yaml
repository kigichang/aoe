      url: https://zh.wikipedia.org/wiki/西拉雅族

- id: tw-sinkang-school
  year: 1636
  title: 新港社設校，以羅馬字書寫西拉雅語
  category: culture
  importance: 4
  desc: 臺灣史上第一所學校。傳教士用拉丁字母拼寫原住民語言，所留下的契約文書即新港文書，直到十九世紀仍在使用。
  sources:
    - title: 維基百科：新港文書
      url: https://zh.wikipedia.org/wiki/新港文書
    - title: 維基百科：臺灣荷蘭統治時期
      url: https://zh.wikipedia.org/wiki/臺灣荷蘭統治時期

- id: tw-deerskin-trade
  year: 1637
  title: 鹿皮出口達十五萬張
  category: economy
  importance: 3
  desc: 漢人引進陷阱後產量大增，鹿皮主要銷往日本製甲冑。濫捕使鹿群銳減，1640 年起一度全面禁獵。
  sources:
    - title: 維基百科：臺灣梅花鹿
      url: https://zh.wikipedia.org/wiki/臺灣梅花鹿
    - title: 維基百科：臺灣荷蘭統治時期
      url: https://zh.wikipedia.org/wiki/臺灣荷蘭統治時期

- id: tw-dutch-expel-spanish
  year: 1642
  title: 荷蘭驅逐西班牙人
  category: war
  importance: 4
  sources:
    - title: 維基百科：西班牙統治時期 (台灣)
      url: https://zh.wikipedia.org/wiki/西班牙統治時期_(台灣)

- id: tw-pacht
  year: 1644
  title: 贌社，村社交易權公開招標
  category: economy
  importance: 3
  desc: 荷蘭人把各原住民村社的交易權公開標售，得標商人獨佔該社所有買賣，以鹽、鐵鍋、布疋換取鹿皮鹿肉再轉售。「贌」是荷語 pacht 的台語音譯。清治延續此制而改以社餉徵稅，直到 1737 年乾隆稅制改革才逐漸消失 —— 一套荷蘭的承包制在台灣運作了近百年。
  sources:
    - title: 維基百科：贌社
      url: https://zh.wikipedia.org/wiki/贌社

- id: tw-middag-kingdom
  year: 1645
  title: 大肚王國與荷蘭締約
  category: politics
  importance: 3
  desc: 中部跨部落的政治聯盟。荷蘭打通南北陸路時遭其攻擊，翌年進兵後締約，但大肚王仍保有相當自主，連年貢都獲豁免。
  sources:
    - title: 維基百科：大肚王國
      url: https://zh.wikipedia.org/wiki/大肚王國
    - title: 維基百科：臺灣荷蘭統治時期
