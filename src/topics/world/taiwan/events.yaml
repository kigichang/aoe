  title: 台北帝大完成亞洲第一次人工撞擊原子核
  category: science
  importance: 3
  desc: 台北帝國大學首任物理學講座教授荒勝文策帶領團隊自建考克饒夫—瓦耳頓型直線加速器，成功以人工方式擊破鋰原子核，是繼劍橋卡文迪西實驗室之後世界第二例、亞洲第一例。這件事發生在一個被當成農業殖民地經營的島上，距離帝大創校只有六年。荒勝 1936 年轉任京都帝大，戰後其研究室的迴旋加速器遭盟軍總部拆除，實驗紀錄與儀器大量流失。
