  title: 921 大地震
  category: culture
  importance: 4
  desc: 9 月 21 日凌晨車籠埔斷層錯動，芮氏規模 7.3，地表破裂帶長達八十五公里，二千四百餘人罹難、五萬餘戶房屋全倒。這是戰後台灣傷亡最重的天災，此後建築耐震規範全面翻修，也促成防災體系的重建。
