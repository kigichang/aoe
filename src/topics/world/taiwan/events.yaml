- id: tw-crossing-ban
  year: 1684
  title: 渡臺禁令，限制赴臺與攜眷
  category: politics
  importance: 3
  endYear: 1875
  desc: 意在防止臺灣再成為反抗基地。政策時緊時鬆，卻造成長期男女比例失衡與遊民問題，直到 1875 年才全面解除。
  sources:
