- id: tw-nationality-deadline
  year: 1897
  title: 住民去就決定日，台灣人被自動變成日本國民
  category: politics
  importance: 4
  desc: 《馬關條約》給了台灣住民兩年的猶豫期，1897 年 5 月 8 日是最後期限 —— 這一天之前離開的仍是大清子民，沒有離開的依「台灣人民國籍處分辦法」自動成為日本國民。實際離開的以官紳與商人為主，佔全島人口極小的比例，絕大多數人不是選擇留下，而是根本無處可去。台灣人的國籍第一次由一紙條約決定，而做決定的兩個政府都不在這座島上。
  sources:
    - title: 維基百科：住民去就決定日
      url: https://zh.wikipedia.org/wiki/住民去就決定日

- id: tw-goto
  year: 1898
  title: 後藤新平任民政長官，展開殖民地經營
  category: politics
  importance: 4
  desc: 以調查與統計為基礎推動土地、戶口、度量衡與衛生制度。
  sources:
    - title: 維基百科：後藤新平
      url: https://zh.wikipedia.org/wiki/後藤新平

- id: tw-land-survey
  year: 1898
  endYear: 1905
  title: 土地調查事業，一塊地只留一個業主
  category: economy
  importance: 4
  desc: 逐筆丈量全島田園、清查清代以來未曾課稅的隱田，並以公債買斷大租權，終結一田二主的舊慣。課稅面積增為原本的兩倍多，地租收入跟著大幅躍升，成為總督府 1905 年財政獨立的第一根柱子；土地也第一次可以抵押與買賣，後來的糖業擴張與大型水利工程都建立在這個基礎上。
  sources:
    - title: 維基百科：土地調查事業
      url: https://zh.wikipedia.org/wiki/土地調查事業
    - title: 維基百科：一田二主
      url: https://zh.wikipedia.org/wiki/一田二主

- id: tw-public-school
  year: 1898
  title: 公學校開辦，台灣人的初等教育體系成形
  category: culture
  importance: 3
  desc: 總督府把各地國語傳習所改制為公學校，收台灣本島人子弟；在台日本人另讀小學校，原住民另讀蕃人公學校，一開始就是三軌並行。就學率從個位數逐年爬升，1941 年改制國民學校、1943 年實施義務教育之後突破七成。這是台灣識字率與日語普及的主要管道，也是差別待遇最具體的地方 —— 同一個島上三種學校、三套課程。
  sources:
    - title: 維基百科：公學校
      url: https://zh.wikipedia.org/wiki/公學校

