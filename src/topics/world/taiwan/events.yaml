- id: tw-tuntian
  year: 1661
  title: 實施軍屯制，奠定漢人拓墾基礎
  category: economy
  importance: 4
  desc: 鄭成功抵台後為解決糧食危機頒布屯田令，實施軍屯制度。官兵文封田、武屯墾，分駐中南部各地，此即今日新營、左營、柳營、前鎮等軍營地名的由來。軍屯奠定了台灣漢人開墾與聚落分布的基礎。
  sources:
    - title: 維基百科：臺灣明鄭時期
      url: https://zh.wikipedia.org/wiki/臺灣明鄭時期
    - title: 維基百科：屯田制
      url: https://zh.wikipedia.org/wiki/屯田制

- id: tw-qianjie
  year: 1661
  title: 清朝實施遷界令，封鎖明鄭經濟
  category: politics
  importance: 3
  endYear: 1684
  desc: 清朝為斷絕沿海居民對明鄭的物資支援，嚴令山東至廣東沿海居民內遷三十里並毀棄村莊。遷界令使沿海經濟受創，但也迫使明鄭轉向與日本、英國及東南亞展開國際走私與跨境貿易。
  sources:
    - title: 維基百科：遷界令
      url: https://zh.wikipedia.org/wiki/遷界令
    - title: 維基百科：臺灣明鄭時期
      url: https://zh.wikipedia.org/wiki/臺灣明鄭時期

