- id: tw-zheng-british-treaty
  year: 1670
  title: 英國東印度公司與明鄭締結通商條約
  category: economy
  importance: 4
  desc: 明鄭與英國東印度公司簽署《鄭英通商條約》，英商於安平設置商館，為臺灣史上首次與歐美強權建立正式貿易關係。明鄭出口蔗糖與鹿皮，換取英方的火砲、彈藥與洋貨。
  sources:
    - title: 維基百科：鄭英通商
      url: https://zh.wikipedia.org/wiki/鄭英通商
    - title: 維基百科：臺灣明鄭時期
      url: https://zh.wikipedia.org/wiki/臺灣明鄭時期

- id: tw-sanfan-zheng
  year: 1674
  title: 響應三藩之亂，鄭經率軍西征閩粵
  category: war
  importance: 4
  endYear: 1680
  desc: 靖南王耿精忠於福建響應三藩之亂，邀請鄭經出兵。鄭經率主力西征反清，一度攻佔泉州、漳州、潮州等地。後因與耿精忠內爭、清軍反攻與資源枯竭，於 1680 年敗退回臺，明鄭精銳盡失。
  sources:
    - title: 維基百科：三藩之亂
      url: https://zh.wikipedia.org/wiki/三藩之亂
    - title: 維基百科：臺灣明鄭時期
      url: https://zh.wikipedia.org/wiki/臺灣明鄭時期

- id: tw-dongning-coup
  year: 1681
  title: 鄭經病逝，東寧之變
  category: politics
  importance: 3
  desc: 鄭經西征失敗返台後病逝，大臣馮錫範與鄭聰等發動政變，殺害監國世子鄭克𡛕，擁立十二歲的鄭克塽。明鄭內部政爭加劇，政局嚴重動盪，加速了兩年後明鄭的覆亡。
  sources:
    - title: 維基百科：東寧之變
      url: https://zh.wikipedia.org/wiki/東寧之變
    - title: 維基百科：鄭克塽
      url: https://zh.wikipedia.org/wiki/鄭克塽

