  category: culture
  importance: 3
  desc: 蔣渭水、蔡培火等於東京創辦《臺灣民報》（前身為《臺灣青年》與《臺灣》），後獲准回臺發行。作為日治時期臺灣人唯一自治的言論機關，積極宣揚民主思想、漢文白話文與啟蒙運動。
