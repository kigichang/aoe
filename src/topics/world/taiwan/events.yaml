  year: 1875
  title: 沈葆楨開山撫番，解除渡臺禁令
  category: politics
  importance: 4
  desc: 牡丹社事件後治臺方針由消極轉為積極。增設臺北府與恆春縣，開闢通往後山的道路，並解除實行近兩百年的渡臺限制。
  sources:
    - title: 維基百科：沈葆楨
      url: https://zh.wikipedia.org/wiki/沈葆楨
