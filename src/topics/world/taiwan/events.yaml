- id: tw-law-63
  year: 1896
  title: 六三法，總督獨攬立法權
  category: politics
  importance: 3
  desc: 授權總督在臺灣發布具法律效力的命令，行政、立法、司法與軍事大權集於一身。這是「特別統治」的法源。
