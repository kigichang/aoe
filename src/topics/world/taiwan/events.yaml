- id: tw-mudan
  year: 1874
  title: 牡丹社事件，日本出兵台灣
  category: war
  importance: 4
  desc: 促使清廷改變消極治台方針，轉向開山撫番與積極經營。
  sources:
    - title: 維基百科：牡丹社事件
      url: https://zh.wikipedia.org/wiki/牡丹社事件

