- id: tw-campus-folk
  year: 1975
  title: 校園民歌運動，「唱自己的歌」
  category: culture
  importance: 3
  desc: 楊弦在台北中山堂舉辦現代民謠創作演唱會，把余光中的詩譜成曲並出版唱片，一般視為台灣現代民歌的起點。1976 年 12 月，李雙澤在淡江的西洋民謠演唱會上拎著可口可樂上台，質問台上台下為什麼唱的都是英文歌，改唱〈補破網〉—— 廣為流傳的「摔可樂瓶」其實是後人添上去的，當晚的主持人陶曉清否認有這一幕。李雙澤隔年因救人溺斃，他寫的〈美麗島〉由楊祖珺推廣開來。退出聯合國與台美斷交的年代裡，年輕人先問的是「我們自己的歌在哪裡」。
