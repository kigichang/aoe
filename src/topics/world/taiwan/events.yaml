      url: https://zh.wikipedia.org/wiki/臺灣清治時期

- id: tw-yu-yonghe
  year: 1697
  title: 郁永河抵台採硫，著《裨海紀遊》
  category: culture
  importance: 3
  desc: 福州鴉片庫火災失硫，郁永河自告奮勇前往臺灣採硫。他自府城陸路北上淡水，詳細記錄沿途原住民風貌與地理景物，所著《裨海紀遊》為清初臺灣最重要的遊記與人文地理文獻。
  sources:
    - title: 維基百科：裨海紀遊
      url: https://zh.wikipedia.org/wiki/裨海紀遊
    - title: 維基百科：郁永河
      url: https://zh.wikipedia.org/wiki/郁永河

- id: tw-chen-laizhang
  year: 1709
  title: 陳賴章墾號成立，台北盆地大開墾
  category: economy
  importance: 4
  desc: 泉州商人陳天仕、陳賴章等申獲「陳賴章墾號」，獲准開墾大佳臘（今台北市艋舺、大稻埕至松山一帶）。這是漢人有系統開墾台北盆地的開端，奠定台北市街發展的基石。
  sources:
    - title: 維基百科：陳賴章
      url: https://zh.wikipedia.org/wiki/陳賴章

- id: tw-babao-canal
  year: 1719
  title: 八堡圳完工，水利灌溉彰化平原
  category: economy
  importance: 3
  desc: 施世榜引濁水溪水開鑿八堡圳，耗時十年建成，灌溉彰化大部分農田。八堡圳為清代臺灣規模最大的水利工程，使彰化平原成為臺灣的中部糧倉。
  sources:
    - title: 維基百科：八堡圳
      url: https://zh.wikipedia.org/wiki/八堡圳

- id: tw-zhu-yigui
  year: 1721
  title: 朱一貴事件
  category: war
  importance: 3
  sources:
    - title: 維基百科：朱一貴
      url: https://zh.wikipedia.org/wiki/朱一貴

