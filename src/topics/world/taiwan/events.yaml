      url: https://zh.wikipedia.org/wiki/臺灣銀行券

- id: tw-monopoly-bureau
  year: 1901
  title: 專賣局成立，鴉片、樟腦、食鹽收歸官營
  category: economy
  importance: 4
  desc: 總督府把先後開辦的鴉片（1897）、食鹽與樟腦（1899）三項專賣合併由專賣局經營，此後再加入菸草（1905）與酒（1922）。專賣收入長期佔歲入的三成到五成，是殖民地財政自立的關鍵；其中鴉片採「漸禁」而非嚴禁，靠特許牌照收稅，既是財政成就也是道德代價。這套機構戰後由臺灣省專賣局、公賣局一路承接下來。
  sources:
    - title: 維基百科：臺灣總督府專賣局
      url: https://zh.wikipedia.org/wiki/臺灣總督府專賣局

- id: tw-armed-resistance-crushed
  year: 1902
  title: 武裝抗日勢力大致肅清
  category: war
  importance: 3
  desc: 據總督府自身的統計，統治前八年約三萬二千人遭殺害，超過當時總人口的百分之一。此後漢人抗日沉寂約五年。
  sources:
    - title: 維基百科：臺灣日治時期
      url: https://zh.wikipedia.org/wiki/臺灣日治時期

