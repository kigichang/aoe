- id: tw-changbin
  year: -3000
  actualYear: -28000
  title: 長濱文化，台灣最早的人類遺留
  category: culture
  importance: 3
  desc: 台東長濱鄉八仙洞的海蝕洞群，1969 年首度發現，依考古學慣例以所在地命名。年代距今約三萬至一萬五千年前，是舊石器時代的漁獵採集隊群，住在海邊洞穴與岩蔭下，只用礫石單面打製砍器與石片器，不製陶，也沒有農耕或畜牧的跡象。它與六千年前才登場的新石器文化之間隔著近萬年的空白，兩者是否有承續關係至今不明——換句話說，台灣最早的居民未必就是原住民族的祖先。台南左鎮人的化石曾號稱「台灣最古老的人類」，2015 年重新定年後修正為距今約三千年；年代更早的是澎湖水道撈起的澎湖1號顎骨，2025 年經蛋白質分析確認屬於丹尼索瓦人，那已是另一個人種。
  sources:
    - title: 維基百科：長濱文化
      url: https://zh.wikipedia.org/wiki/長濱文化
    - title: 維基百科：八仙洞遺址
      url: https://zh.wikipedia.org/wiki/八仙洞遺址
    - title: 維基百科：左鎮人
      url: https://zh.wikipedia.org/wiki/左鎮人
    - title: 維基百科：澎湖1號
      url: https://zh.wikipedia.org/wiki/澎湖1號

- id: tw-tapenkeng
  year: -3000
  actualYear: -4000
  endYear: -2200
  title: 大坌坑文化，進入新石器時代
  category: culture
  importance: 4
  desc: 台灣最早的新石器文化，以粗繩紋陶為特徵，廣布西部海岸。一般認為它是島嶼東南亞最早的農業人群，也是台灣原住民族與南島語族的起源文化 —— 南島語系今日西達馬達加斯加、東抵復活節島，分化與擴散的源頭被認為就在這座島上。實際約始於距今六千年。
  sources:
    - title: 維基百科：大坌坑文化
      url: https://zh.wikipedia.org/wiki/大坌坑文化
    - title: 維基百科：南島語系
      url: https://zh.wikipedia.org/wiki/南島語系

- id: tw-niumatou
  year: -2500
  endYear: -1400
  title: 牛罵頭文化，中部的農耕聚落
  category: culture
  importance: 3
  desc: 台中清水鰲峰山的命名遺址，1943 年由日本學者國分直一在大肚台地西緣調查時正式發現。陶器以紅褐色為主、拍印繩紋，看得出承續大坌坑而來；石製農具數量很大，顯示這裡已是以農耕為主、兼行漁撈狩獵的定居聚落。同一座山丘由下而上疊著牛罵頭、營埔、番仔園三個文化層，等於一份中部史前序列的標準剖面。
  sources:
    - title: 維基百科：牛罵頭遺址
      url: https://zh.wikipedia.org/wiki/牛罵頭遺址
    - title: 維基百科：臺灣史前時期
      url: https://zh.wikipedia.org/wiki/臺灣史前時期

- id: tw-zhishanyan
  year: -1600
  endYear: -1000
  title: 芝山岩文化，台灣考古學的起點
  category: culture
  importance: 3
  desc: 1896 年，總督府國語學校教諭粟野傳之丞在台北士林芝山岩山麓撿到史前石器，這是台灣第一個被發現的史前遺址，島上的考古工作自此開始。文化本身的內涵要到 1979 年雨農國小施工挖到地下兩公尺的貝層才確認——出土物與台北盆地已知的文化都對不上，於是另立「芝山岩文化」之名。地下水位以下的環境保住了木器、繩索與帶穗稻穀等有機質遺物，在台灣極為罕見，證實當時已有成熟的稻作。這一支的來歷至今不明，與前後的圓山、植物園文化都接不上。
  sources:
    - title: 維基百科：芝山岩遺址
      url: https://zh.wikipedia.org/wiki/芝山岩遺址
    - title: 維基百科：臺灣史前時期
      url: https://zh.wikipedia.org/wiki/臺灣史前時期

- id: tw-beinan
  year: -1500
  endYear: -300
  title: 卑南文化，環太平洋最大的石板棺墓葬群
  category: culture
  importance: 4
  desc: 台東卑南山麓的聚落，廣義面積達一百公頃，是台灣所發現最大的史前聚落。出土大量石板棺與棺內精美的玉器陪葬品，墓葬群規模為環太平洋之最 —— 有正式墓制與陪葬階序，意味著這裡已存在明顯的社會分化。
  sources:
    - title: 維基百科：卑南文化
      url: https://zh.wikipedia.org/wiki/卑南文化
    - title: 維基百科：卑南遺址
      url: https://zh.wikipedia.org/wiki/卑南遺址

- id: tw-qilin
  year: -1500
  endYear: -1
  title: 麒麟文化，東海岸的巨石
  category: culture
  importance: 3
  desc: 分布於花蓮新社至台東都蘭一帶，以岩棺、單石、石壁等大型立石著稱。1929 年鹿野忠雄曾與卑南並稱為「巨石文化」，1976 年宋文薰才將兩者分開。以山田燒墾種植穀類，農業技術的進展支撐了人口成長。
  sources:
    - title: 維基百科：麒麟文化
      url: https://zh.wikipedia.org/wiki/麒麟文化

- id: tw-yuanshan
  year: -1200
  endYear: -300
  title: 圓山文化，台北盆地的貝塚
  category: culture
  importance: 3
  desc: 台北盆地西側的多文化層遺址，以厚實的貝塚得名，出土磨製石器、獸骨魚叉與精緻玉器。1964 年圓山遺址是台灣考古史上第一個做出絕對年代鑑定的遺址；此處採該遺址碳十四定年的距今 3200 至 2300 年，維基條目導言另有一個「西元前3300年」的說法，與其內文的定年不合。
  sources:
    - title: 維基百科：圓山遺址
      url: https://zh.wikipedia.org/wiki/圓山遺址

- id: tw-shihsanhang
  year: 200
  endYear: 1600
  title: 十三行文化，台灣進入鐵器時代
  category: science
  importance: 4
  desc: 淡水河出海口南岸的聚落，出土煉鐵作坊與大量鐵器，是目前確定擁有煉鐵技術的台灣史前居民，很可能是凱達格蘭族的祖先。同層另有中國瓷器與玻璃器，顯示島外交易已成常態 —— 這一支一直延續到荷蘭人抵達前後，與有文字的歷史時期首尾相接。
  sources:
    - title: 維基百科：十三行遺址
      url: https://zh.wikipedia.org/wiki/十三行遺址

- id: tw-yizhou
  year: 230
  title: 東吳船隊抵「夷洲」
  category: politics
  importance: 3
  desc: 《三國志》載孫權遣衛溫、諸葛直率軍萬人渡海求夷洲，行經一年，士卒病死八九成，俘數千人而返。夷洲是否即台灣至今仍有爭議。隋煬帝大業年間也兩度用兵於「流求」，先遣朱寬入海招撫，其後陳稜、張鎮周率軍破其都城、殺其王歡斯渴剌兜，俘萬餘人；這個流求同樣指不定是台灣還是琉球群島。中國史書裡這幾筆記載都太簡略，方位、航程與風俗都能各自解釋 —— 台灣要到十七世紀初的《東番記》才第一次被具體地寫下來。
  sources:
    - title: 維基百科：夷洲
      url: https://zh.wikipedia.org/wiki/夷洲
    - title: 維基百科：流求國
      url: https://zh.wikipedia.org/wiki/流求國

- id: tw-tsiaosong
  year: 400
  endYear: 1500
  title: 蔦松文化，西南平原的金屬器時代
  category: culture
  importance: 3
  desc: 分布於台南、高雄與屏東北部，以台南永康蔦松遺址為代表，一般認為是西拉雅等平埔族群的祖先文化。與北部的十三行同屬金屬器時代 —— 荷蘭人 1624 年在大員登陸時，面對的正是這一支的後裔。
  sources:
    - title: 維基百科：蔦松文化
      url: https://zh.wikipedia.org/wiki/蔦松文化
    - title: 維基百科：衛溫
      url: https://zh.wikipedia.org/wiki/衛溫

- id: tw-penghu-inspectorate
  year: 1281
  title: 元朝設澎湖寨巡檢司
  category: politics
  importance: 3
  desc: 中原政權第一次在澎湖正式設官署，隸屬福建同安縣。此前南宋泉州知州汪大猷已在澎湖造營房兩百間駐兵，但那是水師戍防，不是設治。明初實施封海政策時一度廢除並把居民遷回泉漳安置，1563 年為了沿海治安復設，一直維持到 1622 年荷蘭東印度公司佔領澎湖為止。台灣本島始終不在這套官署的管轄裡 —— 澎湖與台灣在帝國的行政地圖上分屬兩件事，要到 1684 年設台灣府才合流。
  sources:
    - title: 維基百科：澎湖寨巡檢司
      url: https://zh.wikipedia.org/wiki/澎湖寨巡檢司

- id: tw-formosa
  year: 1582
  title: 葡萄牙與西班牙船員因船難滯留台灣
  category: culture
  importance: 3
  sources:
    - title: 維基百科：臺灣歷史
