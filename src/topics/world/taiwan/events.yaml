  desc: 台灣原住民權利促進會成立，提出正名、還我土地與自治三大訴求。1988 年嘉義火車站前的吳鳳銅像被拆除，「吳鳳捨生取義感化生番」這則寫進教科書數十年的敘事就此退場 —— 運動要爭的不只是權利，還有誰來講述這座島的歷史。
