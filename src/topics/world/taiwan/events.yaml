  title: 李遠哲獲諾貝爾化學獎
  category: science
  importance: 3
  desc: 新竹出身的李遠哲以交叉分子束方法研究化學反應動力學，與赫施巴赫、波拉尼共同獲獎，是第一位在台灣出生成長的諾貝爾獎得主。他 1994 年放棄美國籍返台出任中央研究院院長，此後十餘年深度介入台灣的教育改革與政治，從一個科學家的獎項變成一個公共人物的起點 —— 那段參與的評價至今分歧，但四百年來第一次有台灣長大的人站上那個位置這件事，當年的震撼是一致的。
