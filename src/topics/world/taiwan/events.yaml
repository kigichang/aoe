    - title: 維基百科：藍鼎元
      url: https://zh.wikipedia.org/wiki/藍鼎元

- id: tw-dajiaxi-uprising
  year: 1731
  endYear: 1732
  title: 大甲西社事件，平埔族群最大規模的抗官
  category: war
  importance: 3
  desc: 道卡斯族大甲西社的林武力等人因不堪勞役而起事，中部各社響應，前後延續一年才被平定，是平埔族群歷史上規模最大的一次抗官行動。清軍調鳳山總兵北上支援，南部守備因此空虛，朱一貴的舊部趁機再起，是為吳福生事件。事後清廷在平埔各社境內加強駐兵，中部的大肚王國也在此後瓦解 —— 一個從荷蘭時期存續下來、與三個政權都打過交道的跨部落聯盟，就這樣消失在文獻裡。
  sources:
    - title: 維基百科：大甲西社抗清事件
      url: https://zh.wikipedia.org/wiki/大甲西社抗清事件

- id: tw-family-migration
  year: 1733
  title: 開放移民攜眷渡臺
  category: politics
  importance: 3
  desc: 藍鼎元建言獲雍正採納。此前以單身男性為主的移墾社會，自此逐步轉為攜家帶眷的定居社會。
  sources:
    - title: 維基百科：渡臺禁令
      url: https://zh.wikipedia.org/wiki/渡臺禁令
    - title: 維基百科：藍鼎元
      url: https://zh.wikipedia.org/wiki/藍鼎元

