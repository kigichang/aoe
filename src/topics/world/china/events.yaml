      url: https://zh.wikipedia.org/wiki/董仲舒

- id: cn-tuien-decree
  year: -127
  title: 推恩令，諸侯王國自行瓦解
  category: politics
  importance: 4
  desc: 主父偃獻策：王國封地須分給每一個兒子，不再由嫡長獨得。不必動兵、也不必背削藩的惡名，王國數代之內就碎成不足為患的小侯 —— 七國之亂那樣的正面衝突再未重演。
  sources:
    - title: 維基百科：推恩令
      url: https://zh.wikipedia.org/wiki/推恩令
    - title: 維基百科：主父偃
      url: https://zh.wikipedia.org/wiki/主父偃

- id: cn-hexi-corridor
  year: -121
  title: 霍去病取河西，設河西四郡
  category: war
  importance: 3
  desc: 兩次出隴西，渾邪王率眾降漢。武威、張掖、酒泉、敦煌次第設郡，把匈奴與羌隔開，也把中原通往西域的走廊真正握在手裡 —— 張騫十七年前只是走通了路，這一戰才使它成為漢的領土。
  sources:
    - title: 維基百科：河西四郡
      url: https://zh.wikipedia.org/wiki/河西四郡
    - title: 維基百科：霍去病
      url: https://zh.wikipedia.org/wiki/霍去病

- id: cn-mobei-campaign
  year: -119
  title: 漠北之戰，衛青霍去病破匈奴
  category: war
  importance: 4
  desc: 漢軍兩路出塞逾兩千里，匈奴遠遁，「漠南無王庭」。行之六十年的和親政策就此翻轉，代價是府庫耗盡 —— 同年即開鹽鐵國營籌措軍費。
  sources:
    - title: 維基百科：漠北之戰
      url: https://zh.wikipedia.org/wiki/漠北之戰
    - title: 維基百科：衛青
      url: https://zh.wikipedia.org/wiki/衛青
    - title: 維基百科：霍去病
      url: https://zh.wikipedia.org/wiki/霍去病

- id: cn-salt-iron-monopoly
  year: -119
  title: 鹽鐵國營，專賣制籌措軍費
  category: economy
  importance: 3
  desc: 武帝把鹽、鐵的產銷收歸官府，孔僅、東郭咸陽主持，桑弘羊繼之而擴及均輸平準。國家專賣自此成為財政的常備手段，歷代屢屢重回這條路；昭帝時著名的鹽鐵會議，爭的就是它該不該廢。
  sources:
    - title: 維基百科：鹽鐵國營
      url: https://zh.wikipedia.org/wiki/鹽鐵國營
    - title: 維基百科：桑弘羊
      url: https://zh.wikipedia.org/wiki/桑弘羊

- id: cn-wuzhu-coin
  year: -118
  title: 鑄五銖錢，幣制收歸中央
  category: economy
  importance: 3
  desc: 廢半兩、行五銖，其後禁郡國私鑄、專令上林三官。這枚錢的形制沿用七百餘年，直到唐初改鑄開元通寶才告終 —— 鑄幣權歸於中央，自此是中原王朝的常態。
  sources:
    - title: 維基百科：五銖
      url: https://zh.wikipedia.org/wiki/五銖

- id: cn-han-four-commanderies
  year: -108
  title: 滅衛氏朝鮮，設漢四郡
  category: war
  importance: 3
  desc: 漢軍水陸並進滅衛滿朝鮮，置樂浪、玄菟、真番、臨屯四郡。樂浪自此成為漢文化東傳的門戶，倭與三韓諸國都經由它與中原往來 —— 日本最早見於中國史書的紀錄，正是從這條路徑來的。
  sources:
    - title: 維基百科：漢四郡
      url: https://zh.wikipedia.org/wiki/漢四郡
    - title: 維基百科：衛滿朝鮮
      url: https://zh.wikipedia.org/wiki/衛滿朝鮮
    - title: 維基百科：樂浪郡
      url: https://zh.wikipedia.org/wiki/樂浪郡

- id: cn-shiji
  year: -104
