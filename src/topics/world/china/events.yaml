  category: politics
  importance: 4
  desc: 袁紹不取此策，曹操從毛玠之議「奉天子以令不臣」。同時大興屯田解決軍糧 —— 名義上的天子與實際的權力自此分離，開魏晉霸府政治之先河。
  sources:
