# year: 負數 = 西元前，沒有西元 0 年。endYear 選填（有跨度的事件）。
# category: politics | war | culture | science | religion | economy
# importance: 1-5。縮放到全域視角時只會顯示 5，放大後才逐層釋出。
#
# 年代經維基百科查證；標題與描述為自行撰寫，未取用條目文字。

- id: cn-liangzhu
  year: -3000
  endYear: -2000
  title: 良渚古城，中華五千年文明的實證
  category: culture
  importance: 4
  desc: 長江下游環太湖地區的新石器聚落群，有城牆、大型水利系統與階層分明的墓葬，玉琮玉鉞象徵神權與王權。2019 年列入世界遺產，被視為國家形態在此已然出現的證據 —— 這一批考古文化與同區間的三皇五帝條目並列，前者有碳十四定年，後者出自後世追記。良渚實際起於前 3300 年，此處為時間軸起點所截。
  sources:
    - title: 維基百科：良渚遺址
      url: https://zh.wikipedia.org/wiki/良渚遺址
    - title: 維基百科：良渚文化
      url: https://zh.wikipedia.org/wiki/良渚文化
    - title: 維基百科：古國時代
      url: https://zh.wikipedia.org/wiki/古國時代

- id: cn-longshan
  year: -3000
  endYear: -1900
  title: 龍山文化，黑陶與城址林立
  category: culture
  importance: 3
  desc: 黃河中下游承接仰韶與大汶口而起，以薄如蛋殼的黑陶得名，1928 年首見於山東城子崖。此期城址成群出現，聚落之間已有明顯的規模落差，是中原邁向早期國家的階段；二里頭即由此一系演變而來。
  sources:
    - title: 維基百科：龍山文化
      url: https://zh.wikipedia.org/wiki/龍山文化

- id: cn-fuxi
  year: -2852
  title: 伏羲畫八卦，傳說中的文明肇始
  category: culture
  importance: 4
  legendary: true
  desc: 三皇之首，傳說教民結網漁獵、始畫八卦。年代出自晉人皇甫謐《帝王世紀》的追記，非考古定年。
  sources:
    - title: 維基百科：伏羲
      url: https://zh.wikipedia.org/wiki/伏羲
    - title: 維基百科：八卦
      url: https://zh.wikipedia.org/wiki/八卦
    - title: 維基百科：帝王世紀
      url: https://zh.wikipedia.org/wiki/帝王世紀

- id: cn-shennong
  year: -2737
  title: 神農嘗百草，教民耕種
  category: economy
  importance: 4
  legendary: true
  desc: 傳說中農耕與醫藥的開端。與黃帝並稱炎黃，被後世追認為華夏共祖之一。
  sources:
    - title: 維基百科：神農
      url: https://zh.wikipedia.org/wiki/神農
