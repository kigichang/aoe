  importance: 3
  desc: 仿效蘇聯模式，集中資源發展重工業與國防工業，同時推行農業與工商業的社會主義改造，奠定計畫經濟體制的基礎。
  sources:
    - title: 維基百科：第一個五年計畫（中國）
