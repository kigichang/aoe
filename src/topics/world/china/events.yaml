  category: war
  importance: 3
  desc: 竇憲大破北匈奴，登燕然山刻石記功，班固作銘。北匈奴殘部自此西徙 —— 兩百多年後出現在歐洲的匈人是否為其後裔，史學界至今未有定論。
  sources:
    - title: 維基百科：燕然勒石
