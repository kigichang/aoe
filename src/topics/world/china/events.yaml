    - title: 維基百科：隋朝
      url: https://zh.wikipedia.org/wiki/隋朝

- id: cn-imperial-exam-founded
  year: 587
  title: 創立科舉，選官不問門第
  category: politics
  importance: 4
  desc: 取代行之三百年的九品中正制，門第不再是入仕的前提。606 年煬帝再增設進士科，制度大體成形 —— 此後行用一千三百餘年，直到 1905 年才廢除。
  sources:
    - title: 維基百科：科舉
      url: https://zh.wikipedia.org/wiki/科舉
