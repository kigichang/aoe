  year: 626
  title: 玄武門之變，李世民奪嫡
  category: politics
  importance: 3
  desc: 誅殺太子李建成與齊王李元吉，控制長安。高祖隨即禪位 —— 貞觀之治的起點，也是唐代皇位繼承屢屢流血的開端。
