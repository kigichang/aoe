  category: politics
  importance: 4
  desc: 司馬懿誅曹爽及其黨羽，魏國朝政落入司馬氏之手。其子師、昭相繼掌權，十七年後司馬炎受禪建晉 —— 曹丕代漢的方式，原封不動地回到曹家身上。
  sources:
