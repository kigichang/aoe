- id: cn-tiankehan
  year: 630
  title: 滅東突厥，太宗受尊「天可汗」
  category: war
  importance: 4
  desc: 四年前突厥還兵臨渭水逼唐訂盟，此役後北方各族入貢長安，共尊唐帝為天可汗。中原王朝首次同時是草原共主。
  sources:
    - title: 維基百科：東突厥
      url: https://zh.wikipedia.org/wiki/東突厥
    - title: 維基百科：天可汗
      url: https://zh.wikipedia.org/wiki/天可汗
    - title: 維基百科：唐太宗
      url: https://zh.wikipedia.org/wiki/唐太宗

- id: cn-wencheng-princess
  year: 641
  title: 文成公主入吐蕃
  category: politics
  importance: 3
  desc: 與贊普松贊干布通婚。唐蕃此後時戰時和，但漢地的工藝、曆法與佛教也隨之進入高原。
  sources:
    - title: 維基百科：文成公主
      url: https://zh.wikipedia.org/wiki/文成公主

- id: cn-tang-conquers-korea
  year: 660
  endYear: 668
  title: 唐滅百濟、高句麗，重塑朝鮮半島格局
  category: war
  importance: 4
  desc: 唐與新羅聯軍先滅百濟（660），再滅立國七百餘年的高句麗（668），一度於平壤設安東都護府直接統治。此後新羅逐步驅逐唐朝勢力統一半島，唐與新羅轉為聯盟，朝鮮半島的政治版圖自此定型。
  sources:
    - title: 維基百科：唐滅百濟之戰
      url: https://zh.wikipedia.org/wiki/唐滅百濟之戰
    - title: 維基百科：唐與高句麗戰爭
      url: https://zh.wikipedia.org/wiki/唐與高句麗戰爭

- id: cn-wu-zetian
  year: 690
  title: 武則天稱帝
  category: politics
  importance: 4
  desc: 武則天從高宗皇后、與高宗「二聖臨朝」共治，到廢黜親生兩子（中宗、睿宗）後自行稱帝改國號周，是中國史上唯一的女皇帝。她任用酷吏興告密之風剷除異己，卻也開殿試選才、不拘門第拔擢寒門與能臣（狄仁傑等），統治十五年間國力續有發展，晚年才因男寵與繼承問題埋下神龍革命的種子。
  sources:
    - title: 維基百科：武則天
      url: https://zh.wikipedia.org/wiki/武則天
    - title: 維基百科：武周
      url: https://zh.wikipedia.org/wiki/武周

- id: cn-shenlong-coup
  year: 705
  title: 神龍革命，武周終、唐室復辟
  category: politics
  importance: 3
  desc: 張柬之等人趁武則天病重起兵，逼其禪位於中宗。國號復為唐，還都長安 —— 中國史上唯一由女性建立的王朝歷十四年而終。
  sources:
    - title: 維基百科：神龍革命
      url: https://zh.wikipedia.org/wiki/神龍革命
    - title: 維基百科：武周
      url: https://zh.wikipedia.org/wiki/武周
    - title: 維基百科：武則天
      url: https://zh.wikipedia.org/wiki/武則天

- id: cn-tanglong-coup
  year: 710
  title: 唐隆政變，李隆基誅韋后
  category: politics
  importance: 3
  desc: 中宗被韋皇后與安樂公主毒殺，兩人意圖仿效武則天臨朝稱制。臨淄王李隆基聯合姑母太平公主發動政變，誅殺韋后一黨，擁立其父睿宗復位。李隆基隨後鬥倒太平公主獨攬大權，兩年後即位，是為唐玄宗，開元盛世自此鋪路。
  sources:
    - title: 維基百科：唐隆政變
      url: https://zh.wikipedia.org/wiki/唐隆政變

- id: cn-kaiyuan
  year: 713
  title: 開元盛世，人口達八千萬
  category: politics
  importance: 4
  desc: 玄宗革除前朝弊端，政治開明，威震四方，是唐朝的第二個高峰。但天寶年間他志得意滿、不問國事，由盛轉衰的伏筆就埋在此。
  sources:
    - title: 維基百科：開元之治
      url: https://zh.wikipedia.org/wiki/開元之治
    - title: 維基百科：唐玄宗
      url: https://zh.wikipedia.org/wiki/唐玄宗

- id: cn-tang-poetry
  year: 750
  title: 李白杜甫並世，唐詩臻於鼎盛
  category: culture
  importance: 4
  desc: 《全唐詩》收兩千兩百多位詩人、四萬八千九百多首，而這還不是全部。詩仙與詩聖同處盛唐轉衰的那幾十年，安史之亂的離亂也寫進了詩裡。
  sources:
    - title: 維基百科：唐詩
      url: https://zh.wikipedia.org/wiki/唐詩
    - title: 維基百科：李白
      url: https://zh.wikipedia.org/wiki/李白
    - title: 維基百科：杜甫
      url: https://zh.wikipedia.org/wiki/杜甫

- id: cn-talas
  year: 751
  title: 怛羅斯之戰，造紙術西傳
  category: war
  importance: 4
  desc: 唐與阿拔斯王朝的一場邊境戰役，卻意外把造紙術帶進了伊斯蘭世界與歐洲。
  sources:
    - title: 維基百科：怛羅斯戰役
      url: https://zh.wikipedia.org/wiki/怛羅斯戰役
    - title: 維基百科：造紙術
      url: https://zh.wikipedia.org/wiki/造紙術

- id: cn-nanzhao-wars
  year: 751
  endYear: 754
  title: 天寶戰爭，唐軍慘敗於南詔
  category: war
  importance: 3
  desc: 崛起於雲南的南詔叛離唐朝，劍南節度使鮮于仲通、繼任的楊國忠兩度徵發大軍南征均全軍覆沒，唐軍前後折損近二十萬人。與同年怛羅斯之戰的挫敗東西呼應，暴露玄宗晚期窮兵黷武的惡果，也讓中央可用兵力在安史之亂爆發前先行透支。
  sources:
    - title: 維基百科：南詔
      url: https://zh.wikipedia.org/wiki/南诏
    - title: 維基百科：唐朝與南詔的戰爭
      url: https://zh.wikipedia.org/wiki/唐朝與南詔的戰爭

- id: cn-anshi
  year: 755
  title: 安史之亂
  category: war
  importance: 5
  endYear: 763
  desc: 身兼三鎮節度使的安祿山以討楊國忠為名起兵，玄宗倉皇南逃，馬嵬驛兵變賜死楊貴妃，太子李亨於靈武自行稱帝（肅宗）。唐室借回紇兵收復兩京，但叛軍內鬥（安慶緒弒父、史思明弒安慶緒、史朝義弒父）延長戰事至八年才平定。戰後藩鎮割據成為定局，唐朝由盛轉衰，此後一百五十年再未真正重建中央集權。
  sources:
    - title: 維基百科：安史之亂
      url: https://zh.wikipedia.org/wiki/安史之亂

- id: cn-two-tax
  year: 780
  title: 兩稅法，稅基由人丁改為資產
  category: economy
  importance: 3
  desc: 均田制崩解後的因應之策，也是中國賦稅史上從稅人到稅地的轉折點。
  sources:
    - title: 維基百科：兩稅法
      url: https://zh.wikipedia.org/wiki/兩稅法

- id: cn-yuanhe-restoration
  year: 806
  endYear: 819
  title: 元和中興，唐憲宗討平藩鎮
  category: politics
  importance: 4
  desc: 順宗朝的永貞革新試圖以文官集團奪回宦官與藩鎮的權力，僅維持二百餘天便遭宦官政變推翻；憲宗改走武力路線，先後平定西川劉闢、鎮海李錡，最終派李愬雪夜奇襲蔡州、平定淮西吳元濟，河北藩鎮相繼歸順，安史之亂後六十年來中央權威首度重新籠罩全境，史稱「元和中興」。
  sources:
    - title: 維基百科：元和中興
      url: https://zh.wikipedia.org/wiki/元和中興
    - title: 維基百科：永貞革新
      url: https://zh.wikipedia.org/wiki/永貞革新

- id: cn-ganlu-incident
  year: 835
  title: 甘露之變，宦官盡掌軍政
  category: politics
  importance: 3
  desc: 文宗謀誅宦官失敗，仇士良以神策軍反殺大臣。此後宦官牢握軍政大權，皇帝的廢立幾乎全出其手。
  sources:
    - title: 維基百科：甘露之變
      url: https://zh.wikipedia.org/wiki/甘露之變

- id: cn-huichang-persecution
  year: 845
  title: 會昌毀佛
  category: religion
  importance: 3
  desc: 大量寺產被沒入官府。佛教在中國的制度性擴張自此受挫。
  sources:
    - title: 維基百科：會昌毀佛
      url: https://zh.wikipedia.org/wiki/會昌毀佛

- id: cn-diamond-sutra
  year: 868
  title: 《金剛經》雕版印刷
  category: science
  importance: 4
  desc: 現存最早有明確紀年的印刷品。
  sources:
    - title: 維基百科：金剛經
      url: https://zh.wikipedia.org/wiki/金剛經
    - title: 維基百科：雕版印刷
      url: https://zh.wikipedia.org/wiki/雕版印刷

- id: cn-huangchao
  year: 875
  title: 黃巢之亂
  category: war
  importance: 4
  endYear: 885
  desc: 流動作戰十年，一度攻陷長安。江南經濟遭嚴重破壞，門閥士族在戰亂中幾乎盡毀 —— 唐朝的統治基礎自此瓦解，二十二年後即亡於降將朱溫之手。
  sources:
    - title: 維基百科：黃巢之亂
      url: https://zh.wikipedia.org/wiki/黃巢之亂
    - title: 維基百科：唐朝
      url: https://zh.wikipedia.org/wiki/唐朝

- id: cn-tang-fall
  year: 907
  title: 唐亡，五代十國
  category: politics
  importance: 3
  desc: 朱溫先於904年弒殺唐昭宗、在白馬驛一夜屠盡朝臣三十餘人投屍黃河（「此輩清流，可投濁流」），再逼末代皇帝唐哀帝禪位，建國號梁。享國近三百年的唐朝就此覆滅，中原進入五代更迭、南方十國並立的分裂局面，直到 960 年宋朝建立才逐步收拾。
  sources:
    - title: 維基百科：五代十國
      url: https://zh.wikipedia.org/wiki/五代十國
    - title: 維基百科：白馬驛之禍
      url: https://zh.wikipedia.org/wiki/白馬驛之禍

- id: cn-wuyue-submission
  year: 907
  endYear: 978
  title: 吳越國，亂世中的偏安典範，終以納土歸宋
  category: politics
  importance: 3
  desc: 錢鏐據兩浙建吳越國，是十國中壽命最長的一個。歷代國主奉行「善事中原」的保境安民策略，興修水利、獎勵農桑，江南經濟在亂世中反而持續發展。978年末代國主錢俶主動獻土歸降北宋，是十國裡少數不經血戰、和平終結的政權。
  sources:
    - title: 維基百科：吳越國
      url: https://zh.wikipedia.org/wiki/吳越國
    - title: 維基百科：錢鏐
      url: https://zh.wikipedia.org/wiki/錢鏐

- id: cn-khitan-founded
  year: 916
  title: 耶律阿保機建契丹國
  category: politics
  importance: 4
  desc: 契丹統一各部後稱帝建國，兩年後定都臨潢府，並創制契丹文字。此國祚二百一十年，與中原長期對峙 —— 俄語至今仍以「契丹」稱中國。
  sources:
    - title: 維基百科：耶律阿保機
      url: https://zh.wikipedia.org/wiki/耶律阿保機
    - title: 維基百科：遼朝
      url: https://zh.wikipedia.org/wiki/遼朝
    - title: 維基百科：契丹
      url: https://zh.wikipedia.org/wiki/契丹

- id: cn-later-tang
  year: 923
  title: 李存勗滅後梁，建後唐
  category: war
  importance: 3
  desc: 沙陀人以「復興唐朝」為名稱帝，滅掉朱溫所建的後梁。此後五代的君主多出自李克用的子孫與部屬。
  sources:
    - title: 維基百科：後唐
      url: https://zh.wikipedia.org/wiki/後唐
    - title: 維基百科：後梁
      url: https://zh.wikipedia.org/wiki/後梁
    - title: 維基百科：五代十國
      url: https://zh.wikipedia.org/wiki/五代十國

- id: cn-sixteen-prefectures
  year: 936
  title: 石敬瑭割燕雲十六州予契丹
  category: politics
  importance: 4
  desc: 為向契丹借兵奪位，石敬瑭稱兒皇帝並割讓幽薊十六州、歲輸帛三十萬匹。中原自此失去北方屏障，直到 1368 年明軍北伐才收回 —— 前後四百三十二年。
  sources:
    - title: 維基百科：燕雲十六州
      url: https://zh.wikipedia.org/wiki/燕雲十六州
    - title: 維基百科：石敬瑭
      url: https://zh.wikipedia.org/wiki/石敬瑭
    - title: 維基百科：後晉
      url: https://zh.wikipedia.org/wiki/後晉

- id: cn-southern-tang-culture
  year: 937
  endYear: 975
  title: 南唐立國，李煜詞風締造五代文學高峰
  category: culture
  importance: 3
  desc: 徐知誥（李昪）奪吳國政權，改國號唐，以江南富庶之地延續中原文教。末代國主李煜精書畫音律，尤以詞聞名，975年亡國降宋後所作「春花秋月何時了」等亡國之詞，反而將詞這種文體推向前所未有的高度，是五代十國留給中國文學最重要的遺產。
  sources:
    - title: 維基百科：南唐
      url: https://zh.wikipedia.org/wiki/南唐
    - title: 維基百科：李煜
      url: https://zh.wikipedia.org/wiki/李煜

- id: cn-liao-proclaimed
  year: 947
  title: 契丹滅後晉，改國號大遼
  category: war
  importance: 3
  desc: 遼太宗攻入開封，自居為繼承後晉的中原正統。但縱兵掠奪招來反抗，數月後即北返，中原由後漢接手。
  sources:
    - title: 維基百科：遼朝
      url: https://zh.wikipedia.org/wiki/遼朝
    - title: 維基百科：後晉
      url: https://zh.wikipedia.org/wiki/後晉

- id: cn-later-zhou-founded
  year: 951
  title: 郭威滅後漢，建後周
  category: politics
  importance: 3
  desc: 後漢隱帝誅殺顧命大臣，郭威以清君側起兵，數日入開封。登基後減免徭役、整頓軍紀與吏治，是五代少見的節儉之君 —— 死後陵前僅立石碑一塊，連守陵宦官都沒有。
  sources:
    - title: 維基百科：郭威
      url: https://zh.wikipedia.org/wiki/郭威
    - title: 維基百科：後周
      url: https://zh.wikipedia.org/wiki/後周
    - title: 維基百科：後漢 (五代)
      url: https://zh.wikipedia.org/wiki/後漢_(五代)

- id: cn-gaoping-battle
  year: 954
  title: 高平之戰，柴榮親征扭轉戰局
  category: war
  importance: 3
  desc: 北漢聯遼趁後周新君初立來攻。柴榮親臨戰場，在右翼潰退的劣勢下逆轉取勝，戰後藉勢整頓禁軍 —— 那正是六年後趙匡胤統領的同一支部隊。
  sources:
    - title: 維基百科：高平之戰
      url: https://zh.wikipedia.org/wiki/高平之戰
    - title: 維基百科：周世宗
      url: https://zh.wikipedia.org/wiki/周世宗
    - title: 維基百科：北漢
      url: https://zh.wikipedia.org/wiki/北漢

- id: cn-zhou-shizong
  year: 955
  title: 周世宗三征南唐，盡取江北
  category: war
  importance: 3
  endYear: 958
  desc: 三度親征，迫使南唐去帝號、割讓長江以北幾乎全部土地。959 年他再北上攻遼，兩個月幾乎抵達幽州，卻突然患病而中止，不久病逝 —— 趙匡胤接手的正是這份底子。
  sources:
    - title: 維基百科：周世宗
      url: https://zh.wikipedia.org/wiki/周世宗
    - title: 維基百科：後周
      url: https://zh.wikipedia.org/wiki/後周
    - title: 維基百科：南唐
      url: https://zh.wikipedia.org/wiki/南唐

- id: cn-song-founding
  year: 960
  title: 趙匡胤建立北宋
  category: politics
  importance: 4
  sources:
    - title: 維基百科：宋太祖
      url: https://zh.wikipedia.org/wiki/宋太祖
    - title: 維基百科：北宋
      url: https://zh.wikipedia.org/wiki/北宋

- id: cn-cup-of-wine
  year: 961
  title: 杯酒釋兵權，確立重文輕武
  category: politics
  importance: 4
  desc: 太祖以一場酒宴解除大將兵權，改以文官治軍，軍權財權盡歸中央。兩宋因此不再有藩鎮割據，代價是對外戰爭長期居於下風。
  sources:
    - title: 維基百科：杯酒釋兵權
      url: https://zh.wikipedia.org/wiki/杯酒釋兵權
    - title: 維基百科：陳橋兵變
      url: https://zh.wikipedia.org/wiki/陳橋兵變
    - title: 維基百科：北宋
      url: https://zh.wikipedia.org/wiki/北宋

- id: cn-conquer-southern-tang
  year: 975
  title: 宋滅南唐
  category: war
  importance: 3
  desc: 十國之中最強的南唐亡於宋，李煜被俘。南方大致底定，只剩北漢待四年後解決。
  sources:
    - title: 維基百科：宋滅南唐之戰
      url: https://zh.wikipedia.org/wiki/宋滅南唐之戰
    - title: 維基百科：南唐
      url: https://zh.wikipedia.org/wiki/南唐

- id: cn-conquer-beihan
  year: 979
  title: 滅北漢，結束二百年藩鎮割據
  category: politics
  importance: 3
  desc: 安史之亂以來的分裂局面告終。但太宗乘勢北伐燕京，於高梁河慘敗，宋對遼自此轉為守勢。
  sources:
    - title: 維基百科：宋滅北漢之戰
      url: https://zh.wikipedia.org/wiki/宋滅北漢之戰
    - title: 維基百科：藩鎮
      url: https://zh.wikipedia.org/wiki/藩鎮
    - title: 維基百科：北宋
      url: https://zh.wikipedia.org/wiki/北宋

- id: cn-yang-ye-death
  year: 986
  title: 雍熙北伐再敗，楊業陣亡
  category: war
  importance: 3
  desc: 太宗三路北伐燕雲十六州，主帥潘美與監軍王侁指揮失當，名將楊業孤軍苦戰後被俘，絕食殉國。此役徹底打消宋朝收復燕雲的念頭，楊家將的故事也由此傳頌。
  sources:
    - title: 維基百科：楊業
      url: https://zh.wikipedia.org/wiki/杨业

- id: cn-xiao-taihou-regency
  year: 982
  endYear: 1009
  title: 蕭太后攝政，遼聖宗盛世
  category: politics
  importance: 4
  desc: 遼景宗去世，年僅十二歲的遼聖宗即位，生母蕭綽（蕭燕燕）以太后身分攝政近三十年，重用漢臣、整頓吏治、勸農興學，遼朝國力自此達到頂峰。1004年她更親率大軍南征，促成澶淵之盟。是中國史上少數長期臨朝、且治績斐然的女性統治者，後世戲曲小說常見其身影。
  sources:
    - title: 維基百科：蕭綽
      url: https://zh.wikipedia.org/wiki/萧绰

- id: cn-chanyuan-treaty
  year: 1004
  title: 澶淵之盟，宋遼結為兄弟之國
  category: politics
  importance: 4
  desc: 遼聖宗與攝政的蕭太后親率大軍南征，遼將蕭撻凜陣前戰死，雙方隨即議和：宋以歲幣換取和平，此後宋遼百餘年無大戰。以錢帛代替戰爭的做法，成為北宋處理北方關係的基調。1042年遼朝再以陳兵邊境施壓，逼宋將歲幣加碼（重熙增幣），並堅持用字為「納」而非「贈」，維持名義上的優勢地位。
  sources:
    - title: 維基百科：澶淵之盟
      url: https://zh.wikipedia.org/wiki/澶淵之盟
    - title: 維基百科：宋朝
      url: https://zh.wikipedia.org/wiki/宋朝
    - title: 維基百科：重熙增幣
      url: https://zh.wikipedia.org/wiki/重熙增幣

- id: cn-jiaozi
  year: 1024
  title: 交子成為官方紙幣
  category: economy
  importance: 4
  desc: 世界最早的官方紙幣，比歐洲早了約六百年。
  sources:
    - title: 維基百科：交子
      url: https://zh.wikipedia.org/wiki/交子

- id: cn-xixia-script
  year: 1036
  title: 西夏文正式頒行
  category: culture
  importance: 3
  desc: 李元昊命野利仁榮參照漢字六書造字法創制西夏文，共約六千字，稱「國書」，頒令境內公私文書一律使用。這是中國歷史上少數由統治者主導、獨立於漢字系統的成熟文字。
  sources:
    - title: 維基百科：西夏文
      url: https://zh.wikipedia.org/wiki/西夏文

- id: cn-xixia-founded
  year: 1038
  title: 西夏建國，宋夏戰爭起
  category: politics
  importance: 3
  desc: 李元昊稱帝，宋軍於三川口、好水川、定川寨屢敗。遼趁機施壓索取歲幣，宋在西北與北方同時受制。1044 年雙方簽訂慶曆和議，宋冊封元昊為夏國主並支付歲幣，換得對西夏事實獨立的承認。
  sources:
    - title: 維基百科：西夏
      url: https://zh.wikipedia.org/wiki/西夏
    - title: 維基百科：宋夏戰爭
      url: https://zh.wikipedia.org/wiki/宋夏戰爭

- id: cn-movable-type
  year: 1041
  title: 畢昇發明活字印刷
  category: science
  importance: 5
  sources:
    - title: 維基百科：畢昇
      url: https://zh.wikipedia.org/wiki/畢昇
    - title: 維基百科：活字印刷術
      url: https://zh.wikipedia.org/wiki/活字印刷術

- id: cn-qingli-reform
  year: 1043
  title: 慶曆新政
  category: politics
  importance: 3
  desc: 范仲淹、富弼、韓琦等人整頓吏治。守舊派指其結黨營私，改革派多遭外放，新政不足兩年即止 —— 二十六年後王安石變法重啟同一課題。
  sources:
    - title: 維基百科：慶曆新政
      url: https://zh.wikipedia.org/wiki/慶曆新政
    - title: 維基百科：范仲淹
      url: https://zh.wikipedia.org/wiki/范仲淹

- id: cn-wang-anshi
  year: 1069
  title: 王安石變法
  category: politics
  importance: 3
  desc: 推行青苗、市易、保甲等法富國強兵，卻因與民爭利、執行走樣而爭議不斷。神宗死後高太后重用司馬光盡廢新法（元祐更化），哲宗親政又反轉重啟新法（紹聖紹述），新舊黨爭反覆拉鋸近半世紀，朝政元氣大傷。
  sources:
    - title: 維基百科：王安石變法
      url: https://zh.wikipedia.org/wiki/王安石變法
    - title: 維基百科：元祐更化
      url: https://zh.wikipedia.org/wiki/元祐更化
    - title: 維基百科：紹聖紹述
      url: https://zh.wikipedia.org/wiki/绍圣绍述

- id: cn-liao-yelu-yixin
  year: 1075
  endYear: 1083
  title: 耶律乙辛專權，遼道宗冤殺皇后太子
  category: politics
  importance: 3
  desc: 遼道宗寵信權臣耶律乙辛，聽信其誣陷賜死皇后蕭觀音（史稱十香詞冤案），太子耶律濬隨後也遭害死。耶律乙辛專權多年後才因意圖投宋事洩被誅。這場冤案重創遼朝統治核心，是遼朝由盛轉衰、四十餘年後亡於女真的關鍵轉折之一。
  sources:
    - title: 維基百科：耶律乙辛
      url: https://zh.wikipedia.org/wiki/耶律乙辛
    - title: 維基百科：蕭觀音
      url: https://zh.wikipedia.org/wiki/萧观音

- id: cn-yongle-city-disaster
  year: 1081
  endYear: 1082
  title: 宋神宗五路伐夏，永樂城之戰慘敗
  category: war
  importance: 4
  desc: 宋神宗趁西夏內亂發動五路大軍西征，一度攻勢凌厲，卻在隔年築永樂城扼守時遭梁太后率三十萬大軍圍攻破城，宋軍與民夫死傷逾二十萬，是北宋對外戰爭最慘重的一次失敗，神宗自此不再言兵。
  sources:
    - title: 維基百科：永樂城之戰
      url: https://zh.wikipedia.org/wiki/永樂城之戰

- id: cn-zizhi-tongjian
  year: 1084
  title: 司馬光《資治通鑑》成書
  category: culture
  importance: 4
  desc: 歷十九年編成的編年體通史，上起戰國下至五代，共二百九十四卷。體例與《史記》的紀傳體分庭抗禮，成為後世治史的兩大範式之一。
  sources:
    - title: 維基百科：資治通鑑
      url: https://zh.wikipedia.org/wiki/資治通鑑
    - title: 維基百科：司馬光
      url: https://zh.wikipedia.org/wiki/司馬光

- id: cn-mengxi-bitan
  year: 1088
  title: 沈括《夢溪筆談》
  category: science
  importance: 3
  desc: 記錄了活字印刷、磁針指向與地層成因等觀察，是宋代科技的第一手材料。
  sources:
    - title: 維基百科：夢溪筆談
      url: https://zh.wikipedia.org/wiki/夢溪筆談

- id: cn-fang-la-song-jiang-rebellion
  year: 1119
  endYear: 1121
  title: 方臘、宋江起義
  category: war
  importance: 3
  desc: 徽宗設應奉局大興花石綱搜刮奇石異木，江南民怨沸騰，方臘於歙縣起事攻陷杭州等六州五十二縣，同時宋江也聚眾起於山東、河北，後受招安。兩場民變後來分別成為《水滸傳》的故事原型，也預示了北宋統治已現裂痕。
  sources:
    - title: 維基百科：方腊起义
      url: https://zh.wikipedia.org/wiki/方腊起义
    - title: 維基百科：宋江
      url: https://zh.wikipedia.org/wiki/宋江

- id: cn-jin-founding
  year: 1115
  title: 完顏阿骨打建金，起兵反遼
  category: politics
  importance: 4
  desc: 完顏阿骨打統一女真各部後稱帝，國號「大金」，取「金不變不壞」之意，與遼朝的世仇宿怨隨即轉為公開戰爭。以猛安謀克制編組的女真軍隊十年間橫掃遼國，兵力精悍程度遠超其人口規模。
  sources:
    - title: 維基百科：完顏阿骨打
      url: https://zh.wikipedia.org/wiki/完顏阿骨打

- id: cn-jurchen-script
  year: 1119
  title: 完顏希尹創制女真文字
  category: culture
  importance: 3
  desc: 完顏希尹參照漢字與契丹字創制女真大字，稍後又制女真小字，是金朝確立自身文化認同的重要一步，也用於編譯漢文經典與官方文書。
  sources:
    - title: 維基百科：女真文
      url: https://zh.wikipedia.org/wiki/女真文

- id: cn-jin-liao-fall
  year: 1125
  title: 金滅遼，耶律大石西遷建西遼
  category: war
  importance: 4
  desc: 遼天祚帝被俘，立國二百餘年的遼朝滅亡。宗室耶律大石率殘部西遷中亞，擊敗當地突厥政權後建立西遼（哈喇契丹），延續遼的統緒近百年，直到被蒙古所滅。
  sources:
    - title: 維基百科：金滅遼之戰
      url: https://zh.wikipedia.org/wiki/金滅遼之戰
    - title: 維基百科：西遼
      url: https://zh.wikipedia.org/wiki/西辽

- id: cn-sea-alliance
  year: 1125
  title: 聯金滅遼反遭南侵
  category: politics
  importance: 3
  desc: 宋與金訂海上之盟夾攻遼，卻在合作中被看穿虛實。遼亡的同年金軍即分兩路南下，兩年後便是靖康之變。
  sources:
    - title: 維基百科：海上之盟
      url: https://zh.wikipedia.org/wiki/海上之盟
    - title: 維基百科：靖康之變
      url: https://zh.wikipedia.org/wiki/靖康之變

- id: cn-jingkang
  year: 1127
  title: 靖康之變，北宋滅亡
  category: war
  importance: 4
  sources:
    - title: 維基百科：靖康之變
      url: https://zh.wikipedia.org/wiki/靖康之變

- id: cn-southern-song-capital
  year: 1138
  title: 南宋定都臨安
  category: politics
  importance: 3
  desc: 高宗南渡後遷徙十餘年，最終擇杭州為都。建康仍作留都，開封則始終被視為正統首都。
  sources:
    - title: 維基百科：南宋
      url: https://zh.wikipedia.org/wiki/南宋

- id: cn-xixia-renzong-golden-age
  year: 1139
  endYear: 1193
  title: 夏仁宗盛世，天盛律令頒布
  category: culture
  importance: 3
  desc: 夏仁宗在位五十四年，平定任得敬分國之謀，設科舉、興儒學、崇佛法，並頒行《天盛律令》——一部體例仿唐宋、以西夏文寫成的完整法典，是西夏國力與文化的鼎盛期。
  sources:
    - title: 維基百科：夏仁宗
      url: https://zh.wikipedia.org/wiki/夏仁宗

- id: cn-shaoxing-treaty
  year: 1141
  title: 紹興和議，宋金劃淮而治
  category: politics
  importance: 3
  desc: 南宋向金稱臣納貢，以淮河大散關為界。岳飛於同年下獄遇害，北伐就此中止。
  sources:
    - title: 維基百科：紹興和議
      url: https://zh.wikipedia.org/wiki/紹興和議

- id: cn-yue-fei-death
  year: 1142
  title: 岳飛郾城大捷後遭「莫須有」罪名處死
  category: war
  importance: 5
  desc: 岳飛率岳家軍北伐屢勝，郾城一役大破金軍精銳「拐子馬」，兵鋒直逼開封。秦檜為促成和議，以「莫須有」的罪名將岳飛下獄，父子最終在風波亭遇害。岳飛之死成為此後八百年中國「精忠報國」的象徵，也是南宋主戰派最沉重的一次挫敗。
  sources:
    - title: 維基百科：岳飛
      url: https://zh.wikipedia.org/wiki/岳飞

- id: cn-zhongdu-jin-capital
  year: 1153
  title: 金遷都中都（今北京）
  category: politics
  importance: 3
  desc: 海陵王完顏亮擴建遼燕京為中都並遷都於此，人口迅速膨脹至二十餘萬戶，是北京首次成為大一統王朝級別政權的核心首都，此後元明清三代皆沿用其地。
  sources:
    - title: 維基百科：金中都
      url: https://zh.wikipedia.org/wiki/金中都

- id: cn-wanyan-liang-invasion
  year: 1161
  title: 完顏亮南侵，采石之戰擊退金軍
  category: war
  importance: 4
  desc: 金海陵王完顏亮撕毀紹興和議大舉南侵，號稱百萬大軍。虞允文在采石磯以文臣身分臨陣督戰，憑新式車船擊潰金軍水師，完顏亮隨後在前線遭部將弒殺，南宋因此轉危為安。
  sources:
    - title: 維基百科：采石之戰 (1161年)
      url: https://zh.wikipedia.org/wiki/采石之戰_(1161年)

- id: cn-jin-golden-age
  year: 1161
  endYear: 1208
  title: 金世宗大定之治，金章宗明昌之治
  category: politics
  importance: 4
  desc: 完顏雍平定完顏亮亂政後即位，崇儒尚廉、與宋修好、與民休息，被《金史》譽為「小堯舜」；其孫金章宗前期延續盛世並深化漢化，設書畫院、興文教，稱「明昌之治」。這是金朝國力與文化的頂峰，晚期卻因章宗寵信外戚而由盛轉衰。
  sources:
    - title: 維基百科：金世宗
      url: https://zh.wikipedia.org/wiki/金世宗
    - title: 維基百科：大定之治
      url: https://zh.wikipedia.org/wiki/大定之治
    - title: 維基百科：金章宗
      url: https://zh.wikipedia.org/wiki/金章宗

- id: cn-zhu-xi
  year: 1200
  title: 朱熹歿，程朱理學集大成
  category: culture
  importance: 3
  desc: 以四書取代五經為核心，元代以後成為科舉的標準，支配東亞思想界六百餘年，直到王陽明心學才出現大規模的反動。
  sources:
    - title: 維基百科：朱熹
      url: https://zh.wikipedia.org/wiki/朱熹
    - title: 維基百科：程朱理學
      url: https://zh.wikipedia.org/wiki/程朱理學

- id: cn-kaixi-expedition
  year: 1206
  endYear: 1208
  title: 韓侂胄開禧北伐兵敗，嘉定和議加碼歲幣
  category: war
  importance: 3
  desc: 權臣韓侂胄倉促北伐圖謀恢復中原，準備不足全線潰敗。南宋為求和竟將韓侂胄頭顱函送金國，換得《嘉定和議》，歲幣由紹興舊額加碼至三十萬，南宋國格再受重創。
  sources:
    - title: 維基百科：開禧北伐
      url: https://zh.wikipedia.org/wiki/開禧北伐
    - title: 維基百科：韓侂胄
      url: https://zh.wikipedia.org/wiki/韓侂冑

- id: cn-genghis
  year: 1206
  title: 成吉思汗統一蒙古
  category: politics
  importance: 5
  sources:
    - title: 維基百科：成吉思汗
      url: https://zh.wikipedia.org/wiki/成吉思汗
    - title: 維基百科：蒙古帝國
      url: https://zh.wikipedia.org/wiki/蒙古帝國

- id: cn-mongol-jin-war
  year: 1211
  title: 蒙金戰爭起，野狐嶺大破金軍
  category: war
  importance: 3
  desc: 成吉思汗與金斷交後南下，四十萬金軍潰敗。1215 年蒙軍攻陷中都，金朝遷都汴京。
  sources:
    - title: 維基百科：蒙金戰爭
      url: https://zh.wikipedia.org/wiki/蒙金戰爭
    - title: 維基百科：蒙古帝國
      url: https://zh.wikipedia.org/wiki/蒙古帝國

- id: cn-first-western-campaign
  year: 1219
  title: 蒙古第一次西征，滅花剌子模
  category: war
  importance: 4
  endYear: 1223
  desc: 因商隊遭屠殺而起兵。中亞大國兩年內亡國，蒙軍越高加索山，於迦勒迦河擊潰羅斯諸國聯軍。
  sources:
    - title: 維基百科：蒙古第一次西征
      url: https://zh.wikipedia.org/wiki/蒙古第一次西征
    - title: 維基百科：花剌子模
      url: https://zh.wikipedia.org/wiki/花剌子模
    - title: 維基百科：蒙古帝國
      url: https://zh.wikipedia.org/wiki/蒙古帝國

- id: cn-xixia-fall
  year: 1227
  title: 蒙古滅西夏
  category: war
  importance: 4
  desc: 成吉思汗發動最後一次滅夏戰役，親率大軍分東西兩路進攻，自己卻在圍城期間病逝軍中，遺命秘不發喪。西夏末帝隨後獻城出降，立國近兩百年的西夏正式滅亡。
  sources:
    - title: 維基百科：蒙古滅西夏之戰
      url: https://zh.wikipedia.org/wiki/蒙古滅西夏之戰

- id: cn-sanfeng-mountain
  year: 1232
  title: 三峰山之戰，金軍主力覆滅
  category: war
  importance: 4
  desc: 拖雷率蒙古軍在嚴寒中奔襲，於鈞州三峰山圍殲金朝最後的精銳野戰兵團，金軍主力自此不復存在，兩年後蔡州陷落只是收尾。
  sources:
    - title: 維基百科：三峰山之戰
      url: https://zh.wikipedia.org/wiki/三峰山之戰

- id: cn-mongol-destroy-jin
  year: 1234
  title: 蒙古滅金
  category: war
  importance: 3
  desc: 聯宋滅金。華北與黃土高原自此入蒙古之手，南宋失去屏障，也開啟了此後四十餘年的宋蒙戰爭。
  sources:
    - title: 維基百科：蒙金戰爭
      url: https://zh.wikipedia.org/wiki/蒙金戰爭
    - title: 維基百科：元朝
      url: https://zh.wikipedia.org/wiki/元朝

- id: cn-song-mongol-war
  year: 1235
  title: 宋蒙戰爭爆發
  category: war
  importance: 4
  endYear: 1279
  desc: 聯蒙滅金的隔年蒙軍即全面南侵。宋憑水軍與山城據守四十五年，是蒙古擴張途中耗時最久的一場征服。
  sources:
    - title: 維基百科：宋元戰爭
      url: https://zh.wikipedia.org/wiki/宋元戰爭
    - title: 維基百科：南宋
      url: https://zh.wikipedia.org/wiki/南宋

- id: cn-second-western-campaign
  year: 1236
  title: 第二次西征，滅基輔羅斯、震動東歐
  category: war
  importance: 4
  endYear: 1242
  desc: 拔都率軍西進，滅伏爾加保加利亞與基輔羅斯，再破波蘭與匈牙利，前鋒抵達亞得里亞海濱。窩闊台的死訊傳來才班師。
  sources:
    - title: 維基百科：蒙古第二次西征
      url: https://zh.wikipedia.org/wiki/蒙古第二次西征
    - title: 維基百科：拔都
      url: https://zh.wikipedia.org/wiki/拔都
    - title: 維基百科：蒙古帝國
      url: https://zh.wikipedia.org/wiki/蒙古帝國

- id: cn-mongol-khan-succession
  year: 1241
  endYear: 1251
  title: 窩闊台去世，汗位空懸十年後蒙哥即位
  category: politics
  importance: 3
  desc: 窩闊台去世使西征大軍班師，此後貴由繼位僅兩年即病逝，皇后稱制數年，帝國陷入權力真空。1251 年拖雷長子蒙哥在拔都支持下即位，一舉肅清窩闊台系與察合台系政敵，蒙古帝國的重心自此轉向拖雷家族，也為忽必烈日後經略中國鋪路。
  sources:
    - title: 維基百科：貴由
      url: https://zh.wikipedia.org/wiki/貴由
    - title: 維基百科：蒙哥
      url: https://zh.wikipedia.org/wiki/蒙哥

- id: cn-diaoyucheng
  year: 1259
  title: 釣魚城之戰，蒙哥戰死
  category: war
  importance: 4
  desc: 大汗死於合州城下。忽必烈立即撤軍北返爭位，旭烈兀也從西亞班師，蒙古在敘利亞的攻勢就此中止。一場攻城戰同時改變了歐亞兩端的走向。
  sources:
    - title: 維基百科：釣魚城之戰
      url: https://zh.wikipedia.org/wiki/釣魚城之戰
    - title: 維基百科：蒙哥
      url: https://zh.wikipedia.org/wiki/蒙哥

- id: cn-kublai-split
  year: 1260
  title: 忽必烈自立，蒙古帝國分裂為四大汗國
  category: politics
  importance: 4
  desc: 蒙哥死於釣魚城後，忽必烈與阿里不哥爭位。四年後忽必烈獲勝，但欽察、察合台、窩闊台、伊兒四大汗國自此各自獨立。
  sources:
    - title: 維基百科：忽必烈
      url: https://zh.wikipedia.org/wiki/忽必烈
    - title: 維基百科：四大汗國
      url: https://zh.wikipedia.org/wiki/四大汗國
    - title: 維基百科：蒙古帝國
      url: https://zh.wikipedia.org/wiki/蒙古帝國

- id: cn-xiangyang-siege
  year: 1267
  endYear: 1273
  title: 襄樊之戰，回回炮破城
  category: war
  importance: 4
  desc: 蒙古圍攻長江防線門戶襄陽、樊城長達六年，最終引進波斯工匠打造的巨型配重投石機「回回炮」轟破城牆，呂文煥出降。長江中游門戶洞開，是南宋滅亡前最關鍵的一役。
  sources:
    - title: 維基百科：襄樊之戰
      url: https://zh.wikipedia.org/wiki/襄樊之戰

- id: cn-phagpa-imperial-preceptor
  year: 1270
  title: 八思巴受封帝師，藏傳佛教確立特殊地位
  category: religion
  importance: 3
  desc: 忽必烈尊薩迦派高僧八思巴為帝師，統領全國佛教與吐蕃事務，並命其創制蒙古新字（八思巴文）。藏傳佛教自此在元朝宮廷享有崇高地位，也開啟了此後蒙藏關係的基本格局。
  sources:
    - title: 維基百科：八思巴
      url: https://zh.wikipedia.org/wiki/八思巴

- id: cn-yuan-proclaimed
  year: 1271
  title: 忽必烈建國號大元
  category: politics
  importance: 4
  desc: 取《易經》「大哉乾元」之意。這是中國歷史上第一個把「大」字放進正式國號的統一王朝，蒙文則並稱「大元大蒙古國」。
  sources:
    - title: 維基百科：元朝
      url: https://zh.wikipedia.org/wiki/元朝
    - title: 維基百科：忽必烈
      url: https://zh.wikipedia.org/wiki/忽必烈

- id: cn-linan-fall
  year: 1276
  title: 元軍攻佔臨安，恭帝被俘
  category: war
  importance: 4
  desc: 謝太后攜五歲恭帝出降，南宋朝廷正式覆滅。陸秀夫等大臣隨即在福州擁立端宗另立朝廷，繼續在東南沿海抵抗，直到三年後崖山之戰才畫下句點。
  sources:
    - title: 維基百科：宋元戰爭
      url: https://zh.wikipedia.org/wiki/宋元戰爭

- id: cn-yaishan
  year: 1279
  title: 崖山之戰，元朝統一全國
  category: war
  importance: 4
  sources:
    - title: 維基百科：崖山海戰
      url: https://zh.wikipedia.org/wiki/崖山海戰
    - title: 維基百科：元朝
      url: https://zh.wikipedia.org/wiki/元朝

- id: cn-shoushi-calendar
  year: 1280
  title: 郭守敬編訂《授時曆》
  category: science
  importance: 4
  desc: 郭守敬等人實測全國二十七處觀測站，推算出一年長度為365.2425日，與現行公曆完全一致，卻早了三百年，是傳統中國曆法史上最精確的一部。
  sources:
    - title: 維基百科：授時曆
      url: https://zh.wikipedia.org/wiki/授时历

- id: cn-yanyou-exam-revival
  year: 1313
  title: 延祐復科，重開科舉
  category: politics
  importance: 3
  desc: 科舉制度自南宋滅亡後中斷近四十年，元仁宗恢復開科取士，以程朱理學為考試內容，漢人與南人士子重新獲得入仕管道，卻仍受蒙古、色目人保障名額的限制。
  sources:
    - title: 維基百科：延祐復科
      url: https://zh.wikipedia.org/wiki/延祐復科

- id: cn-yuan-succession-crisis
  year: 1323
  endYear: 1333
  title: 元中期皇位繼承動盪，南坡之變與天曆之變
  category: politics
  importance: 4
  desc: 權臣鐵失刺殺元英宗於上都南郊（南坡之變），此後十年間走馬燈般換了六位皇帝，1328年更爆發兩都之戰般的天曆之變，權臣燕帖木兒操縱擁立與弒殺。頻繁的宮廷政變重創元朝統治威信，為此後民變埋下伏筆。
  sources:
    - title: 維基百科：南坡之變
      url: https://zh.wikipedia.org/wiki/南坡之變
    - title: 維基百科：天曆之變
      url: https://zh.wikipedia.org/wiki/天曆之變

- id: cn-red-turban
  year: 1351
  title: 紅巾軍起義
  category: war
  importance: 3
  desc: 鈔法變更引發物價飛漲，加上黃河改道與徵發民夫治河，十餘年間民變席捲南北。朱元璋即出身其中一支。
  sources:
    - title: 維基百科：紅巾軍
      url: https://zh.wikipedia.org/wiki/紅巾軍
    - title: 維基百科：元朝
      url: https://zh.wikipedia.org/wiki/元朝

- id: cn-ming-founding
  year: 1368
  title: 朱元璋建立明朝
  category: politics
  importance: 4
  sources:
    - title: 維基百科：明太祖
      url: https://zh.wikipedia.org/wiki/明太祖
    - title: 維基百科：明朝
      url: https://zh.wikipedia.org/wiki/明朝

- id: cn-northern-yuan
  year: 1368
  title: 元順帝北走，北元繼續奉大元國號
  category: politics
  importance: 3
  endYear: 1388
  desc: 明軍攻克大都後元廷北遷，仍據有嶺北、遼陽、甘肅、雲南等行省與明對峙。1388 年捕魚兒海之戰後大元國號被廢。
  sources:
    - title: 維基百科：北元
      url: https://zh.wikipedia.org/wiki/北元
    - title: 維基百科：元朝
      url: https://zh.wikipedia.org/wiki/元朝

- id: cn-yunnan-fall
  year: 1382
  title: 雲南梁王殉國，元朝在雲南百餘年統治結束
  category: war
  importance: 3
  desc: 明軍平定雲南，末代梁王把匝剌瓦爾密兵敗自殺。雲南是元朝滅亡後最後淪陷的行省之一，蒙古皇室在此的統治可追溯至忽必烈滅大理，前後長達一百二十八年。
  sources:
    - title: 維基百科：明平雲南之戰
      url: https://zh.wikipedia.org/wiki/明平雲南之戰

- id: cn-abolish-chancellor
  year: 1380
  title: 廢除宰相，六部直屬皇帝
  category: politics
  importance: 4
  desc: 朱元璋以擅權植黨之名處死丞相胡惟庸，順勢廢掉行之一千六百年的宰相制度，君權與相權集於一身。此案連坐受誅逾三萬人；十年後藍玉案再興大獄，株連約一萬五千人，兩案合稱「胡藍之獄」，開國功臣幾乎為之一空。
  sources:
    - title: 維基百科：胡惟庸案
      url: https://zh.wikipedia.org/wiki/胡惟庸案
    - title: 維基百科：藍玉案
      url: https://zh.wikipedia.org/wiki/藍玉案
    - title: 維基百科：明朝
      url: https://zh.wikipedia.org/wiki/明朝

- id: cn-jingnan
  year: 1399
  title: 靖難之役，成祖奪位
  category: war
  importance: 3
  endYear: 1402
  desc: 建文帝削藩，燕王朱棣以「清君側」起兵，三年後攻入南京稱帝。此後遷都北京、六下西洋、修《永樂大典》皆出其手。
  sources:
    - title: 維基百科：靖難之役
      url: https://zh.wikipedia.org/wiki/靖難之役

- id: cn-zheng-he
  year: 1405
  title: 鄭和下西洋
  category: economy
  importance: 5
  endYear: 1433
  desc: 七次遠航直抵東非，規模遠超同時期的歐洲航海，卻在其後戛然而止。
  sources:
    - title: 維基百科：鄭和下西洋
      url: https://zh.wikipedia.org/wiki/鄭和下西洋

- id: cn-yongle-encyclopedia
  year: 1408
  title: 《永樂大典》成書
  category: culture
  importance: 3
  desc: 二萬二千餘卷、約三億七千萬字，引書七八千種且未加刪節 —— 這點與後來的《四庫全書》正好相反。僅抄一部，今存不足百分之四。
  sources:
    - title: 維基百科：永樂大典
      url: https://zh.wikipedia.org/wiki/永樂大典
    - title: 維基百科：明朝
      url: https://zh.wikipedia.org/wiki/明朝

- id: cn-beijing-capital
  year: 1421
  title: 明成祖遷都北京
  category: politics
  importance: 3
  sources:
    - title: 維基百科：明成祖
      url: https://zh.wikipedia.org/wiki/明成祖

- id: cn-tumu-crisis
  year: 1449
  title: 土木堡之變，明朝由盛轉衰
  category: war
  importance: 4
  desc: 宦官王振慫恿英宗親征瓦剌，二十萬大軍潰於土木堡，三大營幾乎全軍覆沒，皇帝被俘。此後明朝對北方由攻轉守。
  sources:
    - title: 維基百科：土木堡之變
      url: https://zh.wikipedia.org/wiki/土木堡之變
    - title: 維基百科：明朝
      url: https://zh.wikipedia.org/wiki/明朝

- id: cn-duomen-restoration
  year: 1457
  title: 奪門之變，英宗復辟
  category: politics
  importance: 3
  desc: 被俘的英宗獲釋後遭弟弟景帝軟禁七年，趁景帝病重發動政變重登帝位，隨即處死力保北京的功臣于謙，是明朝罕見的皇帝復位事件。
  sources:
    - title: 維基百科：奪門之變
      url: https://zh.wikipedia.org/wiki/奪門之變

- id: cn-wang-yangming
  year: 1508
  title: 王陽明龍場悟道，心學興起
  category: culture
  importance: 4
  desc: 貶謫貴州龍場時提出「心外無理」，後倡致良知與知行合一。心學把人的主體性放進學說重心，一洗程朱理學之弊，並東傳日本與朝鮮。
  sources:
    - title: 維基百科：王守仁
      url: https://zh.wikipedia.org/wiki/王守仁
    - title: 維基百科：心學
      url: https://zh.wikipedia.org/wiki/心學

- id: cn-great-rites-controversy
  year: 1521
  endYear: 1524
  title: 大禮議之爭
  category: politics
  importance: 3
  desc: 以外藩身分入繼大統的嘉靖帝，堅持追尊生父為皇考而非僅稱皇叔，與內閣楊廷和等朝臣爆發長達三年的禮法之爭，最終皇帝獲勝，卻也重創了文官集團的制衡力量。
  sources:
    - title: 維基百科：大禮議
      url: https://zh.wikipedia.org/wiki/大禮議

- id: cn-gengxu-incident
  year: 1550
  title: 庚戌之變，俺答汗兵臨北京城下
  category: war
  importance: 3
  desc: 蒙古土默特部俺答汗因求貢遭拒，率軍長驅直入圍攻北京城外八天，大肆焚掠而去，暴露京營戰力空虛，促成二十年後的隆慶封貢和議。
  sources:
    - title: 維基百科：庚戌之變
      url: https://zh.wikipedia.org/wiki/庚戌之變

- id: cn-macau-lease
  year: 1557
  title: 葡萄牙人取得澳門居留權
  category: economy
  importance: 3
  desc: 歐洲人在東亞的第一個長期據點，成為中國、日本與歐洲三方轉口貿易的節點。
  sources:
    - title: 維基百科：葡屬澳門
      url: https://zh.wikipedia.org/wiki/葡屬澳門
    - title: 維基百科：澳門歷史
      url: https://zh.wikipedia.org/wiki/澳門歷史

- id: cn-longqing-opening
  year: 1567
  title: 隆慶開關，部分解除海禁
  category: economy
  importance: 4
  desc: 漳州月港開放民間出海貿易。此前的走私與倭亂大幅減少，美洲白銀自此經馬尼拉大量流入，支撐了晚明的銀本位。
  sources:
    - title: 維基百科：隆慶開關
      url: https://zh.wikipedia.org/wiki/隆慶開關
    - title: 維基百科：明朝
      url: https://zh.wikipedia.org/wiki/明朝

- id: cn-manila-galleon
  year: 1571
  title: 馬尼拉大帆船開航，美洲白銀流入
  category: economy
  importance: 4
  desc: 美洲白銀經馬尼拉大量進入中國，支撐了明代後期的銀本位與賦稅折銀。
  sources:
    - title: 維基百科：馬尼拉大帆船
      url: https://zh.wikipedia.org/wiki/馬尼拉大帆船

- id: cn-zhang-juzheng
  year: 1573
  title: 張居正改革
  category: politics
  importance: 3
  sources:
    - title: 維基百科：張居正
      url: https://zh.wikipedia.org/wiki/張居正

- id: cn-bencao-gangmu
  year: 1578
  title: 李時珍《本草綱目》成書
  category: science
  importance: 4
  desc: 收錄藥物近一千九百種，體例上以自然屬性分類，而非依療效編排。
  sources:
    - title: 維基百科：本草綱目
      url: https://zh.wikipedia.org/wiki/本草綱目

- id: cn-imjin-war
  year: 1592
  title: 萬曆朝鮮之役，明軍援朝抗日
  category: war
  importance: 4
  endYear: 1598
  desc: 明、朝鮮、日本三方投入的大規模戰爭，耗竭明朝國庫，也削弱了豐臣政權。
  sources:
    - title: 維基百科：萬曆朝鮮之役
      url: https://zh.wikipedia.org/wiki/萬曆朝鮮之役

- id: cn-sweet-potato
  year: 1593
  title: 番薯自呂宋傳入福建
  category: economy
  importance: 4
  desc: 耐旱、可種於瘠地的新作物。與玉米一同讓中國人口在此後兩百年間增長數倍。
  sources:
    - title: 維基百科：番薯
      url: https://zh.wikipedia.org/wiki/番薯
    - title: 維基百科：陳振龍
      url: https://zh.wikipedia.org/wiki/陳振龍

- id: cn-peony-pavilion
  year: 1598
  title: 湯顯祖《牡丹亭》
  category: culture
  importance: 3
  desc: 崑曲的代表作，也是晚明市民文化興盛的指標。
  sources:
    - title: 維基百科：牡丹亭
      url: https://zh.wikipedia.org/wiki/牡丹亭

- id: cn-ricci-beijing
  year: 1601
  title: 利瑪竇入北京，西學東漸
  category: religion
  importance: 4
  desc: 以曆算與輿圖為敲門磚傳教，把歐幾里得幾何與世界地圖一併帶進士大夫圈子。
  sources:
    - title: 維基百科：利瑪竇
      url: https://zh.wikipedia.org/wiki/利瑪竇

- id: cn-eight-banners
  year: 1615
  title: 努爾哈赤創建八旗制度
  category: politics
  importance: 4
  desc: 將女真各部按軍事編制整編為八旗，兵民合一、出則為兵入則為民，是後金崛起的組織根基，也是日後滿洲統治中國近三百年的核心制度。
  sources:
    - title: 維基百科：八旗
      url: https://zh.wikipedia.org/wiki/八旗

- id: cn-later-jin
  year: 1616
  title: 努爾哈赤建後金
  category: politics
  importance: 4
  sources:
    - title: 維基百科：努爾哈赤
      url: https://zh.wikipedia.org/wiki/努爾哈赤

- id: cn-seven-grievances
  year: 1618
  title: 七大恨，後金起兵反明
  category: war
  importance: 3
  desc: 努爾哈赤以「七大恨」告天，正式起兵伐明，隔年即在薩爾滸大破明軍四路。
  sources:
    - title: 維基百科：七大恨
      url: https://zh.wikipedia.org/wiki/七大恨

- id: cn-sarhu
  year: 1619
  title: 薩爾滸之戰，明清攻守易勢
  category: war
  importance: 3
  desc: 努爾哈赤以少擊眾，明軍四路喪其三。此後明朝在遼東由攻轉守，再無力主動出擊。
  sources:
    - title: 維基百科：薩爾滸之戰
      url: https://zh.wikipedia.org/wiki/薩爾滸之戰

- id: cn-little-ice-age
  year: 1620
  title: 小冰河期最冷階段，農業歉收
  category: economy
  importance: 3
  endYear: 1710
  desc: 極端低溫使作物減產、財政收入下滑，旱災與流民接連而起。這是明末民變與王朝崩解的背景之一，而非單一事件。
  sources:
    - title: 維基百科：小冰期
      url: https://zh.wikipedia.org/wiki/小冰期
    - title: 維基百科：南明
      url: https://zh.wikipedia.org/wiki/南明
    - title: 維基百科：明末民變
      url: https://zh.wikipedia.org/wiki/明末民變

- id: cn-donglin-eunuchs
  year: 1624
  title: 魏忠賢閹黨與東林黨爭
  category: politics
  importance: 3
  desc: 天啟年間閹黨大興冤獄，東林人士遭誅戮。崇禎即位後雖剷除閹黨，黨爭卻未止，吏治持續敗壞。
  sources:
    - title: 維基百科：魏忠賢
      url: https://zh.wikipedia.org/wiki/魏忠賢
    - title: 維基百科：東林黨
      url: https://zh.wikipedia.org/wiki/東林黨

- id: cn-ningyuan-battle
  year: 1626
  title: 寧遠之戰，努爾哈赤負傷病逝
  category: war
  importance: 4
  desc: 明將袁崇煥以紅夷大砲固守寧遠，擊退努爾哈赤親率的十三萬大軍，是後金崛起以來首次重大挫敗。努爾哈赤數月後傷重去世，皇太極繼位。
  sources:
    - title: 維基百科：寧遠之戰
      url: https://zh.wikipedia.org/wiki/寧遠之戰

- id: cn-jisi-incident
  year: 1629
  title: 己巳之變，皇太極首次入塞，袁崇煥下獄被殺
  category: war
  importance: 4
  desc: 皇太極繞道蒙古突破長城防線，直逼北京城下，寧遠之戰的功臣袁崇煥星夜回援卻反遭崇禎帝以通敵之罪凌遲處死，明朝自毀長城，遼東再無良將可用。
  sources:
    - title: 維基百科：己巳之變 (崇禎)
      url: https://zh.wikipedia.org/wiki/己巳之變_(崇禎)

- id: cn-late-ming-rebellions
  year: 1630
  endYear: 1641
  title: 李自成、張獻忠等民變勢力坐大
  category: war
  importance: 4
  desc: 陝西饑荒與加派並起，流民聚為民變，李自成、張獻忠等部在官軍圍剿與招撫間反覆坐大。1641 年李自成攻破洛陽、殺福王朱常洵，民變自此從流竄劫掠轉為足以顛覆王朝的力量。
  sources:
    - title: 維基百科：李自成
      url: https://zh.wikipedia.org/wiki/李自成
    - title: 維基百科：張獻忠
      url: https://zh.wikipedia.org/wiki/張獻忠

- id: cn-qing-proclaimed
  year: 1636
  title: 皇太極改國號為清
  category: politics
  importance: 3
  desc: 皇太極先於前一年降服漠南蒙古末代大汗林丹汗之子，並將女真族名改為滿洲，隨後在盛京稱帝，改國號大清，滿蒙聯合統治的格局自此成形。
  sources:
    - title: 維基百科：皇太極
      url: https://zh.wikipedia.org/wiki/皇太極

- id: cn-tiangong-kaiwu
  year: 1637
  title: 宋應星《天工開物》
  category: science
  importance: 4
  desc: 系統記錄農業與手工業的實作技術，在當時的士人著作裡相當罕見。
  sources:
    - title: 維基百科：天工開物
      url: https://zh.wikipedia.org/wiki/天工開物

- id: cn-songjin-campaign
  year: 1642
  title: 松錦之戰，明朝關外主力覆滅
  category: war
  importance: 4
  desc: 清軍圍困松山、錦州近兩年，明將洪承疇兵敗被俘後降清，明朝在關外最後一支主力全軍覆沒，山海關外已無力抵禦，兩年後清軍便長驅入關。
  sources:
    - title: 維基百科：松錦之戰
      url: https://zh.wikipedia.org/wiki/松錦之戰

- id: cn-qing-enters
  year: 1644
  title: 李自成入北京，清軍入關
  category: war
  importance: 5
  sources:
    - title: 維基百科：李自成
      url: https://zh.wikipedia.org/wiki/李自成
    - title: 維基百科：甲申之變
      url: https://zh.wikipedia.org/wiki/甲申之變

- id: cn-southern-ming
  year: 1644
  title: 南明諸政權相繼建立與覆滅
  category: politics
  importance: 4
  endYear: 1662
  desc: 弘光、隆武、紹武、永曆等政權在南方接連而起，彼此不相統屬甚至互相攻伐。1659 年永曆帝在吳三桂追擊下逃入緬甸，1662 年遭吳三桂率軍入緬索回，於昆明遇害，南明告終。
  sources:
    - title: 維基百科：南明
      url: https://zh.wikipedia.org/wiki/南明

- id: cn-queue-order
  year: 1645
  title: 剃髮易服令
  category: politics
  importance: 3
  desc: 「留頭不留髮」的強制同化，激起江南各地激烈抵抗。
  sources:
    - title: 維基百科：剃髮易服
      url: https://zh.wikipedia.org/wiki/剃髮易服

- id: cn-yangzhou-massacre
  year: 1645
  title: 揚州十日，史可法殉城
  category: war
  importance: 3
  desc: 清軍破揚州後屠城。同年弘光政權覆滅，江南反剃髮的抗清鬥爭隨之而起。
  sources:
    - title: 維基百科：揚州十日
      url: https://zh.wikipedia.org/wiki/揚州十日
    - title: 維基百科：史可法
      url: https://zh.wikipedia.org/wiki/史可法

- id: cn-li-dingguo-victories
  year: 1652
  title: 李定國兩蹶名王，南明中興一線生機
  category: war
  importance: 4
  desc: 原大西軍將領李定國奉永曆政權出兵，桂林一役逼死清定南王孔有德，衡陽一役陣斬清敬謹親王尼堪，是南明抗清以來最輝煌的戰果，一度讓復國看似有望。
  sources:
    - title: 維基百科：李定國
      url: https://zh.wikipedia.org/wiki/李定國

- id: cn-zheng-chenggong-northern-expedition
  year: 1659
  title: 鄭成功北伐兵臨南京，功敗垂成
  category: war
  importance: 4
  desc: 鄭成功率十餘萬大軍溯長江而上，一度兵臨南京城下，卻中緩兵之計延誤戰機，最終大敗撤回廈門。北伐受挫促使他轉而東取臺灣，作為反清基地。
  sources:
    - title: 維基百科：鄭成功北伐
      url: https://zh.wikipedia.org/wiki/鄭成功北伐

- id: cn-koxinga
  year: 1662
  title: 鄭成功驅逐荷蘭人，取得臺灣
  category: war
  importance: 3
  sources:
    - title: 維基百科：鄭成功攻臺之役
      url: https://zh.wikipedia.org/wiki/鄭成功攻臺之役

- id: cn-kangxi-regent-ousted
  year: 1669
  title: 康熙帝智擒鰲拜，正式親政
  category: politics
  importance: 4
  desc: 十六歲的康熙帝以布庫少年設局擒拿專擅跋扈的輔政大臣鰲拜，結束四大臣輔政體制，開啟長達六十一年的親政時期。
  sources:
    - title: 維基百科：鼇拜
      url: https://zh.wikipedia.org/wiki/鼇拜

- id: cn-three-feudatories
  year: 1673
  title: 三藩之亂
  category: war
  importance: 4
  endYear: 1681
  desc: 康熙撤藩引發的八年內戰。平定之後，清朝對南方的統治才真正穩固。
  sources:
    - title: 維基百科：三藩之亂
      url: https://zh.wikipedia.org/wiki/三藩之亂

- id: cn-taiwan-qing
  year: 1683
  title: 清朝統一臺灣
  category: politics
  importance: 3
  sources:
    - title: 維基百科：澎湖海戰
      url: https://zh.wikipedia.org/wiki/澎湖海戰

- id: cn-nerchinsk
  year: 1689
  title: 尼布楚條約，中俄劃定東段邊界
  category: politics
  importance: 4
  desc: 中國第一份與歐洲國家對等簽訂的條約，以拉丁文為正本。
  sources:
    - title: 維基百科：尼布楚條約
      url: https://zh.wikipedia.org/wiki/尼布楚條約

- id: cn-galdan-campaigns
  year: 1690
  title: 三征噶爾丹，喀爾喀蒙古歸清
  category: war
  importance: 3
  endYear: 1697
  desc: 準噶爾汗噶爾丹東征喀爾喀，康熙三度親征將其擊滅。多倫會盟後外蒙古正式納入版圖。
  sources:
    - title: 維基百科：三征噶爾丹
      url: https://zh.wikipedia.org/wiki/三征噶爾丹
    - title: 維基百科：多倫會盟
      url: https://zh.wikipedia.org/wiki/多倫會盟

- id: cn-poll-tax-frozen
  year: 1712
  title: 滋生人丁永不加賦
  category: economy
  importance: 3
  desc: 人頭稅額就此凍結，隨後併入田賦（攤丁入畝），隱匿人口的誘因消失，戶口數字開始暴增。
  sources:
    - title: 維基百科：攤丁入畝
      url: https://zh.wikipedia.org/wiki/攤丁入畝

- id: cn-rites-controversy
  year: 1724
  title: 雍正禁教，中國禮儀之爭落幕
  category: religion
  importance: 3
  desc: 祭祖祭孔算不算偶像崇拜的爭執，最終以全面禁教收場，西學東漸中斷百餘年。
  sources:
    - title: 維基百科：中國禮儀之爭
      url: https://zh.wikipedia.org/wiki/中國禮儀之爭

- id: cn-kyakhta-treaty
  year: 1727
  title: 恰克圖條約，劃定漠北中俄疆界
  category: politics
  importance: 3
  desc: 繼尼布楚條約劃定東段邊界後，這次條約確立了外蒙古與西伯利亞之間的邊界，並開放恰克圖為兩國通商口岸。
  sources:
    - title: 維基百科：恰克圖界約
      url: https://zh.wikipedia.org/wiki/恰克圖界約

- id: cn-grand-council
  year: 1729
  title: 軍機處設立，皇權高度集中
  category: politics
  importance: 4
  desc: 原是為西征準噶爾而設的軍務機構，後來成為實際的決策中樞，繞過內閣直達皇帝，密摺制度至此完備。
  sources:
    - title: 維基百科：軍機處
      url: https://zh.wikipedia.org/wiki/軍機處

- id: cn-tanding-ruyi
  year: 1735
  title: 攤丁入畝定制，耗羨歸公與養廉銀
  category: economy
  importance: 4
  desc: 雍正將丁銀全數併入田賦徵收，並把地方私徵的耗羨銀收歸中央、轉發官員為養廉銀，同時抑制陋規、增加國庫收入，是清代財政制度最重要的一次整頓。
  sources:
    - title: 維基百科：攤丁入地
      url: https://zh.wikipedia.org/wiki/攤丁入地

- id: cn-dream-red-chamber
  year: 1754
  title: 《紅樓夢》抄本流傳
  category: culture
  importance: 4
  desc: 曹雪芹生前僅以抄本傳世，成書年份只能推定。
  sources:
    - title: 維基百科：紅樓夢
      url: https://zh.wikipedia.org/wiki/紅樓夢

- id: cn-canton-system
  year: 1757
  title: 一口通商，廣州十三行專營對外貿易
  category: economy
  importance: 4
  desc: 對歐貿易集中於廣州一港並由行商包辦，這個體制一直維持到鴉片戰爭。
  sources:
    - title: 維基百科：一口通商
      url: https://zh.wikipedia.org/wiki/一口通商
    - title: 維基百科：廣州十三行
      url: https://zh.wikipedia.org/wiki/廣州十三行

- id: cn-xinjiang-conquest
  year: 1759
  title: 平定準噶爾與回部，疆域達於極盛
  category: war
  importance: 4
  desc: 乾隆先滅準噶爾，再平大小和卓，天山南北納入版圖。清朝疆域至此約一千三百萬平方公里。
  sources:
    - title: 維基百科：三征噶爾丹
      url: https://zh.wikipedia.org/wiki/三征噶爾丹
    - title: 維基百科：大小和卓之亂
      url: https://zh.wikipedia.org/wiki/大小和卓之亂

- id: cn-burma-campaigns
  year: 1769
  endYear: 1788
  title: 清緬戰爭，四征皆無功而返
  category: war
  importance: 3
  desc: 乾隆四度出兵緬甸貢榜王朝，瘴癘與叢林戰重創清軍，最終雙方僅止戰言和，是乾隆「十全武功」中唯一未能真正取勝的一役。
  sources:
    - title: 維基百科：清緬戰爭
      url: https://zh.wikipedia.org/wiki/清緬戰爭

- id: cn-siku-quanshu
  year: 1782
  title: 《四庫全書》修成
  category: culture
  importance: 4
  desc: 規模空前的叢書工程，同時也是一次大規模的禁毀與刪改。
  sources:
    - title: 維基百科：四庫全書
      url: https://zh.wikipedia.org/wiki/四庫全書

- id: cn-macartney
  year: 1793
  title: 馬戛爾尼使華
  category: politics
  importance: 3
  desc: 英國使節團要求通商被拒，常被視為兩個世界秩序的正面相遇。
  sources:
    - title: 維基百科：馬戛爾尼使團
      url: https://zh.wikipedia.org/wiki/馬戛爾尼使團

- id: cn-white-lotus
  year: 1796
  title: 川楚白蓮教起事
  category: war
  importance: 3
  endYear: 1804
  desc: 歷時九年才平定，軍費耗盡國庫，八旗綠營的戰力衰退也就此暴露。
  sources:
    - title: 維基百科：川楚教亂
      url: https://zh.wikipedia.org/wiki/川楚教亂

- id: cn-heshen-fall
  year: 1799
  title: 乾隆逝世，嘉慶誅殺和珅
  category: politics
  importance: 4
  desc: 乾隆帝以太上皇身分掌權四年後去世，嘉慶帝隨即賜死寵臣和珅並抄沒家產，據稱其資產相當於當時國庫數年收入，「和珅跌倒，嘉慶吃飽」之說由此而來。
  sources:
    - title: 維基百科：和珅
      url: https://zh.wikipedia.org/wiki/和珅

- id: cn-opium-war
  year: 1840
  title: 鴉片戰爭
  category: war
  importance: 5
  endYear: 1842
  desc: 林則徐虎門銷煙引發開戰。戰敗後簽下《南京條約》 —— 五口通商、割讓香港、賠款兩千一百萬銀元，是清朝第一個不平等條約。
  sources:
    - title: 維基百科：第一次鴉片戰爭
      url: https://zh.wikipedia.org/wiki/第一次鴉片戰爭
    - title: 維基百科：南京條約
      url: https://zh.wikipedia.org/wiki/南京條約

- id: cn-taiping
  year: 1851
  title: 太平天國
  category: war
  importance: 4
  endYear: 1864
  sources:
    - title: 維基百科：太平天國
      url: https://zh.wikipedia.org/wiki/太平天國

- id: cn-second-opium-war
  year: 1856
  title: 第二次鴉片戰爭；英法聯軍火燒圓明園
  category: war
  importance: 4
  endYear: 1860
  desc: 修約交涉破裂而開戰。1860 年聯軍攻陷北京、焚毀圓明園，清廷簽下《天津條約》與《北京條約》。
  sources:
    - title: 維基百科：第二次鴉片戰爭
      url: https://zh.wikipedia.org/wiki/第二次鴉片戰爭
    - title: 維基百科：圓明園
      url: https://zh.wikipedia.org/wiki/圓明園
    - title: 維基百科：北京條約
      url: https://zh.wikipedia.org/wiki/北京條約

- id: cn-aigun-treaty
  year: 1858
  title: 璦琿條約，俄國取走外東北
  category: politics
  importance: 3
  desc: 俄方以調停有功為由取得黑龍江以北。1860 年北京條約再割烏蘇里江以東，1864 年勘分西北界又割外西北。
  sources:
    - title: 維基百科：璦琿條約
      url: https://zh.wikipedia.org/wiki/璦琿條約
    - title: 維基百科：北京條約
      url: https://zh.wikipedia.org/wiki/北京條約

- id: cn-xinyou-coup
  year: 1861
