  category: religion
  importance: 3
  sources:
    - title: 維基百科：法顯
      url: https://zh.wikipedia.org/wiki/法顯

- id: cn-liu-song
  year: 420
  title: 劉裕代晉建宋，南朝之始
  category: politics
  importance: 4
  desc: 出身行伍的劉裕受晉禪代，定都建康。此後宋、齊、梁、陳四代相繼，與北方政權對峙一百七十年，史稱南北朝。
  sources:
    - title: 維基百科：劉宋
      url: https://zh.wikipedia.org/wiki/劉宋
    - title: 維基百科：劉裕
      url: https://zh.wikipedia.org/wiki/劉裕
    - title: 維基百科：南北朝
      url: https://zh.wikipedia.org/wiki/南北朝

- id: cn-yuanjia-era
  year: 424
  title: 元嘉之治
  category: politics
  importance: 3
  endYear: 453
  desc: 宋文帝在位三十年，勵精圖治、提倡節儉、澄清吏治，江南經濟大幅提升 —— 南朝國力的高點。三次北伐皆無功，最後死於太子之手。
  sources:
    - title: 維基百科：元嘉之治
      url: https://zh.wikipedia.org/wiki/元嘉之治
    - title: 維基百科：宋文帝
      url: https://zh.wikipedia.org/wiki/宋文帝

- id: cn-wei-unify-north
  year: 439
  title: 北魏統一北方，南北朝格局確立
  category: politics
  importance: 4
  desc: 太武帝先後滅夏、北燕、北涼，結束十六國。此後與南朝隔淮對峙一百五十年 —— 「南北朝」這個格局至此才真正成形。
  sources:
    - title: 維基百科：北魏
      url: https://zh.wikipedia.org/wiki/北魏
    - title: 維基百科：南北朝
      url: https://zh.wikipedia.org/wiki/南北朝

- id: cn-yungang-grottoes
  year: 453
  title: 詔開鑿雲岡石窟
  category: religion
  importance: 4
  desc: 太武帝滅佛後文成帝復法，隨即下詔開窟。與後來的龍門石窟同為北魏佛教藝術的代表 —— 佛像的面容自此由犍陀羅式逐步轉為漢地樣貌。
  sources:
    - title: 維基百科：雲岡石窟
      url: https://zh.wikipedia.org/wiki/雲岡石窟
    - title: 維基百科：北魏
      url: https://zh.wikipedia.org/wiki/北魏

- id: cn-southern-qi
  year: 479
  title: 蕭道成代宋建齊
  category: politics
  importance: 3
  desc: 劉宋末年宗王與強臣連年內鬥，蕭道成藉平叛與政變掌權後篡位。南齊僅二十三年，是南朝最短的一代。
  sources:
    - title: 維基百科：南齊
      url: https://zh.wikipedia.org/wiki/南齊
    - title: 維基百科：蕭道成
      url: https://zh.wikipedia.org/wiki/蕭道成

- id: cn-zu-chongzhi-pi
  year: 480
  title: 祖沖之推算圓周率至小數七位
  category: science
  importance: 4
  desc: 3.1415926 與 3.1415927 之間的上下界，這個精度在世界上領先了將近千年。
  sources:
    - title: 維基百科：祖沖之
      url: https://zh.wikipedia.org/wiki/祖沖之

- id: cn-equal-field
  year: 485
  title: 北魏推行均田制
  category: economy
  importance: 3
  sources:
    - title: 維基百科：均田制
      url: https://zh.wikipedia.org/wiki/均田制

- id: cn-xiaowen-sinicization
  year: 494
  title: 孝文帝遷都洛陽，全面漢化
  category: politics
  importance: 4
  desc: 次年禁鮮卑語，496 年令八大貴族改漢姓（皇族拓跋改姓元），並著漢服、與漢人通婚。這是中國史上規模最大的一次由統治民族主動推行的漢化。
  sources:
    - title: 維基百科：魏孝文帝
      url: https://zh.wikipedia.org/wiki/魏孝文帝
    - title: 維基百科：北魏
      url: https://zh.wikipedia.org/wiki/北魏

- id: cn-southern-liang
  year: 502
  title: 蕭衍代齊建梁
  category: politics
  importance: 3
  desc: 梁武帝在位四十八年，是南北朝在世最久的皇帝。早年頗有作為，晚年篤信佛教、三度捨身同泰寺，朝政日弛。
  sources:
    - title: 維基百科：南梁
      url: https://zh.wikipedia.org/wiki/南梁
    - title: 維基百科：梁武帝
      url: https://zh.wikipedia.org/wiki/梁武帝

- id: cn-wei-split
  year: 534
  title: 北魏分裂為東魏、西魏
  category: politics
  importance: 3
  desc: 高歡與宇文泰各擁宗室，一據鄴城、一據長安。北方重回分裂，兩邊此後長期攻伐。
  sources:
    - title: 維基百科：東魏
      url: https://zh.wikipedia.org/wiki/東魏
    - title: 維基百科：西魏
      url: https://zh.wikipedia.org/wiki/西魏
    - title: 維基百科：北魏
      url: https://zh.wikipedia.org/wiki/北魏

- id: cn-houjing-rebellion
  year: 548
  title: 侯景之亂
  category: war
  importance: 4
  endYear: 552
  desc: 東魏降將侯景圍攻建康，各地宗室觀望不救。武帝餓死台城，繁華的江南遭徹底破壞，門閥世族在此役後一蹶不振 —— 南朝自此無力與北方抗衡。
  sources:
    - title: 維基百科：侯景之亂
      url: https://zh.wikipedia.org/wiki/侯景之亂
    - title: 維基百科：南梁
      url: https://zh.wikipedia.org/wiki/南梁

- id: cn-qi-zhou
  year: 550
  title: 北齊代東魏，七年後北周代西魏
  category: politics
  importance: 3
  desc: 高洋建北齊，宇文覺建北周。北齊據關東最為富庶，北周據關中而行府兵制與六官制 —— 最後勝出的是後者，那套制度也被隋唐承繼。
  sources:
    - title: 維基百科：北齊
      url: https://zh.wikipedia.org/wiki/北齊
    - title: 維基百科：北周
      url: https://zh.wikipedia.org/wiki/北周
    - title: 維基百科：府兵制
      url: https://zh.wikipedia.org/wiki/府兵制

- id: cn-southern-chen
  year: 557
  title: 陳霸先代梁建陳，南朝最後一代
  category: politics
  importance: 3
  desc: 承接侯景之亂與江陵陷落後的殘局，疆域已縮至長江以南。三十二年後為隋所滅，南北分裂就此告終。
  sources:
    - title: 維基百科：南陳
      url: https://zh.wikipedia.org/wiki/南陳
    - title: 維基百科：陳霸先
      url: https://zh.wikipedia.org/wiki/陳霸先

- id: cn-zhou-unify-north
  year: 577
  title: 北周滅北齊，統一北方
  category: war
  importance: 3
  desc: 周武帝親征滅齊。四年後外戚楊堅代周建隋，再八年滅陳 —— 自魏晉以來四百年的分裂就此終結。
  sources:
    - title: 維基百科：北周
      url: https://zh.wikipedia.org/wiki/北周
    - title: 維基百科：北齊
      url: https://zh.wikipedia.org/wiki/北齊

- id: cn-sui-founded
  year: 581
  title: 楊堅代周建隋，開皇之治
  category: politics
  importance: 4
  desc: 外戚受禪代周。輕徭薄賦、廣設義倉，戶口由四百餘萬增至八百餘萬，社會累積的財富足供五六十年之用 —— 這份底子後來被煬帝耗盡。
  sources:
    - title: 維基百科：隋文帝
      url: https://zh.wikipedia.org/wiki/隋文帝
    - title: 維基百科：開皇之治
      url: https://zh.wikipedia.org/wiki/開皇之治
    - title: 維基百科：隋朝
      url: https://zh.wikipedia.org/wiki/隋朝

- id: cn-kaihuang-code
  year: 583
  title: 頒行《開皇律》，確立三省六部
  category: politics
  importance: 3
  desc: 博採南北律典之長，廢除鞭刑、梟首、裂刑等酷刑，史稱「刑網簡要，疏而不失」。連同三省六部與州縣二級制，成為唐及此後各代的基本架構。
  sources:
    - title: 維基百科：開皇律
      url: https://zh.wikipedia.org/wiki/開皇律
