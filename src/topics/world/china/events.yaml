  category: politics
  importance: 5
  sources:
    - title: 維基百科：漢高祖
      url: https://zh.wikipedia.org/wiki/漢高祖
    - title: 維基百科：西漢
      url: https://zh.wikipedia.org/wiki/西漢

- id: cn-baideng
  year: -200
  title: 白登之圍，漢對匈奴改採和親
  category: war
  importance: 4
  desc: 高祖親征匈奴，反被冒頓單于困於白登山七日。此後六十年漢廷以宗室女與歲幣換取邊境安定 —— 中原王朝面對草原勢力的兩條路，退讓與征伐，起點都在這一戰。
  sources:
    - title: 維基百科：白登之圍
      url: https://zh.wikipedia.org/wiki/白登之圍
    - title: 維基百科：和親
      url: https://zh.wikipedia.org/wiki/和親
    - title: 維基百科：漢匈戰爭
      url: https://zh.wikipedia.org/wiki/漢匈戰爭

- id: cn-wenjing-rule
  year: -180
  endYear: -141
  title: 文景之治，休養生息
  category: politics
  importance: 4
  desc: 文帝、景帝兩朝約法省禁、輕徭薄賦，田租一度全免，其後定為三十稅一。四十年不興大役，府庫充盈到串錢的繩子都朽爛 —— 武帝日後得以連年用兵，本錢就是這裡攢下的。
  sources:
    - title: 維基百科：文景之治
      url: https://zh.wikipedia.org/wiki/文景之治

- id: cn-seven-states-rebellion
  year: -154
  title: 七國之亂，諸侯王勢力遭剪除
  category: war
  importance: 4
  desc: 景帝採晁錯之議削藩，吳楚等七國以「誅晁錯，清君側」起兵，三個月即平。漢初郡國並行留下的封建殘餘自此失去武力，替武帝的中央集權清好了場。
  sources:
    - title: 維基百科：七國之亂
      url: https://zh.wikipedia.org/wiki/七國之亂
    - title: 維基百科：郡國制
      url: https://zh.wikipedia.org/wiki/郡國制

- id: cn-wudi
  year: -141
  title: 漢武帝即位
  category: politics
  importance: 4
  sources:
    - title: 維基百科：漢武帝
      url: https://zh.wikipedia.org/wiki/漢武帝

- id: cn-zhang-qian
  year: -138
  title: 張騫出使西域，絲路開通
  category: economy
  importance: 5
  desc: 首次把中原與中亞、乃至地中海世界的貿易網路連起來。
  sources:
    - title: 維基百科：張騫
      url: https://zh.wikipedia.org/wiki/張騫
    - title: 維基百科：絲綢之路
      url: https://zh.wikipedia.org/wiki/絲綢之路

- id: cn-confucian-orthodoxy
  year: -134
  title: 罷黜百家，獨尊儒術
  category: culture
  importance: 5
  desc: 董仲舒對策，儒學自此成為官學與選官的標準。此後兩千年，經義既是知識分子的共同語言，也是政權正當性的來源 —— 戰國以來諸子並立的局面到此收束。
  sources:
    - title: 維基百科：獨尊儒術
