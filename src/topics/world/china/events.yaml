  importance: 4
  desc: 陳群所議，由地方中正官依家世、德行、才能評定人物等第，以取代漢代察舉。原意在矯正漢末用人唯親之弊，實際卻使門第固化。此制行用三百餘年，至 587 年隋設科舉才被取代。
