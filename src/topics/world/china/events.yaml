- id: cn-wei-conquer-shu
  year: 263
  title: 魏滅蜀漢
  category: war
  importance: 3
  desc: 司馬昭為建立軍功以備代魏而三路南下。姜維擋住鍾會於劍閣，鄧艾卻走陰平小路直逼成都，劉禪出降 —— 三國中最先亡的一國。
  sources:
