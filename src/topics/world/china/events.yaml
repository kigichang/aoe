      url: https://zh.wikipedia.org/wiki/三皇五帝

- id: cn-zhuolu
  year: -2698
  title: 黃帝敗蚩尤於涿鹿
  category: war
  importance: 5
  legendary: true
  desc: 傳說中部落聯盟成形的關鍵一戰。黃帝其人其事無考古佐證，年代同樣出自後世推定。
  sources:
    - title: 維基百科：黃帝
