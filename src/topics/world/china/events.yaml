  category: war
  importance: 3
  endYear: 234
  desc: 七年間與曹魏六度交兵、五次北伐，曾奪武都陰平、斬魏將張郃。但司馬懿堅守不戰，蜀道補給又難，最終無功而終於五丈原。
  sources:
