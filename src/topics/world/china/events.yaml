  category: culture
  importance: 4
  sources:
    - title: 維基百科：史記
      url: https://zh.wikipedia.org/wiki/史記
    - title: 維基百科：司馬遷
      url: https://zh.wikipedia.org/wiki/司馬遷

- id: cn-taichu-calendar
  year: -104
  title: 頒行太初曆，以正月為歲首
  category: science
  importance: 3
  desc: 落下閎、鄧平等造，取代沿用秦制的顓頊曆。以孟春正月為一年之始、以無中氣之月置閏，這兩項自此定下 —— 今日農曆的骨架，就是在這一年立起來的。
  sources:
    - title: 維基百科：太初曆
      url: https://zh.wikipedia.org/wiki/太初曆

- id: cn-salt-iron-debate
  year: -81
  title: 鹽鐵會議，國策首次公開辯論
  category: economy
  importance: 3
  desc: 昭帝詔郡國舉賢良文學，與桑弘羊當廷爭鹽鐵酒榷的存廢。賢良主張與民休息、斥專賣為與民爭利，桑弘羊持國用邊費不可缺。桓寬追記成《鹽鐵論》，是中國最早的一場經濟政策論戰實錄。
  sources:
    - title: 維基百科：鹽鐵論
      url: https://zh.wikipedia.org/wiki/鹽鐵論
    - title: 維基百科：桑弘羊
      url: https://zh.wikipedia.org/wiki/桑弘羊

- id: cn-huoguang-deposition
  year: -74
  title: 霍光廢昌邑王，立漢宣帝
  category: politics
  importance: 3
  desc: 昌邑王劉賀即位二十七日即遭廢黜，霍光改立流落民間的戾太子之孫。權臣以「不可以承宗廟」廢立天子的先例自此而開，此後兩千年屢被援引；宣帝一朝則有昭宣之治之稱。
  sources:
    - title: 維基百科：霍光
      url: https://zh.wikipedia.org/wiki/霍光
    - title: 維基百科：劉賀
      url: https://zh.wikipedia.org/wiki/劉賀
    - title: 維基百科：昭宣之治
      url: https://zh.wikipedia.org/wiki/昭宣之治

- id: cn-western-regions-protectorate
  year: -60
  title: 設西域都護府，天山南北納入治下
  category: politics
  importance: 4
  desc: 匈奴日逐王降漢，鄭吉為首任都護。張騫通西域七十八年之後，商路沿線諸國由「有往來」變成受漢廷節制 —— 絲路的暢通第一次有了駐軍與行政的保障。
  sources:
    - title: 維基百科：西域都護府
      url: https://zh.wikipedia.org/wiki/西域都護府

- id: cn-wang-zhaojun
  year: -33
  title: 昭君出塞，漢匈六十年無戰事
  category: politics
  importance: 3
  desc: 呼韓邪單于入朝求為漢婿，元帝以宮女王嬙妻之。此時的和親已非前200年白登之後的輸幣求安，而是匈奴分裂、南匈奴附漢之後的結盟 —— 同一種形式，兩種完全相反的力量對比。
  sources:
    - title: 維基百科：王昭君
      url: https://zh.wikipedia.org/wiki/王昭君

- id: cn-wangmang
  year: 9
  title: 王莽篡漢，建立新朝
  category: politics
  importance: 3
  desc: 廢孺子嬰自立，隨即托古改制：行王田制禁土地買賣、次年立六筦收鹽鐵酒與山澤之利、十五年間五度改幣。復古的藍本取自《周禮》，執行卻無配套，王田三年即廢，幣制反覆使民間交易崩壞 —— 新朝十四年而亡，敗因多在此。
  sources:
    - title: 維基百科：王莽
      url: https://zh.wikipedia.org/wiki/王莽
    - title: 維基百科：新朝
      url: https://zh.wikipedia.org/wiki/新朝
    - title: 維基百科：王莽改制
      url: https://zh.wikipedia.org/wiki/王莽改制
    - title: 維基百科：六筦
      url: https://zh.wikipedia.org/wiki/六筦

- id: cn-lulin-chimei
  year: 17
  title: 綠林、赤眉起事
  category: war
  importance: 3
  desc: 荊州饑民聚於綠林山，次年琅邪呂母之後又有赤眉軍起於青徐。兩支流民武裝並非衝著復漢而來，卻在六年內葬送新朝 —— 王莽改制的帳，最後是由災荒中的農民來結算的。
  sources:
    - title: 維基百科：綠林軍
      url: https://zh.wikipedia.org/wiki/綠林軍
    - title: 維基百科：赤眉軍
      url: https://zh.wikipedia.org/wiki/赤眉軍

- id: cn-kunyang
  year: 23
  title: 昆陽之戰，新莽覆滅
  category: war
  importance: 4
  desc: 綠林軍已立劉玄為更始帝，王莽傾四十餘萬眾圍昆陽，為劉秀所破，主力盡失，同年十月長安即陷、王莽被殺。更始政權隨後入主長安，兩年後為赤眉軍所滅 —— 亂局裡真正勝出的，是昆陽這一戰打出名聲的劉秀。
  sources:
    - title: 維基百科：昆陽之戰
      url: https://zh.wikipedia.org/wiki/昆陽之戰
    - title: 維基百科：更始政權
      url: https://zh.wikipedia.org/wiki/更始政權
    - title: 維基百科：赤眉軍
      url: https://zh.wikipedia.org/wiki/赤眉軍

