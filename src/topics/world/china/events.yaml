- id: cn-dong-zhuo
  year: 189
  title: 董卓入京，東漢名存實亡
  category: war
  importance: 4
  desc: 何進召外兵誅宦官事洩被殺，董卓趁亂入洛陽，廢少帝而立獻帝；次年關東群雄起兵討之，卓焚洛陽西遷長安。天子從此成為各方爭奪的號令工具，割據的格局就此定型。
