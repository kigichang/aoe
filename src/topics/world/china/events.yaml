      url: https://zh.wikipedia.org/wiki/隋朝

- id: cn-renshou-coup
  year: 604
  title: 仁壽宮變，楊廣繼位為隋煬帝
  category: politics
  importance: 4
  desc: 隋文帝在仁壽宮病重期間暴斃，傳統史書多指控太子楊廣趁機弒父奪位。楊廣繼位後立即處死廢太子楊勇父子與幼弟漢王楊諒，開皇之治積累的國力自此轉由這位野心勃勃、好大喜功的新君主揮霍。
  sources:
    - title: 維基百科：隋文帝
      url: https://zh.wikipedia.org/wiki/隋文帝
    - title: 維基百科：隋煬帝
      url: https://zh.wikipedia.org/wiki/隋煬帝

- id: cn-grand-canal
  year: 605
  title: 開鑿大運河，遷都營建東都洛陽
  category: economy
  importance: 4
  desc: 煬帝即位次年便同時開鑿通濟渠、興建東都洛陽兩項巨型工程，各動用民伕百萬以上，此後陸續完成通濟渠、江南運河等段，貫通海河、黃河、淮河、長江、錢塘江五大水系。運河日後成為維繫中國南北經濟的大動脈，但即時的代價是民力耗盡，直接助長了隋末民變。
  sources:
    - title: 維基百科：京杭大運河
      url: https://zh.wikipedia.org/wiki/京杭大運河
    - title: 維基百科：隋煬帝
      url: https://zh.wikipedia.org/wiki/隋煬帝

- id: cn-sui-goguryeo
  year: 612
  title: 三征高句麗，引爆隋末民變
  category: war
  importance: 4
  endYear: 614
  desc: 三度東征皆無功而返，勞民耗財最甚。徵調與饑荒下民變四起，數年間群雄割據，煬帝於 618 年在江都被弒 —— 立國僅三十八年。
  sources:
    - title: 維基百科：隋與高句麗的戰爭
      url: https://zh.wikipedia.org/wiki/隋與高句麗的戰爭
    - title: 維基百科：隋末民變
      url: https://zh.wikipedia.org/wiki/隋末民變
    - title: 維基百科：隋煬帝
      url: https://zh.wikipedia.org/wiki/隋煬帝

- id: cn-tang-founding
  year: 618
  title: 唐朝建立
  category: politics
  importance: 5
  desc: 隋末群雄並起之際，李淵於太原起兵南下攻克長安，先擁立代王楊侑為傀儡（隋恭帝），待江都兵變、隋煬帝被弒的消息傳來，便逼恭帝禪位，建國號唐。同年洛陽方面另立越王楊侗為帝延續隋祚，直到隔年被王世充篡奪才真正滅亡——兩京並立的過渡局面，正是隋末唐初改朝換代的縮影。
  sources:
