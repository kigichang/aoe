- id: cn-cangjie
  year: -2650
  title: 倉頡造字
  category: culture
  importance: 3
  legendary: true
  desc: 傳為黃帝史官。文字實際上是長期演化的結果，考古上最早的成熟系統是商代甲骨文。
  sources:
    - title: 維基百科：倉頡
      url: https://zh.wikipedia.org/wiki/倉頡

- id: cn-juediantiantong
  year: -2500
  title: 顓頊「絕地天通」，禁絕民間通神
  category: religion
  importance: 3
  legendary: true
  desc: 顓頊敗共工於黃河中游，命重司天、黎司地，「絕地天通」——禁止民間私自占卜祭祀，通神之權收歸王室所命之官。傳說中政教分離、王權壟斷祭祀解釋權的起點。共工戰敗觸不周山、「天傾西北、地陷東南」的神話即附著於這場戰事之後。
  sources:
    - title: 維基百科：顓頊
      url: https://zh.wikipedia.org/wiki/顓頊
    - title: 維基百科：共工氏
      url: https://zh.wikipedia.org/wiki/共工氏

- id: cn-yao
  year: -2357
  title: 堯命羲和觀象授時，定四時成歲
  category: science
  importance: 3
  legendary: true
  desc: 《尚書·堯典》所載的曆法起源。
  sources:
    - title: 維基百科：堯
      url: https://zh.wikipedia.org/wiki/堯
    - title: 維基百科：三皇五帝
      url: https://zh.wikipedia.org/wiki/三皇五帝

- id: cn-taosi
  year: -2300
  endYear: -1900
  title: 陶寺遺址，可能的堯都與最古老的天象臺
  category: science
  importance: 4
  desc: 山西襄汾的龍山文化城址，出土宮殿、王陵、城牆與貴族墓園，另有一組夯土柱縫被認為是世上最古老的觀象臺，可由縫隙觀測日出方位以定節氣，並有中國最早的文字遺存之一。學界多視之為堯都的可能所在 —— 傳說中「堯命羲和觀象授時」繫於前 2357 年，與此僅隔半個世紀：一則是《尚書》的追記，一則是挖出來的夯土。
  sources:
    - title: 維基百科：陶寺遺址
      url: https://zh.wikipedia.org/wiki/陶寺遺址
    - title: 維基百科：龍山文化
      url: https://zh.wikipedia.org/wiki/龍山文化

- id: cn-shimao
  year: -2300
  endYear: -1800
  title: 石峁石城，已知最大的新石器城址
  category: politics
  importance: 3
  desc: 陝西神木的石砌城址，分內城、外城與「皇城台」，總面積四百二十五萬平方米，是已知中國新石器時代晚期規模最大的城。城牆藏玉、發現大量人頭奠基坑。沒有任何文獻記載過它 —— 傳世典籍寫滿了三皇五帝，卻對這座同時期最大的城一無所知。
  sources:
    - title: 維基百科：石峁遺址
      url: https://zh.wikipedia.org/wiki/石峁遺址

- id: cn-shanrang
  year: -2255
  title: 堯禪位於舜
  category: politics
  importance: 4
  legendary: true
  desc: 禪讓傳說是後世論證政權正當性的重要依據，先秦諸子對它已各有詮釋。
  sources:
    - title: 維基百科：舜
      url: https://zh.wikipedia.org/wiki/舜
    - title: 維基百科：禪讓
      url: https://zh.wikipedia.org/wiki/禪讓

- id: cn-yu-flood
  year: -2200
  title: 大禹治水
  category: economy
  importance: 4
  legendary: true
  desc: 以疏導取代其父鯀的堵塞法，傳說治水十三年、三過家門不入。水患平息後劃天下為九州，依遠近定甸、侯、綏、要、荒五服朝貢等級——後世「九州」作為中國代稱，即源出於此。
  sources:
    - title: 維基百科：大禹治水
      url: https://zh.wikipedia.org/wiki/大禹治水

- id: cn-xia-founded
  year: -2070
  title: 禹傳子啟，世襲取代禪讓；夏朝建立
  category: politics
  importance: 5
  legendary: true
  desc: 禹會諸侯於塗山，「執玉帛者萬國」；禹死後啟殺伯益奪位，又敗有扈氏於甘，世襲自此坐實 —— 公天下變為家天下。前 2070 年是夏商周斷代工程的推定值，二里頭遺址是否即夏，考古上仍無定論。
  sources:
    - title: 維基百科：夏朝
      url: https://zh.wikipedia.org/wiki/夏朝
    - title: 維基百科：夏商周斷代工程
      url: https://zh.wikipedia.org/wiki/夏商周斷代工程
    - title: 維基百科：塗山之會
      url: https://zh.wikipedia.org/wiki/塗山之會
    - title: 維基百科：甘之戰
      url: https://zh.wikipedia.org/wiki/甘之戰

- id: cn-taikang-lost
  year: -1982
  title: 太康失國，后羿代夏
  category: politics
  importance: 3
  legendary: true
  desc: 太康耽於田獵，出遊洛水之北，為東夷有窮氏首領后羿所逐而不得返國；后羿又為部下寒浞所殺。夏室失位前後約四十年，是這個王朝唯一留下情節的一段。年代出自《竹書紀年》一系的追記，非考古定年。
  sources:
    - title: 維基百科：太康失國
      url: https://zh.wikipedia.org/wiki/太康失國
    - title: 維基百科：后羿 (夏朝)
      url: https://zh.wikipedia.org/wiki/后羿_(夏朝)
    - title: 維基百科：寒浞
      url: https://zh.wikipedia.org/wiki/寒浞

- id: cn-shaokang-restoration
  year: -1945
  title: 少康中興，夏室復國
  category: politics
  importance: 3
  legendary: true
  desc: 相被寒浞所殺時遺腹子少康出奔，長成後以「有田一成、有眾一旅」起事，聯合斟灌、斟鄩等舊部滅寒浞父子而復國。「中興」一詞即出於此，此後歷代王朝失而復得皆援引為典。
  sources:
    - title: 維基百科：少康中興
      url: https://zh.wikipedia.org/wiki/少康中興
    - title: 維基百科：少康
      url: https://zh.wikipedia.org/wiki/少康

- id: cn-erlitou
  year: -1800
  endYear: -1500
  title: 二里頭宮室與青銅禮器
  category: science
  importance: 4
  desc: 河南偃師的大型聚落，前 18 至前 16 世紀東亞規模最大，有中軸線布局的宮室、陶製排水管道，以及中國最早的青銅禮器與兵器。多數學者視之為夏都的最佳候選，但始終沒有出土同時代文字，無法自證 —— 這是夏代唯一有考古定年的一筆，其餘各則都是文獻追記，所以只有它不是虛線圖釘。年代跨過文獻上的夏商之交，考古的連續性與王朝的斷代並不重合。
  sources:
    - title: 維基百科：二里頭遺址
      url: https://zh.wikipedia.org/wiki/二里頭遺址
    - title: 維基百科：二里頭文化
      url: https://zh.wikipedia.org/wiki/二里頭文化

- id: cn-shang-tang
  year: -1600
  title: 商湯滅夏
  category: politics
  importance: 4
  desc: 湯以伊尹為輔，敗桀於鳴條。商行內外服制：王畿由百官直轄為內服，外服則封侯、甸、男、衛，對周邊方國採聯合而非直接統治 —— 這是比周的分封更鬆散的一層架構。年份出自夏商周斷代工程的推定。
  sources:
    - title: 維基百科：商朝
      url: https://zh.wikipedia.org/wiki/商朝
    - title: 維基百科：鳴條之戰
      url: https://zh.wikipedia.org/wiki/鳴條之戰

- id: cn-yiyin-taijia
  year: -1580
  title: 伊尹放太甲於桐宮
  category: politics
  importance: 3
  desc: 太甲即位而不遵湯法，元老伊尹放之於桐宮，三年後見其悔過乃還政。這是中國最早的權臣廢立記載 —— 一千五百年後霍光廢昌邑王，援引的正是「伊尹相殷，廢太甲以安宗廟」。但《竹書紀年》另載伊尹自立而遭太甲所殺，兩說截然相反；商前期的紀年亦非考古定年，此處年份為後世推算。
  sources:
    - title: 維基百科：伊尹
      url: https://zh.wikipedia.org/wiki/伊尹
    - title: 維基百科：太甲
      url: https://zh.wikipedia.org/wiki/太甲

- id: cn-oracle-bone
  year: -1300
  title: 盤庚遷殷，甲骨文成熟
  category: culture
  importance: 4
  desc: 商自建國以來屢遷，經九世之亂後盤庚定都於殷，此後二百七十三年不再遷徙。甲骨文是現存最早的成系統漢字，也是中國信史的物證 —— 它到 1899 年才被辨識出來，此前商朝一直被當成傳說。卜辭所用的干支紀日循環至今未斷，是世上連續使用最久的紀日法。
  sources:
    - title: 維基百科：盤庚
      url: https://zh.wikipedia.org/wiki/盤庚
    - title: 維基百科：甲骨文
      url: https://zh.wikipedia.org/wiki/甲骨文
    - title: 維基百科：殷墟
      url: https://zh.wikipedia.org/wiki/殷墟

- id: cn-wuding
  year: -1250
  title: 武丁中興，婦好將兵
  category: war
  importance: 4
  desc: 武丁在位五十九年，征伐八十餘方國，商的勢力達於極盛，甲骨卜辭也自此大量出現。其配偶婦好見於卜辭，曾統兵征伐羌方，是中國最早有文字可考的女性統帥；1976 年出土的婦好墓，是殷墟唯一未經盜掘的王室墓葬。
  sources:
    - title: 維基百科：武丁
      url: https://zh.wikipedia.org/wiki/武丁
    - title: 維基百科：婦好
      url: https://zh.wikipedia.org/wiki/婦好

- id: cn-houmuwu-ding
  year: -1200
  title: 後母戊鼎，青銅工藝極盛
  category: science
  importance: 4
  desc: 重逾八百公斤，是現存最大最重的古代青銅器，需數百人協同澆鑄。銘文「后母戊」指武丁之妻婦妌，鼎應為其子祖庚或祖甲所鑄。同一時期東地中海各文明正陷於青銅時代崩潰 —— 兩端的青銅文明，一個到頂，一個落幕。
  sources:
    - title: 維基百科：後母戊鼎
      url: https://zh.wikipedia.org/wiki/後母戊鼎
    - title: 維基百科：殷墟
      url: https://zh.wikipedia.org/wiki/殷墟

- id: cn-zhou-founding
  year: -1046
  title: 牧野之戰，武王克商；西周建立
  category: politics
  importance: 4
  desc: 周軍趁商軍主力東征東夷時突襲，以兵車三百乘、虎賁三千直取朝歌，帝辛登鹿台自焚。年份極不確定：歷來有四十五種說法，從前 1130 到前 1018 年都有，相差逾百年；前 1046 年是夏商周斷代工程依《國語》「歲在鶉火」推定的，學界並未一致接受。
  sources:
    - title: 維基百科：牧野之戰
      url: https://zh.wikipedia.org/wiki/牧野之戰
    - title: 維基百科：武王伐紂
      url: https://zh.wikipedia.org/wiki/武王伐紂
    - title: 維基百科：利簋
      url: https://zh.wikipedia.org/wiki/利簋
    - title: 維基百科：夏商周斷代工程
      url: https://zh.wikipedia.org/wiki/夏商周斷代工程
    - title: 維基百科：西周
      url: https://zh.wikipedia.org/wiki/西周

- id: cn-zhougong-east
  year: -1042
  title: 周公東征，制禮作樂
  category: politics
  importance: 4
  desc: 武王死後管叔、蔡叔挾武庚作亂，周公旦東征三年平之，續行大分封 —— 七十一國之中姬姓佔五十三。同時定宗法：嫡長子繼統為大宗，餘子分封為小宗，封建親戚以藩屏周。這套血緣與禮樂交織的秩序支撐周室八百年，也正是孔子畢生所嚮往的那個「周」。
  sources:
    - title: 維基百科：周公東征
      url: https://zh.wikipedia.org/wiki/周公東征
    - title: 維基百科：宗法
      url: https://zh.wikipedia.org/wiki/宗法
    - title: 維基百科：西周
      url: https://zh.wikipedia.org/wiki/西周

- id: cn-gonghe
  year: -841
  title: 國人暴動，共和行政
  category: politics
  importance: 4
  desc: 中國歷史確切紀年的起點，此後每一年都有明確記載。
  sources:
    - title: 維基百科：國人暴動
      url: https://zh.wikipedia.org/wiki/國人暴動
