# 林業與礦業鐵道
#
# ⚠️ 多主題機制的驗證用種子資料，尚未走完 README 的完整查證流程。

- id: alishan-1907-shay-steam
  year: 1907
  endYear: 1976
  title: Shay式蒸汽機車引進阿里山，登山鐵路動力之始
  category: rolling-stock
  importance: 3
  desc: 阿里山林業鐵路主線興建期間，1907年引進第一輛13噸級Shay式蒸汽機車，其齒輪傳動設計適合克服登山鐵路的陡坡與急彎；通車後陸續增購18噸級（1910至1913年）與28噸級（1912至1917年）機車，成為運材與載客的主力車型。1970年代中期起陸續停駛（如SL-24號於1976年12月公告停駛），部分機車以動態或靜態方式保存至今。
  sources:
    - title: 維基百科：阿里山林業鐵路蒸汽機車
      url: https://zh.wikipedia.org/wiki/阿里山林業鐵路蒸汽機車

- id: alishan-1912-opening
  year: 1912
  title: 阿里山林業鐵路嘉義至二萬平通車
  category: opening
  importance: 5
  desc: 為運出阿里山檜木而建，從嘉義平原一路爬到海拔兩千公尺。獨立山的螺旋路線與之字形折返是為了克服坡度。
  sources:
    - title: 維基百科：阿里山林業鐵路
      url: https://zh.wikipedia.org/wiki/阿里山林業鐵路

- id: alishan-1914-zhaoping
  year: 1914
  title: 阿里山鐵路延伸至沼平，主線全線通車
  category: opening
  importance: 4
  desc: 1914年3月14日，鐵路自二萬平延伸至沼平（阿里山），主線正式竣工，至此才真正抵達阿里山林場核心，得以大規模運出檜木等珍貴林木。1918年起鐵路開始兼辦客運業務，逐漸從純粹的運材鐵道轉為兼具旅客運輸功能。
  sources:
    - title: 維基百科：阿里山林業鐵路
      url: https://zh.wikipedia.org/wiki/阿里山林業鐵路

- id: baxianshan-1916-established
  year: 1916
  title: 八仙山出張所成立，台灣三大林場格局確立
  category: institution
  importance: 3
  desc: 1914年總督府技師綱島正吉前往八仙山勘查，1915年八仙山事業區脫離阿里山作業所、直屬營林局，1916年八仙山出張所成立，與阿里山、太平山並列「台灣三大林場」。1927年鋪設平地鐵道運出木材，運材系統結合山地軌道、平地鐵道與流籠索道，較另兩處林場更為複雜；1942年伐木事業轉由台灣拓殖株式會社接管，隔年產材量達到高峰。戰後資源枯竭，伐木事業逐漸停止，林場現已轉型為國家森林遊樂區。
  sources:
    - title: 維基百科：八仙山林場
      url: https://zh.wikipedia.org/wiki/八仙山林場

- id: pingxi-1921-opening
  year: 1921
  title: 台陽礦業石底線（今平溪線）完工
  category: construction
  importance: 4
  desc: 私人礦業公司自建的運煤鐵路，沿基隆河谷深入平溪一帶的煤田。
  sources:
    - title: 維基百科：平溪線
      url: https://zh.wikipedia.org/wiki/平溪線

- id: jiji-line-1921-opening
  year: 1921
  title: 集集線完工通車，因日月潭發電工程而生
  category: construction
  importance: 3
  desc: 台灣電力株式會社為運送日月潭水力發電工程物資，1919年動工興建集集線，1921年10月完工，1922年1月14日起兼辦客運業務。1927年4月由總督府買收，正式納入鐵道部管轄，成為官營鐵路的一段支線。
  sources:
    - title: 維基百科：集集線
      url: https://zh.wikipedia.org/wiki/集集線

- id: pingxi-1929-acquired
  year: 1929
  title: 總督府鐵道部收購石底線
  category: institution
  importance: 3
  desc: 私設的運煤路線轉為官營並開辦客運，礦業鐵道就此併入一般鐵路網。煤礦結束後，這條線靠觀光活了下來。
  sources:
    - title: 維基百科：平溪線
      url: https://zh.wikipedia.org/wiki/平溪線

- id: jinguashi-1936-mining-line
  year: 1933
  endYear: 1962
  title: 金瓜石線通車，運送金銅礦砂的輕便鐵道
  category: opening
  importance: 3
  desc: 1933年日本礦業株式會社購入金瓜石礦區，興建762公釐軌距輕便鐵道運送金銅礦砂，1936年全線完工，連接水湳洞與基隆八尺門，礦砂經駁船轉運至基隆牛稠港裝船運往日本提煉，同時兼營客運。戰後由台灣金屬鑛業公司接手，1962年8月26日因路線老舊停止客運，這條台灣少見的貴金屬礦業鐵道自此走入歷史；其中瑞芳至深澳一段路廊，後來成為台鐵深澳線的雛形。
  sources:
    - title: 維基百科：金瓜石線
      url: https://zh.wikipedia.org/wiki/金瓜石線

- id: houtong-1934-ruisan-coal
  year: 1934
  endYear: 1990
  title: 瑞三煤礦成立，猴硐站成運煤轉運樞紐
  category: institution
  importance: 3
  desc: 猴硐一帶採煤始於1914年，1920年宜蘭線猴硐站設站、1922年選煤場完工後，煤礦開採與鐵路運輸緊密結合。1934年李建興向三井會社承租礦權、成立瑞三煤礦，全盛時期雇用逾千名礦工，1946至1980年間總產量超過674萬公噸，是台灣最大民營煤礦之一。隨著石油取代煤炭與鐵路電氣化，1990年5月1日正式停止開採，猴硐現已轉型為煤礦博物園區，選煤場亦於2022年修復開放參觀。
  sources:
    - title: 維基百科：瑞三煤礦
      url: https://zh.wikipedia.org/wiki/瑞三煤礦

- id: taipingshan-1937-maoxing
  year: 1937
  title: 太平山林鐵生產中心遷至新太平山，索道—軌道運材系統成熟
  category: construction
  importance: 3
  desc: 太平山是繼阿里山、八仙山之後台灣另一處重要林場，運材方式獨具特色：以輕便軌道銜接高山索道，交替運送木材下山。1935年仁澤、白嶺、白系等索道相繼完工，1937年生產中心由舊太平山遷至新太平山，茂興線啟用出材，運材系統自此臻於成熟。
  sources:
    - title: 維基百科：太平山森林鐵路
      url: https://zh.wikipedia.org/wiki/太平山森林鐵路

- id: alishan-1978-logging-end
  year: 1978
  title: 阿里山林場停止伐木，鐵路轉型觀光路線
  category: closure
  importance: 4
  desc: 隨著森林資源枯竭與保育意識抬頭，阿里山林場伐木作業陸續停止，1978年林場專用路線停駛，鐵路的運材任務走入歷史。此後鐵路逐漸轉型為純粹服務旅客的觀光鐵道，1982年阿里山公路通車後，鐵路客運業績更是大幅萎縮。
  sources:
    - title: 維基百科：阿里山林業鐵路
      url: https://zh.wikipedia.org/wiki/阿里山林業鐵路

- id: taipingshan-1982-closure
  year: 1982
  title: 太平山林場停產，運材鐵路走入歷史
  category: closure
  importance: 3
  desc: 太平山林場1982年正式停產，索道與軌道構成的運材系統隨之全面停用。1991年廢棄多年的茂興線著手修復，轉型為俗稱「蹦蹦車」的觀光小火車路線，成為太平山僅存可供遊客體驗的鐵道遺跡。
  sources:
    - title: 維基百科：太平山森林鐵路
      url: https://zh.wikipedia.org/wiki/太平山森林鐵路

- id: alishan-1986-zhushan
  year: 1986
  title: 阿里山林鐵祝山線通車
  category: opening
  importance: 3
  desc: 台灣海拔最高的鐵路支線，功能從運木材完全轉向看日出。
  sources:
    - title: 維基百科：阿里山林業鐵路
      url: https://zh.wikipedia.org/wiki/阿里山林業鐵路

- id: alishan-1999-2009-disasters
  year: 1999
  endYear: 2009
  title: 921大地震與莫拉克風災接連重創阿里山林鐵
  category: accident
  importance: 4
  desc: 1999年921大地震重創阿里山車站與眠月線，多處路基坍方；2009年8月莫拉克風災再度重創路網，全線出現421處毀損。天災接連侵襲讓這條百年林鐵長期柔腸寸斷，部分路段（如眠月線）此後長年無法修復，僅能分段局部通車。
  sources:
    - title: 維基百科：阿里山林業鐵路
      url: https://zh.wikipedia.org/wiki/阿里山林業鐵路

- id: jiji-line-1999-earthquake
  year: 1999
  endYear: 2001
  title: 921大地震重創集集線，2001年修復通車
  category: accident
  importance: 3
  desc: 1999年9月21日集集大地震震央即在集集線沿線，集集車站傾斜、多處鐵軌扭曲變形，全線停駛。歷經整建，2001年1月21日修復通車，此後集集線逐漸轉型為兼具運輸與觀光價值的鐵道路線。
  sources:
    - title: 維基百科：集集線
      url: https://zh.wikipedia.org/wiki/集集線

- id: alishan-2024-restoration
  year: 2024
  title: 阿里山林鐵本線歷經15年修復，全線直通復駛
  category: opening
  importance: 4
  desc: 莫拉克風災重創後，嘉義至阿里山的本線分段修復：2012年嘉義—竹崎段先復駛，2014年竹崎—奮起湖段跟進，最陡峭險峻的上段工程延宕多年，直到2024年7月6日全線終於直通復駛，前後歷時15年，是阿里山林鐵有史以來最漫長的一次修復工程。
  sources:
    - title: 維基百科：阿里山林業鐵路
      url: https://zh.wikipedia.org/wiki/阿里山林業鐵路
