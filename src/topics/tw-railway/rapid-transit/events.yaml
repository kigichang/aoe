# 高鐵與都會捷運
#
# 已走完 README 的查證流程（維基 API 批次驗證標題 → 寫入 → --check-pages 複查）。

- id: mrt-1988-groundbreaking
  year: 1988
  title: 台北捷運動工，台灣第一套都會軌道系統破土
  category: construction
  importance: 4
  desc: 台北市內鐵路高架化的構想1968年就有人提，交通部1977年規劃出U1、U2、U3、S1四條路線，行政院1986年3月27日核定三條高運量加一條中運量、總長70.3公里的路網。1987年2月23日台北市政府捷運工程局成立，隔年2月24日北投機廠開工進入施工階段，12月15日木柵線、12月30日淡水線相繼動土。從第一次提案到第一鏟，整整二十年。
  sources:
    - title: 維基百科：臺北捷運歷史
      url: https://zh.wikipedia.org/wiki/臺北捷運歷史

- id: mrt-1993-matra-dispute
  year: 1993
  title: 木柵線兩度火燒車，馬特拉合約糾紛引爆
  category: accident
  importance: 3
  desc: 首批VAL256型電聯車1990年11月16日運抵基隆港後，木柵線進入測試階段卻狀況不斷：1993年4月發現高架橋帽樑裂縫，5月與9月兩度發生電聯車測試火警，法商馬特拉多次暫停測試。10月9日內湖線的系統形式因此一度改採高運量。1994年8月木柵線所有權移交市府後，馬特拉才交付機電設備；1997年馬特拉撤出技術支援，雙方對簿公堂，「馬特拉不拉，我們自己拉」成為台灣工程史上最有名的一句抱怨。1995年5月體檢委員會確認系統安全，10月29日啟動帽樑補強。
  sources:
    - title: 維基百科：文湖線
      url: https://zh.wikipedia.org/wiki/文湖線
    - title: 維基百科：馬特拉
      url: https://zh.wikipedia.org/wiki/馬特拉

- id: mrt-1994-trtc-founded
  year: 1994
  title: 台北大眾捷運公司成立，台灣第一家捷運營運者
  category: institution
  importance: 3
  desc: 1994年7月29日成立，負責營運維護捷運工程局興建完成的路線。捷運「興建」與「營運」分家的模式自此定型，日後高雄、桃園、台中、新北各自成立捷運公司都沿用同一套架構——市府（或中央）負責蓋，公司負責開。
  sources:
    - title: 維基百科：臺北捷運歷史
      url: https://zh.wikipedia.org/wiki/臺北捷運歷史

- id: mrt-1996-muzha
  year: 1996
  title: 台北捷運木柵線通車
  category: opening
  importance: 5
  desc: 1996年3月28日在台北市長陳水扁見證下通車收費，全長10.5公里，使用51對102輛馬特拉VAL256型膠輪電聯車。台灣第一條捷運路線，也是第一條中運量膠輪系統。都會軌道運輸從這一年開始。
  sources:
    - title: 維基百科：臺北捷運
      url: https://zh.wikipedia.org/wiki/臺北捷運
    - title: 維基百科：文湖線
      url: https://zh.wikipedia.org/wiki/文湖線

- id: mrt-1997-tamsui-line
  year: 1997
  title: 淡水線通車，首條高運量捷運路線
  category: opening
  importance: 4
  desc: 1997年3月28日淡水線通車，是台北捷運第一條高運量系統路線，運能遠高於木柵線採用的中運量膠輪系統。往後陸續與新店線、信義線串連為今日的淡水信義線，是全台使用人次最高的捷運路線之一。
  sources:
    - title: 維基百科：淡水信義線
      url: https://zh.wikipedia.org/wiki/淡水信義線

- id: mrt-1998-zhonghe-xindian
  year: 1998
  title: 中和線與新店線通車，捷運跨出台北市
  category: opening
  importance: 3
  desc: 中和線1992年5月15日開工、新店線1991年3月8日開工，1998年12月24日中和線全線與新店線北段同日通車，1999年11月11日新店線南段跟進、全線抵達新店。中和線是台北捷運第一條伸進台北縣（今新北市）的路線，捷運自此不再只是台北市的交通工具；2000年8月31日通車的小南門線把兩線與板南線串起來，後來重組為松山新店線與中和新蘆線。
  sources:
    - title: 維基百科：中和新蘆線
      url: https://zh.wikipedia.org/wiki/中和新蘆線
    - title: 維基百科：松山新店線
      url: https://zh.wikipedia.org/wiki/松山新店線

- id: hsr-1999-shinkansen-switch
  year: 1999
  title: 高鐵機電系統從歐規改採日本新幹線，世紀標案大轉彎
  category: rolling-stock
  importance: 4
  desc: 1997年9月25日台灣高鐵聯盟以3,366億元的報價擊敗主打日本新幹線的中華高鐵聯盟，取得優先議約權，當時規劃採用歐洲鐵路系統；1998年7月23日簽下35年特許合約。1999年3月26日動工後情勢逆轉——同年5月日本政府承諾若改用新幹線技術即提供低利貸款，6月15日機電系統重新招標，12月28日由台灣新幹線企業聯盟得標。土建照歐規、機電走日規的混血結果，讓台灣高鐵成為新幹線技術首次輸出海外的案例。首列700T型列車2004年1月30日於神戶出廠，2005年10月完成時速300公里營運測試、隔日衝上315公里。
  sources:
    - title: 維基百科：台灣高鐵
      url: https://zh.wikipedia.org/wiki/台灣高鐵
    - title: 維基百科：台灣高速鐵路700T型電聯車
      url: https://zh.wikipedia.org/wiki/台灣高速鐵路700T型電聯車

- id: mrt-2000-bannan-line
  year: 2000
  title: 板南線全線通車，台北捷運形成十字路網
  category: opening
  importance: 4
  desc: 1999年12月龍山寺至市政府段先行通車，2000年12月30日板南線全線貫通，與同日通車的南港線相接，加上先前的淡水線、新店線，台北捷運路網首度連成貫穿東西、南北的十字骨幹，路網總長增至約56公里。
  sources:
    - title: 維基百科：板南線
      url: https://zh.wikipedia.org/wiki/板南線

- id: mrt-2001-nari-flood
  year: 2001
  title: 納莉颱風灌進捷運，高運量路網停擺三個月
  category: accident
  importance: 4
  desc: 2001年9月17日納莉颱風的雨水湧入南港機廠，順著隧道一路擴散，16座車站的月台與部分列車泡水，高運量路線全面停駛，是台北捷運營運史上最嚴重的一次系統中斷，直到同年12月才全面恢復。事後全系統增設防水閘門與抽水設施，出入口墊高、機廠加設擋水牆，成為日後各都會捷運防洪設計的教訓來源。
  sources:
    - title: 維基百科：颱風納莉 (2001年)
      url: https://zh.wikipedia.org/wiki/颱風納莉_(2001年)
    - title: 維基百科：臺北捷運
      url: https://zh.wikipedia.org/wiki/臺北捷運

- id: krt-2001-construction
  year: 2001
  title: 高雄捷運動工，南台灣等了二十二年
  category: construction
  importance: 3
  desc: 1979年高雄改制院轄市後就有興建捷運的提議，紅線（橋頭至臨海工業區）與橘線的路網1991年1月25日才獲行政院核定，2001年10月24日於小港站動土，2002年12月9日紅線高架段開始施工。從提議到動工二十二年，從動工到通車又是七年。
  sources:
    - title: 維基百科：高雄捷運紅線
      url: https://zh.wikipedia.org/wiki/高雄捷運紅線

- id: krt-2005-tunnel-collapse
  year: 2005
  title: 高捷橘線潛盾隧道坍塌，施工期最重大的災變
  category: accident
  importance: 3
  desc: 2005年12月4日文化中心站與五塊厝站之間的潛盾隧道工地滲水坍塌，是高雄捷運施工期間最嚴重的一次災變，隧道直到2007年11月29日才修復接合、全線貫通，橘線通車因此延後。此前2004年8月9日西子灣站已發生連續壁漏水漏砂、鄰近民宅坍塌；2005年5月13日凹子底站拆除支撐型鋼時有工人受傷；同年8月21日外籍勞工宿舍爆發抗議事件，後續延燒成高捷弊案。
  sources:
    - title: 維基百科：高雄捷運橘線
      url: https://zh.wikipedia.org/wiki/高雄捷運橘線

- id: hsr-2007-opening
  year: 2007
  title: 台灣高鐵通車
  category: opening
  importance: 5
  desc: 1998年政府與台灣高速鐵路聯盟簽約，採BOT模式興建，1999年動工，2007年1月5日板橋—左營段先行通車，同年3月2日全線通車，台北到高雄縮短到一個半小時，西部走廊變成一日生活圈，這是縱貫線通車之後對城際移動影響最大的一次；通車後西部國內航線急遽萎縮，2012年起台北—高雄航線一度成為僅存的西部幹線航班。
  sources:
    - title: 維基百科：台灣高鐵
      url: https://zh.wikipedia.org/wiki/台灣高鐵

- id: mrt-2008-kaohsiung
  year: 2008
  title: 高雄捷運紅線、橘線通車
  category: opening
  importance: 4
  desc: 台北以外的第一套捷運系統。2008年3月9日紅線（橋頭火車站—小港）先行通車，同年9月14日橘線（哈瑪星—大寮）跟進通車，兩線在美麗島站交會成十字路網，南台灣的都會軌道網自此起步。
  sources:
    - title: 維基百科：高雄捷運紅線
      url: https://zh.wikipedia.org/wiki/高雄捷運紅線
    - title: 維基百科：高雄捷運橘線
      url: https://zh.wikipedia.org/wiki/高雄捷運橘線

- id: mrt-2009-neihu-line
  year: 2009
  title: 內湖線通車與文湖線當機風波
  category: opening
  importance: 4
  desc: 內湖線的系統形式在中運量與高運量之間爭執了五年，2001年1月才定案沿用中運量，2002年5月23日開工，由工信工程與龐巴迪合作興建高架段並同步更新木柵線機電。2009年7月4日通車、與木柵線貫通為文湖線，卻在通車初期接連當機誤點，成為台北捷運營運史上最難堪的一段——7月25日起以電子票證64折優惠向乘客致歉，直到2011年8月系統穩定度達99.5%才取消。1996年上路的馬特拉VAL256型列車一度停駛進廠改裝CBTC號誌，2010年12月26日重新上線，與龐巴迪INNOVIA APM 256型混跑至今。
  sources:
    - title: 維基百科：文湖線
      url: https://zh.wikipedia.org/wiki/文湖線
    - title: 維基百科：台北捷運VAL256型電聯車
      url: https://zh.wikipedia.org/wiki/台北捷運VAL256型電聯車

- id: mrt-2010-xinzhuang-luzhou
  year: 2010
  title: 新莊蘆洲線通車，台北捷運路網突破百公里
  category: opening
  importance: 3
  desc: 新莊線2001年7月27日、蘆洲線同年12月3日先後動工，2010年11月3日忠孝新生至蘆洲段先行通車，路網總長首度突破100公里；2012年1月5日大橋頭至輔大段接上，9月30日東門站啟用，全線與中和線串成中和新蘆線。這條路線大致沿著劉銘傳鐵路被廢棄的舊路廊北上新莊，一百餘年後又有軌道回到同一條走廊。
  sources:
    - title: 維基百科：中和新蘆線
      url: https://zh.wikipedia.org/wiki/中和新蘆線

- id: mrt-2014-songshan-line
  year: 2014
  title: 松山線通車，台北捷運原始路網完成
  category: opening
  importance: 4
  desc: 繼2013年信義線通車後，2014年11月15日松山線通車，銜接新店線成為松山新店線，台北捷運自1996年首條路線通車以來規劃的「原始設計路網」至此全數完成，路線總長突破130公里。
  sources:
    - title: 維基百科：松山新店線
      url: https://zh.wikipedia.org/wiki/松山新店線

- id: mrt-2014-random-attack
  year: 2014
  title: 板南線隨機殺人事件，捷運營運史上最嚴重的傷亡
  category: accident
  importance: 3
  desc: 2014年5月21日，一名大學生在板南線行駛中的列車上持刀隨機攻擊乘客，造成4人死亡、24人輕重傷，是台北捷運營運以來傷亡最慘重的事件。事後全系統加強警力巡邏與月台監控，車廂內安全設備與緊急通報流程也全面檢討；2022年3月11日新埔站電扶梯失速倒退造成約30人受傷，是另一類型的首見事故。
  sources:
    - title: 維基百科：2014年台北捷運隨機殺人事件
      url: https://zh.wikipedia.org/wiki/2014年台北捷運隨機殺人事件

- id: lrt-2015-kaohsiung
  year: 2015
  endYear: 2024
  title: 高雄輕軌通車，全台第一條現代輕軌
  category: opening
  importance: 3
  desc: 2013年6月動工，2015年10月16日第一階段（籬仔內—哈瑪星）通車，是全台最早營運的現代輕軌系統。2024年1月1日第二階段完工，全線繞成一個環狀路網，全長22.1公里、38站，並在哈瑪星站接橘線、於籬仔內、愛河之心站可轉乘紅線。
  sources:
    - title: 維基百科：高雄環狀輕軌
      url: https://zh.wikipedia.org/wiki/高雄環狀輕軌

- id: hsr-2015-restructuring
  year: 2015
  title: 台灣高鐵公司改革，BOT時代告終
  category: institution
  importance: 3
  desc: 高鐵通車後長期虧損，實際運量遠低於當初BOT財務規劃預期的每日24萬人次，公司財務瀕臨破產。2015年立法院通過改革方案，政府大舉注資成為最大股東，同年7月完成合約修訂，正式終結長達17年的BOT民間興建營運模式，轉為「國有民營」。
  sources:
    - title: 維基百科：台灣高鐵
      url: https://zh.wikipedia.org/wiki/台灣高鐵

- id: hsr-2015-new-stations
  year: 2015
  endYear: 2016
  title: 高鐵苗栗、彰化、雲林三站與南港站啟用，全線十二站定型
  category: opening
  importance: 3
  desc: 通車時只設八站，路線經過卻不停靠的苗栗、彰化、雲林三縣爭取多年，三站於2015年12月1日同日啟用。北端的南港延伸段2010年6月1日動工，2016年1月28日首度有列車駛入，7月1日正式營運。高鐵路網自此成為南港至左營十二站的定型樣貌，也在南港、台北、板橋三站與台鐵地下化路廊共用同一條走廊。
  sources:
    - title: 維基百科：台灣高鐵
      url: https://zh.wikipedia.org/wiki/台灣高鐵

- id: mrt-2017-airport
  year: 2017
  title: 桃園機場捷運通車
  category: opening
  importance: 3
  desc: 1996年起規劃以BOT模式興建，2002年民間特許業者長生國際與政府終止合約，BOT模式失敗，政府收回改為公務預算自建，2006年動工。原訂2010年通車，因林口台地坡度陡峭、隧道與高架橋工程複雜，六度延宕，直到2017年3月2日才正式通車，總經費暴增至新台幣1,277億元，台北車站終於能直達桃園機場，籌備超過二十年。
  sources:
    - title: 維基百科：桃園機場捷運
      url: https://zh.wikipedia.org/wiki/桃園機場捷運

- id: lrt-2018-tamsui
  year: 2018
  endYear: 2020
  title: 淡海輕軌通車，新北首座輕軌系統
  category: opening
  importance: 3
  desc: 1992年就有可行性研究，2005年改以輕軌形式重新推動，2014年11月23日動工。綠山線2018年12月23日通車、隔年2月1日起收費，藍海線第一期2020年11月15日跟進，是新北市第一套輕軌系統，於紅樹林、淡水兩站與台北捷運淡水信義線轉乘。車輛由台灣車輛承造、德國福伊特提供設計技術，首列2016年底出廠，共15列，是台灣輕軌「國車國造」的起點。營運者新北大眾捷運公司也在2018年1月26日登記設立。
  sources:
    - title: 維基百科：淡海輕軌
      url: https://zh.wikipedia.org/wiki/淡海輕軌

- id: mrt-2020-circular-line
  year: 2020
  title: 台北捷運環狀線第一階段通車
  category: opening
  importance: 3
  desc: 2020年1月31日環狀線大坪林至新北產業園區段通車，是台北捷運路網首度跳脫市中心放射狀路線、改採環繞新北市郊區串連既有路線的骨幹，也是台灣第一條中運量環狀捷運系統。
  sources:
    - title: 維基百科：環狀線 (台北都會區)
      url: https://zh.wikipedia.org/wiki/環狀線_(台北都會區)

- id: mrt-2021-taichung
  year: 2021
  title: 台中捷運綠線通車，試營運六天就因軸心斷裂喊停
  category: opening
  importance: 3
  desc: 中台灣第一條捷運路線。1990年開始規劃，2004年11月23日行政院核定「烏日文心北屯線」，2009年10月5日先期工程開工，2015年4月11日曾因鋼梁墜落工安意外全線停工。2020年11月16日免費試營運，六天後卻在11月21日發生車廂間半永久連結器牽引裝置軸心斷裂，隔日全線停止試營運，全數列車回廠檢測；2021年3月25日重新試營運，4月25日才正式通車。車輛為川崎重工與台灣車輛共同製造的兩節編組全自動無人駕駛電聯車，共18列。
  sources:
    - title: 維基百科：臺中捷運綠線
      url: https://zh.wikipedia.org/wiki/臺中捷運綠線

- id: lrt-2023-ankeng
  year: 2023
  title: 安坑輕軌通車，新北第二套輕軌
  category: opening
  importance: 3
  desc: 相關計畫最早1999年提出，2013年獲行政院核可，2016年4月6日主體工程開工、2022年底完工，2023年2月2日交通部核發營運許可，2月10日通車試營運，3月13日開始收費。全線位於新店區，採高架與平面混合形式，土建統包經費新台幣166.6億元，在十四張站與環狀線轉乘，服務長期只能靠公車與安坑交流道對外的安坑地區。
  sources:
    - title: 維基百科：安坑輕軌
      url: https://zh.wikipedia.org/wiki/安坑輕軌

- id: hsr-2023-n700st
  year: 2023
  title: 高鐵簽下N700ST新世代列車，通車十六年後首度換車
  category: rolling-stock
  importance: 3
  desc: 700T型服役十餘年後車齡漸長、運能吃緊，台灣高鐵2023年3月15日由日立與東芝聯盟得標，5月18日簽約採購12組新世代列車，金額約1,240.91億日圓（約新台幣289億元）。車型2025年8月20日定名N700ST，首列編組2026年7月30日出廠，是台灣高鐵通車以來第一次引進新車型。
  sources:
    - title: 維基百科：台灣高鐵
      url: https://zh.wikipedia.org/wiki/台灣高鐵

- id: mrt-2024-circular-line-quake
  year: 2024
  title: 環狀線遭0403花蓮地震重創，停駛八個月
  category: accident
  importance: 3
  desc: 2024年4月3日花蓮外海強震，環狀線高架橋的支承與伸縮縫受損、部分軌道位移，全線停止營運。修復工程歷時八個多月，直到12月12日才恢復通車，是台灣捷運史上單一路線停駛最久的一次。此前一年環狀線剛完成移交：2023年1月31日由台北市政府形式上移交新北市政府，5月23日實質交接，營運者由台北捷運公司換成新北捷運公司。
  sources:
    - title: 維基百科：環狀線 (台北都會區)
      url: https://zh.wikipedia.org/wiki/環狀線_(台北都會區)
    - title: 維基百科：新北捷運
      url: https://zh.wikipedia.org/wiki/新北捷運

- id: krt-2024-gangshan-luzhu
  year: 2024
  title: 高捷岡山路竹延伸線第一階段通車
  category: opening
  importance: 3
  desc: 2018年11月11日動土，第一階段自岡山高醫至岡山車站，採高運量規格與紅線主線直通行駛，2024年6月30日完工試營運、9月1日正式收費。這是紅線繼2012年12月23日南岡山站延伸後再度北推，全案八站13.22公里、預算新台幣303億元，第二A階段預計2029年、第二B階段預計2031年完工，往北銜接路竹、湖內的產業廊帶。
  sources:
    - title: 維基百科：岡山路竹延伸線
      url: https://zh.wikipedia.org/wiki/岡山路竹延伸線

- id: mrt-2025-keelung
  year: 2025
  title: 基隆捷運先期工程開工，一個吵了二十年的計畫終於動土
  category: construction
  importance: 3
  desc: 2006年基隆市完成輕軌可行性研究提出四線版本，2007年改為海線、山線二線版，2010年1月交通部以自償率偏低、運量不足退回。2017年3月17日改以利用台鐵第三軌的「國際郵輪母港線」重啟，2019年4月10日核定可行性研究，2020年2月26日輕軌與火車共軌方案破局，同年10月13日北北基協商後升級為中運量捷運。2022年2月22日定案，2024年1月31日綜合規劃獲核定、總經費新台幣696.89億元，2025年12月30日先期工程開工，第一階段南港八堵段規劃2033年通車。
  sources:
    - title: 維基百科：基隆捷運
      url: https://zh.wikipedia.org/wiki/基隆捷運

- id: mrt-2026-sanying
  year: 2026
  title: 三鶯線通車試營運，捷運進入三峽與鶯歌
  category: opening
  importance: 3
  desc: 構想最早於2000年提出，2016年7月21日開工，2026年4月7日完工，6月30日起通車試營運至8月31日。全線除大湳站外皆為高架，經土城、三峽、鶯歌，屬新北捷運「三環六線」的一環，未來規劃再延伸至桃園。這條路線大致沿著1901年日治改線後的鐵路走廊南下，鶯歌與板橋因鐵路而興的百年脈絡，到這一代換成了捷運。
  sources:
    - title: 維基百科：三鶯線
      url: https://zh.wikipedia.org/wiki/三鶯線

- id: hsr-2026-yilan-extension
  year: 2026
  title: 高鐵延伸宜蘭案核定，路網首度跨出西部走廊
  category: construction
  importance: 3
  desc: 2026年7月23日行政院核定高鐵北延宜蘭案，總經費新台幣3,521.8億元，預計十一年後完成。這是台灣高鐵自2007年通車以來第一次跨出西部走廊的延伸計畫，若完工，東部往台北將出現繼北迴線之後的第二條軌道通道。
  sources:
    - title: 維基百科：台灣高鐵
      url: https://zh.wikipedia.org/wiki/台灣高鐵
