- id: hsr-2007-opening
  year: 2007
  title: 台灣高鐵通車
  category: opening
  importance: 5
  desc: 台北到高雄縮短到一個半小時，西部走廊變成一日生活圈。這是縱貫線通車之後對城際移動影響最大的一次。
  sources:
    - title: 維基百科：台灣高鐵
      url: https://zh.wikipedia.org/wiki/台灣高鐵

