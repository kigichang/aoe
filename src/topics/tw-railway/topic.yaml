# 台灣鐵道史。目錄名就是網址路徑：/tw-railway/
#
# 這份目前只是骨架，用來驗證多主題機制。補資料的流程照 README ——
# 先用維基 API 批次查證標題，再寫入。

name: 台灣鐵道史
description: 把台灣各家鐵道營運者放在同一條時間軸上，看同一個年代各自在鋪哪一段。

# 排在清單最後。**新增主題時請把新的那個插在鐵道史之前，不要接在它後面** ——
# 這一份還是種子資料（林鐵礦鐵那欄尚未走完查證流程），其餘主題都補到正式規模了，
# 半成品不該擋在讀者第一眼會點的位置。
#
# 號碼維持連號，不留空號：留空號一樣排得對，但下次新增主題就得先猜哪些號碼還空著。
order: 6

# 欄位在這裡是「營運者」，不是「地區」。
#
# 為什麼不是「路線」：路線動輒數十條，而配色只驗證過四欄相鄰的色盲安全距離
# （見 CLAUDE.md「顏色只承載地區」）。以營運者分欄剛好落在安全範圍內，
# 而且「同一年台鐵在做什麼、糖鐵在做什麼」本來就是比較有意思的對照。
columnLabel: 營運者

# 跨度只有 141 年，事件也還不多，開場就攤到一屏約六十年，標籤才排得開。
defaultPpy: 12

# 這個主題的年代跨度只有一百多年，世界史那組（前2000…）在這裡全部出界。
jumps: [1890, 1910, 1930, 1950, 1970, 1990, 2010, 2020]
