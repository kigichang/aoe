# 起點取 1874：八斗子運煤鐵道（1876）的前兩年，讓最早那則事件不會卡在軸的
# 頂端被切掉（見 CLAUDE.md 實作坑第 7 條）。
#
# 原本是 1885（劉銘傳奏請設鐵路的前兩年），但台灣目前可知最早興建的鐵道是
# 1876 年八斗子官營煤礦的運煤軌道，比劉銘傳的鐵路早十一年。把下界卡在 1885
# 等於讓這條軸從第二早的鐵道開始講起，而那正是 CLAUDE.md 說的「超出範圍的
# 資料會靜默消失」——只是這次是在資料寫進來之前就先被排除掉了。
# 代價只有 MIN_PPY（700 / SPAN_YEARS，141→152 年，4.96→4.61），
# 開場的 defaultPpy: 12 與 jumps 都不受影響。
minYear: 1874

# 會逐年過期。加了超出的事件時 assertInRange 會直接報錯，屆時往上調即可。
maxYear: 2026
