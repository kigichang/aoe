- id: sugar-1900-taiwan-sugar-founded
  year: 1900
  title: 台灣製糖株式會社創立，新式糖業與糖鐵的起點
  category: institution
  importance: 3
  desc: 1900年12月10日由三井財閥主導，在東京舉行創立總會，資本額100萬圓。隔年春天於橋仔頭動工興建台灣第一座新式製糖工場，1901年11月機器裝設完成，1902年1月15日開工製糖。新式糖廠的產能遠非傳統糖廍可比，原料甘蔗必須從更遠的蔗田運進來——糖業鐵道就是為了餵飽這些工場而生，橋仔頭糖廠的專用線1907年改用蒸汽機車牽引，成了台灣糖鐵之始。
  sources:
    - title: 維基百科：臺灣製糖
      url: https://zh.wikipedia.org/wiki/臺灣製糖
    - title: 維基百科：橋頭糖廠
      url: https://zh.wikipedia.org/wiki/橋頭糖廠

- id: sugar-1907-first-line
  year: 1907
  title: 台灣製糖鋪設橋仔頭糖廠專用線
  category: construction
  importance: 5
  desc: 台灣糖業鐵道之始。1906年橋仔頭糖廠先鋪設762公釐軌距的台車軌道，以水牛或人力牽引，1907年11月改用蒸汽機車牽引，原本只為運甘蔗進廠，後來長成遍布嘉南平原的路網。
  sources:
    - title: 維基百科：臺灣糖業鐵路
      url: https://zh.wikipedia.org/wiki/臺灣糖業鐵路
    - title: 維基百科：橋頭糖廠
      url: https://zh.wikipedia.org/wiki/橋頭糖廠

- id: sugar-1909-passenger-start
  year: 1909
  title: 鹽水港製糖新營—岸內線開辦客運，糖鐵首度載客
  category: opening
  importance: 3
  desc: 1909年5月20日，鹽水港製糖的新營至岸內線開始營運定期客運，是糖業鐵路最早長期經營的載客路線。原本純為運蔗而生的產業軌道，自此兼營起沿線居民的日常交通，往後數十年間陸續有其他會社跟進開辦客運。同年6月30日，台灣製糖的九曲堂至東港、阿猴至阿里港兩條專用鐵道也獲准兼營運輸業，糖鐵載運外人貨物自此有了法源。
  sources:
    - title: 維基百科：臺灣糖業鐵路
      url: https://zh.wikipedia.org/wiki/臺灣糖業鐵路
    - title: 維基百科：鹽水港製糖
      url: https://zh.wikipedia.org/wiki/鹽水港製糖

- id: sugar-1910-qiwei-line
  year: 1910
  endYear: 1978
  title: 旗尾線通車，載運旗山香蕉的百年產業鐵道
  category: opening
  importance: 3
  desc: 高砂製糖會社興建的旗尾線1910年8月20日核准營業，自九曲堂通往旗尾，初設七站，1912年再延伸至竹頭角。除了運送甘蔗，也是旗山香蕉等農產品外銷的重要運輸管道，全盛時期每年載客量約30萬人次。產權歷經高砂製糖、鹽水港製糖、台灣製糖數度轉手，戰後由台糖經營，1978年全線停駛，鐵軌於1982年拆除走入歷史。
  sources:
    - title: 維基百科：旗尾線
      url: https://zh.wikipedia.org/wiki/旗尾線

- id: sugar-1913-magongcuo
  year: 1913
  title: 馬公厝線通車，日後成為全台最後一條運蔗鐵路
  category: opening
  importance: 3
  desc: 大日本製糖的馬公厝線1913年10月5日通車至龍巖庄，隔年7月30日延長線跟進，1961年9月16日獲交通部核准為營業線，1968年龍岩線停辦客運。全長12.9公里、762公釐軌距，自虎尾糖廠通往褒忠。糖鐵原料線一條條停用之後，這條線成了台灣唯一還在運甘蔗的鐵路：每年12月初先開除草列車替軌道清路，接著行駛原料列車到隔年4月初，牽引機為德馬B型、車廂全是蔗廂車。2009年3月蚊港線廢線後，褒忠13番裝車場成為實際終點。
  sources:
    - title: 維基百科：馬公厝線
      url: https://zh.wikipedia.org/wiki/馬公厝線
    - title: 維基百科：台糖虎尾總廠
      url: https://zh.wikipedia.org/wiki/台糖虎尾總廠

- id: sugar-1946-taisugar
  year: 1946
  title: 台灣糖業公司成立，接收各製糖會社鐵道
  category: institution
  importance: 4
  desc: 戰前分屬台灣製糖、明治製糖等會社的路線收歸一家，糖鐵成為單一經營者的系統。日治末期糖鐵路網一度長達近2965公里，是同期台鐵正線的十餘倍，堪稱台灣最龐大的鐵道系統。
  sources:
    - title: 維基百科：臺灣糖業鐵路
      url: https://zh.wikipedia.org/wiki/臺灣糖業鐵路

- id: sugar-1948-fengshun-diesel
  year: 1948
  endYear: 1991
  title: 順風牌內燃機車引進，糖鐵柴油化起步
  category: rolling-stock
  importance: 3
  desc: 台灣糖業公司1948年向美國Plymouth機車廠購入15輛順風牌內燃機車（編號40至54號），原用汽油引擎，1966年改裝為柴油引擎，是糖業鐵路現存最早的內燃機車之一，標誌著糖鐵動力從蒸汽機車轉向內燃機車的開端。同年台糖也大量購入比利時製蒸汽機車，1952年再統一各廠機車編號（1至750號），戰後接收來的雜牌車隊到這時才整編成一套系統。順風牌1991年全數停用退役，晚年集中配屬新營糖廠。
  sources:
    - title: 維基百科：台糖順風牌內燃機車
      url: https://zh.wikipedia.org/wiki/台糖順風牌內燃機車
    - title: 維基百科：臺灣糖業鐵路
      url: https://zh.wikipedia.org/wiki/臺灣糖業鐵路

- id: sugar-1950-north-south-line
  year: 1950
  endYear: 1998
  title: 南北平行預備線完工，糖鐵串成一條戰備縱貫線
  category: construction
  importance: 4
  desc: 1950年國防部要求台糖鋪一條與縱貫線平行的路線，以防戰時南北交通被切斷。同年起工、1952年8月竣工，西螺大橋1953年1月28日通車後，同年4月25日完成全線試運轉。全長262.5公里、762公釐軌距，北起台中、南至高雄籬子內，把台中、南投、溪湖、虎尾、大林、新營、佳里、橋頭八家糖廠的路網接成一條，是台灣唯一一條為軍事目的而生的糖業鐵路，也兼營客貨運。名為「平行」，實際上與縱貫線有數處立體交叉。此後路線一段段被自然災害吃掉：1959年八七水災沖毀橋樑、起點退到二水，1974年改員林，1979年西螺大橋改建後改斗南，1990年高屏大橋遭洪水沖毀，1998年各糖廠停止鐵路運輸，全線正式廢止，實際運轉四十八年。
  sources:
    - title: 維基百科：南北平行預備線
      url: https://zh.wikipedia.org/wiki/南北平行預備線

- id: sugar-1977-diema
  year: 1977
  title: 德馬牌內燃機車引進，糖鐵至今仍在跑的主力
  category: rolling-stock
  importance: 3
  desc: 台糖向德國Diepholzer Maschinenfabrik訂購，1977年第一批66輛（編號101至166，德馬B型，賓士引擎），1979年再訂第二批25輛（167至191，德馬A型，艾利斯查默斯引擎），合計91輛。這是糖業鐵路數量最多、分布最廣的內燃機車，牽引甘蔗與成品運輸；糖鐵大幅萎縮之後，它反而成為現存路線的當家車型——除溪湖糖廠外，還有鐵路在跑的糖廠都看得到，2022年起部分車輛還做了性能優化改造。
  sources:
    - title: 維基百科：台糖德馬牌內燃機車
      url: https://zh.wikipedia.org/wiki/台糖德馬牌內燃機車

- id: sugar-1982-passenger-end
  year: 1982
  title: 糖鐵營業線客運全面停駛
  category: closure
  importance: 4
  desc: 戰後糖鐵客運路線一度多達41條、里程約675公里，1950年代末達到全盛，每日搭乘旅客約六萬人次，是許多鄉鎮居民往返市街唯一的公共運輸。隨後公路客運興起取代，路線快速萎縮（1961年剩25條、1971年剩17條、1981年僅剩3條），1982年8月17日最後一條北港線停駛，宣告糖鐵客運全面終止。此後糖鐵只剩原料運蔗的專用線與少數觀光路段，如今僅虎尾糖廠馬公厝線仍在運蔗。
  sources:
    - title: 維基百科：臺灣糖業鐵路
      url: https://zh.wikipedia.org/wiki/臺灣糖業鐵路
    - title: 維基百科：北港線
      url: https://zh.wikipedia.org/wiki/北港線

- id: sugar-2001-wushulin-revival
  year: 2001
  title: 烏樹林五分車復駛，糖鐵從產業軌道變成觀光鐵道
  category: opening
  importance: 4
  desc: 烏樹林車站1944年6月16日開辦客運，現存木造站房1946年12月竣工，同年白河客運線開辦，成為新營、東山、白河三地的輻輳；1979年9月廢止客運後閒置二十餘年。2001年12月29日以「烏樹林五分車懷舊之旅」短程復駛，是糖鐵停辦客運近二十年後第一次重新載客；2003年一度因阿里山事故連帶停駛，同年6月26日獲交通部補發客運執照、8月4日復駛至今。園區另以動態方式讓老車重生：2003年370號蒸汽機車改燒燃油上路，2011年11月5日勝利號與成功號兩輛汽油客車復駛。這條路走通之後，其他糖廠陸續跟進。
  sources:
    - title: 維基百科：烏樹林車站
      url: https://zh.wikipedia.org/wiki/烏樹林車站
    - title: 維基百科：烏樹林糖廠
      url: https://zh.wikipedia.org/wiki/烏樹林糖廠

- id: sugar-2002-xihu-tourism
  year: 2002
  title: 溪湖糖廠停止製糖，五分車改載觀光客
  category: opening
  importance: 3
  desc: 溪湖糖廠源自1919年辜顯榮創辦的大和製糖，1920年10月併入明治製糖成為溪湖工場。2002年3月8日結束製糖業務，同年6月16日觀光小火車開始營運，用過去的運蔗車輛改裝，全程約7公里。1948年比利時AFB廠製、原配屬溪州糖廠的346號蒸汽機車2007年12月9日修復完成重新上路；蒜頭糖廠的650號也在2017年改燒燃油恢復動態運轉。烏樹林的370號、溪湖的346號、蒜頭的650號，是糖鐵蒸汽機車在停用數十年後重新冒煙的三個節點。
  sources:
    - title: 維基百科：溪湖糖廠
      url: https://zh.wikipedia.org/wiki/溪湖糖廠
    - title: 維基百科：蒜頭糖廠
      url: https://zh.wikipedia.org/wiki/蒜頭糖廠
