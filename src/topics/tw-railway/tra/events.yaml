- id: tra-1887-start
  year: 1887
  title: 劉銘傳設全臺鐵路商務總局，台灣鐵路開工
  category: construction
  importance: 5
  desc: 台灣第一條官辦鐵路動工，也是清帝國境內最早自建的鐵路之一。路線自基隆往南，目標是縱貫全島。
  sources:
    - title: 維基百科：台灣鐵路
      url: https://zh.wikipedia.org/wiki/台灣鐵路
    - title: 維基百科：劉銘傳
      url: https://zh.wikipedia.org/wiki/劉銘傳

- id: tra-1888-xikou-trial
  year: 1888
  title: 大稻埕至錫口試營運，台灣第一列載客火車
  category: opening
  importance: 4
  desc: 1888年8月25日，台北大稻埕至錫口（今松山）段開始試營運，是台灣土地上第一次有火車載客；同年12月18日頒布台灣鐵路章程，台北至錫口正式開辦客運。此前一年淡水河上的大木橋（今台北大橋前身）先行竣工，鐵路才得以跨河北上。
  sources:
    - title: 維基百科：台灣鐵路
      url: https://zh.wikipedia.org/wiki/台灣鐵路

- id: tra-1888-tengyun
  year: 1888
  endYear: 1924
  title: 騰雲號抵台，台灣第一輛蒸汽機車
  category: rolling-stock
  importance: 4
  desc: 劉銘傳向德國霍亨索機車製造廠購入兩輛蒸汽機車，其中一輛正式名稱為「騰雲一號」，四輪水櫃式、重16公噸、牽引力2300公斤。1891年起與其他七輛新購機車一同行駛基隆至台北間，進入日治時期後仍留用於縱貫線，直到1924年才退休，是台灣現存最老的鐵路機車。清代另有六輛英國山楂萊斯利廠製的機車，日治後編為3型，1931年悉數報廢，無一保存。
  sources:
    - title: 維基百科：騰雲號
      url: https://zh.wikipedia.org/wiki/騰雲號

- id: tra-1888-shiqiuling-tunnel
  year: 1888
  endYear: 1890
  title: 獅球嶺隧道貫通，台灣第一座鐵路隧道
  category: construction
  importance: 3
  desc: 基隆端的獅球嶺是清代鐵路最難啃的一段。隧道自1888年春動工，1890年8月才鑿通，全長235公尺，費時三十個月，是台灣第一座鐵路隧道。日治時期改線後停用，卻也因此原封保存下來，成為目前唯一僅存的清代鐵路隧道，今列為基隆市定古蹟「劉銘傳隧道」。
  sources:
    - title: 維基百科：獅球嶺隧道
      url: https://zh.wikipedia.org/wiki/獅球嶺隧道

- id: tra-1891-keelung-taipei
  year: 1891
  title: 基隆至台北段通車
  category: opening
  importance: 4
  desc: 基隆到台北全段正式營運，是台灣第一條完整通車的鐵路。1893年再延伸至新竹，清代的鐵路建設至此告一段落，新竹以南僅築成路堤便告中止。這段路線鐵軌偏輕、坡度大、彎道急，橋樑又屢遭洪水沖毀，日治初期幾乎全線改線重建。
  sources:
    - title: 維基百科：台灣鐵路
      url: https://zh.wikipedia.org/wiki/台灣鐵路

- id: tra-1895-army-railway-corps
  year: 1895
  title: 陸軍臨時台灣鐵道隊接收清代鐵路，日治鐵道的過渡期
  category: institution
  importance: 4
  desc: 1895年日軍登陸後，基隆至新竹的清代鐵路由陸軍臨時台灣鐵道隊接管，先修復被戰事與洪水破壞的橋樑路段，勉強維持軍運與客運。1897年鐵道事務移交台灣總督府民政部，1899年才設立鐵道部改為專責機關。這四年間的營運全靠清代留下的舊線舊車，橋樑屢壞屢修，也讓總督府認定清代路線非改線重建不可。
  sources:
    - title: 維基百科：臺灣總督府交通局鐵道部
      url: https://zh.wikipedia.org/wiki/臺灣總督府交通局鐵道部
    - title: 維基百科：臺灣日治時期年表
      url: https://zh.wikipedia.org/wiki/臺灣日治時期年表

- id: tra-1899-railway-bureau
  year: 1899
  title: 台灣總督府鐵道部成立，縱貫線南北同時開工
  category: institution
  importance: 4
  desc: 民間募款興建鐵路的嘗試接連失敗後，總督府於1899年11月8日成立鐵道部，改由官方主導興建縱貫鐵路，自基隆、打狗兩端同時開工。隔年打狗至台南段率先通車，是日本統治後開通的第一條新路線，往後八年由南北兩端逐步向中部推進。
  sources:
    - title: 維基百科：台灣鐵路
      url: https://zh.wikipedia.org/wiki/台灣鐵路
    - title: 維基百科：臺灣總督府交通局鐵道部
      url: https://zh.wikipedia.org/wiki/臺灣總督府交通局鐵道部

- id: tra-1901-tamsui-line
  year: 1901
  title: 淡水線通車，台灣第一條鐵路支線
  category: opening
  importance: 3
  desc: 1900年動工，1901年8月25日通車，自台北站分歧北上至淡水，全長21.2公里，是台灣第一條鐵路支線；1916年再闢新北投支線。這條路線陪伴大台北通勤與觀光近九十年，直到1988年才走入歷史。
  sources:
    - title: 維基百科：淡水線 (臺鐵)
      url: https://zh.wikipedia.org/wiki/淡水線_(臺鐵)

- id: tra-1901-guilun-abandoned
  year: 1901
  title: 台北至桃園改線經板橋、鶯歌，清代龜崙嶺舊線廢棄改作公路
  category: closure
  importance: 3
  desc: 日治初期的改線工程以台北至桃仔園（今桃園）之間變動最大。清代舊線取道海山口（今新莊）、翻越龜崙嶺（今龜山），坡度陡到難以行車，1901年改為繞經枋橋（今板橋）、鶯歌石（今鶯歌）的新線。被放棄的舊路廊改鋪成「台北台南道路」，即日後省道台1線舊線的前身——鐵路換了路廊，也換掉了沿線市鎮的命運，新莊、龜山自此衰微，板橋、鶯歌則因鐵路而起。
  sources:
    - title: 維基百科：台灣鐵路
      url: https://zh.wikipedia.org/wiki/台灣鐵路

- id: tra-1908-trunk-line
  year: 1908
  title: 縱貫線全線通車
  category: opening
  importance: 5
  desc: 1908年4月20日，縱貫線在台灣中部接軌全線貫通，同年10月24日於台中公園舉行「全通式」通車典禮，由日本皇族閑院宮載仁親王主持。基隆到打狗（高雄）自此連成一氣，南北往來從數日縮短到一日之內，台灣西部的城市軸線自此定型。
  sources:
    - title: 維基百科：縱貫線 (臺鐵)
      url: https://zh.wikipedia.org/wiki/縱貫線_(臺鐵)

- id: tra-1908-railway-hotel
  year: 1908
  endYear: 1945
  title: 台灣鐵道飯店開業，縱貫線通車配套的第一家西式旅館
  category: institution
  importance: 3
  desc: 1907年夏動工，1908年10月落成、11月1日開業，位於台北車站對面，由鐵道部直營。三層樓、三十間客房與兩間餐廳，是台灣第一家也是當時唯一一家西式旅館，落成時間刻意配合縱貫線全通式，讓遠道而來的貴賓有地方落腳。1945年5月31日台北大空襲中被炸毀，戰後未在原址重建，舊址如今是新光摩天大樓一帶。
  sources:
    - title: 維基百科：臺灣鐵道飯店
      url: https://zh.wikipedia.org/wiki/臺灣鐵道飯店

- id: tra-1910-taitung-line-start
  year: 1910
  title: 台東線開工，東部有了第一條鐵路
  category: construction
  importance: 3
  desc: 1910年2月1日自花蓮港動工，同年12月15日花蓮港至鯉魚尾（今壽豐）先行舉行開通式，是東部第一段通車的鐵路。全段採762公釐窄軌，但路基橋隧依1067公釐標準預留，為日後改軌接上西部路網留了餘地。花蓮港至璞石閣（今玉里）到1917年才完工，全線通到台東更要等到1926年。
  sources:
    - title: 維基百科：臺東線
      url: https://zh.wikipedia.org/wiki/臺東線
    - title: 維基百科：臺灣日治時期年表
      url: https://zh.wikipedia.org/wiki/臺灣日治時期年表

- id: tra-1911-night-train
  year: 1911
  title: 基隆至打狗夜行列車開行，縱貫線進入長途運輸時代
  category: institution
  importance: 2
  desc: 1911年12月1日開行基隆至打狗（今高雄）的夜行列車，旅客上車過一夜就到島的另一端。隔年6月1日起，直達與夜行列車的一、二等車廂加掛食堂車。縱貫線1908年才剛全通，這兩項服務標誌著它從「接起來了」進入「當長途幹線在經營」的階段。
  sources:
    - title: 維基百科：臺灣日治時期年表
      url: https://zh.wikipedia.org/wiki/臺灣日治時期年表

- id: tra-1913-akau-line
  year: 1913
  title: 阿緱線通車，下淡水溪鐵橋是當時的東洋第一長橋
  category: opening
  importance: 3
  desc: 縱貫線南端自九曲堂跨過下淡水溪（今高屏溪）延伸到阿緱（今屏東），1913年12月20日開始營運，1914年2月15日由總督佐久間左馬太主持通車典禮。全長1526公尺、二十四孔鋼桁架的下淡水溪鐵橋號稱東洋第一長橋，設計者飯田豐二在完工前的1913年6月積勞病逝。舊橋1992年除役，1997年指定為國定古蹟保存至今。
  sources:
    - title: 維基百科：下淡水溪鐵橋
      url: https://zh.wikipedia.org/wiki/下淡水溪鐵橋
    - title: 維基百科：屏東線
      url: https://zh.wikipedia.org/wiki/屏東線

- id: tra-1918-yingge-runaway
  year: 1918
  title: 鶯歌石列車溜逸事故，促成縱貫線盤山展線改良
  category: accident
  importance: 3
  desc: 1918年6月21日晚間，台北開出的南下列車行經鶯歌石往桃園途中連結器斷裂，當時列車尚未裝設貫通式空氣煞車，脫離的車廂順著坡度倒溜後相撞，官方記為6人當場死亡（另有13人死亡之說），重傷五十餘人、輕傷百餘人。事故揭露了陡坡加上無貫通軔機的致命組合，鐵道部因此把該段改為繞行山腰的展線以減緩坡度，1922年完工，鶯歌車站也在同年遷至現址。
  sources:
    - title: 維基百科：鶯歌石列車溜逸事故
      url: https://zh.wikipedia.org/wiki/鶯歌石列車溜逸事故
    - title: 維基百科：鶯歌車站
      url: https://zh.wikipedia.org/wiki/鶯歌車站

- id: tra-1919-bureau-building
  year: 1919
  title: 鐵道部遷入台北新廳舍，此後七十年的鐵路行政中心
  category: institution
  importance: 3
  desc: 森山松之助設計的鐵道部廳舍座落於台北城北門旁，分兩期於1919、1920年完工，1919年5月27日鐵道部遷入。一樓磚造、二樓木造的半木構造，樑柱外露，木料多取自阿里山檜木——用自家鐵路運下山的木材蓋自家的辦公廳。這裡一直是台灣鐵路的行政中心，直到1990年台鐵局本部遷入台北車站大樓。2007年指定為國定古蹟，2020年以國立台灣博物館鐵道部園區的身分開放。
  sources:
    - title: 維基百科：臺灣總督府交通局鐵道部 (文化資產)
      url: https://zh.wikipedia.org/wiki/臺灣總督府交通局鐵道部_(文化資產)

- id: tra-1921-xindian-line
  year: 1921
  endYear: 1965
  title: 台北鐵道新店線通車，民營鐵道進入台北盆地
  category: opening
  importance: 3
  desc: 台北鐵道株式會社1919年由總督府評議員古賀三千人籌組，1921年3月24日試運轉、4月17日舉行萬華至新店的開通式，全長10.4公里、採1067公釐軌距，運送文山一帶的煤炭與茶葉，兼營客貨運，1931年再延長至文山郡役所。戰後改組為台北鐵路公司，1949年連同路線由台灣鐵路管理局收購，1965年廢線；同一條路廊日後成為捷運新店線。
  sources:
    - title: 維基百科：臺北鐵道
      url: https://zh.wikipedia.org/wiki/臺北鐵道
    - title: 維基百科：臺灣日治時期年表
      url: https://zh.wikipedia.org/wiki/臺灣日治時期年表

- id: tra-1922-coastal-line
  year: 1922
  title: 海岸線（海線）通車，縱貫線雙線紓解坡度瓶頸
  category: opening
  importance: 3
  desc: 縱貫線山線（今臺中線）坡度陡峭，貨運班次一直受限於瓶頸路段。總督府另闢一條沿海岸而行、坡度平緩的「海岸線」，自竹南通往彰化，1920年12月25日先通中段至清水，1922年10月全線通車，山、海兩線自此並行紓解縱貫線運能，也構成今日縱貫線的路網雛形。
  sources:
    - title: 維基百科：海岸線 (臺鐵)
      url: https://zh.wikipedia.org/wiki/海岸線_(臺鐵)
    - title: 維基百科：臺中線
      url: https://zh.wikipedia.org/wiki/臺中線

- id: tra-1924-yilan-line
  year: 1924
  title: 宜蘭線全線通車，北部首度以鐵路連通東部
  category: opening
  importance: 4
  desc: 1917年起自八堵、蘇澳兩端同時興建，歷經七年、克服草嶺隧道等艱鉅工程，1924年12月1日全線通車，全長93.6公里、共25座隧道。這是台灣鐵路首度將東部納入路網，往後北迴線、南迴線相繼通車，才逐步串成環島鐵路。
  sources:
    - title: 維基百科：宜蘭線
      url: https://zh.wikipedia.org/wiki/宜蘭線

- id: tra-1926-taitung-line
  year: 1926
  title: 台東線全線通車，東部自成一套762公釐窄軌路網
  category: opening
  importance: 4
  desc: 花蓮港至玉里段由總督府興建，1917年完工；台東至關山段原為民營台東開拓會社所建，1919年通車。1921年官方收購民營段並接軌，1926年3月25日全線通車，全長171.8公里，採762公釐窄軌，與西部縱貫線規格不同，形成東部獨立的鐵路系統。
  sources:
    - title: 維基百科：臺東線
      url: https://zh.wikipedia.org/wiki/臺東線

- id: tra-1948-tra-founded
  year: 1948
  title: 台灣鐵路管理局成立
  category: institution
  importance: 4
  desc: 戰後接收日治時期鐵道部的資產與路線，統一由省營機構經營。這個名字沿用了七十六年。
  sources:
    - title: 維基百科：臺灣鐵路管理局
      url: https://zh.wikipedia.org/wiki/臺灣鐵路管理局

- id: tra-1951-neiwan-line
  year: 1944
  endYear: 1951
  title: 內灣線通車，戰後首條新建支線
  category: opening
  importance: 3
  desc: 為開發新竹內山的煤礦、石灰石與林業資源，台灣電力株式會社於1944年奉命興建竹東支線，因二戰資金短缺而中止。戰後1947年新竹至竹東段重新通車，是台灣戰後第一條興建的支線鐵路；1950年延伸至合興，1951年9月11日全線通車定名內灣線。2011年新竹至竹中段完成高架電氣化，使內灣線成為台鐵唯一同時擁有電氣化與非電氣化區間的路線。
  sources:
    - title: 維基百科：內灣線
      url: https://zh.wikipedia.org/wiki/內灣線

- id: tra-1961-minxiong-accident
  year: 1961
  title: 民雄平交道事故，太魯閣事故前死傷最慘重的一次
  category: accident
  importance: 4
  desc: 1961年7月9日，台中開往高雄的11次對號特快車，在民雄站南方平交道撞上闖越的嘉義客運班車，車上48人罹難、28人受傷。這是2021年太魯閣號事故發生前，台灣鐵路史上死傷最慘重的一次事故。事後這處平交道永久封閉，另建陸橋改道。
  sources:
    - title: 維基百科：平交道
      url: https://zh.wikipedia.org/wiki/平交道
    - title: 維基百科：臺鐵重大死傷事故列表
      url: https://zh.wikipedia.org/wiki/臺鐵重大死傷事故列表

- id: tra-1965-shenao-line
  year: 1965
  endYear: 2014
  title: 深澳線通車，貨運轉型海科館觀光線
  category: opening
  importance: 3
  desc: 台鐵1965年4月8日開通瑞芳至深澳貨運線，1967年延伸至水湳洞並兼辦客運，主要運送深澳發電廠所需煤炭；其路廊部分源自日治時期運送金瓜石礦砂的金瓜石線。隨後客運業績衰退，1989年8月客貨運全面停駛，僅存的運煤業務也在2007年結束。停用多年後，為銜接國立海洋科技博物館，2014年1月9日恢復客運，同年7月與平溪線直通運行，是台灣少見「先廢後復」的成功案例。
  sources:
    - title: 維基百科：深澳線
      url: https://zh.wikipedia.org/wiki/深澳線

- id: tra-1966-dr2700-guanghua
  year: 1966
  endYear: 2014
  title: 光華號登場，DR2700型柴聯車服役近半世紀
  category: rolling-stock
  importance: 3
  desc: 1966年10月31日，DR2700型柴聯車以「光華號」之名在西部幹線正式營運，台北到高雄僅需4小時45分，是自強號推出前台灣陸上最快的交通工具。隨後地位陸續被自強號、莒光號取代，逐漸轉為對號快車、普通車，晚年主要行駛花東線；2014年7月15日隨花東線電氣化完工，最後一班普快車抵達花蓮，結束近48年的服役生涯。
  sources:
    - title: 維基百科：光華號列車
      url: https://zh.wikipedia.org/wiki/光華號列車
    - title: 維基百科：台鐵DR2700型柴油車
      url: https://zh.wikipedia.org/wiki/台鐵DR2700型柴油車

- id: tra-1970-juguang
  year: 1970
  title: 莒光號開行，台鐵最高等級客車的世代交替
  category: rolling-stock
  importance: 3
  desc: 1970年2月3日，首批27輛客車由R100型柴電機車牽引，以台北至台中的1011至1014次投入營運，同月20日擴展到高雄線。車廂由日本車輛、日立製作所合作生產，取代前一世代的觀光號成為台鐵最高等級的客車，觀光號車廂也在1970年代陸續改造為莒光號。1986年起引進車頂冷氣型（10200系列），1995年後的新造與改造車改配自動門；2022年6月29日摺疊門車廂全數退役。隨EMU3000型接手城際運用，莒光號規劃在2028年底前全數退場。
  sources:
    - title: 維基百科：莒光號列車
      url: https://zh.wikipedia.org/wiki/莒光號列車

- id: tra-1978-emu100
  year: 1978
  endYear: 2010
  title: EMU100型電聯車服役，台鐵首款電聯自強號
  category: rolling-stock
  importance: 4
  desc: 從英國引進的交流電聯車，1978年8月15日起以「自強號」之名投入營運，是台鐵首度採用電聯車，也是「自強號」這個品牌的起點；隔年西部幹線電氣化完工，電聯車才有全線用武之地。服役逾三十年後零件停產、故障頻傳，2010年7月4日一列自強號故障後台鐵不再排班，全數走入歷史。
  sources:
    - title: 維基百科：台鐵EMU100型電聯車
      url: https://zh.wikipedia.org/wiki/台鐵EMU100型電聯車

- id: tra-1979-electrification
  year: 1979
  title: 西部幹線電氣化完成
  category: construction
  importance: 5
  desc: 十大建設之一。蒸汽與柴油動力退出主線，行車速度與運能都跳了一級。
  sources:
    - title: 維基百科：十大建設
      url: https://zh.wikipedia.org/wiki/十大建設
    - title: 維基百科：西部幹線
      url: https://zh.wikipedia.org/wiki/西部幹線

- id: tra-1980-north-link
  year: 1980
  title: 北迴線通車
  category: opening
  importance: 4
  desc: 蘇澳到花蓮接上，東部從此不必再靠公路與海運進出。也是十大建設的一環。
  sources:
    - title: 維基百科：北迴線
      url: https://zh.wikipedia.org/wiki/北迴線

- id: tra-1982-taitung-widening
  year: 1982
  title: 台東線拓寬為1067公釐軌距，銜接北迴線
  category: construction
  importance: 3
  desc: 為與1980年通車的北迴線銜接，台東線自1978年起展開拓寬工程，將原本762公釐窄軌全面改建為與西部相同的1067公釐軌距，1982年6月完工通車。東部鐵路自此可與西部列車直通行駛，不必再於花蓮換車換裝。
  sources:
    - title: 維基百科：臺東線
      url: https://zh.wikipedia.org/wiki/臺東線

- id: tra-1983-taipei-underground
  year: 1983
  endYear: 2011
  title: 台北鐵路地下化動工，市區平交道與地面幹線陸續消失
  category: construction
  importance: 4
  desc: 1979年行政院核准台北車站段地下化，1983年7月12日動土，1989年9月2日主體完工通車，台北車站一併改建為地下車站。後續分三期東西延伸：松山專案1989年動工，1992至1994年南北隧道分階段啟用，騰出的地面路廊改成市民大道；萬華板橋專案1992年動工，1999與2002年兩座隧道先後啟用；松山南港專案1998年動工，2008年9月21日切換啟用，2011年全案竣工。四期合計新台幣1,741億元，台北市自此沒有平交道，也沒有走在地面上的城際鐵路，同一條路廊還順帶為日後的高鐵台北段預留了空間。
  sources:
    - title: 維基百科：臺北鐵路地下化專案
      url: https://zh.wikipedia.org/wiki/臺北鐵路地下化專案

- id: tra-1988-tamsui-closure
  year: 1988
  title: 淡水線走入歷史，路廊改建為捷運
  category: closure
  importance: 4
  desc: 1988年7月15日深夜11點20分，末班往淡水的列車自台北車站第六月台發車，翌日再加開一班紀念列車後，經營87年的淡水線正式停駛。原有路廊隨後改建為台北捷運，1997年通車的淡水線是台灣第一條由傳統鐵路直接改建而成的捷運路線。
  sources:
    - title: 維基百科：淡水線 (臺鐵)
      url: https://zh.wikipedia.org/wiki/淡水線_(臺鐵)

- id: tra-1991-zaoqiao-collision
  year: 1991
  title: 造橋列車追撞事故，山線全面雙軌化的導火線
  category: accident
  importance: 4
  desc: 1991年11月15日下午，苗栗造橋鄉山線134號誌站，北上自強號因ATS/ATW安全系統故障、號誌疑似誤判，加上彎道視線受阻，煞車不及追撞上正轉轍進入副正線的南下莒光號，兩車多節車廂出軌翻覆，造成30人死亡、112人受傷。134號誌站已隨後續山線雙軌工程於1996年廢止，這起事故也加速了1998年新山線通車、舊山線走入歷史的腳步。
  sources:
    - title: 維基百科：造橋列車追撞事故
      url: https://zh.wikipedia.org/wiki/造橋列車追撞事故

- id: tra-1991-south-link
  year: 1991
  title: 南迴線通車，環島鐵路網成形
  category: opening
  importance: 5
  desc: 枋寮到台東的最後一段接通，台灣的鐵路自此連成一個環。這是縱貫線通車後最大的一次路網改變。
  sources:
    - title: 維基百科：南迴線
      url: https://zh.wikipedia.org/wiki/南迴線

- id: tra-1996-push-pull
  year: 1996
  title: 推拉式自強號登場，台鐵城際主力換了一個世代
  category: rolling-stock
  importance: 3
  desc: 台鐵1990年代中期的「810購車計畫」訂購400輛車，E1000型電力機車由南非UCW製造，客車由韓國現代精工承造，首列1996年4月運抵台灣，同年中秋連假投入服務，11月1日起接手EMU100型的直達自強號班次。兩輛機車一前一後夾住客車編組，省去終點站調頭的工序，是台鐵第一款推拉式列車，共64輛機車、349輛客車，此後二十餘年都是西部幹線的門面。2026年7月1日改點後轉為備用車，定期運用告終。
  sources:
    - title: 維基百科：推拉式自強號
      url: https://zh.wikipedia.org/wiki/推拉式自強號

- id: tra-1998-old-mountain-line-closure
  year: 1998
  title: 舊山線廢止，新山線雙軌通車
  category: closure
  importance: 4
  desc: 三義至豐原間的原臺中線（山線）坡度陡峭、單軌行車瓶頸嚴重，加上1991年造橋事故的教訓，台鐵另闢一條複線化的「新山線」。1998年9月24日最後一班列車駛過勝興車站後，行車路線正式切換至新山線，這段全長23.6公里、經勝興車站與魚藤坪斷橋等著名地標的舊山線走入歷史。
  sources:
    - title: 維基百科：舊山線
      url: https://zh.wikipedia.org/wiki/舊山線

- id: tra-2007-taroko-express
  year: 2007
  title: 太魯閣號傾斜式列車正式營運，台灣首款擺式列車
  category: rolling-stock
  importance: 3
  desc: 台鐵向日立製作所採購的TEMU1000型電聯車，以「太魯閣號」之名於2007年5月8日正式營運，主跑宜蘭線、北迴線與台東線。這是台灣第一款引進的傾斜式（擺式）列車，最大可傾斜5度，過彎速度比一般車種快，大幅縮短東部幹線行車時間。
  sources:
    - title: 維基百科：台鐵TEMU1000型電聯車
      url: https://zh.wikipedia.org/wiki/台鐵TEMU1000型電聯車

- id: tra-2010-old-mountain-line-revival
  year: 2010
  title: 舊山線復駛，轉型觀光鐵道
  category: opening
  importance: 3
  desc: 停用十二年後，舊山線於2010年6月5日以觀光列車形式復駛，勝興車站、魚藤坪斷橋（龍騰斷橋）等日治工程遺跡自此成為熱門鐵道旅遊景點。2015年起復駛班次縮減，僅不定期加開特定活動列車。
  sources:
    - title: 維基百科：舊山線
      url: https://zh.wikipedia.org/wiki/舊山線

- id: tra-2013-puyuma
  year: 2013
  title: 普悠瑪號服役，第二款傾斜式列車跑遍全島
  category: rolling-stock
  importance: 3
  desc: 台鐵2012年自日本車輛引進的TEMU2000型傾斜式電聯車，2013年2月6日投入營運，車名取自卑南族自稱。初期專跑東部幹線的特快班次，與太魯閣號一同壓縮台北往花東的行車時間；不同於太魯閣號長期受限於編組與月台，普悠瑪後來擴及台鐵主要路網。2018年新馬站出軌事故後，全面加裝與檢討列車速限自動控制系統。
  sources:
    - title: 維基百科：普悠瑪列車
      url: https://zh.wikipedia.org/wiki/普悠瑪列車

- id: tra-2014-electrification-east
  year: 2014
  title: 花東線電氣化通車
  category: construction
  importance: 3
  desc: 台鐵自2009年起於花蓮、台東間展開電氣化工程，2014年6月28日於台東站舉行通車典禮，完成交流25KV電氣化。東部幹線自此大幅提升行車效率與運能，也為傾斜式電聯車普悠瑪號投入東部營運鋪路。
  sources:
    - title: 維基百科：臺東線
      url: https://zh.wikipedia.org/wiki/臺東線

- id: tra-2018-kaohsiung-underground
  year: 2018
  title: 高雄市區鐵路地下化切換通車，帝冠式舊站走了十九年才回家
  category: construction
  importance: 3
  desc: 2006年1月行政院核定，2009年6月26日愛河段隧道開工，2018年10月14日新舊軌道切換通車，高雄市區的地面鐵路與平交道自此消失，路廊改闢為綠園道。1941年落成的帝冠式舊高雄車站為了讓出施工空間，2002年8月整棟遷移；直到2021年7月至9月間才移回永久位置，成為地下化新站的一部分。
  sources:
    - title: 維基百科：高雄市區鐵路地下化計畫
      url: https://zh.wikipedia.org/wiki/高雄市區鐵路地下化計畫

- id: tra-2018-puyuma
  year: 2018
  title: 普悠瑪號新馬站出軌事故
  category: accident
  importance: 4
  desc: 宜蘭線新馬站彎道出軌，十八人罹難。事後對列車速限自動控制與行車管理制度做了大幅檢討。
  sources:
    - title: 維基百科：普悠瑪號列車出軌事故
      url: https://zh.wikipedia.org/wiki/普悠瑪號列車出軌事故

- id: tra-2020-south-link-electrification
  year: 2020
  title: 南迴線電氣化通車，環島鐵路電氣化最後一哩路
  category: construction
  importance: 4
  desc: 2017年9月動工，2020年12月20日首航、23日正式通車，普悠瑪號與推拉式自強號等電氣化列車投入南迴線營運。至此，自1979年西部幹線電氣化以來歷經逾四十年，台灣環島鐵路網終於全線電氣化完成，柴油機車正式退出主線營運。
  sources:
    - title: 維基百科：南迴線
      url: https://zh.wikipedia.org/wiki/南迴線

- id: tra-2021-emu3000
  year: 2021
  title: EMU3000型電聯車加入營運，全面汰換老舊城際車隊
  category: rolling-stock
  importance: 3
  desc: 2018年12月由日立製作所以新台幣442.9億元得標、隔年1月簽約，首列原訂2021年6月交車、因疫情延至7月30日抵台，12月29日以「新自強號」之名正式加入營運。2021至2024年間分批交付50列共600輛，是台鐵單一車型採購數量最多的電聯車，用來汰換車況不佳、故障頻傳的自強號與莒光號老舊車隊；同年4月EMU300型已先退出定期運用。
  sources:
    - title: 維基百科：台鐵EMU3000型電聯車
      url: https://zh.wikipedia.org/wiki/台鐵EMU3000型電聯車

- id: tra-2021-taroko
  year: 2021
  title: 太魯閣號清水隧道出軌事故
  category: accident
  importance: 4
  desc: 工程車滑落邊坡侵入路線，列車在隧道口撞上，四十九人罹難，是台鐵史上死傷最重的事故。
  sources:
    - title: 維基百科：北迴線太魯閣號列車出軌事故
      url: https://zh.wikipedia.org/wiki/北迴線太魯閣號列車出軌事故

- id: tra-2023-diesel-emu-farewell
  year: 2023
  title: 柴聯自強號告別，非電氣化時代的最後一批城際車退場
  category: rolling-stock
  importance: 3
  desc: DR2800型1982年6月1日上路，是台鐵第一款冷氣柴聯車，專為當時尚未電氣化的東部幹線而生；DR2900型1986年12月、DR3000型1990年5月接續加入。三型合稱「柴聯自強號」，在北迴線與台東線跑了四十年。隨著花東線與南迴線先後電氣化、EMU3000型大量到位，2023年4月26日最後一趟商業運轉後全數退出定期運用。
  sources:
    - title: 維基百科：自強號列車
      url: https://zh.wikipedia.org/wiki/自強號列車

- id: tra-2024-corporatization
  year: 2024
  title: 台灣鐵路公司成立，台鐵局走入歷史
  category: institution
  importance: 4
  desc: 由公務機關改制為國營公司，人事與財務脫離公務體系。組織形式的改變，不是路線的改變。
  sources:
    - title: 維基百科：臺灣鐵路公司
      url: https://zh.wikipedia.org/wiki/臺灣鐵路公司

- id: tra-2025-railway-museum
  year: 2025
  title: 國家鐵道博物館開館，舊台北機廠重生
  category: opening
  importance: 3
  desc: 停用的台北機廠2015年整區指定為國定古蹟，2019年成立國家鐵道博物館籌備處，歷經數年古蹟修復工程，2025年7月31日啟動第一階段開館，開放六處古蹟建築，典藏日本JR東日本捐贈的583系電聯車等重要車輛，是台灣第一座國家級鐵道博物館。
  sources:
    - title: 維基百科：國家鐵道博物館
      url: https://zh.wikipedia.org/wiki/國家鐵道博物館
