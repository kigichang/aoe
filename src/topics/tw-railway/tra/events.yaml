# 補到正式規模時請照 README：先用維基 API 批次查證標題，再寫入。

- id: tra-1887-start
  year: 1887
  title: 劉銘傳設全臺鐵路商務總局，台灣鐵路開工
  category: construction
  importance: 5
  desc: 台灣第一條官辦鐵路動工，也是清帝國境內最早自建的鐵路之一。路線自基隆往南，目標是縱貫全島。
  sources:
    - title: 維基百科：台灣鐵路
      url: https://zh.wikipedia.org/wiki/台灣鐵路
    - title: 維基百科：劉銘傳
      url: https://zh.wikipedia.org/wiki/劉銘傳

- id: tra-1891-keelung-taipei
  year: 1891
  title: 基隆至台北段通車
  category: opening
  importance: 4
  desc: 台灣第一段實際營運的鐵路。1893年再延伸至新竹，清代的鐵路建設至此告一段落。這段路線坡度大、彎道急，日治初期幾乎全線改線重建。
  sources:
    - title: 維基百科：台灣鐵路
      url: https://zh.wikipedia.org/wiki/台灣鐵路

- id: tra-1899-railway-bureau
  year: 1899
  title: 台灣總督府鐵道部成立，縱貫線南北同時開工
  category: institution
  importance: 4
  desc: 民間募款興建鐵路的嘗試接連失敗後，總督府於1899年11月8日成立鐵道部，改由官方主導興建縱貫鐵路，自基隆、打狗兩端同時開工。隔年打狗至台南段率先通車，是日本統治後開通的第一條新路線，往後八年由南北兩端逐步向中部推進。
  sources:
    - title: 維基百科：台灣鐵路
      url: https://zh.wikipedia.org/wiki/台灣鐵路
    - title: 維基百科：臺灣總督府交通局鐵道部
      url: https://zh.wikipedia.org/wiki/臺灣總督府交通局鐵道部

- id: tra-1901-tamsui-line
  year: 1901
  title: 淡水線通車，台灣第一條鐵路支線
  category: opening
  importance: 3
  desc: 1900年動工，1901年8月25日通車，自台北站分歧北上至淡水，全長21.2公里，是台灣第一條鐵路支線；1916年再闢新北投支線。這條路線陪伴大台北通勤與觀光近九十年，直到1988年才走入歷史。
  sources:
    - title: 維基百科：淡水線 (臺鐵)
      url: https://zh.wikipedia.org/wiki/淡水線_(臺鐵)

- id: tra-1908-trunk-line
  year: 1908
  title: 縱貫線全線通車
  category: opening
  importance: 5
  desc: 1908年4月20日，縱貫線在台灣中部接軌全線貫通，同年10月24日於台中公園舉行「全通式」通車典禮，由日本皇族閑院宮載仁親王主持。基隆到打狗（高雄）自此連成一氣，南北往來從數日縮短到一日之內，台灣西部的城市軸線自此定型。
  sources:
    - title: 維基百科：縱貫線 (臺鐵)
      url: https://zh.wikipedia.org/wiki/縱貫線_(臺鐵)

- id: tra-1922-coastal-line
  year: 1922
  title: 海岸線（海線）通車，縱貫線雙線紓解坡度瓶頸
  category: opening
  importance: 3
  desc: 縱貫線山線（今臺中線）坡度陡峭，貨運班次一直受限於瓶頸路段。總督府另闢一條沿海岸而行、坡度平緩的「海岸線」，自竹南通往彰化，1920年12月25日先通中段至清水，1922年10月全線通車，山、海兩線自此並行紓解縱貫線運能，也構成今日縱貫線的路網雛形。
  sources:
    - title: 維基百科：海岸線 (臺鐵)
      url: https://zh.wikipedia.org/wiki/海岸線_(臺鐵)
    - title: 維基百科：臺中線
      url: https://zh.wikipedia.org/wiki/臺中線

- id: tra-1924-yilan-line
  year: 1924
  title: 宜蘭線全線通車，北部首度以鐵路連通東部
  category: opening
  importance: 4
  desc: 1917年起自八堵、蘇澳兩端同時興建，歷經七年、克服草嶺隧道等艱鉅工程，1924年12月1日全線通車，全長93.6公里、共25座隧道。這是台灣鐵路首度將東部納入路網，往後北迴線、南迴線相繼通車，才逐步串成環島鐵路。
  sources:
    - title: 維基百科：宜蘭線
      url: https://zh.wikipedia.org/wiki/宜蘭線

- id: tra-1926-taitung-line
  year: 1926
  title: 台東線全線通車，東部自成一套762公釐窄軌路網
  category: opening
  importance: 4
  desc: 花蓮港至玉里段由總督府興建，1917年完工；台東至關山段原為民營台東開拓會社所建，1919年通車。1921年官方收購民營段並接軌，1926年3月25日全線通車，全長171.8公里，採762公釐窄軌，與西部縱貫線規格不同，形成東部獨立的鐵路系統。
  sources:
    - title: 維基百科：臺東線
      url: https://zh.wikipedia.org/wiki/臺東線

- id: tra-1948-tra-founded
  year: 1948
  title: 台灣鐵路管理局成立
  category: institution
  importance: 4
  desc: 戰後接收日治時期鐵道部的資產與路線，統一由省營機構經營。這個名字沿用了七十六年。
  sources:
    - title: 維基百科：臺灣鐵路管理局
      url: https://zh.wikipedia.org/wiki/臺灣鐵路管理局

- id: tra-1951-neiwan-line
  year: 1944
  endYear: 1951
  title: 內灣線通車，戰後首條新建支線
  category: opening
  importance: 3
  desc: 為開發新竹內山的煤礦、石灰石與林業資源，台灣電力株式會社於1944年奉命興建竹東支線，因二戰資金短缺而中止。戰後1947年新竹至竹東段重新通車，是台灣戰後第一條興建的支線鐵路；1950年延伸至合興，1951年9月11日全線通車定名內灣線。2011年新竹至竹中段完成高架電氣化，使內灣線成為台鐵唯一同時擁有電氣化與非電氣化區間的路線。
  sources:
    - title: 維基百科：內灣線
      url: https://zh.wikipedia.org/wiki/內灣線

- id: tra-1961-minxiong-accident
  year: 1961
  title: 民雄平交道事故，太魯閣事故前死傷最慘重的一次
  category: accident
  importance: 4
  desc: 1961年7月9日，台中開往高雄的11次對號特快車，在民雄站南方平交道撞上闖越的嘉義客運班車，車上48人罹難、28人受傷。這是2021年太魯閣號事故發生前，台灣鐵路史上死傷最慘重的一次事故。事後這處平交道永久封閉，另建陸橋改道。
  sources:
    - title: 維基百科：平交道
      url: https://zh.wikipedia.org/wiki/平交道
    - title: 維基百科：臺鐵重大死傷事故列表
      url: https://zh.wikipedia.org/wiki/臺鐵重大死傷事故列表

- id: tra-1965-shenao-line
  year: 1965
  endYear: 2014
  title: 深澳線通車，貨運轉型海科館觀光線
  category: opening
  importance: 3
  desc: 台鐵1965年4月8日開通瑞芳至深澳貨運線，1967年延伸至水湳洞並兼辦客運，主要運送深澳發電廠所需煤炭；其路廊部分源自日治時期運送金瓜石礦砂的金瓜石線。隨後客運業績衰退，1989年8月客貨運全面停駛，僅存的運煤業務也在2007年結束。停用多年後，為銜接國立海洋科技博物館，2014年1月9日恢復客運，同年7月與平溪線直通運行，是台灣少見「先廢後復」的成功案例。
  sources:
    - title: 維基百科：深澳線
      url: https://zh.wikipedia.org/wiki/深澳線

- id: tra-1979-electrification
  year: 1979
  title: 西部幹線電氣化完成
  category: construction
  importance: 5
  desc: 十大建設之一。蒸汽與柴油動力退出主線，行車速度與運能都跳了一級。
  sources:
    - title: 維基百科：十大建設
      url: https://zh.wikipedia.org/wiki/十大建設
    - title: 維基百科：西部幹線
      url: https://zh.wikipedia.org/wiki/西部幹線

- id: tra-1980-north-link
  year: 1980
  title: 北迴線通車
  category: opening
  importance: 4
  desc: 蘇澳到花蓮接上，東部從此不必再靠公路與海運進出。也是十大建設的一環。
  sources:
    - title: 維基百科：北迴線
      url: https://zh.wikipedia.org/wiki/北迴線

- id: tra-1982-taitung-widening
  year: 1982
  title: 台東線拓寬為1067公釐軌距，銜接北迴線
  category: construction
  importance: 3
  desc: 為與1980年通車的北迴線銜接，台東線自1978年起展開拓寬工程，將原本762公釐窄軌全面改建為與西部相同的1067公釐軌距，1982年6月完工通車。東部鐵路自此可與西部列車直通行駛，不必再於花蓮換車換裝。
  sources:
    - title: 維基百科：臺東線
      url: https://zh.wikipedia.org/wiki/臺東線

- id: tra-1988-tamsui-closure
  year: 1988
  title: 淡水線走入歷史，路廊改建為捷運
  category: closure
  importance: 4
  desc: 1988年7月15日深夜11點20分，末班往淡水的列車自台北車站第六月台發車，翌日再加開一班紀念列車後，經營87年的淡水線正式停駛。原有路廊隨後改建為台北捷運，1997年通車的淡水線是台灣第一條由傳統鐵路直接改建而成的捷運路線。
  sources:
    - title: 維基百科：淡水線 (臺鐵)
      url: https://zh.wikipedia.org/wiki/淡水線_(臺鐵)

- id: tra-1991-zaoqiao-collision
  year: 1991
  title: 造橋列車追撞事故，山線全面雙軌化的導火線
  category: accident
  importance: 4
  desc: 1991年11月15日下午，苗栗造橋鄉山線134號誌站，北上自強號因ATS/ATW安全系統故障、號誌疑似誤判，加上彎道視線受阻，煞車不及追撞上正轉轍進入副正線的南下莒光號，兩車多節車廂出軌翻覆，造成30人死亡、112人受傷。134號誌站已隨後續山線雙軌工程於1996年廢止，這起事故也加速了1998年新山線通車、舊山線走入歷史的腳步。
  sources:
    - title: 維基百科：造橋列車追撞事故
      url: https://zh.wikipedia.org/wiki/造橋列車追撞事故

- id: tra-1991-south-link
  year: 1991
  title: 南迴線通車，環島鐵路網成形
  category: opening
  importance: 5
  desc: 枋寮到台東的最後一段接通，台灣的鐵路自此連成一個環。這是縱貫線通車後最大的一次路網改變。
  sources:
    - title: 維基百科：南迴線
      url: https://zh.wikipedia.org/wiki/南迴線

- id: tra-1998-old-mountain-line-closure
  year: 1998
  title: 舊山線廢止，新山線雙軌通車
  category: closure
  importance: 4
  desc: 三義至豐原間的原臺中線（山線）坡度陡峭、單軌行車瓶頸嚴重，加上1991年造橋事故的教訓，台鐵另闢一條複線化的「新山線」。1998年9月24日最後一班列車駛過勝興車站後，行車路線正式切換至新山線，這段全長23.6公里、經勝興車站與魚藤坪斷橋等著名地標的舊山線走入歷史。
  sources:
    - title: 維基百科：舊山線
      url: https://zh.wikipedia.org/wiki/舊山線

- id: tra-2007-taroko-express
  year: 2007
  title: 太魯閣號傾斜式列車正式營運，台灣首款擺式列車
  category: rolling-stock
  importance: 3
  desc: 台鐵向日立製作所採購的TEMU1000型電聯車，以「太魯閣號」之名於2007年5月8日正式營運，主跑宜蘭線、北迴線與台東線。這是台灣第一款引進的傾斜式（擺式）列車，最大可傾斜5度，過彎速度比一般車種快，大幅縮短東部幹線行車時間。
  sources:
    - title: 維基百科：台鐵TEMU1000型電聯車
      url: https://zh.wikipedia.org/wiki/台鐵TEMU1000型電聯車

- id: tra-2010-old-mountain-line-revival
  year: 2010
  title: 舊山線復駛，轉型觀光鐵道
  category: opening
  importance: 3
  desc: 停用十二年後，舊山線於2010年6月5日以觀光列車形式復駛，勝興車站、魚藤坪斷橋（龍騰斷橋）等日治工程遺跡自此成為熱門鐵道旅遊景點。2015年起復駛班次縮減，僅不定期加開特定活動列車。
  sources:
    - title: 維基百科：舊山線
      url: https://zh.wikipedia.org/wiki/舊山線

- id: tra-2014-electrification-east
  year: 2014
  title: 花東線電氣化通車
  category: construction
  importance: 3
  desc: 台鐵自2009年起於花蓮、台東間展開電氣化工程，2014年6月28日於台東站舉行通車典禮，完成交流25KV電氣化。東部幹線自此大幅提升行車效率與運能，也為傾斜式電聯車普悠瑪號投入東部營運鋪路。
  sources:
    - title: 維基百科：臺東線
      url: https://zh.wikipedia.org/wiki/臺東線

- id: tra-2018-puyuma
  year: 2018
  title: 普悠瑪號新馬站出軌事故
  category: accident
  importance: 4
  desc: 宜蘭線新馬站彎道出軌，十八人罹難。事後對列車速限自動控制與行車管理制度做了大幅檢討。
  sources:
    - title: 維基百科：普悠瑪號列車出軌事故
      url: https://zh.wikipedia.org/wiki/普悠瑪號列車出軌事故

- id: tra-2020-south-link-electrification
  year: 2020
  title: 南迴線電氣化通車，環島鐵路電氣化最後一哩路
  category: construction
  importance: 4
  desc: 2017年9月動工，2020年12月20日首航、23日正式通車，普悠瑪號與推拉式自強號等電氣化列車投入南迴線營運。至此，自1979年西部幹線電氣化以來歷經逾四十年，台灣環島鐵路網終於全線電氣化完成，柴油機車正式退出主線營運。
  sources:
    - title: 維基百科：南迴線
      url: https://zh.wikipedia.org/wiki/南迴線

- id: tra-2021-taroko
  year: 2021
  title: 太魯閣號清水隧道出軌事故
  category: accident
  importance: 4
  desc: 工程車滑落邊坡侵入路線，列車在隧道口撞上，四十九人罹難，是台鐵史上死傷最重的事故。
  sources:
    - title: 維基百科：北迴線太魯閣號列車出軌事故
      url: https://zh.wikipedia.org/wiki/北迴線太魯閣號列車出軌事故

- id: tra-2024-corporatization
  year: 2024
  title: 台灣鐵路公司成立，台鐵局走入歷史
  category: institution
  importance: 4
  desc: 由公務機關改制為國營公司，人事與財務脫離公務體系。組織形式的改變，不是路線的改變。
  sources:
    - title: 維基百科：臺灣鐵路公司
      url: https://zh.wikipedia.org/wiki/臺灣鐵路公司

- id: tra-2025-railway-museum
  year: 2025
  title: 國家鐵道博物館開館，舊台北機廠重生
  category: opening
  importance: 3
  desc: 停用的台北機廠2015年整區指定為國定古蹟，2019年成立國家鐵道博物館籌備處，歷經數年古蹟修復工程，2025年7月31日啟動第一階段開館，開放六處古蹟建築，典藏日本JR東日本捐贈的583系電聯車等重要車輛，是台灣第一座國家級鐵道博物館。
  sources:
    - title: 維基百科：國家鐵道博物館
      url: https://zh.wikipedia.org/wiki/國家鐵道博物館
