# 兩條 track，理由同 visual/periods.yaml：
#   track 0 = 西方
#   track 1 = 東亞木構
#
# 東亞這條刻意用「木構」而非朝代來命名——建築史上東亞與西方最根本的
# 分歧不是風格而是材料：一邊用石砌與拱券解決跨距，一邊用榫卯與斗栱。
# 這條線因此不跟著改朝換代切，而是照木構技術本身的階段切。

# ---- track 0：西方 ----

