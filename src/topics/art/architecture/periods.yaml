  note: 塔與殿堂的形制隨佛教傳入而確立，法隆寺是現存最早的實物。

- id: arc-p-tang-song
  name: 唐宋斗栱
  track: 1
  start: 618
  end: 1279
  note: 斗栱是結構主體，《營造法式》把作法標準化。

- id: arc-p-ming-qing-timber
  name: 明清官式
  track: 1
  start: 1280
  end: 1911
  note: 斗栱縮小為裝飾，改由樑柱直接承重，形制全面制度化。

