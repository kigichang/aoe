# 世界藝術史。目錄名就是網址路徑：/art/
#
# 史觀：**「做得到什麼」的歷史**，不是傑作排行榜。收錄的判準是「這件事之後，
# 這一門能做的事不一樣了」——一種材料或方法被發明出來、一群人形成共同的做法、
# 一件作品把某條路走到讓後人繞不開、誰出錢誰認證的規則改變了、
# 一個傳統的東西被另一個傳統挪去用、有人因為做了某件作品被查禁或被砸。
#
# 刻意**不做「傑作巡禮」**：《蒙娜麗莎》沒有收，因為它的地位是十九世紀之後
# 才長出來的，在繪畫本身能做的事上沒有留下缺口；同一位達文西的《最後的晚餐》
# 收了，因為那是線性透視被用來組織一整個敘事場面的關鍵一步。
#
# 也刻意**不把非西方的部分當成「其他」**。朱載堉比歐洲早半世紀算出十二平均律、
# 中國的印刷書比古騰堡早六百年、日本浮世繪反過來改寫了巴黎的構圖習慣——
# 這些不是補充說明，是這條軸上與西方事件同一級的節點。

name: 世界藝術史
description: 把幾個門類放在同一條時間軸上，看同一個年代各自在做什麼。

order: 5

# 欄位在這裡是「門類」，不是地區，也不是媒材。
#
# 為什麼不照地理分欄：世界史那個主題已經在做地理對照，宗教史也已經解釋過
# 重做一次沒有新東西。照門類分欄才問得出這個主題獨有的問題——
# 「莎士比亞寫《哈姆雷特》那年，歌劇剛剛被發明出來」
# 「巴哈寫《平均律》的同時，洛可可正在把宮廷牆面畫滿貝殼捲草」。
#
# 為什麼不叫「媒材」：媒材是油畫、青銅、羊皮紙這一層，比欄位細一級，
# 而且新媒材的出現本身就是這條軸上的事件（攝影、留聲機、電影），
# 把它當成欄位就沒地方擺這些事件了。門類才是那個穩定不變的容器。
columnLabel: 門類

# 開場縮放（px/年）。與科學史同為 1.6：事件分佈的形狀幾乎一樣——
# 軸的前三千年稀疏，1400 之後急遽變密，1850 之後每十年都有東西。
# 1.0 時十九世紀以後整段擠成一片圓點，1.6 才讀得出標題。
defaultPpy: 1.6

# 愈近代愈密。1400（印刷術與透視法）與 1600（歌劇與巴洛克）各給一顆，
# 因為那是這條軸上密度陡增的兩個轉折點。
jumps: [-2000, -500, 1, 500, 1000, 1400, 1600, 1800, 1900, 1960]
