# 欄位定義。order 決定由左至右的順序，**同時也決定配色 slot**
# （0=藍 1=橘 2=青 3=黃 4=洋紅 5=綠 6=紫 7=紅）。
#
# 只有四欄是刻意的：相鄰欄的配色只驗證過前四個 slot 的色盲安全距離
# （見 CLAUDE.md「顏色只承載地區」）。要加第五欄之前得先重驗，
# 而且調整 order 也要重驗。
#
# 排列順序照「作品存在的方式」：**空間的東西在左，時間的東西在右**。
# 造形與建築做出來就在那裡，你繞著它走；音樂與文學表演必須被演出、
# 被閱讀，佔的是時間而不是空間。這個順序讓相鄰欄真的有話可講——
# 造形與建築共用贊助人、工坊與材料（壁畫依附牆面，雕塑依附立面）；
# 音樂與文學表演共用劇場、樂譜與出版這一整套流通機制，
# 歌劇更是兩欄直接接在一起的地方。隔一欄以上的對照才是純粹的同代並置。
#
# **刻意沒有「設計與工藝」這一欄。** 陶瓷、漆器、地毯、家具、平面設計
# 全部歸到造形藝術，理由是它們與繪畫雕塑共用同一批工匠、同一套裝飾語彙
# 與同一群贊助人；真要獨立成欄，界線每一則都得重判（唐三彩算工藝還是雕塑？
# 包浩斯的椅子算設計還是建築？）。合併之後只需要問「這是不是造形的」。

- id: visual
  name: 造形
  subtitle: 繪畫・雕塑・工藝・攝影
  order: 0

- id: architecture
  name: 建築
  subtitle: 空間與構造
  order: 1

- id: music
  name: 音樂
  subtitle: 聲音與時間
  order: 2

- id: literature
  name: 文學與表演
  subtitle: 敘事・戲劇・電影
  order: 3
