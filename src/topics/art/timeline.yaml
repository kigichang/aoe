# 時間軸的上下界。事件與時期都必須落在裡面，超出的會被 data.ts 的
# assertInRange 在載入期擋下（見 CLAUDE.md「時間軸的上下界」）。
#
# 為什麼是 -3000：有連續脈絡可循的藝術活動大致從這裡開始（埃及早王朝的
# 墓室浮雕、蘇美的圓筒印章、兩河的廟塔）。
#
# 舊石器的洞窟壁畫（蕭維約前 30000、拉斯科約前 17000）與哥貝克力石陣
# （約前 9600）確實更早，而且是這門學問繞不開的起點——但它們與其後的
# 一切之間隔著上萬年沒有中介的空白，釘在精確的 y 上是假精度。
# 這兩則依 CLAUDE.md「卡在起點的事件有數量上限」的作法處理：`year` 夾在
# -3000，`actualYear` 填真實估計年代，文字一律印真實年代。**每欄至多兩則，
# 目前造形與建築各一則，不要再加第三則**——再有需求就是另開一個
# prehistory 主題，而不是把這條軸往前拉。
#
# 往前拉的代價已經算過（CLAUDE.md 有表）：固定 ppy 下任兩年的像素距離
# 與 minYear 無關，真正會壞掉的是全域視角——minYear 拉到 -12000，
# 「前500 至西元500」那段會被壓到現在的 42%，而那正是這條軸上
# 希臘、羅馬、漢唐三個高峰擠在一起的地方。
minYear: -3000

# 會逐年過期。加了超出的事件時 assertInRange 會直接報錯，屆時往上調即可。
maxYear: 2026
