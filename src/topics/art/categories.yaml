# 這個主題的事件類別。**最多六個** —— 識別完全靠圖釘上那個漢字，
# 不靠顏色（顏色只承載欄位，理由見 CLAUDE.md）。
#
# 六類是照「一件事怎麼改變這一門」切的，不是照媒材或風格切
# （媒材比欄位細一級，風格本身就是其中一類）：
# 做出了什麼（作）、學會了怎麼做（技）、一群人開始這樣做（派）、
# 誰出錢誰認證（院）、從別人那裡拿來（傳）、做了之後被追打（爭）。
#
# 界線上的常見疑問：
# - 「作品」對「風格」：《亞維農的少女》是作品（那一張畫本身就是斷點），
#   印象派畫展是風格（一群人第一次以共同名義出現）。同一件事常常兩者都是，
#   這時看那則事件想講的是「這一件」還是「這一群」。
# - 「技法」收的是**讓做不到的事變成做得到**（油畫顏料、線性透視、
#   活字樂譜、留聲機、有聲電影），不是單純的風格偏好。判準是：
#   沒有它，那一整批後來的作品在物理上做不出來。
# - 「建制」問的是**作品在什麼條件下產生與被看見**——學院、沙龍、
#   公共美術館、售票歌劇院、音樂節、雙年展、著作權。誰出錢決定了誰能做，
#   誰展示決定了誰被看見，兩者是同一個問題的正反面。
# - 「傳播」收的是**跨傳統的移入與挪用**（浮世繪之於印象派、
#   非洲面具之於立體派、龐貝出土之於新古典）。同一個傳統內部的師承不算，
#   那是「風格」。
# - 「爭議」收的是**因為作品本身而起的查禁、破壞、審判與騷動**
#   （聖像破壞、《包法利夫人》受審、《春之祭》首演、頹廢藝術展）。
#   戰亂中被順帶毀掉的不算，那是戰爭史不是藝術史。

