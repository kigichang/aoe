# 兩條 track：
#   track 0 = 西方
#   track 1 = 東亞
#
# 這一欄的東亞線特別值得畫，因為它的分期是照**文體**切的
# （賦、詩、詞、曲、小說），與西方照**時代**切完全不同。
# 兩條線並排就看得出這個差異本身——「唐詩宋詞元曲」是一種
# 「每個朝代有一種當令文體」的史觀，西方沒有對應的說法。

