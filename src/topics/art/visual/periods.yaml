# 兩條 track：
#   track 0 = 西方（地中海—歐洲—大西洋兩岸）
#   track 1 = 東亞（中國—日本）
#
# **為什麼分區而不是只畫一條「世界造形藝術分期」**：那條線不存在。
# 「文藝復興」對中國毫無意義，「宋代文人畫」對歐洲也一樣。
# 硬合成一條的話，色帶會變成一個沒有任何人使用過的分期，
# 讀者反而更難把圖釘對回自己知道的框架。
#
# **色帶在這裡的作用是尺規，不是覆蓋率**（同 CLAUDE.md 對世界史「global」
# 欄的說明）。伊斯蘭、印度、美洲的事件沒有對應的色帶可靠，
# 這是已知的取捨——兩條線已經足夠讓人判斷「阿茲特克覆滅那年，
# 歐洲正在盛期文藝復興、中國正在明代中期」。要加第三條之前先確認
# 那條線從頭到尾填得滿，空白的色帶比沒有色帶更難讀。

