# 時間軸的上下界。事件與時期都必須落在裡面，超出的會被 data.ts 的
# assertInRange 在載入期擋下（見 CLAUDE.md「時間軸的上下界」）。
#
# 為什麼是 -3000：有文字紀錄的宗教活動大致從這裡開始（蘇美的神廟經濟、
# 埃及早王朝的葬儀）。再往前只有考古遺存（哥貝克力石陣約前 9600、
# 舊石器的墓葬），年代誤差以千年計，釘在精確的 y 上是假精度——
# 那類題材該另開一個 prehistory 主題，不是把這條軸拉長
# （CLAUDE.md「卡在起點的事件有數量上限」已經算過代價）。
minYear: -3000

# 會逐年過期。加了超出的事件時 assertInRange 會直接報錯，屆時往上調即可。
maxYear: 2026
