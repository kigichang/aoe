# 世界宗教史。目錄名就是網址路徑：/religion/
#
# 史觀：**比較宗教史**，不是護教也不是反宗教的敘事。
# 收錄的判準是「這件事改變了某個傳統之後的走向」——開祖的關鍵一步、
# 經典成典、教義被裁定、教團分裂、傳到新的地方、被打壓或反擊。
# 不收錄神學命題本身的對錯，也不評價信仰真偽；`legendary` 旗標處理
# 「這件事有多確定」那一層（出埃及、老子出關、神武東征都掛了旗標）。

name: 世界宗教史
description: 把幾大宗教傳統放在同一條時間軸上，看同一個年代各自在發生什麼。

order: 6

# 欄位在這裡是「傳統」（tradition），不是地區。
#
# 為什麼不照地理分欄：宗教會跨地理走動——佛教從印度走到東亞、伊斯蘭從阿拉伯
# 走到西非與東南亞、基督宗教從黎凡特走到歐洲再走到美洲。照地理切會把同一個
# 傳統的因果鏈剪斷（「大乘興起」與「玄奘取經」變成兩欄），而這條因果鏈正是
# 宗教史最值得看的東西。照傳統分欄則保住它，而跨傳統的橫向對照
# （「尼西亞公會議那年，印度正在編纂往世書」）才是這個站的本業。
columnLabel: 傳統

# 開場縮放（px/年）。跟世界史同樣是 1.0：跨度一樣是五千年，事件量也接近，
# 沒有理由另訂一個。覺得圖釘太多要調的是這個值，不是 importance
# （CLAUDE.md 標籤排版那節有實測）。
defaultPpy: 1

# 沿用世界史那組：愈近代愈密。宗教史的資料密度也是同一個形狀
# （軸的前兩千年稀疏，公元後逐段變密）。
jumps: [-2000, -1000, -500, 1, 500, 1000, 1500, 1800, 1950]
