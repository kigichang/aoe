# 欄位定義。order 決定由左至右的順序，**同時也決定配色 slot**
# （0=藍 1=橘 2=青 3=黃 4=洋紅 5=綠 6=紫 7=紅）。
#
# 只有四欄是刻意的：相鄰欄的配色只驗證過前四個 slot 的色盲安全距離
# （見 CLAUDE.md「顏色只承載地區」）。要加第五欄之前得先重驗，
# 而且調整 order 也要重驗。
#
# 由西而東排列，也大致是「誰從誰身上長出來」的順序：
#   古代近東與地中海 → 亞伯拉罕諸教 → 印度諸教 → 東亞。
# 第一欄是另外三欄的底土（瑣羅亞斯德的末世論影響猶太教、
# 希臘哲學進了教父神學、吠陀之前的印度河文明），放在最左邊
# 讀起來就是「從這裡長出來的」。

- id: ancient
  name: 古代
  subtitle: 兩河・埃及・希臘羅馬・伊朗
  order: 0

- id: abrahamic
  name: 亞伯拉罕
  subtitle: 猶太・基督・伊斯蘭
  order: 1

- id: indic
  name: 印度
  subtitle: 婆羅門・佛・耆那・錫克
  order: 2

- id: eastasia
  name: 東亞
  subtitle: 儒・道・神道
  order: 3
