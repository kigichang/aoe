# 兩條 track（同 track 內不重疊）：
#   track 0 = 婆羅門教與印度教
#   track 1 = 印度本土的沙門傳統（佛教與耆那教）
#
# track 1 到 1200 年為止就停了，這不是缺漏——印度佛教在那爛陀寺被毀之後
# 確實中斷了七百年。空白本身是這一欄最重要的訊息之一，補一條假的色帶
# 反而會掩蓋它。1956 年安貝德卡的集體皈依那則事件因此站在空白上，
# 那正是它的意思。
#
# 錫克教（1499 起）與藏傳佛教沒有色帶，同世界史 global 欄的處理：
# 斷代在這裡的作用是尺規，不是覆蓋率。

