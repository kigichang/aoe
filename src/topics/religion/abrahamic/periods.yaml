# 三個傳統各一條 track（同 track 內不重疊）：
#   track 0 = 猶太教
#   track 1 = 基督宗教
#   track 2 = 伊斯蘭
#
# 三條都通過「從頭到尾填得滿」的檢驗：猶太 -960…2026、基督 30…2026、
# 伊斯蘭 610…2026，各自開始之後就沒有中斷。開始之前的空白不是缺口，
# 是「這個傳統還不存在」——而那正好是這一欄最該讓人看到的東西
# （伊斯蘭那條 610 才開始，前面六百年整片空白）。

