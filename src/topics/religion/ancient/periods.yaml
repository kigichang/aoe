  end: -540

- id: anc-p-iran
  name: 瑣羅亞斯德的伊朗
  track: 1
  start: -539
  end: 651

- id: anc-p-greek
  name: 希臘多神教
  track: 2
  start: -800
  end: -31

- id: anc-p-roman
  name: 羅馬國家宗教
  track: 2
  start: -30
  end: 392
