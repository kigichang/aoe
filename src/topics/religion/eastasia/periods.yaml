# 兩條 track（同 track 內不重疊）：
#   track 0 = 中國
#   track 1 = 日本
#
# 朝鮮半島沒有自己的 track。它的分期與中國高度重疊（三國佛教、高麗佛教、
# 朝鮮性理學），再開一條色帶只會多吃 26px 卻沒有新資訊；那幾則事件
# 靠標題自帶的地名辨識（同世界史 global 欄不做 subregion 欄位的理由）。
#
# 中國那條在秦（-221…-207）與五代（908…959）有兩個缺口，是刻意的：
# 那兩段本來就沒有穩定的官方宗教格局，硬拉一條連續色帶會編出不存在的秩序。

