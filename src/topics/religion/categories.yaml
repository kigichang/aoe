# 這個主題的事件類別。**最多六個** —— 識別完全靠圖釘上那個漢字，
# 不靠顏色（顏色只承載欄位，理由見 CLAUDE.md）。
#
# 六類是照「宗教史上一件事怎麼改變一個傳統」切的，不是照神學題材切：
# 一個傳統怎麼開始（起）、把什麼定成經（經）、教義被裁定成什麼（義）、
# 分出了誰或組成了什麼教團（派）、走到哪裡去（傳）、跟誰打起來（爭）。
#
# **刻意沒有「制度」這一類**：修道會、教宗制、哈里發、寺請制度都歸到
# 「教派與教團」——它們的共通點是「一個新的組織出現」，跟教義分裂在
# 宗教史裡本來就是同一件事的兩面（分出去的人要有自己的組織才活得下來）。
# 拆成兩類的話，每一則都要判斷「這是分裂還是建制」，界線比合併更難守。

- id: founding
  label: 起源
  glyph: 起

- id: scripture
  label: 經典
  glyph: 經

- id: doctrine
  label: 教義
  glyph: 義

- id: order
  label: 教派與教團
  glyph: 派

- id: spread
  label: 傳播
  glyph: 傳

- id: conflict
  label: 衝突
  glyph: 爭
