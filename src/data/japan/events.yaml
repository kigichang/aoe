- id: jp-isshi-incident
  year: 645
  title: 乙巳之變，暗殺蘇我入鹿開啟大化改新
  category: politics
  importance: 5
  desc: 中大兄皇子與中臣鎌足等人在宮中暗殺了權臣蘇我入鹿，消滅了專橫的蘇我氏本宗（乙巳之變）。隨後即位的孝德天皇頒布《改新之詔》，全面推動唐化改革（大化改新），確立天皇中心的中央集權制。
  sources:
    - title: 維基百科：乙巳之變
      url: https://zh.wikipedia.org/wiki/乙巳之變
    - title: 維基百科：大化改新
      url: https://zh.wikipedia.org/wiki/大化改新

- id: jp-hakusukinoe
  year: 663
  title: 白江口之戰，日本敗於唐新聯軍加速國內集權
  category: war
  importance: 5
  desc: 為了援助百濟復國，日本出兵朝鮮半島，但在白江口之戰中慘敗於唐朝與新羅聯軍。此戰使日本放棄了對朝鮮半島的軍事干預，轉而專注於修築防禦工事與加速國內的律令制國家建設。
  sources:
    - title: 維基百科：白江口之战
      url: https://zh.wikipedia.org/wiki/白江口之战

- id: jp-otsu-palace
  year: 667
  title: 遷都近江大津宮，備戰唐朝反攻
  category: politics
  importance: 3
  desc: 白江口戰敗後，中大兄皇子將都城由飛鳥遷至近江大津宮，遠離海岸以防唐朝與新羅聯軍來犯。翌年他在此即位為天智天皇，繼續推動戶籍與法制改革。
  sources:
    - title: 日文維基百科：近江大津宮
      url: https://ja.wikipedia.org/wiki/近江大津宮

- id: jp-koba-nenjaku
  year: 670
  title: 編製庚午年籍，日本首份全國戶籍
  category: politics
  importance: 4
  desc: 天智天皇下令編製「庚午年籍」，是日本歷史上第一部涵蓋全國的戶籍。戶籍以氏姓為單位登錄人口，成為日後徵稅、徵兵與班田收授的基礎，象徵律令制國家在制度上邁出關鍵一步。
  sources:
    - title: 日文維基百科：古代日本の戸籍制度
      url: https://ja.wikipedia.org/wiki/古代日本の戸籍制度

- id: jp-jinshin-war
  year: 672
  title: 壬申之亂，天武天皇獲勝確立絕對皇權
  category: war
  importance: 5
  desc: 天智天皇駕崩後，其弟大海人皇子與其子大友皇子之間爆發爭奪皇位的內戰（壬申之亂）。大海人皇子獲勝並即位為天武天皇，他進一步推進律令制，確立了強大的絕對皇權。
  sources:
    - title: 維基百科：壬申之亂
      url: https://zh.wikipedia.org/wiki/壬申之亂

- id: jp-asuka-kiyomihara-code
  year: 681
  endYear: 689
  title: 編纂並頒布飛鳥淨御原令
  category: politics
  importance: 4
  desc: 天武天皇下令編纂日本第一部較完整的律令法典「飛鳥淨御原令」，天皇本人未及見其頒行便駕崩，由繼位的持統天皇於689年正式頒布施行，為701年的大寶律令奠定了基礎。
  sources:
    - title: 維基百科：飛鳥淨御原令
      url: https://zh.wikipedia.org/wiki/飛鳥淨御原令

- id: jp-handen-shuju
  year: 692
  title: 實施班田收授法，確立公地公民制土地分配
  category: economy
  importance: 4
  desc: 持統天皇依飛鳥淨御原令的規定，依戶籍將口分田分配給人民耕作、身死後歸還國家的「班田收授法」正式實施。此法以中國均田制為藍本，是律令制國家「公地公民」原則落實於土地制度的具體展現。
  sources:
    - title: 維基百科：班田制
      url: https://zh.wikipedia.org/wiki/班田制

- id: jp-fujiwara-kyo
  year: 694
  title: 遷都藤原京，首座仿唐都城
  category: politics
  importance: 4
  desc: 持統天皇將都城由飛鳥淨御原宮遷至藤原京，這是日本第一座仿照中國都城棋盤式格局建造、具備完整宮城與條坊制的正式都城，也是持續使用時間最短的都城，僅十六年後便讓位給平城京。
  sources:
    - title: 維基百科：藤原京
      url: https://zh.wikipedia.org/wiki/藤原京

- id: jp-taiho
  year: 701
  title: 大寶律令
  category: politics
  importance: 4
  sources:
    - title: 維基百科：大寶律令
      url: https://zh.wikipedia.org/wiki/大寶律令

- id: jp-wado-kaichin
  year: 708
  title: 鑄行和同開珍，日本最早的官鑄貨幣
  category: economy
  importance: 3
  desc: 武藏國獻上銅礦後，朝廷仿唐朝開元通寶鑄造「和同開珍」銀錢與銅錢，是日本律令政府正式鑄行的第一種貨幣，用於支付遷都平城京的工資與物資採購，帶動了貨幣經濟的萌芽。
  sources:
    - title: 維基百科：和同開珍
      url: https://zh.wikipedia.org/wiki/和同開珍

- id: jp-nara-capital
  year: 710
  title: 遷都平城京（奈良）
  category: politics
  importance: 4
  sources:
    - title: 維基百科：平城京
      url: https://zh.wikipedia.org/wiki/平城京
    - title: 日文維基百科：平城京
      url: https://ja.wikipedia.org/wiki/平城京

- id: jp-heijo-kyo
  year: 710
  title: 元明天皇遷都平城京，奈良時代開幕
  category: politics
  importance: 5
  desc: 元明天皇將都城從藤原京遷至仿造唐朝長安城建立的平城京（今奈良市）。這標誌著日本律令制國家的全盛時期「奈良時代」正式開始，國家行政與唐風文化在此高度發展。
  sources:
    - title: 維基百科：平城京
      url: https://zh.wikipedia.org/wiki/平城京

- id: jp-kojiki
