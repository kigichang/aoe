- id: jp-noto-earthquake-2024
  year: 2024
  title: 能登半島地震，強震與海嘯重創北陸
  category: culture
  importance: 3
  desc: 元旦下午能登半島發生芮氏規模 7.6 淺層強震並引發海嘯與火災，造成逾二百人罹難，古建築與傳統漆器工藝重創。為令和時代以來日本傷亡最慘重的自然災害。
