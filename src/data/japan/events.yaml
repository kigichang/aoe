- id: jp-hanshin-sarin
  year: 1995
  title: 阪神大地震；東京地下鐵沙林毒氣事件
  category: culture
  importance: 4
  desc: 1 月阪神・淡路大地震重創關西，釀逾六千人死傷；3 月奧姆真理教於東京地下鐵發動沙林毒氣襲擊，造成 14 死數千傷。兩起重大災難重創日本社會治安與安全神話，促使應變與安全防禦機制的變革。
  sources:
