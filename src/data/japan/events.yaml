- id: jp-shotoku-taishi
  year: 593
  title: 聖德太子攝政，推行推古朝改革與冠位十二階
  category: politics
  importance: 5
  desc: 推古天皇即位，任命聖德太子為攝政。太子推行了一系列旨在強化皇權的改革，包括制定「冠位十二階」與「十七條憲法」，並派遣遣隋使積極吸收中國先進的政治與文化制度。
  sources:
