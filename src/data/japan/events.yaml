  desc: 自民黨因派系分裂與政治改革爭議遭倒閣，眾議院改選後細川護熙組建八黨派聯合內閣。自民黨自 1955 年成立以來連續 38 年的單獨執政終結，宣告「55年體制」正式瓦解。
