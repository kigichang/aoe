- id: jp-hogen-insei
  year: 1156
  title: 保元之亂，後白河天皇與崇德上皇為院政主導權內鬨
  category: war
  importance: 4
  desc: 為了爭奪院政的主導權，後白河天皇與崇德上皇分別召集武士爆發武裝衝突。這場內鬨不僅使皇室權威受損，也證明了不論哪一方掌握院政，都必須仰賴武士的軍事實力。
  sources:
    - title: 維基百科：院政
      url: https://zh.wikipedia.org/wiki/院政
    - title: 維基百科：保元之亂
      url: https://zh.wikipedia.org/wiki/保元之亂

- id: jp-heiji-insei
  year: 1159
  title: 平治之亂，平清盛擊敗源義朝，武士勢力介入院政
  category: war
  importance: 5
  desc: 後白河上皇的親信之間發生權力鬥爭，引發平治之亂。平清盛在動亂中擊敗了源義朝，成為朝廷唯一倚重的武裝力量。此後，院政的實行不得不深受平氏武家政權的牽制。
  sources:
    - title: 維基百科：院政
      url: https://zh.wikipedia.org/wiki/院政
    - title: 維基百科：平治之乱
      url: https://zh.wikipedia.org/wiki/平治之乱

- id: jp-heiji-taira
  year: 1159
  title: 平治之亂，平清盛消滅源氏勢力獨攬朝政
  category: politics
  importance: 4
  desc: 在平治之亂中，平清盛成功擊敗源義朝為首的源氏勢力，掌握了京都的軍事控制權。平氏一族開始在朝廷中獨攬大權，為平氏政權的建立奠定了堅實基礎。
  sources:
    - title: 維基百科：平治之乱
      url: https://zh.wikipedia.org/wiki/平治之乱
    - title: 維基百科：平清盛
      url: https://zh.wikipedia.org/wiki/平清盛

- id: jp-daijo-daijin-taira
  year: 1167
  title: 平清盛就任太政大臣，建立首個武家政權
  category: politics
  importance: 5
  desc: 平清盛打破常規，以武士身分就任朝廷最高文官職位「太政大臣」。平氏一族不僅壟斷朝廷高位，還與天皇家結為外戚，建立了日本歷史上第一個武家政權「平氏政權」。
  sources:
    - title: 維基百科：平清盛
      url: https://zh.wikipedia.org/wiki/平清盛
    - title: 維基百科：太政大臣
      url: https://zh.wikipedia.org/wiki/太政大臣

- id: jp-honen-pureland
  year: 1175
  title: 法然開創淨土宗，念佛信仰普及
  category: religion
  importance: 3
  desc: 只需稱名念佛即可往生的主張，讓佛教首度走出貴族階層，進入庶民生活。
  sources:
    - title: 維基百科：法然
      url: https://zh.wikipedia.org/wiki/法然
    - title: 日文維基百科：法然
      url: https://ja.wikipedia.org/wiki/法然

- id: jp-shishigatani
  year: 1177
  title: 鹿谷陰謀，後白河法皇企圖推翻平氏失敗
  category: politics
  importance: 3
  desc: 面對平氏政權的專橫，後白河法皇的近臣在京都東山的鹿谷別墅密謀打倒平氏。陰謀敗露後，平清盛流放了參與者，並將後白河法皇幽禁，平氏的獨裁統治達到頂峰。
  sources:
    - title: 維基百科：鹿谷陰謀
      url: https://zh.wikipedia.org/wiki/鹿谷陰謀
    - title: 維基百科：平清盛
      url: https://zh.wikipedia.org/wiki/平清盛

- id: jp-fukuhara-kyo
  year: 1180
  title: 平清盛強行遷都福原京，引發全國源氏舉兵
  category: politics
  importance: 4
  desc: 為了推動宋日貿易並逃避京都舊勢力反對，平清盛強行將國都遷往攝津國的福原京（今神戶）。此舉引發極大民怨，加上以仁王發布討平旨令，促使全國各地的源氏武士紛紛舉兵反抗。
  sources:
    - title: 維基百科：福原京
      url: https://zh.wikipedia.org/wiki/福原京
    - title: 維基百科：平清盛
      url: https://zh.wikipedia.org/wiki/平清盛

- id: jp-dannoura
  year: 1185
  title: 壇之浦之戰，平氏滅亡
  category: war
  importance: 5
  sources:
    - title: 維基百科：壇之浦之戰
      url: https://zh.wikipedia.org/wiki/壇之浦之戰

- id: jp-kamakura-era-start
  year: 1185
  title: 壇之浦之戰平氏滅亡，鎌倉時代開幕
  category: war
  importance: 5
  desc: 源平合戰以平氏在壇之浦海戰中覆滅告終。源賴朝隨即以追捕源義經為由，獲得朝廷准許在全國各地設立「守護」與「地頭」，掌握了實質的軍事與警察權，開啟了鎌倉時代。
  sources:
    - title: 維基百科：鎌倉時代
      url: https://zh.wikipedia.org/wiki/鎌倉時代
    - title: 維基百科：壇之浦之戰
      url: https://zh.wikipedia.org/wiki/壇之浦之戰

- id: jp-dan-no-ura-taira
  year: 1185
  title: 壇之浦之戰，平氏政權徹底覆滅
  category: war
  importance: 5
  desc: 經過長達五年的源平合戰，源義經率領的源氏水軍在壇之浦海戰中徹底擊敗平氏。年幼的安德天皇抱著三神器投海自盡，曾經權傾一時的平氏政權至此覆滅。
  sources:
    - title: 維基百科：平清盛
      url: https://zh.wikipedia.org/wiki/平清盛

- id: jp-kamakura-bakufu
  year: 1192
  title: 源賴朝任征夷大將軍，鎌倉幕府
  category: politics
  importance: 5
  desc: 武家政權登場，此後近七百年實權不在朝廷。
  sources:
    - title: 維基百科：鎌倉幕府
      url: https://zh.wikipedia.org/wiki/鎌倉幕府
    - title: 維基百科：源賴朝
      url: https://zh.wikipedia.org/wiki/源賴朝

- id: jp-kamakura-shogunate-est
  year: 1192
  title: 源賴朝就任征夷大將軍，鎌倉幕府正式成立
  category: politics
  importance: 5
  desc: 後白河法皇崩駕後，朝廷正式任命源賴朝為「征夷大將軍」。這標誌著日本史上第一個武家政權「鎌倉幕府」的法理確立，開始了長達近 700 年的武家統治時代。
  sources:
    - title: 維基百科：镰仓幕府
      url: https://zh.wikipedia.org/wiki/镰仓幕府
    - title: 維基百科：征夷大將軍
      url: https://zh.wikipedia.org/wiki/征夷大將軍

- id: jp-hojo-regency
  year: 1203
  title: 北條時政就任執權，北條氏確立專制政治
  category: politics
  importance: 4
  desc: 幕府初代將軍源賴朝死後，其岳父北條時政與北條政子奪取實權，廢黜二代將軍源賴家。時政就任第一代「執權」，自此鎌倉幕府將軍淪為傀儡，實權掌握在北條氏手中。
  sources:
    - title: 維基百科：镰仓幕府
      url: https://zh.wikipedia.org/wiki/镰仓幕府
    - title: 維基百科：執權
      url: https://zh.wikipedia.org/wiki/執權
    - title: 維基百科：北條氏
      url: https://zh.wikipedia.org/wiki/北條氏

- id: jp-jokyu
  year: 1221
  title: 承久之亂，幕府控制朝廷與西國
  category: war
  importance: 4
  desc: 後鳥羽上皇發布討幕宣旨起兵企圖推翻幕府，北條義時率鎌倉武士迅即攻入京都平定。戰後幕府流放三上皇並設「六波羅探題」嚴密監視朝廷，幕府對朝廷與全國的控制力達到頂峰。
  sources:
    - title: 維基百科：承久之亂
      url: https://zh.wikipedia.org/wiki/承久之亂

- id: jp-jokyu-kamakura
  year: 1221
  title: 承久之亂，幕府擊敗朝廷確立政治優勢
  category: politics
  importance: 5
  desc: 後鳥羽上皇試圖推翻鎌倉幕府，引發承久之亂。在北條政子的號召下，幕府軍大勝並攻入京都，流放了三位上皇。此戰徹底改變了朝野勢力對比，幕府權威凌駕於朝廷之上。
  sources:
    - title: 維基百科：鎌倉時代
      url: https://zh.wikipedia.org/wiki/鎌倉時代
    - title: 維基百科：承久之亂
      url: https://zh.wikipedia.org/wiki/承久之亂

- id: jp-jokyu-insei
  year: 1221
  title: 承久之亂後，幕府控制朝廷，院政實權名存實亡
  category: politics
  importance: 4
  desc: 後鳥羽上皇發動承久之亂討伐鎌倉幕府失敗。幕府隨後設立「六波羅探題」監視朝廷，並干預皇位繼承與院政的人選。自此，院政完全受制於武家，失去了實質的政治權力。
  sources:
    - title: 維基百科：院政
      url: https://zh.wikipedia.org/wiki/院政
    - title: 維基百科：承久之亂
      url: https://zh.wikipedia.org/wiki/承久之亂

- id: jp-goseibai-kamakura
  year: 1232
  title: 制定《御成敗式目》，確立武家法律基礎
  category: politics
  importance: 4
  desc: 執權北條泰時為了公平解決御家人之間的領地糾紛，頒布了基於武家習慣法的《御成敗式目》（貞永式目）。這成為日本史上第一部武家法典，對後世武家政權產生深遠影響。
  sources:
    - title: 維基百科：鎌倉時代
      url: https://zh.wikipedia.org/wiki/鎌倉時代
    - title: 維基百科：御成敗式目
      url: https://zh.wikipedia.org/wiki/御成敗式目

- id: jp-hoji-battle
  year: 1247
  title: 寶治合戰，北條氏消滅三浦氏鞏固絕對專制
  category: war
  importance: 4
  desc: 執權北條時賴為了徹底掃除幕府內部的反對勢力，發動寶治合戰，消滅了有力的御家人三浦泰村一族。此戰後，北條氏在鎌倉幕府內的獨裁體制（得宗專制）得以進一步鞏固。
  sources:
    - title: 維基百科：镰仓幕府
      url: https://zh.wikipedia.org/wiki/镰仓幕府
    - title: 維基百科：寶治合戰
      url: https://zh.wikipedia.org/wiki/寶治合戰
    - title: 維基百科：三浦氏
      url: https://zh.wikipedia.org/wiki/三浦氏

- id: jp-nichiren
  year: 1253
  title: 日蓮創立法華信仰
  category: religion
