- id: jp-yamaichi-collapse
  year: 1997
  title: 山一證券自主廢業，平成金融危機爆發
  category: economy
  importance: 3
  desc: 消費稅率調升至 5% 後，日本四大證券之一的山一證券因巨額隱匿壞帳爆發自主廢業倒閉，北海道拓殖銀行亦相繼破產。平成金融危機加劇信用緊縮與資產通縮，使日本陷入「失落的二十年」。
  sources:
    - title: 日文維基百科：山一證券
      url: https://ja.wikipedia.org/wiki/山一證券

- id: jp-world-cup-2002
  year: 2002
  title: 日韓世界盃；小泉純一郎訪平壤簽署平壤宣言
  category: culture
  importance: 3
  desc: 日韓兩國共同主辦第 17 屆世界盃足球賽，為世界盃首次在亞洲舉行；同年首相小泉純一郎首度出訪平壤與金正日會談並簽署《日朝平壤宣言》，北韓首度公開承認綁架日本國人事件並放還五名被害者。
  sources:
    - title: 維基百科：2002年國際足協世界盃
