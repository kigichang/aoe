  sources:
    - title: 維基百科：日蓮
      url: https://zh.wikipedia.org/wiki/日蓮

- id: jp-bunei
  year: 1274
  title: 文永之役（元寇）
  category: war
  importance: 4
  sources:
    - title: 維基百科：元日戰爭
      url: https://zh.wikipedia.org/wiki/元日戰爭

- id: jp-mongol-kamakura
  year: 1274
  title: 元日戰爭，蒙古兩次入侵動搖幕府根基
  category: war
  importance: 5
  endYear: 1281
  desc: 蒙古帝國忽必烈發動「文永之役」與「弘安之役」入侵日本。雖然幕府成功抵禦外敵，但由於是防衛戰而無新土地可作為恩賞，導致參戰的御家人陷入嚴重財政困境，幕府威信大減。
  sources:
    - title: 維基百科：鎌倉時代
      url: https://zh.wikipedia.org/wiki/鎌倉時代
    - title: 維基百科：元日战争
      url: https://zh.wikipedia.org/wiki/元日战争

- id: jp-koan
  year: 1281
  title: 弘安之役，元軍再敗於颱風
  category: war
  importance: 5
  sources:
    - title: 維基百科：元日戰爭
      url: https://zh.wikipedia.org/wiki/元日戰爭

- id: jp-shimotsuki-incident
  year: 1285
  title: 霜月騷動，得宗專制確立與御家人沒落
  category: politics
  importance: 4
  desc: 隨著蒙古入侵帶來的社會動盪，北條氏家臣（御內人）首領平賴綱在霜月騷動中消滅了代表御家人勢力的安達泰盛。這標誌著北條氏本家（得宗）與御內人徹底掌握幕府，傳統御家人勢力沒落。
  sources:
    - title: 維基百科：镰仓幕府
      url: https://zh.wikipedia.org/wiki/镰仓幕府
    - title: 維基百科：霜月骚动
      url: https://zh.wikipedia.org/wiki/霜月骚动
    - title: 維基百科：得宗
      url: https://zh.wikipedia.org/wiki/得宗

- id: jp-einin-tokuseirei
  year: 1297
  title: 頒布《永仁德政令》，挽救御家人經濟破產
  category: economy
  importance: 4
  desc: 面對元日戰爭後大量御家人抵押土地、瀕臨破產的窘境，鎌倉幕府發布了日本史上首道《德政令》（永仁德政令），強制廢除御家人的債務並無償收回被賣出的土地，但最終引發經濟混亂。
  sources:
    - title: 維基百科：鎌倉時代
      url: https://zh.wikipedia.org/wiki/鎌倉時代
    - title: 維基百科：御家人
      url: https://zh.wikipedia.org/wiki/御家人

- id: jp-genko-war
  year: 1331
  title: 元弘之亂，後醍醐天皇舉兵倒幕
  category: war
  importance: 4
  desc: 不滿鎌倉幕府干預皇位繼承的後醍醐天皇，帶著象徵正統的三神器逃出京都，於笠置山舉兵倒幕。雖然天皇很快被捕並流放隱岐，但這場動亂成為推翻鎌倉幕府、開啟南北朝動盪的序曲。
  sources:
    - title: 維基百科：南北朝時代 (日本)
      url: https://zh.wikipedia.org/wiki/南北朝時代_(日本)
    - title: 維基百科：元弘之亂
      url: https://zh.wikipedia.org/wiki/元弘之亂
    - title: 維基百科：後醍醐天皇
      url: https://zh.wikipedia.org/wiki/後醍醐天皇

- id: jp-kamakura-fall
  year: 1333
  title: 鎌倉幕府滅亡
  category: politics
  importance: 4
  sources:
    - title: 維基百科：鎌倉幕府
      url: https://zh.wikipedia.org/wiki/鎌倉幕府

- id: jp-kenmu-start
  year: 1333
  title: 後醍醐天皇實施建武新政，恢復天皇親政
  category: politics
  importance: 5
  desc: 鎌倉幕府滅亡後，後醍醐天皇廢除院政與攝關政治，推行以天皇絕對皇權為中心的「建武新政」。新政企圖結合公家與武家統治，並將重要機關設於京都。
  sources:
    - title: 維基百科：建武新政
      url: https://zh.wikipedia.org/wiki/建武新政
    - title: 維基百科：後醍醐天皇
      url: https://zh.wikipedia.org/wiki/後醍醐天皇

- id: jp-kamakura-fall-hojo
  year: 1333
  title: 新田義貞攻陷鎌倉，北條高時自盡與幕府滅亡
  category: war
  importance: 5
  desc: 響應後醍醐天皇的倒幕運動，新田義貞率軍攻入鎌倉。最後一任得宗北條高時與一族數百人於東勝寺自盡，延續了近 150 年的鎌倉幕府與北條氏專制統治正式宣告滅亡。
  sources:
    - title: 維基百科：镰仓幕府
      url: https://zh.wikipedia.org/wiki/镰仓幕府
    - title: 維基百科：北條高時
      url: https://zh.wikipedia.org/wiki/北條高時

- id: jp-kenmu-policies
  year: 1334
  title: 頒布建武新政各項政令，設立雜訴決斷所
  category: politics
  importance: 4
  desc: 建武新政期間，朝廷為了處理全國蜂擁而至的土地所有權訴訟，設立了「雜訴決斷所」與「記錄所」。然而，頻繁更改的法令（如綸旨絕對主義）與官僚腐敗，使得政局陷入混亂。
  sources:
    - title: 維基百科：建武新政
      url: https://zh.wikipedia.org/wiki/建武新政

- id: jp-nijo-kawara
  year: 1334
  title: 建武新政引發強烈不滿，二條河原落書諷刺亂象
  category: culture
  importance: 3
  desc: 由於新政嚴重忽視武士與地方國人的土地權益，社會動盪不安。當時京都出現了著名的《二條河原落書》，生動諷刺了新政下的各種社會亂象與朝令夕改的無能統治。
  sources:
    - title: 維基百科：建武新政
      url: https://zh.wikipedia.org/wiki/建武新政

- id: jp-nakasendai
  year: 1335
  title: 中先代之亂爆發，暴露建武政權防衛脆弱
  category: war
  importance: 4
  desc: 北條高時之子北條時行在信濃國舉兵，成功攻陷鎌倉，史稱「中先代之亂」。這場叛亂雖然短暫，但充分暴露了建武政權軍事力量的脆弱，並成為足利尊氏脫離新政的導火線。
  sources:
    - title: 維基百科：中先代之亂
      url: https://zh.wikipedia.org/wiki/中先代之亂
    - title: 維基百科：建武新政
      url: https://zh.wikipedia.org/wiki/建武新政

- id: jp-muromachi-bakufu
  year: 1336
  title: 足利尊氏開室町幕府；南北朝分裂
  category: politics
  importance: 4
  sources:
    - title: 維基百科：室町幕府
      url: https://zh.wikipedia.org/wiki/室町幕府
    - title: 維基百科：足利尊氏
      url: https://zh.wikipedia.org/wiki/足利尊氏
    - title: 維基百科：南北朝時代 (日本)
      url: https://zh.wikipedia.org/wiki/南北朝時代_(日本)

- id: jp-minatogawa
  year: 1336
  title: 建武新政失敗，湊川之戰與南北朝對立
  category: war
  importance: 4
  desc: 後醍醐天皇推行建武新政試圖復闢公家親政，然因忽視武士權益引發足利尊氏反叛。湊川之戰中忠臣楠木正成戰死，後醍醐天皇避居吉野設立南朝，足利尊氏於京都另立北朝，日本進入半個多世紀的南北朝對立時期。
  sources:
    - title: 維基百科：建武新政
      url: https://zh.wikipedia.org/wiki/建武新政
    - title: 維基百科：湊川之戰
      url: https://zh.wikipedia.org/wiki/湊川之戰

- id: jp-muromachi-nanbokucho
  year: 1336
  title: 足利尊氏建立武家政權，南北朝時代與室町時代開幕
  category: politics
  importance: 5
  desc: 足利尊氏在京都擁立光明天皇，頒布《建武式目》建立新的武家政權（後稱室町幕府）。同時，後醍醐天皇逃往吉野建立南朝，日本進入南北朝對立的「室町時代」初期。
  sources:
    - title: 維基百科：室町時代
      url: https://zh.wikipedia.org/wiki/室町時代
    - title: 維基百科：南北朝時代 (日本)
      url: https://zh.wikipedia.org/wiki/南北朝時代_(日本)

- id: jp-nanbokucho-split
  year: 1336
  title: 湊川之戰建武政權崩潰，後醍醐天皇逃往吉野
  category: politics
  importance: 5
  desc: 建武新政失敗後，足利尊氏反叛並在湊川之戰擊敗朝廷軍隊。尊氏在京都擁立北朝天皇，而後醍醐天皇則攜帶三神器逃至大和國吉野建立南朝。自此，日本出現兩個並立的朝廷，史稱「南北朝時代」。
  sources:
    - title: 維基百科：南北朝時代 (日本)
      url: https://zh.wikipedia.org/wiki/南北朝時代_(日本)
    - title: 維基百科：吉野
      url: https://zh.wikipedia.org/wiki/吉野
    - title: 維基百科：凑川之战
      url: https://zh.wikipedia.org/wiki/凑川之战

- id: jp-kenmu-collapse
  year: 1336
  title: 足利尊氏反叛，建武新政實質崩潰
  category: politics
  importance: 5
  desc: 足利尊氏在平息中先代之亂後拒絕返回京都，並公然反叛建武政權。尊氏軍隊攻入京都，迫使後醍醐天皇逃亡，僅維持了兩年半的建武新政至此徹底崩潰。
  sources:
    - title: 維基百科：建武新政
      url: https://zh.wikipedia.org/wiki/建武新政
    - title: 維基百科：足利尊氏
      url: https://zh.wikipedia.org/wiki/足利尊氏

- id: jp-muromachi-bakufu-est
  year: 1338
  title: 足利尊氏受封征夷大將軍，開創室町幕府
  category: politics
  importance: 5
  desc: 足利尊氏在京都北朝天皇的任命下，正式就任「征夷大將軍」。這標誌著繼鎌倉幕府之後，日本歷史上第二個武家政權「室町幕府」的建立，開始了幕府與守護大名共治的政治體制。
  sources:
    - title: 維基百科：室町幕府
      url: https://zh.wikipedia.org/wiki/室町幕府
    - title: 維基百科：足利尊氏
      url: https://zh.wikipedia.org/wiki/足利尊氏
    - title: 維基百科：征夷大將軍
      url: https://zh.wikipedia.org/wiki/征夷大將軍

- id: jp-jinno-shotoki
  year: 1339
  title: 後醍醐天皇駕崩，北畠親房著《神皇正統記》
  category: culture
  importance: 4
  desc: 南朝的後醍醐天皇駕崩，南朝勢力受挫。為鞏固南朝正統性並教育幼帝，重臣北畠親房撰寫了《神皇正統記》，強調三神器為皇室正統的唯一憑證，對後世的皇國史觀產生深遠影響。
  sources:
    - title: 維基百科：南北朝時代 (日本)
      url: https://zh.wikipedia.org/wiki/南北朝時代_(日本)
    - title: 維基百科：神皇正統記
      url: https://zh.wikipedia.org/wiki/神皇正統記
    - title: 維基百科：北畠親房
      url: https://zh.wikipedia.org/wiki/北畠親房

- id: jp-kanno-disturbance
  year: 1350
  title: 觀應之擾亂，室町幕府內部分裂，南朝趁機反攻
  category: war
  importance: 4
  endYear: 1352
  desc: 室町幕府內部爆發了將軍足利尊氏與其弟足利直義之間的激烈政治與軍事鬥爭（觀應之擾亂）。雙方為了打擊對手，不惜輪流向南朝短暫降伏。南朝軍隊趁機數次攻入京都，使南北朝戰局陷入膠著。
  sources:
    - title: 維基百科：南北朝時代 (日本)
      url: https://zh.wikipedia.org/wiki/南北朝時代_(日本)
    - title: 維基百科：观应扰乱
      url: https://zh.wikipedia.org/wiki/观应扰乱

- id: jp-yoshimitsu-shogun
  year: 1368
  title: 足利義滿就任第三代將軍，強化幕府統治體制
  category: politics
  importance: 4
  desc: 年幼的足利義滿繼位為第三代將軍，在管領細川賴之的輔佐下，逐步削弱各地有力守護大名的勢力。他將幕府機構集中於京都室町，奠定了室町幕府絕對的統治權威。
  sources:
    - title: 維基百科：室町幕府
      url: https://zh.wikipedia.org/wiki/室町幕府
    - title: 維基百科：足利義滿
      url: https://zh.wikipedia.org/wiki/足利義滿

- id: jp-muromachi-meitoku
  year: 1392
  title: 明德和約，南北朝統一與室町時代全盛期
  category: politics
  importance: 4
  desc: 第3代將軍足利義滿促成南朝後龜山天皇將三神器交還給北朝後小松天皇，結束了半世紀的皇室分裂。室町幕府的權威達到頂峰，迎來室町時代最穩定的全盛時期。
  sources:
    - title: 維基百科：室町時代
      url: https://zh.wikipedia.org/wiki/室町時代
    - title: 維基百科：明德和約
      url: https://zh.wikipedia.org/wiki/明德和約

- id: jp-nanbokucho-unification
  year: 1392
  title: 南北朝合一，南朝交出三神器結束56年分裂
  category: politics
  importance: 5
  desc: 經過長達56年的戰亂與對立，南朝勢力已大幅衰退。在室町幕府將軍足利義滿的斡旋與保證下（明德和約），南朝後龜山天皇將三神器交還北朝後小松天皇，日本重新歸於統一。
  sources:
    - title: 維基百科：南北朝時代 (日本)
      url: https://zh.wikipedia.org/wiki/南北朝時代_(日本)
    - title: 維基百科：三神器
      url: https://zh.wikipedia.org/wiki/三神器

- id: jp-kitayama-culture
  year: 1397
  title: 足利義滿建立金閣寺，北山文化繁榮
  category: culture
  importance: 4
  desc: 足利義滿在京都北山建造豪華的鹿苑寺（金閣寺）。此時期融合了傳統公家貴族文化與新興武家文化，並受到明朝禪宗影響，形成了華麗的「北山文化」。
  sources:
    - title: 維基百科：室町時代
      url: https://zh.wikipedia.org/wiki/室町時代
    - title: 維基百科：鹿苑寺
      url: https://zh.wikipedia.org/wiki/鹿苑寺
    - title: 維基百科：北山文化
      url: https://zh.wikipedia.org/wiki/北山文化_(日本)

- id: jp-oei-rebellion
  year: 1399
  title: 應永之亂，幕府鎮壓大內義弘鞏固權力
  category: war
  importance: 4
  desc: 控制西國六國的強大守護大名大內義弘因不滿足利義滿的中央集權政策而舉兵叛亂。幕府軍在堺市將其擊敗並討伐，徹底掃除了幕府權威的最後障礙。
  sources:
    - title: 維基百科：室町幕府
      url: https://zh.wikipedia.org/wiki/室町幕府
    - title: 維基百科：应永之乱
      url: https://zh.wikipedia.org/wiki/应永之乱
    - title: 維基百科：大內義弘
      url: https://zh.wikipedia.org/wiki/大內義弘

- id: jp-kango-trade
  year: 1404
  title: 勘合貿易，日明通商
  category: economy
  importance: 3
  sources:
    - title: 維基百科：勘合貿易
      url: https://zh.wikipedia.org/wiki/勘合貿易

- id: jp-shocho-uprising
  year: 1428
  title: 正長土一揆，農民要求德政令的大規模起義
  category: economy
  importance: 4
  desc: 隨著貨幣經濟發展與天災頻發，近畿地區的農民與馬借（運輸業者）為了逃避高利貸債務，發動了日本史上首次大規模的「土一揆」，襲擊酒屋與土倉，迫使幕府發布德政令。
  sources:
    - title: 維基百科：室町時代
      url: https://zh.wikipedia.org/wiki/室町時代
    - title: 維基百科：土一揆
      url: https://zh.wikipedia.org/wiki/土一揆

- id: jp-kakitsu-rebellion
  year: 1441
  title: 嘉吉之亂，將軍足利義教遭暗殺，幕府權威急墜
  category: politics
  importance: 4
  desc: 第6代將軍足利義教推行強硬的獨裁政治，引發守護大名恐慌。播磨守護赤松滿祐在府邸宴會上將其暗殺，史稱「嘉吉之亂」。此事件導致將軍權威一落千丈，各地開始出現下剋上的風潮。
  sources:
    - title: 維基百科：室町幕府
