- id: jp-toba-insei
  year: 1129
  title: 鳥羽上皇展開院政，北面武士力量擴張
  category: politics
  importance: 4
  desc: 白河法皇駕崩後，鳥羽上皇接掌院政。他大量提拔源氏與平氏等武士擔任守衛院廳的「北面武士」，藉此強化軍事力量。這使得武士階級正式進入中央政治舞台。
  sources:
    - title: 維基百科：院政
      url: https://zh.wikipedia.org/wiki/院政
    - title: 維基百科：鳥羽天皇
      url: https://zh.wikipedia.org/wiki/鳥羽天皇

- id: jp-hogen
  year: 1156
  title: 保元之亂
  category: war
  importance: 3
  sources:
    - title: 維基百科：保元之亂
      url: https://zh.wikipedia.org/wiki/保元之亂

- id: jp-hogen-rebellion
  year: 1156
  title: 保元之亂，皇室內鬨引發武士實力決定政局
  category: war
  importance: 5
  desc: 圍繞皇位繼承問題，後白河天皇與崇德上皇發生對立，雙方各自拉攏源氏與平氏武士集團。天皇方最終獲勝，這場內鬨使得武士的軍事實力成為決定國家政局的關鍵，王朝國家逐漸走向終結。
  sources:
    - title: 維基百科：平安時代
