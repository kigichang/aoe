- id: jp-five-kings
  year: 413
  title: 倭王讚遣使東晉，倭五王時代開始
  category: politics
  importance: 3
  desc: 中國史書再度出現倭國紀錄。此後讚、珍、濟、興、武五王相繼遣使南朝，求取封號以確立在朝鮮半島的地位。
  sources:
