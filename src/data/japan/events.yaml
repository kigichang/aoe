- id: jp-fujiwara-michinaga
  year: 1016
  title: 藤原道長建立「一家立三后」，攝關政治達到頂峰
  category: politics
  importance: 5
  desc: 藤原道長將三個女兒先後送入宮中成為三位天皇的中宮（一家立三后），藉此壟斷了外戚地位。他出任攝政後，藤原北家的權力與榮華富貴達到極盛，成為平安時代攝關政治的巔峰。
  sources:
    - title: 維基百科：攝關政治
      url: https://zh.wikipedia.org/wiki/攝關政治
    - title: 維基百科：藤原道長
      url: https://zh.wikipedia.org/wiki/藤原道長

- id: jp-gosanjo-emperor
  year: 1068
  title: 後三條天皇即位，攝關政治開始衰退
  category: politics
  importance: 4
  desc: 後三條天皇即位，成為 170 年來首位母親非藤原氏的天皇。他不受藤原氏控制，積極推動延久荘園整理令等改革以強化皇權，藤原氏的攝關政治自此開始走向衰退。
  sources:
    - title: 維基百科：攝關政治
      url: https://zh.wikipedia.org/wiki/攝關政治
    - title: 維基百科：後三條天皇
      url: https://zh.wikipedia.org/wiki/後三條天皇

- id: jp-enkyu-shoen
  year: 1069
  title: 頒布延久荘園整理令，加強朝廷土地控制
  category: economy
  importance: 4
  desc: 後三條天皇為了削弱藤原氏等權門的經濟基礎，頒布了嚴格的《延久荘園整理令》，設立記錄莊園券契所審查莊園合法性。這在一定程度上恢復了朝廷的財政與國司的權威。
  sources:
    - title: 維基百科：平安時代
      url: https://zh.wikipedia.org/wiki/平安時代

