- id: jp-shirakawa-insei-start
  year: 1086
  title: 白河上皇開啟院政，法皇凌駕天皇掌握實權
  category: politics
  importance: 5
  desc: 白河天皇將皇位讓給年幼的堀河天皇，成為「上皇」，並在院廳組建自己的家司與近衛軍團處理國政。這種退位天皇掌握實權的「院政」體系，成功壓制了藤原氏的攝關政治。
  sources:
    - title: 維基百科：院政
      url: https://zh.wikipedia.org/wiki/院政
