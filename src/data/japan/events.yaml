- id: jp-kojiki-nihon-shoki
  year: 712
  title: 編纂《古事記》與《日本書紀》，確立國家神話
  category: culture
  importance: 4
  endYear: 720
  desc: 為了確立天皇統治的歷史正當性，朝廷先後完成了《古事記》（712年）與《日本書紀》（720年）的編纂。這兩部史書結合了神話與歷史，成為日本國家起源與神道教思想的基石。
  sources:
