- id: jp-higashiyama-culture
  year: 1489
  title: 足利義政建立銀閣寺，東山文化與侘寂美學
  category: culture
  importance: 4
  desc: 第8代將軍足利義政於京都東山建造慈照寺（銀閣寺）。雖然當時正值應仁之亂後的衰敗期，但孕育出了茶道、花道與枯山水庭園等強調「侘寂」幽玄之美的「東山文化」，深遠影響了後世的日本審美。
