- id: jp-abenomics
  year: 2012
  title: 第二次安倍內閣成立，推動「安倍經濟學」
  category: economy
  importance: 4
  desc: 自民黨勝選重返執政，安倍晉三再度就任首相並推出「三支箭」政策（超寬鬆貨幣政策、機動財政政策與經濟結構成長戰略），嘗試帶領日本走出長達二十年的通貨緊縮與低迷。
  sources:
    - title: 維基百科：安倍經濟學
