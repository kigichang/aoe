- id: jp-konden-einen
  year: 743
  title: 頒布墾田永年私財法，莊園制萌芽
  category: economy
  importance: 5
  desc: 為了解決人口增加導致的公地不足，朝廷頒布了《墾田永年私財法》，承認農民與貴族開墾的土地為永久私有。此舉實質上破壞了律令制的「公地公民」原則，促使私有莊園開始大規模發展。
  sources:
    - title: 維基百科：墾田永年私財法
      url: https://zh.wikipedia.org/wiki/墾田永年私財法

- id: jp-great-buddha
  year: 752
  title: 東大寺大佛開眼
  category: religion
  importance: 4
  sources:
    - title: 維基百科：東大寺
      url: https://zh.wikipedia.org/wiki/東大寺

- id: jp-todai-ji-daibutsu
  year: 752
  title: 聖武天皇建立東大寺大佛，鎮護國家思想盛行
  category: religion
  importance: 4
  desc: 面對天花流行與政治動盪，聖武天皇推崇「鎮護國家」的佛教思想。他在平城京建造了宏偉的東大寺並為巨大的盧舍那佛舉行開眼供養，佛教成為維繫國家安定的核心信仰。
  sources:
    - title: 維基百科：东大寺
      url: https://zh.wikipedia.org/wiki/东大寺

- id: jp-ganjin
  year: 754
  title: 鑑真和尚東渡日本，確立日本佛教戒律
  category: religion
  importance: 4
  desc: 唐朝高僧鑑真歷經多次失敗與失明，終於成功東渡抵達日本。他在東大寺設立戒壇，為聖武太上皇等人授戒，正式確立了日本佛教的受戒制度與律宗傳承。
  sources:
    - title: 維基百科：鑑真
      url: https://zh.wikipedia.org/wiki/鑑真

- id: jp-heian-capital
  year: 794
  title: 遷都平安京（京都）
  category: politics
  importance: 5
  sources:
    - title: 維基百科：平安京
      url: https://zh.wikipedia.org/wiki/平安京

- id: jp-heian-kyo
  year: 794
  title: 桓武天皇遷都平安京，平安時代開幕
  category: politics
  importance: 5
  desc: 為了擺脫奈良平城京強大的佛教寺院勢力干政，桓武天皇將都城遷至山城國的平安京（今京都市）。這標誌著長達 400 年、以貴族政治與獨特國風文化為特徵的「平安時代」正式開始。
  sources:
    - title: 維基百科：平安時代
      url: https://zh.wikipedia.org/wiki/平安時代
    - title: 維基百科：桓武天皇
      url: https://zh.wikipedia.org/wiki/桓武天皇
    - title: 維基百科：平安京
      url: https://zh.wikipedia.org/wiki/平安京

- id: jp-saicho-kukai
  year: 806
  title: 最澄、空海自唐歸國，天台與真言宗興起
  category: religion
  importance: 3
  desc: 兩宗把佛教從奈良的官寺體制帶向山林修行，也深深影響了往後的日本文化。
  sources:
    - title: 維基百科：最澄
      url: https://zh.wikipedia.org/wiki/最澄
    - title: 維基百科：空海
      url: https://zh.wikipedia.org/wiki/空海

- id: jp-sekkan-start
  year: 858
  title: 藤原良房就任攝政，攝關政治萌芽
  category: politics
  importance: 4
  desc: 清和天皇年幼即位，其外祖父藤原良房以皇族以外臣子的身分首次就任「攝政」。這為日後藤原北家長期壟斷朝政的「攝關政治」奠定了基礎。
  sources:
    - title: 維基百科：平安時代
      url: https://zh.wikipedia.org/wiki/平安時代
    - title: 維基百科：藤原良房
      url: https://zh.wikipedia.org/wiki/藤原良房
    - title: 維基百科：攝政
      url: https://zh.wikipedia.org/wiki/攝政

- id: jp-fujiwara-yoshifusa
  year: 858
  title: 藤原良房成為首位非皇族攝政，開啟藤原北家專權
  category: politics
  importance: 4
  desc: 清和天皇以9歲之齡即位，其外祖父藤原良房以外臣身分成為日本史上首位非皇族的「攝政」。這標誌著藤原北家開始以外戚身分掌控朝政，攝關政治的序幕正式拉開。
  sources:
    - title: 維基百科：攝關政治
      url: https://zh.wikipedia.org/wiki/攝關政治
    - title: 維基百科：藤原良房
      url: https://zh.wikipedia.org/wiki/藤原良房

- id: jp-otenmon
  year: 866
  title: 應天門之變，藤原氏攝關政治確立
  category: politics
  importance: 3
  desc: 皇居應天門失火，藤原良房藉排擠伴善男、紀豐城等競爭政敵，獲賜「攝政」重權。此事件確立了藤原氏外戚獨攬朝政的「攝關政治」體制。
  sources:
    - title: 維基百科：應天門之變
      url: https://zh.wikipedia.org/wiki/應天門之變
    - title: 維基百科：攝關政治
      url: https://zh.wikipedia.org/wiki/攝關政治

- id: jp-fujiwara-mototsune
  year: 884
  title: 藤原基經就任首位關白，確立攝關政治雛形
  category: politics
  importance: 4
  desc: 光孝天皇即位後，委任藤原基經為首任「關白」，負責輔佐成年天皇處理政務。攝政與關白兩種職務的確立，使得藤原氏無論天皇年幼或成年皆能把持國政，攝關政治體制逐漸成形。
  sources:
    - title: 維基百科：攝關政治
      url: https://zh.wikipedia.org/wiki/攝關政治
    - title: 維基百科：藤原基經
      url: https://zh.wikipedia.org/wiki/藤原基經
    - title: 維基百科：關白
      url: https://zh.wikipedia.org/wiki/關白

- id: jp-end-kentoshi
  year: 894
  title: 廢止遣唐使
  category: politics
  importance: 4
  desc: 停止官方遣唐後，假名文學與國風文化開始成形。
  sources:
    - title: 維基百科：遣唐使
      url: https://zh.wikipedia.org/wiki/遣唐使
    - title: 維基百科：菅原道真
      url: https://zh.wikipedia.org/wiki/菅原道真

- id: jp-kokufu-culture
  year: 894
  title: 菅原道真建議廢止遣唐使，國風文化興起
  category: culture
  importance: 5
  desc: 鑒於唐朝衰落與航海危險，菅原道真上奏建議廢止遣唐使。日本開始停止大規模吸收中國文化，轉而在消化唐風的基礎上，發展出假名文字、和歌與物語等獨特且本土化的「國風文化」。
  sources:
    - title: 維基百科：平安時代
      url: https://zh.wikipedia.org/wiki/平安時代
    - title: 維基百科：菅原道真
      url: https://zh.wikipedia.org/wiki/菅原道真
    - title: 維基百科：遣唐使
      url: https://zh.wikipedia.org/wiki/遣唐使
    - title: 維基百科：國風文化
      url: https://zh.wikipedia.org/wiki/國風文化

- id: jp-shotai-incident
  year: 901
  title: 昌泰之變，藤原時平謫降菅原道真排除異己
  category: politics
  importance: 4
  desc: 為了鞏固藤原氏的絕對權力，左大臣藤原時平向醍醐天皇進讒言，將深受重用的右大臣菅原道真貶謫至太宰府。此事件進一步清除了朝廷內非藤原氏的有力競爭者。
  sources:
    - title: 維基百科：攝關政治
      url: https://zh.wikipedia.org/wiki/攝關政治
    - title: 維基百科：菅原道真
      url: https://zh.wikipedia.org/wiki/菅原道真

- id: jp-engi-shoen
  year: 902
  title: 頒布延喜荘園整理令，班田收授法實質崩潰
  category: economy
  importance: 4
  desc: 醍醐天皇為了抑制貴族與寺社非法佔有土地（莊園），頒布了《延喜荘園整理令》。然而此令未能有效執行，反而標誌著基於律令制的「班田收授法」徹底崩潰，日本正式轉向以莊園和公領為基礎的「王朝國家」體制。
  sources:
    - title: 維基百科：平安時代
      url: https://zh.wikipedia.org/wiki/平安時代

- id: jp-johei-tengyo
  year: 939
  title: 承平天慶之亂，平將門與藤原純友叛亂
  category: war
  importance: 4
  desc: 關東的平將門自稱「新皇」發動叛亂，同時瀨戶內海的海賊藤原純友也起兵作亂。朝廷無力直接鎮壓，只能依靠其他地方武士平亂，這標誌著武士階級作為軍事力量在王朝國家中開始抬頭。
  sources:
    - title: 維基百科：平安時代
      url: https://zh.wikipedia.org/wiki/平安時代
    - title: 維基百科：承平天慶之亂
      url: https://zh.wikipedia.org/wiki/承平天慶之亂

- id: jp-anna-incident
  year: 969
  title: 安和之變，藤原氏排擠他姓確立攝關政治
  category: politics
  importance: 4
  desc: 左大臣源高明被藤原氏誣告謀反並流放至九州。此後，朝廷高層職位完全由藤原北家壟斷，排除了其他姓氏的競爭，王朝國家的權力核心「攝關政治」體制正式確立。
  sources:
    - title: 維基百科：平安時代
      url: https://zh.wikipedia.org/wiki/平安時代
    - title: 維基百科：安和之變
      url: https://zh.wikipedia.org/wiki/安和之變

