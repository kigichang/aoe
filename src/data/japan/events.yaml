- id: jp-reiwa-era
  year: 2019
  title: 明仁天皇退位，改元「令和」
  category: politics
  importance: 4
  desc: 明仁天皇退位，皇太子德仁即位，為日本時隔兩百年首度實現天皇生前退位。新年號「令和」典出日本古典文獻《萬葉集》，象徵日本開啟全新時代。
