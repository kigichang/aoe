  category: war
  importance: 5
  endYear: 1477
  desc: 圍繞將軍繼承權與管領家督之爭，全日本守護大名分為東西兩軍在京都展開長達十年的混戰。幕府權威徹底掃地，莊園制崩潰，地方國人崛起，日本正式步入群雄割據的「戰國時代」。
