- id: jp-buddhism-intro
  year: 538
  title: 佛教傳入日本，引發蘇我氏與物部氏宗教衝突
  category: religion
  importance: 4
  desc: 百濟聖明王向欽明天皇獻上佛像與經卷，標誌著佛教正式傳入日本。這引發了崇佛派的蘇我氏與排佛派的物部氏之間激烈的政治與宗教衝突，最終蘇我氏獲勝，確立了佛教在日本的地位。
  sources:
    - title: 維基百科：佛教
      url: https://zh.wikipedia.org/wiki/佛教
    - title: 維基百科：蘇我氏
      url: https://zh.wikipedia.org/wiki/蘇我氏
    - title: 維基百科：物部氏
      url: https://zh.wikipedia.org/wiki/物部氏

- id: jp-teibi-rebellion
  year: 587
  title: 丁未之亂，蘇我氏滅物部氏獨掌朝政
  category: war
  importance: 4
  desc: 崇佛的蘇我馬子與排佛的物部守屋長期對立，終於兵戎相見。蘇我氏聯合皇族擊滅物部守屋一族，自此蘇我氏在朝廷再無政敵，佛教也隨之在日本站穩腳跟，為推古朝的改革鋪平了道路。
  sources:
    - title: 維基百科：丁未之亂
      url: https://zh.wikipedia.org/wiki/丁未之亂
    - title: 維基百科：物部守屋
      url: https://zh.wikipedia.org/wiki/物部守屋

- id: jp-sushun-assassination
  year: 592
  title: 蘇我馬子弒崇峻天皇，推古天皇即位
  category: politics
  importance: 4
  desc: 崇峻天皇不滿大臣蘇我馬子專權，馬子竟指使東漢直駒將天皇弒殺，是日本信史中唯一一次天皇遭臣下暗殺的紀錄。其後由用明天皇之女、敏達天皇之后即位為推古天皇，是日本首位女性天皇。
  sources:
    - title: 維基百科：崇峻天皇
      url: https://zh.wikipedia.org/wiki/崇峻天皇
    - title: 維基百科：蘇我馬子
      url: https://zh.wikipedia.org/wiki/蘇我馬子

