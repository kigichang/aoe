- id: jp-311-earthquake
  year: 2011
  title: 東日本大震災，福島核電廠事故
  category: culture
  importance: 5
  desc: 3 月 11 日東北地方太平洋沖發生芮氏規模 9.0 海溝型強震，引發巨大海嘯，造成近二萬人死亡與失蹤，並引發福島第一核電廠爐心融毀之核災事故。這是戰後日本遭逢最嚴重的複合型天災與人禍。
  sources:
    - title: 維基百科：東日本大震災
