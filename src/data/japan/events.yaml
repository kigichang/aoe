  year: 1016
  title: 藤原道長就任攝政，攝關政治全盛與《源氏物語》
  category: culture
  importance: 4
  desc: 藤原道長出任攝政，藤原氏的攝關政治達到權力巔峰。同時代的宮廷女房紫式部創作了世界最古老的長篇寫實小說《源氏物語》，成為平安時代貴族文學的最高成就。
  sources:
