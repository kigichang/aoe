  year: 1086
  title: 白河天皇讓位設立院廳，開啟院政時代
  category: politics
  importance: 5
  desc: 為了對抗藤原氏的攝關政治，白河天皇讓位給年幼的堀河天皇，自己成為「上皇」並設立「院廳」在幕後執政。這種由退位天皇掌握實權的「院政」體制，成為平安時代後期的主要政治形態。
  sources:
    - title: 維基百科：平安時代
      url: https://zh.wikipedia.org/wiki/平安時代
