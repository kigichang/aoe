    - title: 維基百科：日朝平壤宣言
      url: https://zh.wikipedia.org/wiki/日朝平壤宣言

- id: jp-postal-privatization
  year: 2005
  title: 郵政民營化大選，自民黨獲壓倒性大勝
  category: politics
  importance: 4
  desc: 首相小泉純一郎核心政策「郵政民營化」法案遭參議院否決，小泉毅然解散眾議院進行「郵政解散」大選。自民黨以改革為訴求斬獲過半席次，順利通過法案，成為平成時代結構性改革的代表作。
  sources:
    - title: 維基百科：日本郵政民營化
      url: https://zh.wikipedia.org/wiki/日本郵政民營化

- id: jp-dpj-transition
  year: 2009
  title: 民主黨政權交代，結束自民黨半世紀主導
  category: politics
  importance: 4
  desc: 民主黨於第 45 屆眾議院大選中狂攬 308 席擊敗自民黨，黨首鳩山由紀夫組閣就任首相。這是自民黨建黨五十四年來首次失去第一大黨地位的單純政黨輪替。
  sources:
    - title: 維基百科：2009年日本眾議院選舉
