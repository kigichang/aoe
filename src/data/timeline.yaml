# 時間軸的上下界。這是整條軸的原點與終點，不是「有資料的範圍」——
# 事件與時期都必須落在裡面，超出的會被 data.ts 的 assertInRange 在載入期擋下。
#
# 為什麼是設定值而不是從資料推導：
#   推導不會過期，但一則離群的資料（例如 -10000）就會把整條軸拉長，
#   其他五千年全部被擠扁。範圍固定，換算與刻度才穩定。
#   代價是要記得維護 —— 所以才有 assertInRange 幫忙盯著。
#
# 改動這裡會改變 SPAN_YEARS，連帶影響整條軸的像素高度與捲動位置。
minYear: -3000

# 會逐年過期。加了超出的事件時 assertInRange 會直接報錯，屆時往上調即可。
maxYear: 2026
