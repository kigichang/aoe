- id: tw-pacht
  year: 1644
  title: 贌社，村社交易權公開招標
  category: economy
  importance: 3
  desc: 荷蘭人把各原住民村社的交易權公開標售，得標商人獨佔該社所有買賣，以鹽、鐵鍋、布疋換取鹿皮鹿肉再轉售。「贌」是荷語 pacht 的台語音譯。清治延續此制而改以社餉徵稅，直到 1737 年乾隆稅制改革才逐漸消失 —— 一套荷蘭的承包制在台灣運作了近百年。
  sources:
