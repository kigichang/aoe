- id: cn-shangshutai
  year: 26
  title: 事歸台閣，尚書台架空三公
  category: politics
  importance: 3
  desc: 光武帝增置尚書分曹理事，政務盡歸這個原本掌文書的近臣機構，三公徒有其名。皇帝身邊的秘書班子逐步變成真正的中樞，此後尚書、中書、門下一路演化，五百餘年後成為隋唐的三省。
  sources:
