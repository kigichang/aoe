  category: politics
  importance: 3
  desc: 班超遣甘英西訪大秦（羅馬帝國），行至條支瀕海，安息船人誇言海途凶險，遂止步而還。漢與羅馬同時並存四百年，兩端都知道對方存在，卻始終只隔著中間商互通有無，這是最接近的一次。
  sources:
