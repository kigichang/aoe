  category: politics
  importance: 3
  desc: 梁冀專擅二十年、毒殺質帝、廢立由己，桓帝倚宦官單超等五人族滅之，五人同日封侯。外戚一倒，權力並未回到皇帝手上，而是落進宦官集團 —— 七年後的黨錮之禍，對手就是他們。
