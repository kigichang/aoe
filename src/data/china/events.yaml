  category: politics
  importance: 4
  desc: 文帝、景帝兩朝約法省禁、輕徭薄賦，田租一度全免，其後定為三十稅一。四十年不興大役，府庫充盈到串錢的繩子都朽爛 —— 武帝日後得以連年用兵，本錢就是這裡攢下的。
