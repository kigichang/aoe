- id: cn-qin-standardization
  year: -221
  title: 書同文、車同軌，度量衡歸一
  category: culture
  importance: 4
  desc: 以小篆為正體統一六國文字，齊一度量衡與車軌，廢六國舊幣而專行半兩錢。軍事上的統一只維持了十五年，這套標準卻讓「書面上是一個中國」成為此後兩千年的事實 —— 戰國各國的文字若一路分歧下去，後來的局面會完全不同。
  sources:
