- id: cn-qin-unification
  year: -221
  title: 秦滅六國，統一中國
  category: politics
  importance: 5
  desc: 廢封建、行郡縣，分天下為三十六郡，郡守縣令由中央任免而不世襲。以官僚取代血緣分封，此後兩千年的中央集權格局自此定型 —— 秦十五年而亡，這套骨架卻被漢原樣接收。
