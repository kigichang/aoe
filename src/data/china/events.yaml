- id: cn-southern-chen
  year: 557
  title: 陳霸先代梁建陳，南朝最後一代
  category: politics
  importance: 3
  desc: 承接侯景之亂與江陵陷落後的殘局，疆域已縮至長江以南。三十二年後為隋所滅，南北分裂就此告終。
  sources:
    - title: 維基百科：南陳
      url: https://zh.wikipedia.org/wiki/南陳
    - title: 維基百科：陳霸先
      url: https://zh.wikipedia.org/wiki/陳霸先

- id: cn-zhou-unify-north
  year: 577
  title: 北周滅北齊，統一北方
  category: war
  importance: 3
  desc: 周武帝親征滅齊。四年後外戚楊堅代周建隋，再八年滅陳 —— 自魏晉以來四百年的分裂就此終結。
  sources:
    - title: 維基百科：北周
      url: https://zh.wikipedia.org/wiki/北周
    - title: 維基百科：北齊
      url: https://zh.wikipedia.org/wiki/北齊

- id: cn-sui-founded
  year: 581
  title: 楊堅代周建隋，開皇之治
  category: politics
  importance: 4
  desc: 外戚受禪代周。輕徭薄賦、廣設義倉，戶口由四百餘萬增至八百餘萬，社會累積的財富足供五六十年之用 —— 這份底子後來被煬帝耗盡。
  sources:
    - title: 維基百科：隋文帝
      url: https://zh.wikipedia.org/wiki/隋文帝
